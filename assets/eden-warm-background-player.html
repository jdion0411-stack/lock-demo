<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17251b}video{display:block;position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 53%}</style></head><body><video id="film" autoplay muted loop playsinline preload="auto"></video><script>(()=>{const v=document.getElementById('film'),reduce=matchMedia('(prefers-reduced-motion:reduce)'),mobile=matchMedia('(max-width:600px)');let resting=false;v.muted=true;v.defaultMuted=true;function sync(){if(resting||document.hidden||reduce.matches)v.pause();else v.play().catch(()=>{})}function source(){const src='/assets/eden-living-'+(mobile.matches?'mobile':'hd')+'.mp4?v=91';if(v.getAttribute('src')!==src){v.src=src;v.load();sync()}}v.addEventListener('loadeddata',sync);document.addEventListener('visibilitychange',sync);reduce.addEventListener?.('change',sync);mobile.addEventListener?.('change',source);addEventListener('message',e=>{if(e.source!==parent)return;if(e.data?.type==='eden-film-rest'){resting=!!e.data.rest;sync()}});source()})();</script></body></html>
