<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EYEOTA Analytics</title><style>body{font:16px/1.5 system-ui;background:#111;color:#eee;max-width:1000px;margin:auto;padding:24px}input,button{font:inherit;padding:10px;margin:4px;background:#222;color:white;border:1px solid #888;border-radius:6px}table{border-collapse:collapse;width:100%;margin-bottom:24px}td,th{text-align:left;padding:8px;border-bottom:1px solid #444}section{overflow:auto}p{color:#ccc}</style><h1>EYEOTA Analytics</h1><p>Daily aggregate events. These counts are not unique visitors. Locations are approximate. Last 30 days; retention up to 90 days.</p><form id="login"><label>Dashboard password <input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form><button id="refresh" hidden>Refresh</button><button id="logout" hidden>Sign out</button><p id="status" role="status"></p><main id="results"></main><script>
const $=id=>document.getElementById(id);async function api(route,body){const r=await fetch('/api/analytics/admin/'+route,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{}),credentials:'same-origin'});if(!r.ok){const v=await r.json();throw Error(v.error||'Request failed')}return r.status===204?null:r.json()}
function table(title,rows,keys){const section=document.createElement('section'),h=document.createElement('h2');h.textContent=title;section.append(h);const t=document.createElement('table'),head=t.insertRow();keys.forEach(k=>{const th=document.createElement('th');th.textContent=k;head.append(th)});rows.forEach(row=>{const tr=t.insertRow();keys.forEach(k=>{tr.insertCell().textContent=String(row[k]||'Unknown')})});section.append(t);$('results').append(section)}
async function load(){try{const v=await api('summary');$('login').hidden=true;$('refresh').hidden=$('logout').hidden=false;$('results').replaceChildren();table('Totals',v.totals||[],['event','count']);table('Dials',v.dials||[],['mode','count']);table('City / state or region',v.locations||[],['city','region','country','count']);table('Daily counts',v.daily||[],['day','event','count']);$('status').textContent='Updated. Location lookup: '+v.locationLookup}catch(e){$('status').textContent=e.message}}
$('login').onsubmit=async e=>{e.preventDefault();try{await api('login',{password:$('password').value});$('password').value='';await load()}catch(e){$('status').textContent=e.message}};$('refresh').onclick=load;$('logout').onclick=async()=>{await api('logout',{});$('results').replaceChildren();$('login').hidden=false;$('refresh').hidden=$('logout').hidden=true;$('status').textContent='Signed out'};load();</script></html>
