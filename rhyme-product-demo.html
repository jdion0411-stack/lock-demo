<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RHYME physical product demonstration</title><style>*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#efdfba;font:15px Arial,sans-serif}main{max-width:760px;margin:auto;text-align:center}.stage{position:relative;width:100%;aspect-ratio:1;perspective:1600px}.card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s ease}.stage.back .card{transform:rotateY(180deg)}.side{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden}.side iframe{width:100%;height:100%;border:0;background:transparent}.rear{transform:rotateY(180deg)}.rear .back-crop{position:absolute;width:76%;height:76%;left:12%;top:12%;border-radius:50%;overflow:hidden;box-shadow:0 10px 35px #0008}.rear .back-crop img{width:100%;height:100%;object-fit:contain}.rear .back-crop{width:99%;height:99%;left:.5%;top:.5%;box-shadow:none}nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 8px 10px}button{border:1px solid #bd9857;color:#efd59a;background:#152e44;padding:10px 20px;border-radius:24px;font:15px Arial;cursor:pointer}button[aria-pressed=true]{background:#e3c17a;color:#132a3d}button:focus-visible{outline:2px solid #fff;outline-offset:3px}p{margin:8px 20px 18px;color:#c6c4bb;line-height:1.5}.status{min-height:24px;color:#e4c58a;font-size:13px}@media(prefers-reduced-motion:reduce){.card{transition:none}}</style></head><body><main><div class="stage" id="stage"><div class="card"><div class="side"><iframe id="front" src="/rhyme-practice.html?v=physical-art-final-13" title="Working front of physical Rhime Dial"></iframe></div><div class="side rear"><div class="back-crop"><img src="/assets/rhyme-mechanical-back.svg" alt="Back of RHYME dial, navy and white bandanna with gold branding" loading="lazy"></div></div></div></div><nav aria-label="Product demonstration"><button id="frontButton" aria-pressed="true">Front</button><button id="backButton" aria-pressed="false">Back</button><button id="demoButton" aria-pressed="false">Play demonstration</button></nav><div class="status" id="status" aria-live="polite"></div><p>Explore the circular letter wheels, hold individual letters, and turn the sword to try another letter. Physical product concept.</p></main><script>(()=>{const stage=document.getElementById('stage'),frame=document.getElementById('front'),front=document.getElementById('frontButton'),back=document.getElementById('backButton'),demo=document.getElementById('demoButton'),status=document.getElementById('status');let running=false,timer=null;function view(rear){stage.classList.toggle('back',rear);front.setAttribute('aria-pressed',String(!rear));back.setAttribute('aria-pressed',String(rear))}function stop(){running=false;clearInterval(timer);demo.textContent='Play demonstration';demo.setAttribute('aria-pressed','false');frame.contentWindow?.postMessage({type:'rhyme-physical-demo',play:false},'*');status.textContent=''}front.onclick=()=>{stop();view(false)};back.onclick=()=>{stop();view(true)};demo.onclick=()=>{if(running){stop();return}running=true;view(false);demo.textContent='Stop demonstration';demo.setAttribute('aria-pressed','true');frame.contentWindow?.postMessage({type:'rhyme-physical-demo',play:true},'*');status.textContent='Front · five letters held while the first letter changes';let tick=0;timer=setInterval(()=>{const rear=++tick%2===1;view(rear);status.textContent=rear?'Back · navy bandanna finish and RHYME branding':'Front · turn letters and hold the parts you want';frame.contentWindow?.postMessage({type:'rhyme-physical-demo',play:!rear},'*')},6500)};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});})();</script></body></html>
