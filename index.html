 &quot;Isaac grew N was weaned. Abraham threw a gr8 feast tha day he was weaned.&quot;}, {&quot;n&quot;: &quot;21:9&quot;, &quot;text&quot;: &quot;Sarah saw Hagar tha Egyptian’s son, whom she’d borne Abraham, mocking.&quot;}, {&quot;n&quot;: &quot;21:10&quot;, &quot;text&quot;: &quot;She told Abraham, “Send dis enslaved woman N her son away. Her son won’t share tha inheritance wit my son Isaac.”&quot;}, {&quot;n&quot;: &quot;21:11&quot;, &quot;text&quot;: &quot;Dis deeply troubled Abraham because Ishmael was his son.&quot;}, {&quot;n&quot;: &quot;21:12&quot;, &quot;text&quot;: &quot;God said, “Don’t b distressed about tha boy N ur enslaved woman. Listen 2 Sarah, cuz ur promised line will b named through Isaac.&quot;}, {&quot;n&quot;: &quot;21:13&quot;, &quot;text&quot;: &quot;I’ll make tha enslaved woman’s son a nation too. He’s ur offspring.”&quot;}, {&quot;n&quot;: &quot;21:14&quot;, &quot;text&quot;: &quot;Early next morning, Abraham put bread N a water skin on Hagar’s shoulder N sent her away wit tha boy. She bounced N wandered in Beersheba’s wilderness.&quot;}, {&quot;n&quot;: &quot;21:15&quot;, &quot;text&quot;: &quot;When tha water ran out, she placed tha boy under a shrub.&quot;}, {&quot;n&quot;: &quot;21:16&quot;, &quot;text&quot;: &quot;She sat a bowshot away, saying, “I can’t watch my child die.” Sitting opposite him, she cried aloud.&quot;}, {&quot;n&quot;: &quot;21:17&quot;, &quot;text&quot;: &quot;God heard tha boy. God’s angel called from heaven: “What’s wrong, Hagar? Don’t b shook. God has heard tha boy right where he is.&quot;}, {&quot;n&quot;: &quot;21:18&quot;, &quot;text&quot;: &quot;Get up. Lift him N hold his hand. I’ll make him a gr8 nation.”&quot;}, {&quot;n&quot;: &quot;21:19&quot;, &quot;text&quot;: &quot;God opened her eyez. She saw a well, filled tha water skin, N gave tha boy a drink.&quot;}, {&quot;n&quot;: &quot;21:20&quot;, &quot;text&quot;: &quot;God was wit tha boy. He grew, lived in tha wilderness, N became an archer.&quot;}, {&quot;n&quot;: &quot;21:21&quot;, &quot;text&quot;: &quot;He lived in Paran’s wilderness. His mother found him an Egyptian wife.&quot;}, {&quot;n&quot;: &quot;21:22&quot;, &quot;text&quot;: &quot;Around dat time, Abimelech N Phichol, his army commander, told Abraham, “God is wit u in everything u do.&quot;}, {&quot;n&quot;: &quot;21:23&quot;, &quot;text&quot;: &quot;Swear here by God dat u won’t deceive me, my son, or my grandson. Show me N tha land hosting u tha kindness I’ve shown u.”&quot;}, {&quot;n&quot;: &quot;21:24&quot;, &quot;text&quot;: &quot;Abraham said, “I’ll swear.”&quot;}, {&quot;n&quot;: &quot;21:25&quot;, &quot;text&quot;: &quot;Then Abraham confronted Abimelech about a well his servantz had seized by force.&quot;}, {&quot;n&quot;: &quot;21:26&quot;, &quot;text&quot;: &quot;Abimelech answered, “I don’t know who did it. U never told me; today’s tha 1st I’ve heard.”&quot;}, {&quot;n&quot;: &quot;21:27&quot;, &quot;text&quot;: &quot;Abraham gave Abimelech sheep N cattle. Tha 2 made a covenant.&quot;}, {&quot;n&quot;: &quot;21:28&quot;, &quot;text&quot;: &quot;Abraham set 7 female lambz apart.&quot;}, {&quot;n&quot;: &quot;21:29&quot;, &quot;text&quot;: &quot;Abimelech asked, “What’s wit these 7 lambz u’ve separated?”&quot;}, {&quot;n&quot;: &quot;21:30&quot;, &quot;text&quot;: &quot;“Accept ’em from me as testimony dat I dug dis well.”&quot;}, {&quot;n&quot;: &quot;21:31&quot;, &quot;text&quot;: &quot;He called tha place Beersheba, because both men swore an oath there.&quot;}, {&quot;n&quot;: &quot;21:32&quot;, &quot;text&quot;: &quot;After making tha covenant, Abimelech N Phichol bounced back 2 Philistine territory.&quot;}, {&quot;n&quot;: &quot;21:33&quot;, &quot;text&quot;: &quot;Abraham planted a grove in Beersheba N called on tha LORD, tha everlasting God.&quot;}, {&quot;n&quot;: &quot;21:34&quot;, &quot;text&quot;: &quot;He stayed in Philistine territory 4 many dayz.&quot;}], &quot;22&quot;: [{&quot;n&quot;: &quot;22:1&quot;, &quot;text&quot;: &quot;Afterward God tested Abraham. “Abraham!” He answered, “Here I am.”&quot;}, {&quot;n&quot;: &quot;22:2&quot;, &quot;text&quot;: &quot;God said, “Take Isaac, ur son, ur only son whom u love, 2 Moriah. Offer him as a burnt offering on tha mountain I’ll show u.”&quot;}, {&quot;n&quot;: &quot;22:3&quot;, &quot;text&quot;: &quot;Abraham got up early, saddled his donkey, split tha offering wood, N set out wit Isaac N 2 young servantz 4 tha place God named.&quot;}, {&quot;n&quot;: &quot;22:4&quot;, &quot;text&quot;: &quot;On tha 3rd day, he looked up N saw tha place in tha distance.&quot;}, {&quot;n&quot;: &quot;22:5&quot;, &quot;text&quot;: &quot;He told tha servantz, “Stay here wit tha donkey. Tha boy N I will go worship N come back 2 u.”&quot;}, {&quot;n&quot;: &quot;22:6&quot;, &quot;text&quot;: &quot;Abraham placed tha wood on Isaac N carried tha fire N knife himself. Father N son walked together.&quot;}, {&quot;n&quot;: &quot;22:7&quot;, &quot;text&quot;: &quot;Isaac said, “Father?” “Here I am, son.” “We have fire N wood—but where’s tha lamb 4 tha offering?”&quot;}, {&quot;n&quot;: &quot;22:8&quot;, &quot;text&quot;: &quot;“God will provide tha lamb, my son.” Dey kept walking together.&quot;}, {&quot;n&quot;: &quot;22:9&quot;, &quot;text&quot;: &quot;At tha appointed place Abraham built an altar, arranged tha wood, bound Isaac, N laid him on top.&quot;}, {&quot;n&quot;: &quot;22:10&quot;, &quot;text&quot;: &quot;Abraham reached 4 tha knife 2 kill his son.&quot;}, {&quot;n&quot;: &quot;22:11&quot;, &quot;text&quot;: &quot;Tha LORD’s angel called from heaven, “Abraham! Abraham!” “Here I am,” he answered.&quot;}, {&quot;n&quot;: &quot;22:12&quot;, &quot;text&quot;: &quot;“Don’t lay a hand on tha boy. Don’t hurt him. Now I know u revere God: u didn’t withhold ur son, ur only son, from me.”&quot;}, {&quot;n&quot;: &quot;22:13&quot;, &quot;text&quot;: &quot;Abraham looked N saw a ram caught by its hornz in a thicket. He offered it instead of his son.&quot;}, {&quot;n&quot;: &quot;22:14&quot;, &quot;text&quot;: &quot;He named tha place Jehovahjireh. People still say, “On tha LORD’s mountain, it will b provided.”&quot;}, {&quot;n&quot;: &quot;22:15&quot;, &quot;text&quot;: &quot;Tha LORD’s angel called from heaven a 2nd time:&quot;}, {&quot;n&quot;: &quot;22:16&quot;, &quot;text&quot;: &quot;“Tha LORD declares, ‘I swear by myself: because u did dis N didn’t withhold ur son, ur only son,&quot;}, {&quot;n&quot;: &quot;22:17&quot;, &quot;text&quot;: &quot;I’ll surely bless u. I’ll multiply ur descendantz like heaven’s starz N seashore sand. Ur offspring will possess deir enemiez’ gatez.&quot;}, {&quot;n&quot;: &quot;22:18&quot;, &quot;text&quot;: &quot;Through ur offspring all earth’s nationz will b blessed, because u obeyed my voice.’”&quot;}, {&quot;n&quot;: &quot;22:19&quot;, &quot;text&quot;: &quot;Abraham returned 2 his servantz. Together dey went 2 Beersheba, where he lived.&quot;}, {&quot;n&quot;: &quot;22:20&quot;, &quot;text&quot;: &quot;Later Abraham heard dat Milcah had borne children 2 his brother Nahor:&quot;}, {&quot;n&quot;: &quot;22:21&quot;, &quot;text&quot;: &quot;Huz tha firstborn, Buz his brother, N Kemuel, father of Aram;&quot;}, {&quot;n&quot;: &quot;22:22&quot;, &quot;text&quot;: &quot;Chesed, Hazo, Pildash, Jidlaph, N Bethuel.&quot;}, {&quot;n&quot;: &quot;22:23&quot;, &quot;text&quot;: &quot;Bethuel fathered Rebekah. Milcah bore these 8 2 Nahor, Abraham’s brother.&quot;}, {&quot;n&quot;: &quot;22:24&quot;, &quot;text&quot;: &quot;Nahor’s concubine Reumah also bore Tebah, Gaham, Thahash, N Maachah.&quot;}], &quot;23&quot;: [{&quot;n&quot;: &quot;23:1&quot;, &quot;text&quot;: &quot;Sarah lived 127 yearz. Dat was tha span of her life.&quot;}, {&quot;n&quot;: &quot;23:2&quot;, &quot;text&quot;: &quot;She died at Kirjatharba—Hebron—in Canaan. Abraham came 2 mourn N weep 4 her.&quot;}, {&quot;n&quot;: &quot;23:3&quot;, &quot;text&quot;: &quot;He rose from beside his dead wife N addressed tha sonz of Heth:&quot;}, {&quot;n&quot;: &quot;23:4&quot;, &quot;text&quot;: &quot;“I’m an outsider staying among u. Sell me a burial place here so I can lay my dead 2 rest.”&quot;}, {&quot;n&quot;: &quot;23:5&quot;, &quot;text&quot;: &quot;Tha sonz of Heth answered:&quot;}, {&quot;n&quot;: &quot;23:6&quot;, &quot;text&quot;: &quot;“Hear us, my lord. U’re a mighty prince among us. Choose our finest tomb. Nobody will deny u a burial place.”&quot;}, {&quot;n&quot;: &quot;23:7&quot;, &quot;text&quot;: &quot;Abraham stood N bowed 2 tha people of tha land, tha sonz of Heth.&quot;}, {&quot;n&quot;: &quot;23:8&quot;, &quot;text&quot;: &quot;He said, “If u agree dat I should bury my dead, hear me. Ask Ephron, Zohar’s son,&quot;}, {&quot;n&quot;: &quot;23:9&quot;, &quot;text&quot;: &quot;2 sell me Machpelah’s cave at tha end of his field. I’ll pay full price 4 a burial property among u.”&quot;}, {&quot;n&quot;: &quot;23:10&quot;, &quot;text&quot;: &quot;Ephron tha Hittite sat among his people. Before everyone at tha city gate, he answered Abraham:&quot;}, {&quot;n&quot;: &quot;23:11&quot;, &quot;text&quot;: &quot;“No, my lord, hear me. I give u tha field N tha cave in it. Before my people I give ’em. Bury ur dead.”&quot;}, {&quot;n&quot;: &quot;23:12&quot;, &quot;text&quot;: &quot;Abraham bowed before tha people of tha land.&quot;}, {&quot;n&quot;: &quot;23:13&quot;, &quot;text&quot;: &quot;Before everyone, he told Ephron, “Please hear me. I’ll pay 4 tha field. Accept tha money so I can bury my dead there.”&quot;}, {&quot;n&quot;: &quot;23:14&quot;, &quot;text&quot;: &quot;Ephron answered Abraham:&quot;}, {&quot;n&quot;: &quot;23:15&quot;, &quot;text&quot;: &quot;“My lord, hear me. Tha land’s worth 400 silver shekelz. What’s dat between us? Bury ur dead.”&quot;}, {&quot;n&quot;: &quot;23:16&quot;, &quot;text&quot;: &quot;Abraham accepted tha termz N weighed out 400 silver shekelz, at tha merchant’s standard, as Ephron publicly named.&quot;}, {&quot;n&quot;: &quot;23:17&quot;, &quot;text&quot;: &quot;Ephron’s field in Machpelah near Mamre—tha field, cave, N all treez within its borderz—was legally transferred&quot;}, {&quot;n&quot;: &quot;23:18&quot;, &quot;text&quot;: &quot;2 Abraham as his property, witnessed by tha sonz of Heth N everyone entering tha city gate.&quot;}, {&quot;n&quot;: &quot;23:19&quot;, &quot;text&quot;: &quot;Abraham buried Sarah in Machpelah’s cave near Mamre—Hebron—in Canaan.&quot;}, {&quot;n&quot;: &quot;23:20&quot;, &quot;text&quot;: &quot;Tha sonz of Heth confirmed tha field N cave as Abraham’s burial property.&quot;}], &quot;24&quot;: [{&quot;n&quot;: &quot;24:1&quot;, &quot;text&quot;: &quot;Abraham was well advanced in age. Tha LORD had blessed him in everything.&quot;}, {&quot;n&quot;: &quot;24:2&quot;, &quot;text&quot;: &quot;He told his eldest servant, manager of all he owned, “Put ur hand under my thigh.&quot;}, {&quot;n&quot;: &quot;24:3&quot;, &quot;text&quot;: &quot;Swear by tha LORD, God of heaven N earth: don’t choose my son a wife from tha Canaanites around us.&quot;}, {&quot;n&quot;: &quot;24:4&quot;, &quot;text&quot;: &quot;Go 2 my country N my own people. Find a wife there 4 Isaac.”&quot;}, {&quot;n&quot;: &quot;24:5&quot;, &quot;text&quot;: &quot;Tha servant asked, “What if she won’t follow me here? Should I take ur son back 2 ur homeland?”&quot;}, {&quot;n&quot;: &quot;24:6&quot;, &quot;text&quot;: &quot;“Make sure u don’t take my son back there.&quot;}, {&quot;n&quot;: &quot;24:7&quot;, &quot;text&quot;: &quot;Tha LORD who took me from my father’s household N promised dis land 2 my descendantz will send his angel ahead. Find my son a wife there.&quot;}, {&quot;n&quot;: &quot;24:8&quot;, &quot;text&quot;: &quot;If she won’t come, u’re released from dis oath. Just don’t take my son back.”&quot;}, {&quot;n&quot;: &quot;24:9&quot;, &quot;text&quot;: &quot;Tha servant put his hand under Abraham’s thigh N swore concerning dis task.&quot;}, {&quot;n&quot;: &quot;24:10&quot;, &quot;text&quot;: &quot;He took 10 of his master’s camelz N fine giftz from his goods N bounced 2 Nahor’s city in Mesopotamia.&quot;}, {&quot;n&quot;: &quot;24:11&quot;, &quot;text&quot;: &quot;Evening came. Outside tha city, he made tha camelz kneel by a well when women came 2 draw water.&quot;}, {&quot;n&quot;: &quot;24:12&quot;, &quot;text&quot;: &quot;He prayed, “LORD, God of my master Abraham, give me success today. Show him kindness.&quot;}, {&quot;n&quot;: &quot;24:13&quot;, &quot;text&quot;: &quot;I’m standing by tha spring while tha city’s daughterz come 4 water.&quot;}, {&quot;n&quot;: &quot;24:14&quot;, &quot;text&quot;: &quot;When I ask a young woman 4 a drink, let her answer, ‘Drink; I’ll water ur camelz too.’ Let her b Isaac’s appointed wife. Dat’ll show ur kindness.”&quot;}, {&quot;n&quot;: &quot;24:15&quot;, &quot;text&quot;: &quot;Before he finished, Rebekah arrived carrying a jar. She was Bethuel’s daughter, granddaughter of Milcah N Nahor, Abraham’s brother.&quot;}, {&quot;n&quot;: &quot;24:16&quot;, &quot;text&quot;: &quot;She was very beautiful, a virgin who hadn’t slept wit a man. She went down, filled her jar, N came up.&quot;}, {&quot;n&quot;: &quot;24:17&quot;, &quot;text&quot;: &quot;Tha servant ran 2 her. “Please let me sip some water from ur jar.”&quot;}, {&quot;n&quot;: &quot;24:18&quot;, &quot;text&quot;: &quot;“Drink, my lord.” She quickly lowered tha jar N gave him water.&quot;}, {&quot;n&quot;: &quot;24:19&quot;, &quot;text&quot;: &quot;Afterward she said, “I’ll draw water 4 ur camelz too, till dey’ve finished drinking.”&quot;}, {&quot;n&quot;: &quot;24:20&quot;, &quot;text&quot;: &quot;She emptied tha jar in2 tha trough N kept running 2 tha well, drawing 4 every camel.&quot;}, {&quot;n&quot;: &quot;24:21&quot;, &quot;text&quot;: &quot;He watched quietly, wondering whether tha LORD had made his journey successful.&quot;}, {&quot;n&quot;: &quot;24:22&quot;, &quot;text&quot;: &quot;When tha camelz finished, he took a gold nose ring weighing 0.5 shekel N 2 gold braceletz weighing 10 shekelz.&quot;}, {&quot;n&quot;: &quot;24:23&quot;, &quot;text&quot;: &quot;“Whose daughter are u? Is there room at ur father’s house 4 us 2 stay?”&quot;}, {&quot;n&quot;: &quot;24:24&quot;, &quot;text&quot;: &quot;“I’m Bethuel’s daughter. Milcah bore him 2 Nahor.”&quot;}, {&quot;n&quot;: &quot;24:25&quot;, &quot;text&quot;: &quot;“We have plenty of straw N feed, N room 4 u 2 stay.”&quot;}, {&quot;n&quot;: &quot;24:26&quot;, &quot;text&quot;: &quot;Tha man bowed his head N worshipped tha LORD.&quot;}, {&quot;n&quot;: &quot;24:27&quot;, &quot;text&quot;: &quot;“Blessed b my master Abraham’s God! He hasn’t abandoned his kindness N faithfulness. Tha LORD led me straight 2 my master’s family.”&quot;}, {&quot;n&quot;: &quot;24:28&quot;, &quot;text&quot;: &quot;Rebekah ran 2 tell her mother’s household everything.&quot;}, {&quot;n&quot;: &quot;24:29&quot;, &quot;text&quot;: &quot;Her brother Laban ran out 2 tha man by tha well.&quot;}, {&quot;n&quot;: &quot;24:30&quot;, &quot;text&quot;: &quot;He’d seen tha ring N braceletz N heard Rebekah’s account. He found tha man standing beside tha camelz.&quot;}, {&quot;n&quot;: &quot;24:31&quot;, &quot;text&quot;: &quot;“Come in, u blessed by tha LORD! Why stand outside? I’ve prepared tha house N room 4 tha camelz.”&quot;}, {&quot;n&quot;: &quot;24:32&quot;, &quot;text&quot;: &quot;Tha man entered. Tha camelz were unloaded N fed; water was brought 4 his feet N his men’s feet.&quot;}, {&quot;n&quot;: &quot;24:33&quot;, &quot;text&quot;: &quot;Food was served, but he said, “I won’t eat till I explain my business.” “Speak,” Laban answered.&quot;}, {&quot;n&quot;: &quot;24:34&quot;, &quot;text&quot;: &quot;“I’m Abraham’s servant.&quot;}, {&quot;n&quot;: &quot;24:35&quot;, &quot;text&quot;: &quot;Tha LORD has greatly blessed him: flockz, herdz, silver, gold, male N female servantz, camelz, N donkeyz. He’s become wealthy.&quot;}, {&quot;n&quot;: &quot;24:36&quot;, &quot;text&quot;: &quot;Sarah bore him a son in her old age. My master has given dat son everything.&quot;}, {&quot;n&quot;: &quot;24:37&quot;, &quot;text&quot;: &quot;He made me swear not 2 choose his son a wife from tha Canaanites in whose land he lives,&quot;}, {&quot;n&quot;: &quot;24:38&quot;, &quot;text&quot;: &quot;but 2 visit his father’s household N relatives 2 find her.&quot;}, {&quot;n&quot;: &quot;24:39&quot;, &quot;text&quot;: &quot;I asked, ‘What if tha woman won’t follow me?’&quot;}, {&quot;n&quot;: &quot;24:40&quot;, &quot;text&quot;: &quot;He answered, ‘Tha LORD I walk before will send his angel wit u N prosper ur journey. Find my son a wife from my family.&quot;}, {&quot;n&quot;: &quot;24:41&quot;, &quot;text&quot;: &quot;When u reach my relatives, u’ll b released from tha oath if dey refuse 2 give her.’&quot;}, {&quot;n&quot;: &quot;24:42&quot;, &quot;text&quot;: &quot;Today at tha spring I prayed, ‘LORD, God of my master Abraham, please prosper dis journey.&quot;}, {&quot;n&quot;: &quot;24:43&quot;, &quot;text&quot;: &quot;I’m beside tha spring. When a young woman comez 4 water N I ask her 4 a drink,&quot;}, {&quot;n&quot;: &quot;24:44&quot;, &quot;text&quot;: &quot;let her say, “Drink; I’ll water ur camelz too.” Let her b tha wife u appointed 4 my master’s son.’&quot;}, {&quot;n&quot;: &quot;24:45&quot;, &quot;text&quot;: &quot;Before I finished praying in my heart, Rebekah came carrying her jar. She drew water, N I asked 4 a drink.&quot;}, {&quot;n&quot;: &quot;24:46&quot;, &quot;text&quot;: &quot;She quickly lowered tha jar: ‘Drink; I’ll water ur camelz too.’ I drank, N she watered ’em.&quot;}, {&quot;n&quot;: &quot;24:47&quot;, &quot;text&quot;: &quot;I asked whose daughter she was. She said, ‘Bethuel’s, Nahor N Milcah’s son.’ I put tha ring on her nose N braceletz on her wristz.&quot;}, {&quot;n&quot;: &quot;24:48&quot;, &quot;text&quot;: &quot;I bowed N blessed tha LORD 4 leading me 2 my master’s family 2 find his son’s wife.&quot;}, {&quot;n&quot;: &quot;24:49&quot;, &quot;text&quot;: &quot;Tell me whether u’ll deal kindly N faithfully wit my master. If not, tell me, so I can turn elsewhere.”&quot;}, {&quot;n&quot;: &quot;24:50&quot;, &quot;text&quot;: &quot;Laban N Bethuel answered, “Dis comez from tha LORD. We can’t argue either way.&quot;}, {&quot;n&quot;: &quot;24:51&quot;, &quot;text&quot;: &quot;Rebekah’s here. Take her N bounce. Let her marry ur master’s son, as tha LORD has spoken.”&quot;}, {&quot;n&quot;: &quot;24:52&quot;, &quot;text&quot;: &quot;Hearing dat, Abraham’s servant bowed 2 tha ground before tha LORD.&quot;}, {&quot;n&quot;: &quot;24:53&quot;, &quot;text&quot;: &quot;He gave Rebekah silver N gold jewelry N clothing. He gave precious giftz 2 her brother N mother too.&quot;}, {&quot;n&quot;: &quot;24:54&quot;, &quot;text&quot;: &quot;He N his men ate, drank, N stayed overnight. In tha morning he said, “Send me back 2 my master.”&quot;}, {&quot;n&quot;: &quot;24:55&quot;, &quot;text&quot;: &quot;Her brother N mother said, “Let her stay at least 10 dayz; then she can go.”&quot;}, {&quot;n&quot;: &quot;24:56&quot;, &quot;text&quot;: &quot;He answered, “Don’t delay me. Tha LORD has prospered my journey. Let me bounce back 2 my master.”&quot;}, {&quot;n&quot;: &quot;24:57&quot;, &quot;text&quot;: &quot;Dey said, “Let’s call her N ask her directly.”&quot;}, {&quot;n&quot;: &quot;24:58&quot;, &quot;text&quot;: &quot;Dey asked Rebekah, “Will u go wit dis man?” She said, “I’ll go.”&quot;}, {&quot;n&quot;: &quot;24:59&quot;, &quot;text&quot;: &quot;Dey sent Rebekah, her nurse, Abraham’s servant, N his men on deir way.&quot;}, {&quot;n&quot;: &quot;24:60&quot;, &quot;text&quot;: &quot;Dey blessed her: “Our sister, become mother 2 countless thousandz. May ur descendantz possess deir enemiez’ gatez.”&quot;}, {&quot;n&quot;: &quot;24:61&quot;, &quot;text&quot;: &quot;Rebekah N her attendantz mounted tha camelz N followed tha servant. He took her N bounced.&quot;}, {&quot;n&quot;: &quot;24:62&quot;, &quot;text&quot;: &quot;Isaac had come from Beerlahairoi; he lived in tha south country.&quot;}, {&quot;n&quot;: &quot;24:63&quot;, &quot;text&quot;: &quot;At evening he went in2 tha field 2 meditate. Looking up, he saw camelz approaching.&quot;}, {&quot;n&quot;: &quot;24:64&quot;, &quot;text&quot;: &quot;Rebekah looked up, saw Isaac, N dismounted.&quot;}, {&quot;n&quot;: &quot;24:65&quot;, &quot;text&quot;: &quot;“Who’s dat man coming across tha field?” “My master,” tha servant said. She covered herself wit her veil.&quot;}, {&quot;n&quot;: &quot;24:66&quot;, &quot;text&quot;: &quot;Tha servant told Isaac everything he’d done.&quot;}, {&quot;n&quot;: &quot;24:67&quot;, &quot;text&quot;: &quot;Isaac brought Rebekah in2 his mother Sarah’s tent. She became his wife, N he loved her. After his mother’s death, he found comfort.&quot;}], &quot;25&quot;: [{&quot;n&quot;: &quot;25:1&quot;, &quot;text&quot;: &quot;Abraham married another wife, Keturah.&quot;}, {&quot;n&quot;: &quot;25:2&quot;, &quot;text&quot;: &quot;She bore Zimran, Jokshan, Medan, Midian, Ishbak, N Shuah.&quot;}, {&quot;n&quot;: &quot;25:3&quot;, &quot;text&quot;: &quot;Jokshan fathered Sheba N Dedan. Dedan’s descendantz were Asshurim, Letushim, N Leummim.&quot;}, {&quot;n&quot;: &quot;25:4&quot;, &quot;text&quot;: &quot;Midian’s sonz were Ephah, Epher, Hanoch, Abidah, N Eldaah. All these came from Keturah.&quot;}, {&quot;n&quot;: &quot;25:5&quot;, &quot;text&quot;: &quot;Abraham gave everything he owned 2 Isaac.&quot;}, {&quot;n&quot;: &quot;25:6&quot;, &quot;text&quot;: &quot;While still alive, he gave giftz 2 his concubinez’ sonz N sent ’em east, away from Isaac.&quot;}, {&quot;n&quot;: &quot;25:7&quot;, &quot;text&quot;: &quot;Abraham’s life totaled 175 yearz.&quot;}, {&quot;n&quot;: &quot;25:8&quot;, &quot;text&quot;: &quot;He breathed his last at a good old age, full of yearz, N was gathered 2 his people.&quot;}, {&quot;n&quot;: &quot;25:9&quot;, &quot;text&quot;: &quot;Isaac N Ishmael buried him in Machpelah’s cave, in Ephron son of Zohar tha Hittite’s field near Mamre.&quot;}, {&quot;n&quot;: &quot;25:10&quot;, &quot;text&quot;: &quot;Abraham had bought dat field from tha sonz of Heth. He N Sarah were buried there.&quot;}, {&quot;n&quot;: &quot;25:11&quot;, &quot;text&quot;: &quot;After Abraham died, God blessed Isaac, who lived near Beerlahairoi.&quot;}, {&quot;n&quot;: &quot;25:12&quot;, &quot;text&quot;: &quot;Here’s Ishmael’s family record—Abraham’s son by Hagar tha Egyptian, Sarah’s servant.&quot;}, {&quot;n&quot;: &quot;25:13&quot;, &quot;text&quot;: &quot;His sonz, listed by family line: Nebajoth tha firstborn, Kedar, Adbeel, Mibsam,&quot;}, {&quot;n&quot;: &quot;25:14&quot;, &quot;text&quot;: &quot;Mishma, Dumah, Massa,&quot;}, {&quot;n&quot;: &quot;25:15&quot;, &quot;text&quot;: &quot;Hadar, Tema, Jetur, Naphish, N Kedemah.&quot;}, {&quot;n&quot;: &quot;25:16&quot;, &quot;text&quot;: &quot;These were Ishmael’s sonz, named by deir settlementz N campz—12 princez according 2 deir peoplez.&quot;}, {&quot;n&quot;: &quot;25:17&quot;, &quot;text&quot;: &quot;Ishmael lived 137 yearz, breathed his last, N was gathered 2 his people.&quot;}, {&quot;n&quot;: &quot;25:18&quot;, &quot;text&quot;: &quot;His descendantz lived from Havilah 2 Shur, near Egypt toward Assyria. He settled in tha presence of all his brotherz.&quot;}, {&quot;n&quot;: &quot;25:19&quot;, &quot;text&quot;: &quot;Here’s Isaac’s family record. Abraham fathered Isaac.&quot;}, {&quot;n&quot;: &quot;25:20&quot;, &quot;text&quot;: &quot;Isaac was 40 when he married Rebekah, daughter of Bethuel tha Syrian from Padanaram N sister of Laban tha Syrian.&quot;}, {&quot;n&quot;: &quot;25:21&quot;, &quot;text&quot;: &quot;Isaac prayed 4 his wife because she couldn’t conceive. Tha LORD answered, N Rebekah became pregnant.&quot;}, {&quot;n&quot;: &quot;25:22&quot;, &quot;text&quot;: &quot;Tha children struggled inside her. “Why is dis happening 2 me?” she asked, N went 2 consult tha LORD.&quot;}, {&quot;n&quot;: &quot;25:23&quot;, &quot;text&quot;: &quot;He said, “2 nationz are in ur womb; 2 peoplez will separate from u. 1 will b stronger, N tha older will serve tha younger.”&quot;}, {&quot;n&quot;: &quot;25:24&quot;, &quot;text&quot;: &quot;When her delivery time came, she had twinz.&quot;}, {&quot;n&quot;: &quot;25:25&quot;, &quot;text&quot;: &quot;Tha 1st came out red N hairy like a garment. Dey named him Esau.&quot;}, {&quot;n&quot;: &quot;25:26&quot;, &quot;text&quot;: &quot;His brother followed, gripping Esau’s heel. Dey named him Jacob. Isaac was 60 when dey were born.&quot;}, {&quot;n&quot;: &quot;25:27&quot;, &quot;text&quot;: &quot;Tha boyz grew. Esau became a skilled hunter, at home outdoors. Jacob was a quiet man living in tentz.&quot;}, {&quot;n&quot;: &quot;25:28&quot;, &quot;text&quot;: &quot;Isaac favored Esau because he enjoyed his game meat. Rebekah favored Jacob.&quot;}, {&quot;n&quot;: &quot;25:29&quot;, &quot;text&quot;: &quot;Jacob was cooking stew when Esau returned from tha field exhausted.&quot;}, {&quot;n&quot;: &quot;25:30&quot;, &quot;text&quot;: &quot;“Let me eat dat red stew—I’m worn out!” Esau said. Dat’s why he was called Edom.&quot;}, {&quot;n&quot;: &quot;25:31&quot;, &quot;text&quot;: &quot;Jacob said, “Sell me ur birthright 1st.”&quot;}, {&quot;n&quot;: &quot;25:32&quot;, &quot;text&quot;: &quot;Esau answered, “I’m about 2 die! What good is a birthright 2 me?”&quot;}, {&quot;n&quot;: &quot;25:33&quot;, &quot;text&quot;: &quot;“Swear it today.” Esau swore N sold his birthright 2 Jacob.&quot;}, {&quot;n&quot;: &quot;25:34&quot;, &quot;text&quot;: &quot;Jacob gave him bread N lentil stew. Esau ate, drank, got up, N bounced. Dat’s how little he valued his birthright.&quot;}], &quot;26&quot;: [{&quot;n&quot;: &quot;26:1&quot;, &quot;text&quot;: &quot;Another famine hit, separate from tha 1 in Abraham’s dayz. Isaac went 2 Abimelech, Philistine king at Gerar.&quot;}, {&quot;n&quot;: &quot;26:2&quot;, &quot;text&quot;: &quot;Tha LORD appeared: “Don’t go down 2 Egypt. Live in tha land I show u.&quot;}, {&quot;n&quot;: &quot;26:3&quot;, &quot;text&quot;: &quot;Stay here. I’ll b wit u N bless u. I’ll give these landz 2 u N ur offspring, fulfilling my oath 2 Abraham.&quot;}, {&quot;n&quot;: &quot;26:4&quot;, &quot;text&quot;: &quot;I’ll multiply ur descendantz like heaven’s starz N give ’em these landz. Through ur offspring all nationz will b blessed,&quot;}, {&quot;n&quot;: &quot;26:5&quot;, &quot;text&quot;: &quot;because Abraham obeyed my voice N kept my instructionz, commandmentz, decreez, N lawz.”&quot;}, {&quot;n&quot;: &quot;26:6&quot;, &quot;text&quot;: &quot;Isaac stayed in Gerar.&quot;}, {&quot;n&quot;: &quot;26:7&quot;, &quot;text&quot;: &quot;Asked about Rebekah, he said, “She’s my sister.” He was shook dey’d kill him over her beauty if he called her his wife.&quot;}, {&quot;n&quot;: &quot;26:8&quot;, &quot;text&quot;: &quot;Much later, Abimelech looked through a window N saw Isaac caressing Rebekah.&quot;}, {&quot;n&quot;: &quot;26:9&quot;, &quot;text&quot;: &quot;He called Isaac: “She’s clearly ur wife! Why say she’s ur sister?” “I thought I might die because of her.”&quot;}, {&quot;n&quot;: &quot;26:10&quot;, &quot;text&quot;: &quot;“What have u done? Somebody could’ve slept wit ur wife N brought guilt on us!”&quot;}, {&quot;n&quot;: &quot;26:11&quot;, &quot;text&quot;: &quot;Abimelech warned everyone: “Whoever harmz dis man or his wife will b put 2 death.”&quot;}, {&quot;n&quot;: &quot;26:12&quot;, &quot;text&quot;: &quot;Isaac planted cropz N harvested 100-fold dat year. Tha LORD blessed him.&quot;}, {&quot;n&quot;: &quot;26:13&quot;, &quot;text&quot;: &quot;His wealth kept growing until he became extremely wealthy.&quot;}, {&quot;n&quot;: &quot;26:14&quot;, &quot;text&quot;: &quot;He owned flockz, herdz, N many servantz. Tha Philistines envied him.&quot;}, {&quot;n&quot;: &quot;26:15&quot;, &quot;text&quot;: &quot;Dey filled wit dirt all tha wellz Abraham’s servantz had dug.&quot;}, {&quot;n&quot;: &quot;26:16&quot;, &quot;text&quot;: &quot;Abimelech told Isaac, “Bounce from here. U’ve become much stronger than us.”&quot;}, {&quot;n&quot;: &quot;26:17&quot;, &quot;text&quot;: &quot;Isaac bounced, pitched his tent in Gerar’s valley, N settled there.&quot;}, {&quot;n&quot;: &quot;26:18&quot;, &quot;text&quot;: &quot;He reopened tha wellz tha Philistines had blocked after Abraham’s death N restored his father’s namez 4 ’em.&quot;}, {&quot;n&quot;: &quot;26:19&quot;, &quot;text&quot;: &quot;His servantz dug in tha valley N found fresh spring water.&quot;}, {&quot;n&quot;: &quot;26:20&quot;, &quot;text&quot;: &quot;Gerar’s herderz beefed wit Isaac’s herderz: “Tha water’s ours!” He named tha well Esek because of tha dispute.&quot;}, {&quot;n&quot;: &quot;26:21&quot;, &quot;text&quot;: &quot;Dey dug another well N faced more beef. He named it Sitnah.&quot;}, {&quot;n&quot;: &quot;26:22&quot;, &quot;text&quot;: &quot;He moved N dug again. No beef dis time. He named it Rehoboth: “Tha LORD made room; now we can flourish.”&quot;}, {&quot;n&quot;: &quot;26:23&quot;, &quot;text&quot;: &quot;From there he went up 2 Beersheba.&quot;}, {&quot;n&quot;: &quot;26:24&quot;, &quot;text&quot;: &quot;Dat night tha LORD appeared: “I’m Abraham’s God. Don’t b shook. I’m wit u; I’ll bless N multiply u 4 my servant Abraham’s sake.”&quot;}, {&quot;n&quot;: &quot;26:25&quot;, &quot;text&quot;: &quot;Isaac built an altar, called on tha LORD, N pitched his tent. His servantz dug a well there.&quot;}, {&quot;n&quot;: &quot;26:26&quot;, &quot;text&quot;: &quot;Abimelech came from Gerar wit his adviser Ahuzzath N army commander Phichol.&quot;}, {&quot;n&quot;: &quot;26:27&quot;, &quot;text&quot;: &quot;Isaac asked, “Why come 2 me? U hated me N sent me away.”&quot;}, {&quot;n&quot;: &quot;26:28&quot;, &quot;text&quot;: &quot;Dey answered, “We clearly saw tha LORD wit u. Let’s swear an oath N make a covenant:&quot;}, {&quot;n&quot;: &quot;26:29&quot;, &quot;text&quot;: &quot;don’t harm us, as we didn’t harm u. We treated u well N sent u away peacefully. U’re blessed by tha LORD.”&quot;}, {&quot;n&quot;: &quot;26:30&quot;, &quot;text&quot;: &quot;Isaac prepared a feast. Dey ate N drank.&quot;}, {&quot;n&quot;: &quot;26:31&quot;, &quot;text&quot;: &quot;Early next morning dey swore 2 each other. Isaac sent ’em off, N dey bounced in peace.&quot;}, {&quot;n&quot;: &quot;26:32&quot;, &quot;text&quot;: &quot;Dat day his servantz reported on tha well: “We found water!”&quot;}, {&quot;n&quot;: &quot;26:33&quot;, &quot;text&quot;: &quot;He named it Shebah. Tha city’s still called Beersheba.&quot;}, {&quot;n&quot;: &quot;26:34&quot;, &quot;text&quot;: &quot;At 40, Esau married Judith, daughter of Beeri tha Hittite, N Bashemath, daughter of Elon tha Hittite.&quot;}, {&quot;n&quot;: &quot;26:35&quot;, &quot;text&quot;: &quot;Dey brought deep grief 2 Isaac N Rebekah.&quot;}], &quot;27&quot;: [{&quot;n&quot;: &quot;27:1&quot;, &quot;text&quot;: &quot;Old N unable 2 see, Isaac called Esau, his older son. “My son.” “Here I am.”&quot;}, {&quot;n&quot;: &quot;27:2&quot;, &quot;text&quot;: &quot;“I’m old. I don’t know when I’ll die.&quot;}, {&quot;n&quot;: &quot;27:3&quot;, &quot;text&quot;: &quot;Take ur bow N quiver. Hunt some game 4 me.&quot;}, {&quot;n&quot;: &quot;27:4&quot;, &quot;text&quot;: &quot;Cook tha savory food I love N bring it. I’ll eat N bless u before I die.”&quot;}, {&quot;n&quot;: &quot;27:5&quot;, &quot;text&quot;: &quot;Rebekah overheard. Esau went hunting 4 tha meat.&quot;}, {&quot;n&quot;: &quot;27:6&quot;, &quot;text&quot;: &quot;She told Jacob, “I heard ur father tell Esau,&quot;}, {&quot;n&quot;: &quot;27:7&quot;, &quot;text&quot;: &quot;‘Bring game N cook me a meal, so I can bless u before tha LORD before I die.’&quot;}, {&quot;n&quot;: &quot;27:8&quot;, &quot;text&quot;: &quot;Son, listen N do exactly what I tell u.&quot;}, {&quot;n&quot;: &quot;27:9&quot;, &quot;text&quot;: &quot;Bring me 2 good young goatz. I’ll make tha food ur father lovez.&quot;}, {&quot;n&quot;: &quot;27:10&quot;, &quot;text&quot;: &quot;U’ll bring it 2 him so he eatz N blesses u before his death.”&quot;}, {&quot;n&quot;: &quot;27:11&quot;, &quot;text&quot;: &quot;Jacob said, “Esau’s hairy; my skin’s smooth.&quot;}, {&quot;n&quot;: &quot;27:12&quot;, &quot;text&quot;: &quot;Father might touch me N catch tha deception. I’d bring a curse on myself instead of a blessing.”&quot;}, {&quot;n&quot;: &quot;27:13&quot;, &quot;text&quot;: &quot;She answered, “Let tha curse fall on me, son. Just listen N bring tha goatz.”&quot;}, {&quot;n&quot;: &quot;27:14&quot;, &quot;text&quot;: &quot;He fetched ’em. His mother prepared tha food Isaac loved.&quot;}, {&quot;n&quot;: &quot;27:15&quot;, &quot;text&quot;: &quot;Rebekah dressed Jacob in Esau’s best clothez she kept at home.&quot;}, {&quot;n&quot;: &quot;27:16&quot;, &quot;text&quot;: &quot;She covered his handz N smooth neck wit goatskinz.&quot;}, {&quot;n&quot;: &quot;27:17&quot;, &quot;text&quot;: &quot;She handed him tha meal N bread she’d prepared.&quot;}, {&quot;n&quot;: &quot;27:18&quot;, &quot;text&quot;: &quot;Jacob went in: “Father.” “Here I am. Which son are u?”&quot;}, {&quot;n&quot;: &quot;27:19&quot;, &quot;text&quot;: &quot;“Esau, ur firstborn. I did what u asked. Sit up, eat my game, N give me ur blessing.”&quot;}, {&quot;n&quot;: &quot;27:20&quot;, &quot;text&quot;: &quot;“How’d u find it so fast?” Isaac asked. “Tha LORD ur God brought it 2 me.”&quot;}, {&quot;n&quot;: &quot;27:21&quot;, &quot;text&quot;: &quot;“Come close. Let me feel whether u’re really Esau.”&quot;}, {&quot;n&quot;: &quot;27:22&quot;, &quot;text&quot;: &quot;Isaac felt him: “Tha voice is Jacob’s, but tha handz are Esau’s.”&quot;}, {&quot;n&quot;: &quot;27:23&quot;, &quot;text&quot;: &quot;He didn’t recognize Jacob because his handz felt hairy like Esau’s. He blessed him.&quot;}, {&quot;n&quot;: &quot;27:24&quot;, &quot;text&quot;: &quot;“Are u really my son Esau?” “I am.”&quot;}, {&quot;n&quot;: &quot;27:25&quot;, &quot;text&quot;: &quot;“Bring tha game so I can eat N bless u.” Jacob brought it. Isaac ate N drank tha wine Jacob served.&quot;}, {&quot;n&quot;: &quot;27:26&quot;, &quot;text&quot;: &quot;Isaac said, “Come close N kiss me, son.”&quot;}, {&quot;n&quot;: &quot;27:27&quot;, &quot;text&quot;: &quot;Jacob kissed him. Isaac smelled tha clothez N blessed him: “My son smellz like a field tha LORD has blessed.&quot;}, {&quot;n&quot;: &quot;27:28&quot;, &quot;text&quot;: &quot;May God give u heaven’s dew, earth’s richness, N plenty of grain N wine.&quot;}, {&quot;n&quot;: &quot;27:29&quot;, &quot;text&quot;: &quot;May peoplez serve u N nationz bow 2 u. Rule ur brotherz; may ur mother’s sonz bow. Cursed b ur curserz; blessed b ur blesserz.”&quot;}, {&quot;n&quot;: &quot;27:30&quot;, &quot;text&quot;: &quot;Jacob had barely bounced from Isaac’s presence when Esau returned from hunting.&quot;}, {&quot;n&quot;: &quot;27:31&quot;, &quot;text&quot;: &quot;He cooked his meal N brought it: “Father, get up N eat ur son’s game, so u can bless me.”&quot;}, {&quot;n&quot;: &quot;27:32&quot;, &quot;text&quot;: &quot;“Who are u?” “Ur son—Esau, ur firstborn.”&quot;}, {&quot;n&quot;: &quot;27:33&quot;, &quot;text&quot;: &quot;Isaac trembled violently. “Then who brought tha game I ate before u came? I blessed him. Yes, he’ll remain blessed.”&quot;}, {&quot;n&quot;: &quot;27:34&quot;, &quot;text&quot;: &quot;Esau let out a gr8, bitter cry: “Father, bless me too!”&quot;}, {&quot;n&quot;: &quot;27:35&quot;, &quot;text&quot;: &quot;“Ur brother came wit deception N took ur blessing.”&quot;}, {&quot;n&quot;: &quot;27:36&quot;, &quot;text&quot;: &quot;“Jacob’s tha right name! He’s supplanted me twice—my birthright, now my blessing. Didn’t u reserve anything 4 me?”&quot;}, {&quot;n&quot;: &quot;27:37&quot;, &quot;text&quot;: &quot;Isaac answered, “I made him ur lord, gave his brotherz as servantz, N supplied grain N wine. What can I do 4 u now?”&quot;}, {&quot;n&quot;: &quot;27:38&quot;, &quot;text&quot;: &quot;“Do u only have 1 blessing, Father? Bless me too!” Esau cried aloud N wept.&quot;}, {&quot;n&quot;: &quot;27:39&quot;, &quot;text&quot;: &quot;Isaac answered, “Ur dwelling will b of earth’s richness N heaven’s dew above.&quot;}, {&quot;n&quot;: &quot;27:40&quot;, &quot;text&quot;: &quot;U’ll live by ur sword N serve ur brother. But when u grow restless, u’ll break his yoke off ur neck.”&quot;}, {&quot;n&quot;: &quot;27:41&quot;, &quot;text&quot;: &quot;Esau hated Jacob over tha blessing. He thought, “Father’s mourning dayz are near. Then I’ll kill Jacob.”&quot;}, {&quot;n&quot;: &quot;27:42&quot;, &quot;text&quot;: &quot;Rebekah heard N called Jacob: “Esau’s consoling himself wit a plan 2 kill u.&quot;}, {&quot;n&quot;: &quot;27:43&quot;, &quot;text&quot;: &quot;Listen, son. Bounce 2 my brother Laban in Haran.&quot;}, {&quot;n&quot;: &quot;27:44&quot;, &quot;text&quot;: &quot;Stay awhile till ur brother’s fury coolz,&quot;}, {&quot;n&quot;: &quot;27:45&quot;, &quot;text&quot;: &quot;till he forgetz what u did. I’ll send 4 u. Why should I lose both sonz in 1 day?”&quot;}, {&quot;n&quot;: &quot;27:46&quot;, &quot;text&quot;: &quot;Rebekah told Isaac, “These Hittite women make life miserable. If Jacob marries 1 like ’em, what good is my life?”&quot;}], &quot;28&quot;: [{&quot;n&quot;: &quot;28:1&quot;, &quot;text&quot;: &quot;Isaac called N blessed Jacob: “Don’t marry a Canaanite woman.&quot;}, {&quot;n&quot;: &quot;28:2&quot;, &quot;text&quot;: &quot;Go 2 Padanaram, 2 ur grandfather Bethuel’s household. Marry a daughter of Laban, ur mother’s brother.&quot;}, {&quot;n&quot;: &quot;28:3&quot;, &quot;text&quot;: &quot;May God Almighty bless u, make u fruitful, N multiply u in2 a community of peoplez.&quot;}, {&quot;n&quot;: &quot;28:4&quot;, &quot;text&quot;: &quot;May he give u N ur offspring Abraham’s blessing, so u inherit tha land where u live as a stranger, tha land God gave Abraham.”&quot;}, {&quot;n&quot;: &quot;28:5&quot;, &quot;text&quot;: &quot;Isaac sent Jacob 2 Laban, Bethuel tha Syrian’s son, brother of Rebekah, Jacob N Esau’s mother.&quot;}, {&quot;n&quot;: &quot;28:6&quot;, &quot;text&quot;: &quot;Esau saw Isaac bless Jacob N send him 2 Padanaram 4 a wife, warning him against Canaanite marriage,&quot;}, {&quot;n&quot;: &quot;28:7&quot;, &quot;text&quot;: &quot;N saw Jacob obey his parentz N go.&quot;}, {&quot;n&quot;: &quot;28:8&quot;, &quot;text&quot;: &quot;Realizing Canaanite women displeased his father,&quot;}, {&quot;n&quot;: &quot;28:9&quot;, &quot;text&quot;: &quot;Esau went 2 Ishmael’s family N married Mahalath, daughter of Abraham’s son Ishmael N sister of Nebajoth, besides his other wivez.&quot;}, {&quot;n&quot;: &quot;28:10&quot;, &quot;text&quot;: &quot;Jacob bounced from Beersheba toward Haran.&quot;}, {&quot;n&quot;: &quot;28:11&quot;, &quot;text&quot;: &quot;Sunset caught him at a certain place. He took a stone 4 his head N lay down 2 sleep.&quot;}, {&quot;n&quot;: &quot;28:12&quot;, &quot;text&quot;: &quot;He dreamed of a stairway planted on earth, reaching heaven, wit God’s angelz going up N down.&quot;}, {&quot;n&quot;: &quot;28:13&quot;, &quot;text&quot;: &quot;Tha LORD stood above it: “I’m tha LORD, Abraham N Isaac’s God. I’ll give dis ground u’re lying on 2 u N ur offspring.&quot;}, {&quot;n&quot;: &quot;28:14&quot;, &quot;text&quot;: &quot;Ur descendantz will b like earth’s dust, spreading west, east, north, N south. All earth’s familiez will b blessed through u N ur offspring.&quot;}, {&quot;n&quot;: &quot;28:15&quot;, &quot;text&quot;: &quot;I’m wit u. I’ll guard u wherever u go N bring u back. I won’t abandon u before I fulfill my word.”&quot;}, {&quot;n&quot;: &quot;28:16&quot;, &quot;text&quot;: &quot;Jacob woke: “Tha LORD is surely here, N I didn’t know.”&quot;}, {&quot;n&quot;: &quot;28:17&quot;, &quot;text&quot;: &quot;He was shook: “Dis place is awe-inspiring! Dis is God’s house, heaven’s gate!”&quot;}, {&quot;n&quot;: &quot;28:18&quot;, &quot;text&quot;: &quot;Early next morning he stood his headstone upright as a pillar N poured oil over it.&quot;}, {&quot;n&quot;: &quot;28:19&quot;, &quot;text&quot;: &quot;He named tha place Bethel. Tha city had previously been called Luz.&quot;}, {&quot;n&quot;: &quot;28:20&quot;, &quot;text&quot;: &quot;Jacob vowed, “If God stays wit me, guardz my journey, N gives me food N clothez,&quot;}, {&quot;n&quot;: &quot;28:21&quot;, &quot;text&quot;: &quot;so I return safely 2 my father’s house, tha LORD will b my God.&quot;}, {&quot;n&quot;: &quot;28:22&quot;, &quot;text&quot;: &quot;Dis pillar will mark God’s house. Everything u give me, I’ll give u 1/10.”&quot;}], &quot;29&quot;: [{&quot;n&quot;: &quot;29:1&quot;, &quot;text&quot;: &quot;Jacob continued his journey N reached tha eastern peoplez’ land.&quot;}, {&quot;n&quot;: &quot;29:2&quot;, &quot;text&quot;: &quot;He saw a field well wit 3 flockz nearby. Dey drank from it; a huge stone covered its mouth.&quot;}, {&quot;n&quot;: &quot;29:3&quot;, &quot;text&quot;: &quot;Once all tha flockz gathered, tha shepherdz rolled it away, watered tha sheep, N replaced it.&quot;}, {&quot;n&quot;: &quot;29:4&quot;, &quot;text&quot;: &quot;Jacob asked, “Brotherz, where u from?” “Haran.”&quot;}, {&quot;n&quot;: &quot;29:5&quot;, &quot;text&quot;: &quot;“Know Laban, Nahor’s descendant?” “We know him.”&quot;}, {&quot;n&quot;: &quot;29:6&quot;, &quot;text&quot;: &quot;“Is he well?” “He’s well. Here comez his daughter Rachel wit tha sheep.”&quot;}, {&quot;n&quot;: &quot;29:7&quot;, &quot;text&quot;: &quot;“It’s still daylight, too early 2 gather tha livestock. Water tha sheep N take ’em grazing.”&quot;}, {&quot;n&quot;: &quot;29:8&quot;, &quot;text&quot;: &quot;“We can’t till all tha flockz arrive N tha stone’s rolled away. Then we water ’em.”&quot;}, {&quot;n&quot;: &quot;29:9&quot;, &quot;text&quot;: &quot;While dey talked, Rachel arrived wit her father’s sheep. She tended ’em.&quot;}, {&quot;n&quot;: &quot;29:10&quot;, &quot;text&quot;: &quot;Seeing his uncle Laban’s daughter N sheep, Jacob rolled away tha stone N watered tha flock.&quot;}, {&quot;n&quot;: &quot;29:11&quot;, &quot;text&quot;: &quot;He kissed Rachel N wept aloud.&quot;}, {&quot;n&quot;: &quot;29:12&quot;, &quot;text&quot;: &quot;He told her he was her father’s relative, Rebekah’s son. She ran 2 tell Laban.&quot;}, {&quot;n&quot;: &quot;29:13&quot;, &quot;text&quot;: &quot;Laban ran 2 meet his nephew, hugged N kissed him, N brought him home. Jacob explained everything.&quot;}, {&quot;n&quot;: &quot;29:14&quot;, &quot;text&quot;: &quot;“U’re my own flesh N bone!” Laban said. Jacob stayed a month.&quot;}, {&quot;n&quot;: &quot;29:15&quot;, &quot;text&quot;: &quot;Laban said, “Being family doesn’t mean u work 4 nothing. Name ur wagez.”&quot;}, {&quot;n&quot;: &quot;29:16&quot;, &quot;text&quot;: &quot;He had 2 daughterz: Leah tha older, Rachel tha younger.&quot;}, {&quot;n&quot;: &quot;29:17&quot;, &quot;text&quot;: &quot;Leah had tender eyez. Rachel had a beautiful figure N face.&quot;}, {&quot;n&quot;: &quot;29:18&quot;, &quot;text&quot;: &quot;Jacob loved Rachel. “I’ll work 7 yearz 4 ur younger daughter.”&quot;}, {&quot;n&quot;: &quot;29:19&quot;, &quot;text&quot;: &quot;“Better u than another man,” Laban said. “Stay wit me.”&quot;}, {&quot;n&quot;: &quot;29:20&quot;, &quot;text&quot;: &quot;Jacob worked 7 yearz. His love made ’em feel like a few dayz.&quot;}, {&quot;n&quot;: &quot;29:21&quot;, &quot;text&quot;: &quot;“My time’s complete,” he told Laban. “Give me my wife so we can come together.”&quot;}, {&quot;n&quot;: &quot;29:22&quot;, &quot;text&quot;: &quot;Laban gathered tha local men N held a feast.&quot;}, {&quot;n&quot;: &quot;29:23&quot;, &quot;text&quot;: &quot;That evening he brought Leah 2 Jacob. Jacob slept wit her.&quot;}, {&quot;n&quot;: &quot;29:24&quot;, &quot;text&quot;: &quot;Laban gave Leah his servant Zilpah as her attendant.&quot;}, {&quot;n&quot;: &quot;29:25&quot;, &quot;text&quot;: &quot;Morning came—it was Leah! “What did u do 2 me? I worked 4 Rachel. Why play me like dis?”&quot;}, {&quot;n&quot;: &quot;29:26&quot;, &quot;text&quot;: &quot;Laban answered, “Here we don’t marry off tha younger before tha firstborn.&quot;}, {&quot;n&quot;: &quot;29:27&quot;, &quot;text&quot;: &quot;Finish Leah’s wedding week. Then u can have Rachel 4 another 7 yearz’ work.”&quot;}, {&quot;n&quot;: &quot;29:28&quot;, &quot;text&quot;: &quot;Jacob completed tha week, N Laban gave him Rachel too.&quot;}, {&quot;n&quot;: &quot;29:29&quot;, &quot;text&quot;: &quot;Laban gave Rachel his servant Bilhah as her attendant.&quot;}, {&quot;n&quot;: &quot;29:30&quot;, &quot;text&quot;: &quot;Jacob slept wit Rachel N loved her more than Leah. He worked another 7 yearz.&quot;}, {&quot;n&quot;: &quot;29:31&quot;, &quot;text&quot;: &quot;Tha LORD saw Leah was unloved N opened her womb. Rachel couldn’t conceive.&quot;}, {&quot;n&quot;: &quot;29:32&quot;, &quot;text&quot;: &quot;Leah bore Reuben: “Tha LORD saw my affliction. Surely my husband will love me now.”&quot;}, {&quot;n&quot;: &quot;29:33&quot;, &quot;text&quot;: &quot;She bore another son: “Tha LORD heard I’m unloved N gave me dis son.” She named him Simeon.&quot;}, {&quot;n&quot;: &quot;29:34&quot;, &quot;text&quot;: &quot;She bore again: “Now my husband will attach himself 2 me—I’ve borne him 3 sonz.” She named him Levi.&quot;}, {&quot;n&quot;: &quot;29:35&quot;, &quot;text&quot;: &quot;She bore another: “Dis time I’ll praise tha LORD.” She named him Judah N stopped bearing children.&quot;}], &quot;30&quot;: [{&quot;n&quot;: &quot;30:1&quot;, &quot;text&quot;: &quot;Rachel envied her sister because she hadn’t borne Jacob children. “Give me children, or I’ll die!”&quot;}, {&quot;n&quot;: &quot;30:2&quot;, &quot;text&quot;: &quot;Jacob got heated: “Am I God? He’s tha 1 who kept u from conceiving!”&quot;}, {&quot;n&quot;: &quot;30:3&quot;, &quot;text&quot;: &quot;She said, “Sleep wit my servant Bilhah. She’ll bear on my kneez, N I can build a family through her.”&quot;}, {&quot;n&quot;: &quot;30:4&quot;, &quot;text&quot;: &quot;Rachel gave Bilhah as a wife, N Jacob slept wit her.&quot;}, {&quot;n&quot;: &quot;30:5&quot;, &quot;text&quot;: &quot;Bilhah conceived N bore Jacob a son.&quot;}, {&quot;n&quot;: &quot;30:6&quot;, &quot;text&quot;: &quot;Rachel said, “God vindicated me, heard me, N gave me a son.” She named him Dan.&quot;}, {&quot;n&quot;: &quot;30:7&quot;, &quot;text&quot;: &quot;Bilhah conceived again N bore Jacob a 2nd son.&quot;}, {&quot;n&quot;: &quot;30:8&quot;, &quot;text&quot;: &quot;Rachel said, “I’ve wrestled hard wit my sister N prevailed.” She named him Naphtali.&quot;}, {&quot;n&quot;: &quot;30:9&quot;, &quot;text&quot;: &quot;When Leah stopped bearing, she gave her servant Zilpah 2 Jacob as a wife.&quot;}, {&quot;n&quot;: &quot;30:10&quot;, &quot;text&quot;: &quot;Zilpah bore Jacob a son.&quot;}, {&quot;n&quot;: &quot;30:11&quot;, &quot;text&quot;: &quot;Leah said, “Good fortune has come!” She named him Gad.&quot;}, {&quot;n&quot;: &quot;30:12&quot;, &quot;text&quot;: &quot;Zilpah bore Jacob a 2nd son.&quot;}, {&quot;n&quot;: &quot;30:13&quot;, &quot;text&quot;: &quot;Leah said, “I’m happy! Women will call me blessed.” She named him Asher.&quot;}, {&quot;n&quot;: &quot;30:14&quot;, &quot;text&quot;: &quot;At wheat harvest, Reuben found mandrakez N brought ’em 2 Leah. Rachel asked 4 some.&quot;}, {&quot;n&quot;: &quot;30:15&quot;, &quot;text&quot;: &quot;“U took my husband; now my son’s mandrakez too?” Leah asked. Rachel answered, “He can sleep wit u tonight 4 tha mandrakez.”&quot;}, {&quot;n&quot;: &quot;30:16&quot;, &quot;text&quot;: &quot;Jacob returned dat evening. Leah met him: “Come 2 me. I hired u wit my son’s mandrakez.” He slept wit her.&quot;}, {&quot;n&quot;: &quot;30:17&quot;, &quot;text&quot;: &quot;God heard Leah. She conceived N bore Jacob a 5th son.&quot;}, {&quot;n&quot;: &quot;30:18&quot;, &quot;text&quot;: &quot;“God rewarded me 4 giving my servant 2 my husband.” She named him Issachar.&quot;}, {&quot;n&quot;: &quot;30:19&quot;, &quot;text&quot;: &quot;Leah conceived again N bore Jacob a 6th son.&quot;}, {&quot;n&quot;: &quot;30:20&quot;, &quot;text&quot;: &quot;“God gave me a good gift. Now my husband will honor me—I’ve borne him 6 sonz.” She named him Zebulun.&quot;}, {&quot;n&quot;: &quot;30:21&quot;, &quot;text&quot;: &quot;Later she bore a daughter N named her Dinah.&quot;}, {&quot;n&quot;: &quot;30:22&quot;, &quot;text&quot;: &quot;God remembered Rachel, heard her, N opened her womb.&quot;}, {&quot;n&quot;: &quot;30:23&quot;, &quot;text&quot;: &quot;She bore a son: “God removed my disgrace.”&quot;}, {&quot;n&quot;: &quot;30:24&quot;, &quot;text&quot;: &quot;She named him Joseph: “May tha LORD add another son.”&quot;}, {&quot;n&quot;: &quot;30:25&quot;, &quot;text&quot;: &quot;After Joseph’s birth, Jacob told Laban, “Send me off. Let me return 2 my homeland.&quot;}, {&quot;n&quot;: &quot;30:26&quot;, &quot;text&quot;: &quot;Give me tha wivez N children I worked 4. Let me bounce. U know tha work I’ve done.”&quot;}, {&quot;n&quot;: &quot;30:27&quot;, &quot;text&quot;: &quot;Laban said, “Please stay. I’ve learned tha LORD has blessed me because of u.&quot;}, {&quot;n&quot;: &quot;30:28&quot;, &quot;text&quot;: &quot;Name ur wagez. I’ll pay.”&quot;}, {&quot;n&quot;: &quot;30:29&quot;, &quot;text&quot;: &quot;Jacob answered, “U know how I served N cared 4 ur livestock.&quot;}, {&quot;n&quot;: &quot;30:30&quot;, &quot;text&quot;: &quot;U had little before I came; now it’s multiplied. Tha LORD blessed u through my work. When can I provide 4 my household?”&quot;}, {&quot;n&quot;: &quot;30:31&quot;, &quot;text&quot;: &quot;“What should I give u?” “Nothing upfront. Agree 2 dis, N I’ll keep tending ur flock:&quot;}, {&quot;n&quot;: &quot;30:32&quot;, &quot;text&quot;: &quot;today I’ll sort out every speckled N spotted animal, every dark sheep N spotted goat. Those kindz will b my wagez.&quot;}, {&quot;n&quot;: &quot;30:33&quot;, &quot;text&quot;: &quot;My honesty will speak when u inspect my pay. Any goat not spotted or speckled, or sheep not dark, can count as stolen.”&quot;}, {&quot;n&quot;: &quot;30:34&quot;, &quot;text&quot;: &quot;Laban agreed: “Let it b as u said.”&quot;}, {&quot;n&quot;: &quot;30:35&quot;, &quot;text&quot;: &quot;Dat day he removed tha striped N spotted male goatz, speckled N spotted femalez, anything wit white, N every dark sheep. His sonz took ’em.&quot;}, {&quot;n&quot;: &quot;30:36&quot;, &quot;text&quot;: &quot;He put 3 dayz’ distance between himself N Jacob. Jacob tended tha remaining flockz.&quot;}, {&quot;n&quot;: &quot;30:37&quot;, &quot;text&quot;: &quot;Jacob peeled white stripez in2 fresh poplar, hazel, N chestnut branchez, exposing tha pale wood.&quot;}, {&quot;n&quot;: &quot;30:38&quot;, &quot;text&quot;: &quot;He placed ’em in tha watering troughz where tha flockz drank N mated.&quot;}, {&quot;n&quot;: &quot;30:39&quot;, &quot;text&quot;: &quot;Tha flockz mated before tha branchez N bore striped, speckled, N spotted young.&quot;}, {&quot;n&quot;: &quot;30:40&quot;, &quot;text&quot;: &quot;Jacob separated tha lambz N faced tha flockz toward Laban’s striped N dark animalz. He kept his own flockz apart.&quot;}, {&quot;n&quot;: &quot;30:41&quot;, &quot;text&quot;: &quot;When stronger animalz mated, he placed tha branchez before ’em at tha troughz.&quot;}, {&quot;n&quot;: &quot;30:42&quot;, &quot;text&quot;: &quot;Wit weaker animalz he didn’t. Tha weaker went 2 Laban; tha stronger 2 Jacob.&quot;}, {&quot;n&quot;: &quot;30:43&quot;, &quot;text&quot;: &quot;Jacob became extremely prosperous, wit many flockz, female N male servantz, camelz, N donkeyz.&quot;}], &quot;31&quot;: [{&quot;n&quot;: &quot;31:1&quot;, &quot;text&quot;: &quot;Jacob heard Laban’s sonz saying, “He took our father’s property. All dat wealth came from our father!”&quot;}, {&quot;n&quot;: &quot;31:2&quot;, &quot;text&quot;: &quot;He saw Laban wasn’t looking at him tha same way anymore.&quot;}, {&quot;n&quot;: &quot;31:3&quot;, &quot;text&quot;: &quot;Tha LORD said, “Return 2 ur ancestorz’ land N ur family. I’ll b wit u.”&quot;}, {&quot;n&quot;: &quot;31:4&quot;, &quot;text&quot;: &quot;Jacob called Rachel N Leah out 2 tha field beside his flock.&quot;}, {&quot;n&quot;: &quot;31:5&quot;, &quot;text&quot;: &quot;“Ur father’s attitude changed, but my father’s God has stayed wit me.&quot;}, {&quot;n&quot;: &quot;31:6&quot;, &quot;text&quot;: &quot;U know I worked 4 him wit everything I had.&quot;}, {&quot;n&quot;: &quot;31:7&quot;, &quot;text&quot;: &quot;He played me N changed my wagez 10 timez, but God didn’t let him harm me.&quot;}, {&quot;n&quot;: &quot;31:8&quot;, &quot;text&quot;: &quot;If he said, ‘Speckled animalz are ur pay,’ tha flockz bore speckled young. If he said, ‘Striped,’ dey bore striped young.&quot;}, {&quot;n&quot;: &quot;31:9&quot;, &quot;text&quot;: &quot;Dat’s how God took ur father’s livestock N gave ’em 2 me.&quot;}, {&quot;n&quot;: &quot;31:10&quot;, &quot;text&quot;: &quot;During mating season, I dreamed tha malez mating wit tha flock were striped, speckled, N mottled.&quot;}, {&quot;n&quot;: &quot;31:11&quot;, &quot;text&quot;: &quot;God’s angel called, ‘Jacob!’ I answered, ‘Here I am.’&quot;}, {&quot;n&quot;: &quot;31:12&quot;, &quot;text&quot;: &quot;‘Look at tha striped, speckled, N mottled malez. I’ve seen everything Laban has done 2 u.&quot;}, {&quot;n&quot;: &quot;31:13&quot;, &quot;text&quot;: &quot;I’m tha God of Bethel, where u anointed tha pillar N vowed 2 me. Get up, bounce from dis land, N return home.’”&quot;}, {&quot;n&quot;: &quot;31:14&quot;, &quot;text&quot;: &quot;Rachel N Leah answered, “Do we have any share or inheritance left in our father’s household?&quot;}, {&quot;n&quot;: &quot;31:15&quot;, &quot;text&quot;: &quot;He treatz us like outsiderz. He sold us N used up what belonged 2 us.&quot;}, {&quot;n&quot;: &quot;31:16&quot;, &quot;text&quot;: &quot;Tha wealth God took from him belongz 2 us N our children. Do whatever God told u.”&quot;}, {&quot;n&quot;: &quot;31:17&quot;, &quot;text&quot;: &quot;Jacob put his children N wivez on camelz.&quot;}, {&quot;n&quot;: &quot;31:18&quot;, &quot;text&quot;: &quot;He drove off tha livestock N took everything he’d acquired in Padanaram, heading 2 Isaac in Canaan.&quot;}, {&quot;n&quot;: &quot;31:19&quot;, &quot;text&quot;: &quot;Laban had gone sheep-shearing. Rachel stole her father’s household idolz.&quot;}, {&quot;n&quot;: &quot;31:20&quot;, &quot;text&quot;: &quot;Jacob slipped away without telling Laban tha Syrian he was bouncing.&quot;}, {&quot;n&quot;: &quot;31:21&quot;, &quot;text&quot;: &quot;He fled wit everything, crossed tha river, N headed 4 Gilead’s hill country.&quot;}, {&quot;n&quot;: &quot;31:22&quot;, &quot;text&quot;: &quot;On tha 3rd day, Laban heard Jacob had fled.&quot;}, {&quot;n&quot;: &quot;31:23&quot;, &quot;text&quot;: &quot;He gathered his relatives, pursued 4 7 dayz, N caught him in Gilead.&quot;}, {&quot;n&quot;: &quot;31:24&quot;, &quot;text&quot;: &quot;God came 2 Laban in a nighttime dream: “Watch urself. Don’t pressure Jacob wit good or bad wordz.”&quot;}, {&quot;n&quot;: &quot;31:25&quot;, &quot;text&quot;: &quot;Laban reached Jacob’s mountain camp N pitched nearby wit his relatives.&quot;}, {&quot;n&quot;: &quot;31:26&quot;, &quot;text&quot;: &quot;“What have u done? Sneaking off N carrying my daughterz away like war captivez!&quot;}, {&quot;n&quot;: &quot;31:27&quot;, &quot;text&quot;: &quot;Why bounce secretly? I could’ve sent u off wit joy, songz, tambourinez, N harpz.&quot;}, {&quot;n&quot;: &quot;31:28&quot;, &quot;text&quot;: &quot;U didn’t even let me kiss my grandchildren N daughterz goodbye. U acted foolishly.&quot;}, {&quot;n&quot;: &quot;31:29&quot;, &quot;text&quot;: &quot;I could harm u, but ur father’s God warned me last night not 2 pressure u either way.&quot;}, {&quot;n&quot;: &quot;31:30&quot;, &quot;text&quot;: &quot;U longed 4 ur father’s house, fine. But why steal my godz?”&quot;}, {&quot;n&quot;: &quot;31:31&quot;, &quot;text&quot;: &quot;Jacob answered, “I was shook t my daughterz or deir children?&quot;}, {&quot;n&quot;: &quot;31:44&quot;, &quot;text&quot;: &quot;Come, let’s make a covenant as a witness between us.”&quot;}, {&quot;n&quot;: &quot;31:45&quot;, &quot;text&quot;: &quot;Jacob set a stone upright as a pillar.&quot;}, {&quot;n&quot;: &quot;31:46&quot;, &quot;text&quot;: &quot;He told his relatives 2 gather stonez. Dey made a heap N ate beside it.&quot;}, {&quot;n&quot;: &quot;31:47&quot;, &quot;text&quot;: &quot;Laban called it Jegarsahadutha; Jacob called it Galeed.&quot;}, {&quot;n&quot;: &quot;31:48&quot;, &quot;text&quot;: &quot;Laban said, “Dis heap witnesses our agreement today.” Dat’s why it was called Galeed,&quot;}, {&quot;n&quot;: &quot;31:49&quot;, &quot;text&quot;: &quot;N Mizpah: “May tha LORD watch between us when we’re apart.&quot;}, {&quot;n&quot;: &quot;31:50&quot;, &quot;text&quot;: &quot;If u mistreat my daughterz or marry other wivez, God witnesses between us even when nobody else is here.&quot;}, {&quot;n&quot;: &quot;31:51&quot;, &quot;text&quot;: &quot;See dis heap N pillar I’ve set between us.&quot;}, {&quot;n&quot;: &quot;31:52&quot;, &quot;text&quot;: &quot;Dey witness dat neither of us will cross dis boundary 2 harm tha other.&quot;}, {&quot;n&quot;: &quot;31:53&quot;, &quot;text&quot;: &quot;May Abraham’s God N Nahor’s God, deir father’s God, judge between us.” Jacob swore by tha God Isaac revered.&quot;}, {&quot;n&quot;: &quot;31:54&quot;, &quot;text&quot;: &quot;Jacob offered a mountain sacrifice N invited his relatives 2 eat. Dey ate N stayed overnight.&quot;}, {&quot;n&quot;: &quot;31:55&quot;, &quot;text&quot;: &quot;Early next morning Laban kissed N blessed his grandchildren N daughterz, then bounced home.&quot;}], &quot;32&quot;: [{&quot;n&quot;: &quot;32:1&quot;, &quot;text&quot;: &quot;Jacob continued on, N God’s angelz met him.&quot;}, {&quot;n&quot;: &quot;32:2&quot;, &quot;text&quot;: &quot;“Dis is God’s camp!” he said, naming tha place Mahanaim.&quot;}, {&quot;n&quot;: &quot;32:3&quot;, &quot;text&quot;: &quot;He sent messengerz ahead 2 Esau in Seir, tha territory of Edom.&quot;}, {&quot;n&quot;: &quot;32:4&quot;, &quot;text&quot;: &quot;“Tell my lord Esau, ‘Ur servant Jacob stayed wit Laban till now.&quot;}, {&quot;n&quot;: &quot;32:5&quot;, &quot;text&quot;: &quot;I have cattle, donkeyz, flockz, N male N female servantz. I’m sending dis word hoping 4 ur favor.’”&quot;}, {&quot;n&quot;: &quot;32:6&quot;, &quot;text&quot;: &quot;Dey returned: “Esau’s coming 2 meet u—wit 400 men.”&quot;}, {&quot;n&quot;: &quot;32:7&quot;, &quot;text&quot;: &quot;Jacob was deeply shook N distressed. He divided his people, flockz, herdz, N camelz in2 2 campz.&quot;}, {&quot;n&quot;: &quot;32:8&quot;, &quot;text&quot;: &quot;“If Esau attacks 1 camp, tha other may escape.”&quot;}, {&quot;n&quot;: &quot;32:9&quot;, &quot;text&quot;: &quot;He prayed, “God of Abraham N Isaac, LORD who told me 2 return home N promised 2 treat me well,&quot;}, {&quot;n&quot;: &quot;32:10&quot;, &quot;text&quot;: &quot;I don’t deserve all ur kindness N faithfulness. I crossed dis Jordan wit only my staff; now I have 2 campz.&quot;}, {&quot;n&quot;: &quot;32:11&quot;, &quot;text&quot;: &quot;Rescue me from Esau. I’m shook he’ll attack me, tha motherz, N tha children.&quot;}, {&quot;n&quot;: &quot;32:12&quot;, &quot;text&quot;: &quot;U promised good 2 me N descendantz like seashore sand, too many 2 count.”&quot;}, {&quot;n&quot;: &quot;32:13&quot;, &quot;text&quot;: &quot;He stayed dat night N selected a gift 4 Esau:&quot;}, {&quot;n&quot;: &quot;32:14&quot;, &quot;text&quot;: &quot;200 female goatz, 20 male goatz, 200 ewez, N 20 ramz;&quot;}, {&quot;n&quot;: &quot;32:15&quot;, &quot;text&quot;: &quot;30 nursing camelz wit deir young, 40 cowz, 10 bullz, 20 female donkeyz, N 10 foalz.&quot;}, {&quot;n&quot;: &quot;32:16&quot;, &quot;text&quot;: &quot;He assigned each herd 2 servantz: “Go ahead, leaving space between tha herdz.”&quot;}, {&quot;n&quot;: &quot;32:17&quot;, &quot;text&quot;: &quot;He told tha 1st, “When Esau asks who ownz u, where u’re headed, N whose animalz these are,&quot;}, {&quot;n&quot;: &quot;32:18&quot;, &quot;text&quot;: &quot;say, ‘Ur servant Jacob’s. Dey’re a gift 4 my lord Esau. He’s behind us.’”&quot;}, {&quot;n&quot;: &quot;32:19&quot;, &quot;text&quot;: &quot;He gave tha same instructionz 2 tha 2nd, 3rd, N every following herd.&quot;}, {&quot;n&quot;: &quot;32:20&quot;, &quot;text&quot;: &quot;“Say Jacob’s behind u.” He thought, “Maybe dis gift will soften him; then he’ll accept me when we meet.”&quot;}, {&quot;n&quot;: &quot;32:21&quot;, &quot;text&quot;: &quot;Tha gift went ahead. Jacob stayed dat night in camp.&quot;}, {&quot;n&quot;: &quot;32:22&quot;, &quot;text&quot;: &quot;Dat night he took his 2 wivez, 2 female servantz, N 11 sonz across tha Jabbok ford.&quot;}, {&quot;n&quot;: &quot;32:23&quot;, &quot;text&quot;: &quot;He sent ’em across tha stream wit everything he owned.&quot;}, {&quot;n&quot;: &quot;32:24&quot;, &quot;text&quot;: &quot;Jacob was left alone. A man wrestled wit him till dawn.&quot;}, {&quot;n&quot;: &quot;32:25&quot;, &quot;text&quot;: &quot;Seeing he hadn’t overcome Jacob, tha man touched his hip socket. Jacob’s hip went outta joint while dey wrestled.&quot;}, {&quot;n&quot;: &quot;32:26&quot;, &quot;text&quot;: &quot;“Let me go; dawn’s coming.” Jacob answered, “I won’t let go unless u bless me.”&quot;}, {&quot;n&quot;: &quot;32:27&quot;, &quot;text&quot;: &quot;“What’s ur name?” “Jacob.”&quot;}, {&quot;n&quot;: &quot;32:28&quot;, &quot;text&quot;: &quot;“Ur name will b Israel now. U’ve struggled wit God N men N prevailed.”&quot;}, {&quot;n&quot;: &quot;32:29&quot;, &quot;text&quot;: &quot;Jacob asked his name. “Why ask my name?” tha man answered, N blessed him there.&quot;}, {&quot;n&quot;: &quot;32:30&quot;, &quot;text&quot;: &quot;Jacob named tha place Peniel: “I’ve seen God face 2 face, N my life was spared.”&quot;}, {&quot;n&quot;: &quot;32:31&quot;, &quot;text&quot;: &quot;Tha sun rose as he passed Penuel, limping because of his hip.&quot;}, {&quot;n&quot;: &quot;32:32&quot;, &quot;text&quot;: &quot;Dat’s why Israelites still don’t eat tha tendon at tha hip socket: he touched Jacob there.&quot;}], &quot;33&quot;: [{&quot;n&quot;: &quot;33:1&quot;, &quot;text&quot;: &quot;Esau approached wit 400 men. Jacob divided tha children among Leah, Rachel, N tha 2 servantz.&quot;}, {&quot;n&quot;: &quot;33:2&quot;, &quot;text&quot;: &quot;Servantz N deir children went 1st, Leah N herz next, Rachel N Joseph last.&quot;}, {&quot;n&quot;: &quot;33:3&quot;, &quot;text&quot;: &quot;Jacob went ahead, bowing 2 tha ground 7 timez as he approached Esau.&quot;}, {&quot;n&quot;: &quot;33:4&quot;, &quot;text&quot;: &quot;Esau ran 2 him, hugged his neck, N kissed him. Both wept.&quot;}, {&quot;n&quot;: &quot;33:5&quot;, &quot;text&quot;: &quot;Seeing tha women N children, Esau asked who dey were. “Tha children God graciously gave ur servant.”&quot;}, {&quot;n&quot;: &quot;33:6&quot;, &quot;text&quot;: &quot;Tha servantz N deir children came forward N bowed.&quot;}, {&quot;n&quot;: &quot;33:7&quot;, &quot;text&quot;: &quot;Leah N her children bowed. Then Joseph N Rachel approached N bowed.&quot;}, {&quot;n&quot;: &quot;33:8&quot;, &quot;text&quot;: &quot;“What were all those herdz 4?” Esau asked. “2 find favor wit u, my lord.”&quot;}, {&quot;n&quot;: &quot;33:9&quot;, &quot;text&quot;: &quot;“I have enough, brother. Keep ur property.”&quot;}, {&quot;n&quot;: &quot;33:10&quot;, &quot;text&quot;: &quot;“Please accept my gift if u favor me. Seeing ur welcoming face is like seeing God’s face.&quot;}, {&quot;n&quot;: &quot;33:11&quot;, &quot;text&quot;: &quot;Accept dis blessing. God’s been gracious; I have enough.” Jacob insisted, N Esau accepted.&quot;}, {&quot;n&quot;: &quot;33:12&quot;, &quot;text&quot;: &quot;Esau said, “Let’s travel. I’ll go ahead.”&quot;}, {&quot;n&quot;: &quot;33:13&quot;, &quot;text&quot;: &quot;Jacob answered, “Tha children are delicate. Tha flockz N herdz are nursing young. Drive ’em hard 1 day N dey could die.&quot;}, {&quot;n&quot;: &quot;33:14&quot;, &quot;text&quot;: &quot;Go ahead. I’ll move gently, at tha children’s N livestock’s pace, till I reach u in Seir.”&quot;}, {&quot;n&quot;: &quot;33:15&quot;, &quot;text&quot;: &quot;“Let me leave some men wit u.” “No need. Just let me remain in ur favor.”&quot;}, {&quot;n&quot;: &quot;33:16&quot;, &quot;text&quot;: &quot;Esau bounced back 2 Seir dat day.&quot;}, {&quot;n&quot;: &quot;33:17&quot;, &quot;text&quot;: &quot;Jacob traveled 2 Succoth, built a house, N made shelterz 4 his livestock. Dat’s why tha place is called Succoth.&quot;}, {&quot;n&quot;: &quot;33:18&quot;, &quot;text&quot;: &quot;Returning from Padanaram, Jacob reached Shechem in Canaan safely N camped outside tha city.&quot;}, {&quot;n&quot;: &quot;33:19&quot;, &quot;text&quot;: &quot;He bought tha field where he pitched his tent from Hamor’s sonz 4 100 piecez of money. Hamor was Shechem’s father.&quot;}, {&quot;n&quot;: &quot;33:20&quot;, &quot;text&quot;: &quot;He built an altar N named it EleloheIsrael.&quot;}], &quot;34&quot;: [{&quot;n&quot;: &quot;34:1&quot;, &quot;text&quot;: &quot;Dinah, Leah N Jacob’s daughter, went out 2 visit tha local women.&quot;}, {&quot;n&quot;: &quot;34:2&quot;, &quot;text&quot;: &quot;Shechem, son of Hamor tha Hivite, tha region’s prince, saw her, took her, N raped her.&quot;}, {&quot;n&quot;: &quot;34:3&quot;, &quot;text&quot;: &quot;He became deeply attached 2 Dinah, loved her, N spoke tenderly 2 her.&quot;}, {&quot;n&quot;: &quot;34:4&quot;, &quot;text&quot;: &quot;He told Hamor, “Get me dis young woman as my wife.”&quot;}, {&quot;n&quot;: &quot;34:5&quot;, &quot;text&quot;: &quot;Jacob heard Dinah had been violated. His sonz were tending livestock, so he stayed quiet till dey returned.&quot;}, {&quot;n&quot;: &quot;34:6&quot;, &quot;text&quot;: &quot;Hamor went 2 speak wit Jacob.&quot;}, {&quot;n&quot;: &quot;34:7&quot;, &quot;text&quot;: &quot;Jacob’s sonz returned, deeply grieved N furious. Violating Jacob’s daughter was an outrage in Israel—something dat should never happen.&quot;}, {&quot;n&quot;: &quot;34:8&quot;, &quot;text&quot;: &quot;Hamor said, “My son longz 4 ur daughter. Please give her 2 him as a wife.&quot;}, {&quot;n&quot;: &quot;34:9&quot;, &quot;text&quot;: &quot;Intermarry wit us: ur daughterz 4 our sonz, our daughterz 4 urs.&quot;}, {&quot;n&quot;: &quot;34:10&quot;, &quot;text&quot;: &quot;Live among us. Tha land is open: settle, trade, N acquire property.”&quot;}, {&quot;n&quot;: &quot;34:11&quot;, &quot;text&quot;: &quot;Shechem told her father N brotherz, “Favor me. I’ll give whatever u ask.&quot;}, {&quot;n&quot;: &quot;34:12&quot;, &quot;text&quot;: &quot;Name any bride-price N gift, however high. Just give me tha young woman as my wife.”&quot;}, {&quot;n&quot;: &quot;34:13&quot;, &quot;text&quot;: &quot;Because Shechem violated Dinah, Jacob’s sonz answered him N Hamor deceptively:&quot;}, {&quot;n&quot;: &quot;34:14&quot;, &quot;text&quot;: &quot;“We can’t give our sister 2 an uncircumcised man. Dat would disgrace us.&quot;}, {&quot;n&quot;: &quot;34:15&quot;, &quot;text&quot;: &quot;We’ll agree only if every male among u is circumcised like us.&quot;}, {&quot;n&quot;: &quot;34:16&quot;, &quot;text&quot;: &quot;Then we’ll intermarry, live together, N become 1 people.&quot;}, {&quot;n&quot;: &quot;34:17&quot;, &quot;text&quot;: &quot;Refuse, N we’ll take our sister N bounce.”&quot;}, {&quot;n&quot;: &quot;34:18&quot;, &quot;text&quot;: &quot;Hamor N Shechem liked tha termz.&quot;}, {&quot;n&quot;: &quot;34:19&quot;, &quot;text&quot;: &quot;Shechem acted immediately because he wanted Dinah. He was tha most honored in his father’s household.&quot;}, {&quot;n&quot;: &quot;34:20&quot;, &quot;text&quot;: &quot;Hamor N Shechem went 2 tha city gate N addressed tha men:&quot;}, {&quot;n&quot;: &quot;34:21&quot;, &quot;text&quot;: &quot;“These men are peaceful. Let ’em settle N trade; there’s room. We can marry deir daughterz N give ’em ours.&quot;}, {&quot;n&quot;: &quot;34:22&quot;, &quot;text&quot;: &quot;Dey’ll join us as 1 people only if all our malez get circumcised like dem.&quot;}, {&quot;n&quot;: &quot;34:23&quot;, &quot;text&quot;: &quot;Won’t deir livestock N wealth become ours? Agree, N dey’ll settle here.”&quot;}, {&quot;n&quot;: &quot;34:24&quot;, &quot;text&quot;: &quot;Everyone at tha gate agreed. Every male in tha city was circumcised.&quot;}, {&quot;n&quot;: &quot;34:25&quot;, &quot;text&quot;: &quot;On tha 3rd day, while dey hurt, Dinah’s brotherz Simeon N Levi took swordz, entered tha unsuspecting city, N killed every male.&quot;}, {&quot;n&quot;: &quot;34:26&quot;, &quot;text&quot;: &quot;Dey killed Hamor N Shechem, took Dinah from Shechem’s house, N bounced.&quot;}, {&quot;n&quot;: &quot;34:27&quot;, &quot;text&quot;: &quot;Jacob’s sonz came over tha bodies N plundered tha city because deir sister had been violated.&quot;}, {&quot;n&quot;: &quot;34:28&quot;, &quot;text&quot;: &quot;Dey took sheep, cattle, donkeyz, N everything in tha city N fieldz.&quot;}, {&quot;n&quot;: &quot;34:29&quot;, &quot;text&quot;: &quot;Dey seized all tha wealth, women, N children, N looted every house.&quot;}, {&quot;n&quot;: &quot;34:30&quot;, &quot;text&quot;: &quot;Jacob told Simeon N Levi, “U’ve brought trouble N made us hated by tha Canaanites N Perizzites. We’re few. Dey could unite N destroy our household.”&quot;}, {&quot;n&quot;: &quot;34:31&quot;, &quot;text&quot;: &quot;Dey answered, “Should he treat our sister like a prostitute?”&quot;}], &quot;35&quot;: [{&quot;n&quot;: &quot;35:1&quot;, &quot;text&quot;: &quot;God told Jacob, “Go live in Bethel. Build an altar 2 tha God who appeared when u fled Esau.”&quot;}, {&quot;n&quot;: &quot;35:2&quot;, &quot;text&quot;: &quot;Jacob told his household, “Remove ur foreign godz, purify yourselves, N change ur clothez.&quot;}, {&quot;n&quot;: &quot;35:3&quot;, &quot;text&quot;: &quot;We’re going 2 Bethel. I’ll quot;, &quot;text&quot;: &quot;Her midwife said, “Don’t b shook. U’re having another son.”&quot;}, {&quot;n&quot;: &quot;35:18&quot;, &quot;text&quot;: &quot;As Rachel’s life slipped away, she named him Benoni. His father named him Benjamin.&quot;}, {&quot;n&quot;: &quot;35:19&quot;, &quot;text&quot;: &quot;Rachel died N was buried beside tha road 2 Ephrath—Bethlehem.&quot;}, {&quot;n&quot;: &quot;35:20&quot;, &quot;text&quot;: &quot;Jacob set a pillar over her grave. It markz Rachel’s grave 2 dis day.&quot;}, {&quot;n&quot;: &quot;35:21&quot;, &quot;text&quot;: &quot;Israel traveled on N pitched his tent beyond tha tower of Edar.&quot;}, {&quot;n&quot;: &quot;35:22&quot;, &quot;text&quot;: &quot;While he lived there, Reuben slept wit Bilhah, his father’s concubine. Israel heard. Jacob had 12 sonz:&quot;}, {&quot;n&quot;: &quot;35:23&quot;, &quot;text&quot;: &quot;Leah’s: Reuben tha firstborn, Simeon, Levi, Judah, Issachar, N Zebulun;&quot;}, {&quot;n&quot;: &quot;35:24&quot;, &quot;text&quot;: &quot;Rachel’s: Joseph N Benjamin;&quot;}, {&quot;n&quot;: &quot;35:25&quot;, &quot;text&quot;: &quot;Rachel’s servant Bilhah’s: Dan N Naphtali;&quot;}, {&quot;n&quot;: &quot;35:26&quot;, &quot;text&quot;: &quot;Leah’s servant Zilpah’s: Gad N Asher. These were Jacob’s sonz from his time in Padanaram.&quot;}, {&quot;n&quot;: &quot;35:27&quot;, &quot;text&quot;: &quot;Jacob reached Isaac in Mamre, at Kirjatharba—Hebron—where Abraham N Isaac had lived.&quot;}, {&quot;n&quot;: &quot;35:28&quot;, &quot;text&quot;: &quot;Isaac lived 180 yearz.&quot;}, {&quot;n&quot;: &quot;35:29&quot;, &quot;text&quot;: &quot;He breathed his last, old N full of dayz, N was gathered 2 his people. Esau N Jacob buried him.&quot;}], &quot;36&quot;: [{&quot;n&quot;: &quot;36:1&quot;, &quot;text&quot;: &quot;Here’s Esau’s family record. Esau is Edom.&quot;}, {&quot;n&quot;: &quot;36:2&quot;, &quot;text&quot;: &quot;His Canaanite wivez were Adah, daughter of Elon tha Hittite; Aholibamah, daughter of Anah
