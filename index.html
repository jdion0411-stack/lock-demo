All tha hangings of tha court round about were of fine twined linen."},{"n":"38:17","text":"N tha socketz 4 tha pillarz were of brass; tha hookz of tha pillarz N their fillets of silver; N tha overlaying of their chapiters of silver; N all tha pillarz of tha court were filleted wit silver."},{"n":"38:18","text":"N tha hanging 4 tha gate of tha court was needlework, of blue, N purple, N scarlet, N fine twined linen: N twenty cubitz was tha length, N tha height in tha breadth was five cubitz, answerable 2 tha hangings of tha court."},{"n":"38:19","text":"N their pillarz were four, N their socketz of brass four; their hookz of silver, N tha overlaying of their chapiters N their fillets of silver."},{"n":"38:20","text":"N all tha pins of tha tabernacle, N of tha court round about, were of brass."},{"n":"38:21","text":"Dis is tha sum of tha tabernacle, even of tha tabernacle of testimony, as it was counted, according 2 tha commandment of Moses, 4 tha service of tha Levites, by tha hand of Ithamar, son 2 Aaron tha priest."},{"n":"38:22","text":"N Bezaleel tha son of Uri, tha son of Hur, of tha tribe of Judah, made all dat tha LORD commanded Moses."},{"n":"38:23","text":"N wit him was Aholiab, son of Ahisamach, of tha tribe of Dan, an engraver, N a cunning workman, N an embroiderer in blue, N in purple, N in scarlet, N fine linen."},{"n":"38:24","text":"All tha gold dat was occupied 4 tha work in all tha work of tha holy place, even tha gold of tha offering, was twenty N nine talents, N seven hundred N thirty shekels, after tha shekel of tha sanctuary."},{"n":"38:25","text":"N tha silver of ’em dat were numbered of tha congregation was a hundred talents, N a thousand seven hundred N threescore N fifteen shekels, after tha shekel of tha sanctuary:"},{"n":"38:26","text":"A bekah 4 every man, dat is, half a shekel, after tha shekel of tha sanctuary, 4 every one dat went 2 be numbered, from twenty yearz old N upward, 4 six hundred thousand N three thousand N five hundred N fifty men."},{"n":"38:27","text":"N of tha hundred talents of silver were cast tha socketz of tha sanctuary, N tha socketz of tha vail; a hundred socketz of tha hundred talents, a talent 4 a socket."},{"n":"38:28","text":"N of tha thousand seven hundred seventy N five shekels he made hookz 4 tha pillarz, N overlaid their chapiters, N filleted ’em."},{"n":"38:29","text":"N tha brass of tha offering was seventy talents, N two thousand N four hundred shekels."},{"n":"38:30","text":"N therewith he made tha socketz 2 tha door of tha tabernacle of tha congregation, N tha brasen altar, N tha brasen grate 4 it, N all tha vessels of tha altar,"},{"n":"38:31","text":"N tha socketz of tha court round about, N tha socketz of tha court gate, N all tha pins of tha tabernacle, N all tha pins of tha court round about."}],"39":[{"n":"39:1","text":"N of tha blue, N purple, N scarlet, they made cloths of service, 2 do service in tha holy place, N made tha holy garmentz 4 Aaron; as tha LORD commanded Moses."},{"n":"39:2","text":"N he made tha ephod of gold, blue, N purple, N scarlet, N fine twined linen."},{"n":"39:3","text":"N they did beat tha gold in2 thin plates, N cut it in2 wires, 2 work it in tha blue, N in tha purple, N in tha scarlet, N in tha fine linen, wit cunning work."},{"n":"39:4","text":"They made shoulderpieces 4 it, 2 couple it together: by tha two edges was it coupled together."},{"n":"39:5","text":"N tha curious girdle of his ephod, dat was on it, was of tha same, according 2 tha work thereof; of gold, blue, N purple, N scarlet, N fine twined linen; as tha LORD commanded Moses."},{"n":"39:6","text":"N they wrought onyx stones inclosed in ouches of gold, graven, as signets r graven, wit tha namez of tha children of Israel."},{"n":"39:7","text":"N he put ’em on tha shoulders of tha ephod, dat they should be stones 4 a memorial 2 tha children of Israel; as tha LORD commanded Moses."},{"n":"39:8","text":"N he made tha breastplate of cunning work, like tha work of tha ephod; of gold, blue, N purple, N scarlet, N fine twined linen."},{"n":"39:9","text":"It was foursquare; they made tha breastplate double: a span was tha length thereof, N a span tha breadth thereof, being doubled."},{"n":"39:10","text":"N they set in it four rows of stones: tha first row was a sardius, a topaz, N a carbuncle: dis was tha first row."},{"n":"39:11","text":"N tha second row, an emerald, a sapphire, N a diamond."},{"n":"39:12","text":"N tha third row, a ligure, an agate, N an amethyst."},{"n":"39:13","text":"N tha fourth row, a beryl, an onyx, N a jasper: they were inclosed in ouches of gold in their inclosings."},{"n":"39:14","text":"N tha stones were according 2 tha namez of tha children of Israel, twelve, according 2 their namez, like tha engravings of a signet, every one wit his name, according 2 tha twelve tribez."},{"n":"39:15","text":"N they made on tha breastplate chains at tha ends, of wreathen work of pure gold."},{"n":"39:16","text":"N they made two ouches of gold, N two gold ringz; N put tha two ringz in tha two ends of tha breastplate."},{"n":"39:17","text":"N they put tha two wreathen chains of gold in tha two ringz on tha ends of tha breastplate."},{"n":"39:18","text":"N tha two ends of tha two wreathen chains they fastened in tha two ouches, N put ’em on tha shoulderpieces of tha ephod, before it."},{"n":"39:19","text":"N they made two ringz of gold, N put ’em on tha two ends of tha breastplate, on tha border of it, which was on tha side of tha ephod inward."},{"n":"39:20","text":"N they made two other golden ringz, N put ’em on tha two sides of tha ephod underneath, toward tha forepart of it, over against tha other coupling thereof, above tha curious girdle of tha ephod."},{"n":"39:21","text":"N they did bind tha breastplate by his ringz 2 tha ringz of tha ephod wit a lace of blue, dat it might be above tha curious girdle of tha ephod, N dat tha breastplate might not be loosed from tha ephod; as tha LORD commanded Moses."},{"n":"39:22","text":"N he made tha robe of tha ephod of woven work, all of blue."},{"n":"39:23","text":"N there was an hole in tha midst of tha robe, as tha hole of an habergeon, wit a band round about tha hole, dat it should not rend."},{"n":"39:24","text":"N they made on tha hems of tha robe pomegranates of blue, N purple, N scarlet, N twined linen."},{"n":"39:25","text":"N they made bells of pure gold, N put tha bells between tha pomegranates on tha hem of tha robe, round about between tha pomegranates;"},{"n":"39:26","text":"A bell N a pomegranate, a bell N a pomegranate, round about tha hem of tha robe 2 minister in; as tha LORD commanded Moses."},{"n":"39:27","text":"N they made coats of fine linen of woven work 4 Aaron, N 4 his sonz,"},{"n":"39:28","text":"N a mitre of fine linen, N goodly bonnets of fine linen, N linen breeches of fine twined linen,"},{"n":"39:29","text":"N a girdle of fine twined linen, N blue, N purple, N scarlet, of needlework; as tha LORD commanded Moses."},{"n":"39:30","text":"N they made tha plate of tha holy crown of pure gold, N wrote on it a writing, like 2 tha engravings of a signet, HOLINESS TO THA LORD."},{"n":"39:31","text":"N they tied 2 it a lace of blue, 2 fasten it on high on tha mitre; as tha LORD commanded Moses."},{"n":"39:32","text":"Thus was all tha work of tha tabernacle of tha tent of tha congregation finished: N tha children of Israel did according 2 all dat tha LORD commanded Moses, so did they."},{"n":"39:33","text":"N they brought tha tabernacle 2 Moses, tha tent, N all his furniture, his taches, his boardz, his bars, N his pillarz, N his socketz,"},{"n":"39:34","text":"N tha covering of rams’ skins dyed red, N tha covering of badgers’ skins, N tha vail of tha covering,"},{"n":"39:35","text":"Tha ark of tha testimony, N tha staves thereof, N tha mercy seat,"},{"n":"39:36","text":"Tha table, N all tha vessels thereof, N tha shewbread,"},{"n":"39:37","text":"Tha pure candlestick, wit tha lamps thereof, even wit tha lamps 2 be set in order, N all tha vessels thereof, N tha oil 4 light,"},{"n":"39:38","text":"N tha golden altar, N tha anointing oil, N tha sweet incense, N tha hanging 4 tha tabernacle door,"},{"n":"39:39","text":"Tha brasen altar, N his grate of brass, his staves, N all his vessels, tha laver N his foot,"},{"n":"39:40","text":"Tha hangings of tha court, his pillarz, N his socketz, N tha hanging 4 tha court gate, his cords, N his pins, N all tha vessels of tha service of tha tabernacle, 4 tha tent of tha congregation,"},{"n":"39:41","text":"Tha cloths of service 2 do service in tha holy place, N tha holy garmentz 4 Aaron tha priest, N his sonz’ garmentz, 2 minister in tha priest’s office."},{"n":"39:42","text":"According 2 all dat tha LORD commanded Moses, so tha children of Israel made all tha work."},{"n":"39:43","text":"N Moses did look on all tha work, N, look, they had done it as tha LORD had commanded, even so had they done it: N Moses blessed ’em."}],"40":[{"n":"40:1","text":"N tha LORD spoke 2 Moses, saying,"},{"n":"40:2","text":"On tha first day of tha first month will u set up tha tabernacle of tha tent of tha congregation."},{"n":"40:3","text":"N u will put therein tha ark of tha testimony, N cover tha ark wit tha vail."},{"n":"40:4","text":"N u will bring in tha table, N set in order tha things dat r 2 be set in order on it; N u will bring in tha candlestick, N light tha lamps thereof."},{"n":"40:5","text":"N u will set tha altar of gold 4 tha incense before tha ark of tha testimony, N put tha hanging of tha door 2 tha tabernacle."},{"n":"40:6","text":"N u will set tha altar of tha burnt offering before tha door of tha tabernacle of tha tent of tha congregation."},{"n":"40:7","text":"N u will set tha laver between tha tent of tha congregation N tha altar, N will put water therein."},{"n":"40:8","text":"N u will set up tha court round about, N hang up tha hanging at tha court gate."},{"n":"40:9","text":"N u will take tha anointing oil, N anoint tha tabernacle, N all dat is therein, N will hallow it, N all tha vessels thereof: N it will be holy."},{"n":"40:10","text":"N u will anoint tha altar of tha burnt offering, N all his vessels, N sanctify tha altar: N it will be an altar most holy."},{"n":"40:11","text":"N u will anoint tha laver N his foot, N sanctify it."},{"n":"40:12","text":"N u will bring Aaron N his sonz 2 tha door of tha tabernacle of tha congregation, N wash ’em wit water."},{"n":"40:13","text":"N u will put on Aaron tha holy garmentz, N anoint him, N sanctify him; dat he may minister 2 me in tha priest’s office."},{"n":"40:14","text":"N u will bring his sonz, N clothe ’em wit coats:"},{"n":"40:15","text":"N u will anoint ’em, as u didst anoint their father, dat they may minister 2 me in tha priest’s office: 4 their anointing will surely be an everlasting priesthood throughout their generations."},{"n":"40:16","text":"Thus did Moses: according 2 all dat tha LORD commanded him, so did he."},{"n":"40:17","text":"N it happened in tha first month in tha second year, on tha first day of tha month, dat tha tabernacle was reared up."},{"n":"40:18","text":"N Moses reared up tha tabernacle, N fastened his socketz, N set up tha boardz thereof, N put in tha bars thereof, N reared up his pillarz."},{"n":"40:19","text":"N he spread abroad tha tent over tha tabernacle, N put tha covering of tha tent above on it; as tha LORD commanded Moses."},{"n":"40:20","text":"N he took N put tha testimony in2 tha ark, N set tha staves on tha ark, N put tha mercy seat above on tha ark:"},{"n":"40:21","text":"N he brought tha ark in2 tha tabernacle, N set up tha vail of tha covering, N covered tha ark of tha testimony; as tha LORD commanded Moses."},{"n":"40:22","text":"N he put tha table in tha tent of tha congregation, on tha side of tha tabernacle northward, without tha vail."},{"n":"40:23","text":"N he set tha bread in order on it before tha LORD; as tha LORD had commanded Moses."},{"n":"40:24","text":"N he put tha candlestick in tha tent of
