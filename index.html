quot;, &quot;text&quot;: &quot;Her midwife said, “Don’t b shook. U’re having another son.”&quot;}, {&quot;n&quot;: &quot;35:18&quot;, &quot;text&quot;: &quot;As Rachel’s life slipped away, she named him Benoni. His father named him Benjamin.&quot;}, {&quot;n&quot;: &quot;35:19&quot;, &quot;text&quot;: &quot;Rachel died N was buried beside tha road 2 Ephrath—Bethlehem.&quot;}, {&quot;n&quot;: &quot;35:20&quot;, &quot;text&quot;: &quot;Jacob set a pillar over her grave. It markz Rachel’s grave 2 dis day.&quot;}, {&quot;n&quot;: &quot;35:21&quot;, &quot;text&quot;: &quot;Israel traveled on N pitched his tent beyond tha tower of Edar.&quot;}, {&quot;n&quot;: &quot;35:22&quot;, &quot;text&quot;: &quot;While he lived there, Reuben slept wit Bilhah, his father’s concubine. Israel heard. Jacob had 12 sonz:&quot;}, {&quot;n&quot;: &quot;35:23&quot;, &quot;text&quot;: &quot;Leah’s: Reuben tha firstborn, Simeon, Levi, Judah, Issachar, N Zebulun;&quot;}, {&quot;n&quot;: &quot;35:24&quot;, &quot;text&quot;: &quot;Rachel’s: Joseph N Benjamin;&quot;}, {&quot;n&quot;: &quot;35:25&quot;, &quot;text&quot;: &quot;Rachel’s servant Bilhah’s: Dan N Naphtali;&quot;}, {&quot;n&quot;: &quot;35:26&quot;, &quot;text&quot;: &quot;Leah’s servant Zilpah’s: Gad N Asher. These were Jacob’s sonz from his time in Padanaram.&quot;}, {&quot;n&quot;: &quot;35:27&quot;, &quot;text&quot;: &quot;Jacob reached Isaac in Mamre, at Kirjatharba—Hebron—where Abraham N Isaac had lived.&quot;}, {&quot;n&quot;: &quot;35:28&quot;, &quot;text&quot;: &quot;Isaac lived 180 yearz.&quot;}, {&quot;n&quot;: &quot;35:29&quot;, &quot;text&quot;: &quot;He breathed his last, old N full of dayz, N was gathered 2 his people. Esau N Jacob buried him.&quot;}], &quot;36&quot;: [{&quot;n&quot;: &quot;36:1&quot;, &quot;text&quot;: &quot;Here’s Esau’s family record. Esau is Edom.&quot;}, {&quot;n&quot;: &quot;36:2&quot;, &quot;text&quot;: &quot;His Canaanite wivez were Adah, daughter of Elon tha Hittite; Aholibamah, daughter of Anah N granddaughter of Zibeon tha Hivite;&quot;}, {&quot;n&quot;: &quot;36:3&quot;, &quot;text&quot;: &quot;N Bashemath, Ishmael’s daughter N Nebajoth’s sister.&quot;}, {&quot;n&quot;: &quot;36:4&quot;, &quot;text&quot;: &quot;Adah bore Eliphaz; Bashemath bore Reuel.&quot;}, {&quot;n&quot;: &quot;36:5&quot;, &quot;text&quot;: &quot;Aholibamah bore Jeush, Jaalam, N Korah. These sonz were born 2 Esau in Canaan.&quot;}, {&quot;n&quot;: &quot;36:6&quot;, &quot;text&quot;: &quot;Esau took his wivez, children, household, livestock, N everything acquired in Canaan N moved away from Jacob.&quot;}, {&quot;n&quot;: &quot;36:7&quot;, &quot;text&quot;: &quot;Deir wealth N livestock were too much 4 tha land 2 support ’em together.&quot;}, {&quot;n&quot;: &quot;36:8&quot;, &quot;text&quot;: &quot;Esau settled in Seir’s hill country. Esau is Edom.&quot;}, {&quot;n&quot;: &quot;36:9&quot;, &quot;text&quot;: &quot;Here’s tha line of Esau, ancestor of Seir’s Edomites.&quot;}, {&quot;n&quot;: &quot;36:10&quot;, &quot;text&quot;: &quot;His sonz included Eliphaz by Adah N Reuel by Bashemath.&quot;}, {&quot;n&quot;: &quot;36:11&quot;, &quot;text&quot;: &quot;Eliphaz’s sonz were Teman, Omar, Zepho, Gatam, N Kenaz.&quot;}, {&quot;n&quot;: &quot;36:12&quot;, &quot;text&quot;: &quot;His concubine Timna bore Amalek. These were descendantz of Esau’s wife Adah.&quot;}, {&quot;n&quot;: &quot;36:13&quot;, &quot;text&quot;: &quot;Reuel’s sonz were Nahath, Zerah, Shammah, N Mizzah—descendantz of Bashemath.&quot;}, {&quot;n&quot;: &quot;36:14&quot;, &quot;text&quot;: &quot;Aholibamah, daughter of Anah N granddaughter of Zibeon, bore Jeush, Jaalam, N Korah 2 Esau.&quot;}, {&quot;n&quot;: &quot;36:15&quot;, &quot;text&quot;: &quot;Esau’s clan chiefz through his firstborn Eliphaz: Teman, Omar, Zepho, Kenaz,&quot;}, {&quot;n&quot;: &quot;36:16&quot;, &quot;text&quot;: &quot;Korah, Gatam, N Amalek. These chiefz in Edom came from Eliphaz, through Adah.&quot;}, {&quot;n&quot;: &quot;36:17&quot;, &quot;text&quot;: &quot;Through Reuel came chiefz Nahath, Zerah, Shammah, N Mizzah—descendantz of Esau’s wife Bashemath.&quot;}, {&quot;n&quot;: &quot;36:18&quot;, &quot;text&quot;: &quot;Through Aholibamah came chiefz Jeush, Jaalam, N Korah. She was Esau’s wife, Anah’s daughter.&quot;}, {&quot;n&quot;: &quot;36:19&quot;, &quot;text&quot;: &quot;Those were Esau’s descendantz N chiefz. Esau is Edom.&quot;}, {&quot;n&quot;: &quot;36:20&quot;, &quot;text&quot;: &quot;Seir tha Horite’s sonz, native inhabitantz: Lotan, Shobal, Zibeon, Anah,&quot;}, {&quot;n&quot;: &quot;36:21&quot;, &quot;text&quot;: &quot;Dishon, Ezer, N Dishan. These were Horite chiefz, Seir’s descendantz in Edom.&quot;}, {&quot;n&quot;: &quot;36:22&quot;, &quot;text&quot;: &quot;Lotan’s children: Hori N Hemam. His sister was Timna.&quot;}, {&quot;n&quot;: &quot;36:23&quot;, &quot;text&quot;: &quot;Shobal’s children: Alvan, Manahath, Ebal, Shepho, N Onam.&quot;}, {&quot;n&quot;: &quot;36:24&quot;, &quot;text&quot;: &quot;Zibeon’s children: Ajah N Anah. Dis Anah found mulez in tha wilderness while tending his father’s donkeyz.&quot;}, {&quot;n&quot;: &quot;36:25&quot;, &quot;text&quot;: &quot;Anah’s children: Dishon N his daughter Aholibamah.&quot;}, {&quot;n&quot;: &quot;36:26&quot;, &quot;text&quot;: &quot;Dishon’s children: Hemdan, Eshban, Ithran, N Cheran.&quot;}, {&quot;n&quot;: &quot;36:27&quot;, &quot;text&quot;: &quot;Ezer’s children: Bilhan, Zaavan, N Akan.&quot;}, {&quot;n&quot;: &quot;36:28&quot;, &quot;text&quot;: &quot;Dishan’s children: Uz N Aran.&quot;}, {&quot;n&quot;: &quot;36:29&quot;, &quot;text&quot;: &quot;Tha Horite chiefz: Lotan, Shobal, Zibeon, Anah,&quot;}, {&quot;n&quot;: &quot;36:30&quot;, &quot;text&quot;: &quot;Dishon, Ezer, N Dishan. Those were deir clan chiefz in Seir.&quot;}, {&quot;n&quot;: &quot;36:31&quot;, &quot;text&quot;: &quot;These kingz ruled Edom before any king ruled tha Israelites:&quot;}, {&quot;n&quot;: &quot;36:32&quot;, &quot;text&quot;: &quot;Bela, Beor’s son, ruled from Dinhabah.&quot;}, {&quot;n&quot;: &quot;36:33&quot;, &quot;text&quot;: &quot;Bela died. Jobab, Zerah’s son from Bozrah, succeeded him.&quot;}, {&quot;n&quot;: &quot;36:34&quot;, &quot;text&quot;: &quot;Jobab died. Husham from tha Temanites’ land succeeded him.&quot;}, {&quot;n&quot;: &quot;36:35&quot;, &quot;text&quot;: &quot;Husham died. Hadad, Bedad’s son, who defeated Midian in Moab’s fieldz, succeeded him. His city was Avith.&quot;}, {&quot;n&quot;: &quot;36:36&quot;, &quot;text&quot;: &quot;Hadad died. Samlah from Masrekah succeeded him.&quot;}, {&quot;n&quot;: &quot;36:37&quot;, &quot;text&quot;: &quot;Samlah died. Saul from Rehoboth by tha river succeeded him.&quot;}, {&quot;n&quot;: &quot;36:38&quot;, &quot;text&quot;: &quot;Saul died. Baalhanan, Achbor’s son, succeeded him.&quot;}, {&quot;n&quot;: &quot;36:39&quot;, &quot;text&quot;: &quot;Baalhanan died. Hadar succeeded him from Pau. His wife was Mehetabel, daughter of Matred N granddaughter of Mezahab.&quot;}, {&quot;n&quot;: &quot;36:40&quot;, &quot;text&quot;: &quot;Esau’s chiefz, by clan N place: Timnah, Alvah, Jetheth,&quot;}, {&quot;n&quot;: &quot;36:41&quot;, &quot;text&quot;: &quot;Aholibamah, Elah, Pinon,&quot;}, {&quot;n&quot;: &quot;36:42&quot;, &quot;text&quot;: &quot;Kenaz, Teman, Mibzar,&quot;}, {&quot;n&quot;: &quot;36:43&quot;, &quot;text&quot;: &quot;Magdiel N Iram. These were Edom’s chiefz by deir settlementz in deir own land—Esau, ancestor of tha Edomites.&quot;}], &quot;37&quot;: [{&quot;n&quot;: &quot;37:1&quot;, &quot;text&quot;: &quot;Jacob lived in Canaan, tha land where his father had stayed as a stranger.&quot;}, {&quot;n&quot;: &quot;37:2&quot;, &quot;text&quot;: &quot;Here’s his family account. Joseph, 17, tended flockz wit tha sonz of Bilhah N Zilpah. He brought his father a bad report about ’em.&quot;}, {&quot;n&quot;: &quot;37:3&quot;, &quot;text&quot;: &quot;Israel loved Joseph most because he was tha son of his old age. He made him a special multicolored coat.&quot;}, {&quot;n&quot;: &quot;37:4&quot;, &quot;text&quot;: &quot;His brotherz saw tha favoritism N hated him. Dey couldn’t speak a peaceful word 2 him.&quot;}, {&quot;n&quot;: &quot;37:5&quot;, &quot;text&quot;: &quot;Joseph dreamed N told his brotherz. Dey hated him even more.&quot;}, {&quot;n&quot;: &quot;37:6&quot;, &quot;text&quot;: &quot;“Listen 2 dis dream:&quot;}, {&quot;n&quot;: &quot;37:7&quot;, &quot;text&quot;: &quot;we were tying grain bundlez. Mine rose upright; ur bundlez gathered around N bowed 2 mine.”&quot;}, {&quot;n&quot;: &quot;37:8&quot;, &quot;text&quot;: &quot;“U think u’ll reign over us?” His dreamz N wordz only deepened tha hate.&quot;}, {&quot;n&quot;: &quot;37:9&quot;, &quot;text&quot;: &quot;He dreamed again: “Tha sun, moon, N 11 starz bowed down 2 me.”&quot;}, {&quot;n&quot;: &quot;37:10&quot;, &quot;text&quot;: &quot;He told his father too. Israel rebuked him: “What’s dis dream? Ur mother, brotherz, N I bowing down before u?”&quot;}, {&quot;n&quot;: &quot;37:11&quot;, &quot;text&quot;: &quot;His brotherz envied him, but his father kept tha matter in mind.&quot;}, {&quot;n&quot;: &quot;37:12&quot;, &quot;text&quot;: &quot;His brotherz went 2 pasture deir father’s flockz near Shechem.&quot;}, {&quot;n&quot;: &quot;37:13&quot;, &quot;text&quot;: &quot;Israel told Joseph, “I’m sending u 2 ur brotherz at Shechem.” “I’m ready.”&quot;}, {&quot;n&quot;: &quot;37:14&quot;, &quot;text&quot;: &quot;“Check on ’em N tha flockz. Bring me word.” He sent Joseph from Hebron’s valley 2 Shechem.&quot;}, {&quot;n&quot;: &quot;37:15&quot;, &quot;text&quot;: &quot;A man found him wandering through tha fieldz: “What u looking 4?”&quot;}, {&quot;n&quot;: &quot;37:16&quot;, &quot;text&quot;: &quot;“My brotherz. Where are dey tending deir flockz?”&quot;}, {&quot;n&quot;: &quot;37:17&quot;, &quot;text&quot;: &quot;“Dey bounced. I heard ’em say Dothan.” Joseph followed N found ’em there.&quot;}, {&quot;n&quot;: &quot;37:18&quot;, &quot;text&quot;: &quot;Dey saw him in tha distance N plotted 2 kill him before he arrived.&quot;}, {&quot;n&quot;: &quot;37:19&quot;, &quot;text&quot;: &quot;“Here comez dat dreamer.&quot;}, {&quot;n&quot;: &quot;37:20&quot;, &quot;text&quot;: &quot;Let’s kill him, throw him in a pit, N say a wild animal ate him. Then we’ll see what becomez of his dreamz.”&quot;}, {&quot;n&quot;: &quot;37:21&quot;, &quot;text&quot;: &quot;Reuben heard N tried 2 rescue him: “Don’t kill him.”&quot;}, {&quot;n&quot;: &quot;37:22&quot;, &quot;text&quot;: &quot;“No bloodshed. Put him in dis wilderness pit, but don’t hurt him.” He planned 2 return Joseph safely 2 deir father.&quot;}, {&quot;n&quot;: &quot;37:23&quot;, &quot;text&quot;: &quot;Joseph arrived. Dey stripped off his special coat.&quot;}, {&quot;n&quot;: &quot;37:24&quot;, &quot;text&quot;: &quot;Dey threw him in2 an empty pit. There was no water.&quot;}, {&quot;n&quot;: &quot;37:25&quot;, &quot;text&quot;: &quot;Sitting down 2 eat, dey saw an Ishmaelite caravan from Gilead carrying spicez, balm, N myrrh on camelz 2 Egypt.&quot;}, {&quot;n&quot;: &quot;37:26&quot;, &quot;text&quot;: &quot;Judah said, “What do we gain by killing our brother N covering his blood?&quot;}, {&quot;n&quot;: &quot;37:27&quot;, &quot;text&quot;: &quot;Sell him 2 tha Ishmaelites. Don’t lay a hand on him—he’s our own flesh.” His brotherz agreed.&quot;}, {&quot;n&quot;: &quot;37:28&quot;, &quot;text&quot;: &quot;Midianite merchantz passed. Joseph was pulled from tha pit N sold 2 tha Ishmaelites 4 20 silver piecez. Dey took him 2 Egypt.&quot;}, {&quot;n&quot;: &quot;37:29&quot;, &quot;text&quot;: &quot;Reuben returned 2 tha pit. Joseph was gone. He tore his clothez.&quot;}, {&quot;n&quot;: &quot;37:30&quot;, &quot;text&quot;: &quot;“Tha boy’s gone!” he told his brotherz. “Where can I turn now?”&quot;}, {&quot;n&quot;: &quot;37:31&quot;, &quot;text&quot;: &quot;Dey killed a young goat N dipped Joseph’s coat in its blood.&quot;}, {&quot;n&quot;: &quot;37:32&quot;, &quot;text&quot;: &quot;Dey brought it 2 deir father: “We found dis. Is it ur son’s coat?”&quot;}, {&quot;n&quot;: &quot;37:33&quot;, &quot;text&quot;: &quot;He recognized it. “My son’s coat! A wild animal devoured him. Joseph’s been torn apart!”&quot;}, {&quot;n&quot;: &quot;37:34&quot;, &quot;text&quot;: &quot;Jacob tore his clothez, put on sackcloth, N mourned many dayz.&quot;}, {&quot;n&quot;: &quot;37:35&quot;, &quot;text&quot;: &quot;His children tried 2 comfort him. He refused: “I’ll go down 2 tha grave mourning my son.” His father kept weeping.&quot;}, {&quot;n&quot;: &quot;37:36&quot;, &quot;text&quot;: &quot;In Egypt tha Midianites sold Joseph 2 Potiphar, Pharaoh’s official N captain of tha guard.&quot;}], &quot;38&quot;: [{&quot;n&quot;: &quot;38:1&quot;, &quot;text&quot;: &quot;Around dat time Judah moved away from his brotherz N stayed wit Hirah tha Adullamite.&quot;}, {&quot;n&quot;: &quot;38:2&quot;, &quot;text&quot;: &quot;He met tha daughter of a Canaanite named Shuah, married her, N slept wit her.&quot;}, {&quot;n&quot;: &quot;38:3&quot;, &quot;text&quot;: &quot;She bore a son, named Er.&quot;}, {&quot;n&quot;: &quot;38:4&quot;, &quot;text&quot;: &quot;She bore another N named him Onan.&quot;}, {&quot;n&quot;: &quot;38:5&quot;, &quot;text&quot;: &quot;She bore Shelah while Judah was in Chezib.&quot;}, {&quot;n&quot;: &quot;38:6&quot;, &quot;text&quot;: &quot;Judah found his firstborn Er a wife named Tamar.&quot;}, {&quot;n&quot;: &quot;38:7&quot;, &quot;text&quot;: &quot;Er was wicked before tha LORD. Tha LORD put him 2 death.&quot;}, {&quot;n&quot;: &quot;38:8&quot;, &quot;text&quot;: &quot;Judah told Onan, “Marry ur brother’s widow N fulfill ur duty, raising offspring 4 him.”&quot;}, {&quot;n&quot;: &quot;38:9&quot;, &quot;text&quot;: &quot;Onan knew tha offspring wouldn’t count as his. When sleeping wit her, he spilled his semen on tha ground 2 avoid giving his brother offspring.&quot;}, {&quot;n&quot;: &quot;38:10&quot;, &quot;text&quot;: &quot;Tha LORD judged dis wicked N put Onan 2 death too.&quot;}, {&quot;n&quot;: &quot;38:11&quot;, &quot;text&quot;: &quot;Judah told Tamar, “Stay a widow at ur father’s house till Shelah growz.” He was shook about losing Shelah too. Tamar went home.&quot;}, {&quot;n&quot;: &quot;38:12&quot;, &quot;text&quot;: &quot;Time passed. Judah’s wife died. After mourning, he went 2 Timnath’s sheep-shearerz wit Hirah.&quot;}, {&quot;n&quot;: &quot;38:13&quot;, &quot;text&quot;: &quot;Tamar heard her father-in-law was heading 2 Timnath 4 shearing.&quot;}, {&quot;n&quot;: &quot;38:14&quot;, &quot;text&quot;: &quot;Seeing Shelah grown but still not given 2 her, she removed her widow’s clothez, veiled herself, N sat by tha road.&quot;}, {&quot;n&quot;: &quot;38:15&quot;, &quot;text&quot;: &quot;Judah saw her covered face N thought she was a prostitute.&quot;}, {&quot;n&quot;: &quot;38:16&quot;, &quot;text&quot;: &quot;Not knowing she was Tamar, he approached 4 sex. She asked, “What will u pay?”&quot;}, {&quot;n&quot;: &quot;38:17&quot;, &quot;text&quot;: &quot;“A young goat from my flock.” “Give me a pledge till u send it.”&quot;}, {&quot;n&quot;: &quot;38:18&quot;, &quot;text&quot;: &quot;“What pledge?” “Ur seal, its cord, N ur staff.” He gave ’em, slept wit her, N she conceived.&quot;}, {&quot;n&quot;: &quot;38:19&quot;, &quot;text&quot;: &quot;She bounced, removed tha veil, N put her widow’s clothez back on.&quot;}, {&quot;n&quot;: &quot;38:20&quot;, &quot;text&quot;: &quot;Judah sent tha goat wit Hirah 2 recover his pledge. Hirah couldn’t find her.&quot;}, {&quot;n&quot;: &quot;38:21&quot;, &quot;text&quot;: &quot;He asked tha local men where tha roadside prostitute was. “There’s been no prostitute here.”&quot;}, {&quot;n&quot;: &quot;38:22&quot;, &quot;text&quot;: &quot;He reported back: “Couldn’t find her. Tha local men say there wasn’t 1.”&quot;}, {&quot;n&quot;: &quot;38:23&quot;, &quot;text&quot;: &quot;Judah said, “Let her keep tha pledge, or we’ll become a joke. I sent tha goat; u couldn’t find her.”&quot;}, {&quot;n&quot;: &quot;38:24&quot;, &quot;text&quot;: &quot;About 3 monthz later, Judah heard Tamar was pregnant through prostitution. “Bring her out N burn her!” he ordered.&quot;}, {&quot;n&quot;: &quot;38:25&quot;, &quot;text&quot;: &quot;Being brought out, she sent tha pledge: “I’m pregnant by tha owner of these. Recognize tha seal, cord, N staff?”&quot;}, {&quot;n&quot;: &quot;38:26&quot;, &quot;text&quot;: &quot;Judah recognized ’em: “She’s more righteous than me. I didn’t give her Shelah.” He never slept wit her again.&quot;}, {&quot;n&quot;: &quot;38:27&quot;, &quot;text&quot;: &quot;When she gave birth, she had twinz.&quot;}, {&quot;n&quot;: &quot;38:28&quot;, &quot;text&quot;: &quot;1 put out a hand. Tha midwife tied scarlet thread around it: “Dis 1 came 1st.”&quot;}, {&quot;n&quot;: &quot;38:29&quot;, &quot;text&quot;: &quot;He drew back, N his brother came out. “What a breakthrough u made!” she said. He was named Pharez.&quot;}, {&quot;n&quot;: &quot;38:30&quot;, &quot;text&quot;: &quot;Then came his brother wit tha scarlet thread. He was named Zarah.&quot;}], &quot;39&quot;: [{&quot;n&quot;: &quot;39:1&quot;, &quot;text&quot;: &quot;Joseph reached Egypt. Potiphar, Pharaoh’s Egyptian official N guard captain, bought him from tha Ishmaelites.&quot;}, {&quot;n&quot;: &quot;39:2&quot;, &quot;text&quot;: &quot;Tha LORD stayed wit Joseph, giving him success in his Egyptian master’s house.&quot;}, {&quot;n&quot;: &quot;39:3&quot;, &quot;text&quot;: &quot;Potiphar saw tha LORD wit him N everything he handled prospering.&quot;}, {&quot;n&quot;: &quot;39:4&quot;, &quot;text&quot;: &quot;Joseph won his favor. Potiphar put him over tha household N entrusted everything 2 him.&quot;}, {&quot;n&quot;: &quot;39:5&quot;, &quot;text&quot;: &quot;From then on, tha LORD blessed Potiphar’s house N fieldz because of Joseph.&quot;}, {&quot;n&quot;: &quot;39:6&quot;, &quot;text&quot;: &quot;He left everything 2 Joseph, worrying only about his food. Joseph was well-built N handsome.&quot;}, {&quot;n&quot;: &quot;39:7&quot;, &quot;text&quot;: &quot;His master’s wife noticed him. “Sleep wit me.”&quot;}, {&quot;n&quot;: &quot;39:8&quot;, &quot;text&quot;: &quot;He refused: “My master doesn’t worry about anything here. He trusted me wit everything.&quot;}, {&quot;n&quot;: &quot;39:9&quot;, &quot;text&quot;: &quot;Nobody in dis house rankz above me. He withheld only u, his wife. How could I do dis gr8 evil N sin against God?”&quot;}, {&quot;n&quot;: &quot;39:10&quot;, &quot;text&quot;: &quot;Day after day she pressured him. He refused 2 sleep wit her or even stay beside her.&quot;}, {&quot;n&quot;: &quot;39:11&quot;, &quot;text&quot;: &quot;1 day Joseph went inside 2 work. No other household men were there.&quot;}, {&quot;n&quot;: &quot;39:12&quot;, &quot;text&quot;: &quot;She grabbed his garment: “Sleep wit me!” He left it in her hand N bounced outside.&quot;}, {&quot;n&quot;: &quot;39:13&quot;, &quot;text&quot;: &quot;Seeing he’d fled N left tha garment,&quot;}, {&quot;n&quot;: &quot;39:14&quot;, &quot;text&quot;: &quot;she called tha household men: “Look! He brought dis Hebrew here 2 insult us. He tried 2 sleep wit me; I screamed!&quot;}, {&quot;n&quot;: &quot;39:15&quot;, &quot;text&quot;: &quot;When he heard me scream, he left his garment N ran outside.”&quot;}, {&quot;n&quot;: &quot;39:16&quot;, &quot;text&quot;: &quot;She kept tha garment till his master returned.&quot;}, {&quot;n&quot;: &quot;39:17&quot;, &quot;text&quot;: &quot;She told him, “Dat Hebrew servant u brought tried 2 make a mockery of me.&quot;}, {&quot;n&quot;: &quot;39:18&quot;, &quot;text&quot;: &quot;When I screamed, he left his garment N fled.”&quot;}, {&quot;n&quot;: &quot;39:19&quot;, &quot;text&quot;: &quot;Hearing his wife’s accusation, Joseph’s master became furious.&quot;}, {&quot;n&quot;: &quot;39:20&quot;, &quot;text&quot;: &quot;He put Joseph in tha prison holding tha king’s prisonerz. Joseph remained there.&quot;}, {&quot;n&quot;: &quot;39:21&quot;, &quot;text&quot;: &quot;But tha LORD stayed wit Joseph, showing kindness N giving him tha prison keeper’s favor.&quot;}, {&quot;n&quot;: &quot;39:22&quot;, &quot;text&quot;: &quot;Tha keeper entrusted Joseph wit all tha prisonerz N everything done there.&quot;}, {&quot;n&quot;: &quot;39:23&quot;, &quot;text&quot;: &quot;He didn’t need 2 inspect Joseph’s work. Tha LORD was wit Joseph N made his work prosper.&quot;}], &quot;40&quot;: [{&quot;n&quot;: &quot;40:1&quot;, &quot;text&quot;: &quot;Later Egypt’s royal cupbearer N baker offended deir king.&quot;}, {&quot;n&quot;: &quot;40:2&quot;, &quot;text&quot;: &quot;Pharaoh became angry wit both chief officialz.&quot;}, {&quot;n&quot;: &quot;40:3&quot;, &quot;text&quot;: &quot;He confined ’em in tha guard captain’s house, tha prison holding Joseph.&quot;}, {&quot;n&quot;: &quot;40:4&quot;, &quot;text&quot;: &quot;Tha captain assigned Joseph 2 attend ’em. Dey stayed in custody awhile.&quot;}, {&quot;n&quot;: &quot;40:5&quot;, &quot;text&quot;: &quot;1 night both men dreamed, each dream carrying its own meaning.&quot;}, {&quot;n&quot;: &quot;40:6&quot;, &quot;text&quot;: &quot;Joseph saw ’em next morning looking troubled.&quot;}, {&quot;n&quot;: &quot;40:7&quot;, &quot;text&quot;: &quot;“Why tha long facez today?” he asked.&quot;}, {&quot;n&quot;: &quot;40:8&quot;, &quot;text&quot;: &quot;“We dreamed, but nobody can interpret.” Joseph said, “Interpretationz belong 2 God. Tell me.”&quot;}, {&quot;n&quot;: &quot;40:9&quot;, &quot;text&quot;: &quot;Tha chief cupbearer said, “I saw a vine.&quot;}, {&quot;n&quot;: &quot;40:10&quot;, &quot;text&quot;: &quot;It had 3 branchez. It budded, blossomed, N produced ripe grapez.&quot;}, {&quot;n&quot;: &quot;40:11&quot;, &quot;text&quot;: &quot;I held Pharaoh’s cup, squeezed tha grapez in2 it, N placed it in his hand.”&quot;}, {&quot;n&quot;: &quot;40:12&quot;, &quot;text&quot;: &quot;Joseph said, “Tha 3 branchez mean 3 dayz.&quot;}, {&quot;n&quot;: &quot;40:13&quot;, &quot;text&quot;: &quot;Within 3 dayz Pharaoh will lift ur head N restore ur position. U’ll serve his cup again.&quot;}, {&quot;n&quot;: &quot;40:14&quot;, &quot;text&quot;: &quot;When things go well, remember me. Show kindness, mention me 2 Pharaoh, N get me out.&quot;}, {&quot;n&quot;: &quot;40:15&quot;, &quot;text&quot;: &quot;I was kidnapped from Hebrew territory. Here too, I did nothing deserving dis dungeon.”&quot;}, {&quot;n&quot;: &quot;40:16&quot;, &quot;text&quot;: &quot;Hearing tha favorable meaning, tha chief baker said, “I dreamed of 3 white basketz on my head.&quot;}, {&quot;n&quot;: &quot;40:17&quot;, &quot;text&quot;: &quot;Tha top 1 held Pharaoh’s baked foodz. Birdz ate from it.”&quot;}, {&quot;n&quot;: &quot;40:18&quot;, &quot;text&quot;: &quot;Joseph answered, “Tha 3 basketz mean 3 dayz.&quot;}, {&quot;n&quot;: &quot;40:19&quot;, &quot;text&quot;: &quot;Within 3 dayz Pharaoh will lift ur head off u N hang u on a tree. Birdz will eat ur flesh.”&quot;}, {&quot;n&quot;: &quot;40:20&quot;, &quot;text&quot;: &quot;Tha 3rd day was Pharaoh’s birthday. At his feast, he brought tha 2 chiefz before his servantz.&quot;}, {&quot;n&quot;: &quot;40:21&quot;, &quot;text&quot;: &quot;He restored tha cupbearer, who again placed tha cup in his hand.&quot;}, {&quot;n&quot;: &quot;40:22&quot;, &quot;text&quot;: &quot;He hanged tha baker, exactly as Joseph interpreted.&quot;}, {&quot;n&quot;: &quot;40:23&quot;, &quot;text&quot;: &quot;But tha cupbearer didn’t remember Joseph. He forgot him.&quot;}], &quot;41&quot;: [{&quot;n&quot;: &quot;41:1&quot;, &quot;text&quot;: &quot;2 full yearz later, Pharaoh dreamed he stood beside tha river.&quot;}, {&quot;n&quot;: &quot;41:2&quot;, &quot;text&quot;: &quot;7 healthy, fat cowz came up N grazed among tha reedz.&quot;}, {&quot;n&quot;: &quot;41:3&quot;, &quot;text&quot;: &quot;7 ugly, thin cowz followed N stood beside ’em.&quot;}, {&quot;n&quot;: &quot;41:4&quot;, &quot;text&quot;: &quot;Tha thin cowz ate tha 7 healthy cowz. Pharaoh woke.&quot;}, {&quot;n&quot;: &quot;41:5&quot;, &quot;text&quot;: &quot;He slept N dreamed again: 7 full, healthy grain headz grew on 1 stalk.&quot;}, {&quot;n&quot;: &quot;41:6&quot;, &quot;text&quot;: &quot;7 thin headz, scorched by tha east wind, sprouted afterward.&quot;}, {&quot;n&quot;: &quot;41:7&quot;, &quot;text&quot;: &quot;Tha thin headz swallowed tha full headz. Pharaoh woke N realized it was a dream.&quot;}, {&quot;n&quot;: &quot;41:8&quot;, &quot;text&quot;: &quot;Troubled next morning, he summoned Egypt’s magicianz N wise men. Nobody could explain tha dreamz.&quot;}, {&quot;n&quot;: &quot;41:9&quot;, &quot;text&quot;: &quot;Tha cupbearer said, “Today I remember my failure.&quot;}, {&quot;n&quot;: &quot;41:10&quot;, &quot;text&quot;: &quot;Pharaoh once confined me N tha chief baker in tha guard captain’s house.&quot;}, {&quot;n&quot;: &quot;41:11&quot;, &quot;text&quot;: &quot;We both dreamed tha same night, each dream wit its own meaning.&quot;}, {&quot;n&quot;: &quot;41:12&quot;, &quot;text&quot;: &quot;A young Hebrew, tha captain’s servant, interpreted each dream 4 us.&quot;}, {&quot;n&quot;: &quot;41:13&quot;, &quot;text&quot;: &quot;It happened exactly as he said: I was restored; tha baker was hanged.”&quot;}, {&quot;n&quot;: &quot;41:14&quot;, &quot;text&quot;: &quot;Pharaoh summoned Joseph. Dey rushed him from tha dungeon. He shaved, changed clothez, N came before Pharaoh.&quot;}, {&quot;n&quot;: &quot;41:15&quot;, &quot;text&quot;: &quot;“Nobody can explain my dream. I hear u can understand N interpret dreamz.”&quot;}, {&quot;n&quot;: &quot;41:16&quot;, &quot;text&quot;: &quot;Joseph answered, “Dat ability isn’t mine. God will give Pharaoh tha answer he needz.”&quot;}, {&quot;n&quot;: &quot;41:17&quot;, &quot;text&quot;: &quot;Pharaoh said, “I stood on tha riverbank.&quot;}, {&quot;n&quot;: &quot;41:18&quot;, &quot;text&quot;: &quot;7 healthy, fat cowz came out N grazed.&quot;}, {&quot;n&quot;: &quot;41:19&quot;, &quot;text&quot;: &quot;7 terribly ugly, thin cowz followed—worse than any I’ve seen in Egypt.&quot;}, {&quot;n&quot;: &quot;41:20&quot;, &quot;text&quot;: &quot;Dey ate tha 7 fat cowz.&quot;}, {&quot;n&quot;: &quot;41:21&quot;, &quot;text&quot;: &quot;After eating, dey looked just as thin. U couldn’t tell dey’d eaten. Then I woke.&quot;}, {&quot;n&quot;: &quot;41:22&quot;, &quot;text&quot;: &quot;In another dream, 7 full, healthy grain headz grew on 1 stalk.&quot;}, {&quot;n&quot;: &quot;41:23&quot;, &quot;text&quot;: &quot;Then 7 withered, thin headz scorched by tha east wind sprouted.&quot;}, {&quot;n&quot;: &quot;41:24&quot;, &quot;text&quot;: &quot;Tha thin headz swallowed tha 7 good headz. No magician could explain it.”&quot;}, {&quot;n&quot;: &quot;41:25&quot;, &quot;text&quot;: &quot;Joseph said, “Both dreamz carry 1 message. God showed Pharaoh what he’s about 2 do.&quot;}, {&quot;n&quot;: &quot;41:26&quot;, &quot;text&quot;: &quot;Tha 7 good cowz N 7 good grain headz mean 7 yearz. Same dream.&quot;}, {&quot;n&quot;: &quot;41:27&quot;, &quot;text&quot;: &quot;Tha 7 thin cowz N empty, wind-scorched headz mean 7 yearz of famine.&quot;}, {&quot;n&quot;: &quot;41:28&quot;, &quot;text&quot;: &quot;Like I said, God revealed his coming action 2 Pharaoh.&quot;}, {&quot;n&quot;: &quot;41:29&quot;, &quot;text&quot;: &quot;7 yearz of gr8 abundance are coming throughout Egypt.&quot;}, {&quot;n&quot;: &quot;41:30&quot;, &quot;text&quot;: &quot;Then 7 famine yearz will swallow all memory of abundance N devastate tha land.&quot;}, {&quot;n&quot;: &quot;41:31&quot;, &quot;text&quot;: &quot;Tha famine will b so severe dat tha earlier abundance won’t b remembered.&quot;}, {&quot;n&quot;: &quot;41:32&quot;, &quot;text&quot;: &quot;Tha repeated dream meanz God has fixed dis N will bring it soon.&quot;}, {&quot;n&quot;: &quot;41:33&quot;, &quot;text&quot;: &quot;Choose a discerning, wise man 2 oversee Egypt.&quot;}, {&quot;n&quot;: &quot;41:34&quot;, &quot;text&quot;: &quot;Appoint officialz 2 collect 1/5 of tha harvest during tha 7 abundant yearz.&quot;}, {&quot;n&quot;: &quot;41:35&quot;, &quot;text&quot;: &quot;Gather tha coming food surplus N store grain in tha citiez under Pharaoh’s authority.&quot;}, {&quot;n&quot;: &quot;41:36&quot;, &quot;text&quot;: &quot;Keep it 4 tha 7 famine yearz, so Egypt doesn’t perish.”&quot;}, {&quot;n&quot;: &quot;41:37&quot;, &quot;text&quot;: &quot;Pharaoh N his officialz approved tha plan.&quot;}, {&quot;n&quot;: &quot;41:38&quot;, &quot;text&quot;: &quot;Pharaoh asked, “Can we find another man like dis, carrying God’s Spirit?”&quot;}, {&quot;n&quot;: &quot;41:39&quot;, &quot;text&quot;: &quot;He told Joseph, “God showed u all dis. Nobody’s as discerning N wise.&quot;}, {&quot;n&quot;: &quot;41:40&quot;, &quot;text&quot;: &quot;U’ll oversee my household. My people will obey ur orderz. Only tha throne will place me above u.”&quot;}, {&quot;n&quot;: &quot;41:41&quot;, &quot;text&quot;: &quot;“I put u over all Egypt.”&quot;}, {&quot;n&quot;: &quot;41:42&quot;, &quot;text&quot;: &quot;Pharaoh gave Joseph his signet ring N royal swag: fine linen N a gold chain around his neck.&quot;}, {&quot;n&quot;: &quot;41:43&quot;, &quot;text&quot;: &quot;He rode in Pharaoh’s 2nd chariot. People called, “Bow tha knee!” Joseph was appointed over Egypt.&quot;}, {&quot;n&quot;: &quot;41:44&quot;, &quot;text&quot;: &quot;Pharaoh said, “I’m Pharaoh, but nobody in Egypt will lift a hand or foot without ur authorization.”&quot;}, {&quot;n&quot;: &quot;41:45&quot;, &quot;text&quot;: &quot;He named Joseph Zaphnathpaaneah N gave him Asenath, daughter of Potipherah, priest of On, as a wife. Joseph toured Egypt.&quot;}, {&quot;n&quot;: &quot;41:46&quot;, &quot;text&quot;: &quot;Joseph was 30 when he entered Pharaoh’s service. He bounced from Pharaoh’s presence N traveled throughout Egypt.&quot;}, {&quot;n&quot;: &quot;41:47&quot;, &quot;text&quot;: &quot;During tha 7 abundant yearz, tha land produced huge harvestz.&quot;}, {&quot;n&quot;: &quot;41:48&quot;, &quot;text&quot;: &quot;He gathered tha surplus N stored each region’s food in its nearby city.&quot;}, {&quot;n&quot;: &quot;41:49&quot;, &quot;text&quot;: &quot;Grain piled up like seashore sand. He stopped counting; there was too much 2 measure.&quot;}, {&quot;n&quot;: &quot;41:50&quot;, &quot;text&quot;: &quot;Before tha famine, Asenath bore Joseph 2 sonz.&quot;}, {&quot;n&quot;: &quot;41:51&quot;, &quot;text&quot;: &quot;He named tha firstborn Manasseh: “God made me forget my hardship N my father’s household.”&quot;}, {&quot;n&quot;: &quot;41:52&quot;, &quot;text&quot;: &quot;He named tha 2nd Ephraim: “God made me fruitful in tha land of my suffering.”&quot;}, {&quot;n&quot;: &quot;41:53&quot;, &quot;text&quot;: &quot;Egypt’s 7 abundant yearz ended.&quot;}, {&quot;n&quot;: &quot;41:54&quot;, &quot;text&quot;: &quot;Tha 7 famine yearz began, as Joseph predicted. Other landz hungered, but Egypt had bread.&quot;}, {&quot;n&quot;: &quot;41:55&quot;, &quot;text&quot;: &quot;When Egypt grew hungry, people cried 2 Pharaoh. “Go 2 Joseph. Do what he tellz u.”&quot;}, {&quot;n&quot;: &quot;41:56&quot;, &quot;text&quot;: &quot;Famine covered tha earth. Joseph opened tha storehousez N sold grain 2 tha Egyptians as hunger worsened.&quot;}, {&quot;n&quot;: &quot;41:57&quot;, &quot;text&quot;: &quot;People from every country came 2 Joseph 4 grain because famine gripped every land.&quot;}], &quot;42&quot;: [{&quot;n&quot;: &quot;42:1&quot;, &quot;text&quot;: &quot;Jacob heard Egypt had grain. “Why are u just looking at each other?” he asked his sonz.&quot;}, {&quot;n&quot;: &quot;42:2&quot;, &quot;text&quot;: &quot;“Go buy food there so we live instead of dying.”&quot;}, {&quot;n&quot;: &quot;42:3&quot;, &quot;text&quot;: &quot;Joseph’s 10 brotherz went down 2 Egypt 4 grain.&quot;}, {&quot;n&quot;: &quot;42:4&quot;, &quot;text&quot;: &quot;Jacob kept Benjamin home, worrying harm might reach him.&quot;}, {&quot;n&quot;: &quot;42:5&quot;, &quot;text&quot;: &quot;Israel’s sonz joined tha buyerz because Canaan was starving too.&quot;}, {&quot;n&quot;: &quot;42:6&quot;, &quot;text&quot;: &quot;Joseph governed Egypt N handled grain salez. His brotherz came N bowed facedown before him.&quot;}, {&quot;n&quot;: &quot;42:7&quot;, &quot;text&quot;: &quot;He recognized ’em but acted like a stranger, speaking harshly. “Where u from?” “Canaan. We came 4 food.”&quot;}, {&quot;n&quot;: &quot;42:8&quot;, &quot;text&quot;: &quot;Joseph knew ’em. Dey didn’t know him.&quot;}, {&quot;n&quot;: &quot;42:9&quot;, &quot;text&quot;: &quot;Remembering his dreamz, he said, “U’re spiez, here 2 inspect our weakness.”&quot;}, {&quot;n&quot;: &quot;42:10&quot;, &quot;text&quot;: &quot;“No, my lord! Ur servantz came 2 buy food.&quot;}, {&quot;n&quot;: &quot;42:11&quot;, &quot;text&quot;: &quot;We’re all 1 man’s sonz. Honest men, no spiez.”&quot;}, {&quot;n&quot;: &quot;42:12&quot;, &quot;text&quot;: &quot;“No. U came 2 see where tha land’s unprotected.”&quot;}, {&quot;n&quot;: &quot;42:13&quot;, &quot;text&quot;: &quot;“We’re 12 brotherz from Canaan. Tha youngest is wit our father; 1 is gone.”&quot;}, {&quot;n&quot;: &quot;42:14&quot;, &quot;text&quot;: &quot;Joseph said, “Exactly what I said—spiez!&quot;}, {&quot;n&quot;: &quot;42:15&quot;, &quot;text&quot;: &quot;Here’s ur test. By Pharaoh’s life, u won’t bounce unless ur youngest brother comez.&quot;}, {&quot;n&quot;: &quot;42:16&quot;, &quot;text&quot;: &quot;Send 1 2 fetch him. Tha rest stay imprisoned till ur story’s checked. Otherwise, by Pharaoh’s life, u’re spiez.”&quot;}, {&quot;n&quot;: &quot;42:17&quot;, &quot;text&quot;: &quot;He jailed ’em together 4 3 dayz.&quot;}, {&quot;n&quot;: &quot;42:18&quot;, &quot;text&quot;: &quot;On tha 3rd day Joseph said, “Do dis N live. I revere God.&quot;}, {&quot;n&quot;: &quot;42:19&quot;, &quot;text&quot;: &quot;If u’re honest, leave 1 brother in custody. Tha rest can take grain 2 ur starving householdz.&quot;}, {&quot;n&quot;: &quot;42:20&quot;, &quot;text&quot;: &quot;Bring tha youngest back. Dat’ll prove ur story N spare ur livez.” Dey agreed.&quot;}, {&quot;n&quot;: &quot;42:21&quot;, &quot;text&quot;: &quot;Dey told each other, “We’re guilty over our brother. We saw his anguish N ignored his pleading. Dat’s why dis trouble hit us.”&quot;}, {&quot;n&quot;: &quot;42:22&quot;, &quot;text&quot;: &quot;Reuben said, “Didn’t I warn u not 2 sin against tha boy? U wouldn’t listen. Now his blood demandz an account.”&quot;}, {&quot;n&quot;: &quot;42:23&quot;, &quot;text&quot;: &quot;Dey didn’t know Joseph understood; he’d been using an interpreter.&quot;}, {&quot;n&quot;: &quot;42:24&quot;, &quot;text&quot;: &quot;He turned away N wept, then returned. He took Simeon N bound him before deir eyez.&quot;}, {&quot;n&quot;: &quot;42:25&quot;, &quot;text&quot;: &quot;Joseph ordered grain 4 deir sackz, each man’s money returned secretly, N provisionz 4 tha road. It was done.&quot;}, {&quot;n&quot;: &quot;42:26&quot;, &quot;text&quot;: &quot;Dey loaded deir donkeyz N bounced.&quot;}, {&quot;n&quot;: &quot;42:27&quot;, &quot;text&quot;: &quot;At a lodging place, 1 opened his sack 2 feed his donkey N found his money at tha top.&quot;}, {&quot;n&quot;: &quot;42:28&quot;, &quot;text&quot;: &quot;“My money’s back!” Deir heartz sank. Shook, dey asked, “What has God done 2 us?”&quot;}, {&quot;n&quot;: &quot;42:29&quot;, &quot;text&quot;: &quot;In Canaan, dey told Jacob everything:&quot;}, {&quot;n&quot;: &quot;42:30&quot;, &quot;text&quot;: &quot;“Tha land’s ruler spoke harshly N called us spiez.&quot;}, {&quot;n&quot;: &quot;42:31&quot;, &quot;text&quot;: &quot;We told him, ‘We’re honest, no spiez.&quot;}, {&quot;n&quot;: &quot;42:32&quot;, &quot;text&quot;: &quot;We’re 12 brotherz. 1 is gone; tha youngest is wit our father in Canaan.’&quot;}, {&quot;n&quot;: &quot;42:33&quot;, &quot;text&quot;: &quot;He said, ‘Leave 1 brother. Take food 4 ur starving householdz N bounce.&quot;}, {&quot;n&quot;: &quot;42:34&quot;, &quot;text&quot;: &quot;Bring ur youngest. Then I’ll know u’re honest, release ur brother, N let u trade here.’”&quot;}, {&quot;n&quot;: &quot;42:35&quot;, &quot;text&quot;: &quot;Emptying deir sackz, every man found his money bundle. Dey N deir father were shook.&quot;}, {&quot;n&quot;: &quot;42:36&quot;, &quot;text&quot;: &quot;Jacob said, “U’ve robbed me of my children! Joseph’s gone, Simeon’s gone, N now Benjamin? Everything’s against me!”&quot;}, {&quot;n&quot;: &quot;42:37&quot;, &quot;text&quot;: &quot;Reuben said, “Kill my 2 sonz if I don’t bring him back. Entrust him 2 me; I’ll return him.”&quot;}, {&quot;n&quot;: &quot;42:38&quot;, &quot;text&quot;: &quot;“My son won’t go. His brother’s dead; he alone remainz. If harm reachz him, u’ll send my gray head grieving 2 tha grave.”&quot;}], &quot;43&quot;: [{&quot;n&quot;: &quot;43:1&quot;, &quot;text&quot;: &quot;Tha famine kept hitting hard.&quot;}, {&quot;n&quot;: &quot;43:2&quot;, &quot;text&quot;: &quot;When Egypt’s grain ran out, Jacob said, “Go back N buy some food.”&quot;}, {&quot;n&quot;: &quot;43:3&quot;, &quot;text&quot;: &quot;Judah answered, “Tha man warned us: ‘U won’t see me unless ur brother’s wit u.’&quot;}, {&quot;n&quot;: &quot;43:4&quot;, &quot;text&quot;: &quot;Send our brother N we’ll buy ur food.&quot;}, {&quot;n&quot;: &quot;43:5&quot;, &quot;text&quot;: &quot;Otherwise we’re not going. He said we can’t face him without Benjamin.”&quot;}, {&quot;n&quot;: &quot;43:6&quot;, &quot;text&quot;: &quot;Israel asked, “Why do me like dis? Why tell him u had another brother?”&quot;}, {&quot;n&quot;: &quot;43:7&quot;, &quot;text&quot;: &quot;“He questioned us closely about our family: ‘Is ur father alive? Another brother?’ We answered. How could we know he’d demand him?”&quot;}, {&quot;n&quot;: &quot;43:8&quot;, &quot;text&quot;: &quot;Judah said, “Send tha boy wit me. Let’s move so we, u, N our children can live.&quot;}, {&quot;n&quot;: &quot;43:9&quot;, &quot;text&quot;: &quot;I’ll personally guarantee him. Hold me responsible. If I don’t return him, I’ll bear tha blame forever.&quot;}, {&quot;n&quot;: &quot;43:10&quot;, &quot;text&quot;: &quot;Without all dis delay, we could’ve gone N returned twice.”&quot;}, {&quot;n&quot;: &quot;43:11&quot;, &quot;text&quot;: &quot;Israel answered, “If it must happen, take a gift of our land’s best: balm, honey, spicez, myrrh, nutz, N almondz.&quot;}, {&quot;n&quot;: &quot;43:12&quot;, &quot;text&quot;: &quot;Take double tha money N return what was in ur sackz. Maybe it was a mistake.&quot;}, {&quot;n&quot;: &quot;43:13&quot;, &quot;text&quot;: &quot;Take ur brother. Go back 2 tha man.&quot;}, {&quot;n&quot;: &quot;43:14&quot;, &quot;text&quot;: &quot;May God Almighty give u mercy so he releasez Simeon N Benjamin. If I lose my children, I lose ’em.”&quot;}, {&quot;n&quot;: &quot;43:15&quot;, &quot;text&quot;: &quot;Dey took tha gift, double money, N Benjamin, N went 2 stand before Joseph in Egypt.&quot;}, {&quot;n&quot;: &quot;43:16&quot;, &quot;text&quot;: &quot;Seeing Benjamin, Joseph told his steward, “Bring these men home. Prepare an animal; dey’ll eat wit me at noon.”&quot;}, {&quot;n&quot;: &quot;43:17&quot;, &quot;text&quot;: &quot;Tha steward obeyed N brought ’em in2 Joseph’s house.&quot;}, {&quot;n&quot;: &quot;43:18&quot;, &quot;text&quot;: &quot;Dey were shook: “It’s tha returned money. He’ll accuse us, attack us, N seize us as slavez, along wit our donkeyz.”&quot;}, {&quot;n&quot;: &quot;43:19&quot;, &quot;text&quot;: &quot;At tha entrance, dey approached tha steward.&quot;}, {&quot;n&quot;: &quot;43:20&quot;, &quot;text&quot;: &quot;“Sir, our 1st trip was 2 buy food.&quot;}, {&quot;n&quot;: &quot;43:21&quot;, &quot;text&quot;: &quot;At tha lodging place, each of us found all his money in his sack. We brought it back.&quot;}, {&quot;n&quot;: &quot;43:22&quot;, &quot;text&quot;: &quot;We brought more 4 food. We don’t know who put tha money there.”&quot;}, {&quot;n&quot;: &quot;43:23&quot;, &quot;text&quot;: &quot;He answered, “Peace. Don’t b shook. Ur God N ur father’s God gave u treasure. I received ur payment.” He brought Simeon out.&quot;}, {&quot;n&quot;: &quot;43:24&quot;, &quot;text&quot;: &quot;He led ’em inside, gave water 4 deir feet, N fed deir donkeyz.&quot;}, {&quot;n&quot;: &quot;43:25&quot;, &quot;text&quot;: &quot;Dey readied tha gift 4 Joseph’s noon arrival, knowing dey’d eat there.&quot;}, {&quot;n&quot;: &quot;43:26&quot;, &quot;text&quot;: &quot;When he came home, dey presented tha gift N bowed 2 tha ground.&quot;}, {&quot;n&quot;: &quot;43:27&quot;, &quot;text&quot;: &quot;He asked how dey were: “Ur elderly father—is he well? Still alive?”&quot;}, {&quot;n&quot;: &quot;43:28&quot;, &quot;text&quot;: &quot;“Ur servant our father is alive N well.” Dey bowed again.&quot;}, {&quot;n&quot;: &quot;43:29&quot;, &quot;text&quot;: &quot;Joseph saw Benjamin, his own mother’s son. “Dis ur youngest brother? God b gracious 2 u, my son.”&quot;}, {&quot;n&quot;: &quot;43:30&quot;, &quot;text&quot;: &quot;Overcome wit love 4 his brother, Joseph hurried in2 a private room N wept.&quot;}, {&quot;n&quot;: &quot;43:31&quot;, &quot;text&quot;: &quot;He washed his face, regained control, N returned: “Serve tha food.”&quot;}, {&quot;n&quot;: &quot;43:32&quot;, &quot;text&quot;: &quot;Joseph ate separately, his brotherz separately, N tha Egyptians separately, because Egyptians considered eating wit Hebrews unacceptable.&quot;}, {&quot;n&quot;: &quot;43:33&quot;, &quot;text&quot;: &quot;Tha brotherz were seated by age, oldest 2 youngest. Dey looked at each other amazed.&quot;}, {&quot;n&quot;: &quot;43:34&quot;, &quot;text&quot;: &quot;Joseph sent portionz from his table. Benjamin received 5 timez as much. Dey drank N celebrated wit him.&quot;}], &quot;44&quot;: [{&quot;n&quot;: &quot;44:1&quot;, &quot;text&quot;: &quot;Joseph told his steward, “Fill deir sackz wit all tha food dey can carry. Return each man’s money 2 his sack.&quot;}, {&quot;n&quot;: &quot;44:2&quot;, &quot;text&quot;: &quot;Put my silver cup in tha youngest’s sack beside his grain money.” Tha steward obeyed.&quot;}, {&quot;n&quot;: &quot;44:3&quot;, &quot;text&quot;: &quot;At dawn, tha men N deir donkeyz were sent off.&quot;}, {&quot;n&quot;: &quot;44:4&quot;, &quot;text&quot;: &quot;Before dey got far, Joseph ordered, “Catch ’em. Ask, ‘Why repay kindness wit evil?&quot;}, {&quot;n&quot;: &quot;44:5&quot;, &quot;text&quot;: &quot;Dat’s my master’s drinking cup, used 4 divination. U’ve done wickedly.’”&quot;}, {&quot;n&quot;: &quot;44:6&quot;, &quot;text&quot;: &quot;Tha steward caught ’em N repeated tha charge.&quot;}, {&quot;n&quot;: &quot;44:7&quot;, &quot;text&quot;: &quot;Dey answered, “Why accuse ur servantz? We’d never do dat!&quot;}, {&quot;n&quot;: &quot;44:8&quot;, &quot;text&quot;: &quot;We returned tha money from Canaan. Why would we steal silver or gold from ur master?&quot;}, {&quot;n&quot;: &quot;44:9&quot;, &quot;text&quot;: &quot;Whoever has tha cup can die. Tha rest of us will become ur master’s slavez.”&quot;}, {&quot;n&quot;: &quot;44:10&quot;, &quot;text&quot;: &quot;He said, “Whoever has it will become my slave. Tha rest will b innocent.”&quot;}, {&quot;n&quot;: &quot;44:11&quot;, &quot;text&quot;: &quot;Dey quickly lowered N opened deir sackz.&quot;}, {&quot;n&quot;: &quot;44:12&quot;, &quot;text&quot;: &quot;He searched oldest 2 youngest. Tha cup was in Benjamin’s sack.&quot;}, {&quot;n&quot;: &quot;44:13&quot;, &quot;text&quot;: &quot;Dey tore deir clothez, reloaded deir donkeyz, N returned 2 tha city.&quot;}, {&quot;n&quot;: &quot;44:14&quot;, &quot;text&quot;: &quot;Joseph was still home. Judah N his brotherz fell before him.&quot;}, {&quot;n&quot;: &quot;44:15&quot;, &quot;text&quot;: &quot;“What have u done? Don’t u know a man like me can uncover thingz through divination?”&quot;}, {&quot;n&quot;: &quot;44:16&quot;, &quot;text&quot;: &quot;Judah answered, “What can we say? How can we clear ourselves? God exposed our guilt. We’re all ur slavez, including tha man wit tha cup.”&quot;}, {&quot;n&quot;: &quot;44:17&quot;, &quot;text&quot;: &quot;“I won’t do dat. Only tha man wit tha cup stayz as my slave. Tha rest can bounce home in peace.”&quot;}, {&quot;n&quot;: &quot;44:18&quot;, &quot;text&quot;: &quot;Judah stepped closer: “Please, my lord, hear ur servant. Don’t get angry. U’re like Pharaoh himself.&quot;}, {&quot;n&quot;: &quot;44:19&quot;, &quot;text&quot;: &quot;U asked whether we had a father or brother.&quot;}, {&quot;n&quot;: &quot;44:20&quot;, &quot;text&quot;: &quot;We told u: an old father N a young son born in his old age. His brother’s dead; he alone remainz from his mother. Father lovez him.&quot;}, {&quot;n&quot;: &quot;44:21&quot;, &quot;text&quot;: &quot;U told us 2 bring him so u could see him.&quot;}, {&quot;n&quot;: &quot;44:22&quot;, &quot;text&quot;: &quot;We said tha boy couldn’t leave his father. If he did, his father would die.&quot;}, {&quot;n&quot;: &quot;44:23&quot;, &quot;text&quot;: &quot;U said we couldn’t see u without our youngest brother.&quot;}, {&quot;n&quot;: &quot;44:24&quot;, &quot;text&quot;: &quot;We returned N told our father ur wordz.&quot;}, {&quot;n&quot;: &quot;44:25&quot;, &quot;text&quot;: &quot;Later he said, ‘Go buy some food.’&quot;}, {&quot;n&quot;: &quot;44:26&quot;, &quot;text&quot;: &quot;We answered, ‘We can’t go unless Benjamin comez. We won’t b admitted without him.’&quot;}, {&quot;n&quot;: &quot;44:27&quot;, &quot;text&quot;: &quot;Father said, ‘U know my wife bore me 2 sonz.&quot;}, {&quot;n&quot;: &quot;44:28&quot;, &quot;text&quot;: &quot;1 bounced N never returned. I said he must’ve been torn apart.&quot;}, {&quot;n&quot;: &quot;44:29&quot;, &quot;text&quot;: &quot;Take dis 1 too, N if harm comez, u’ll send my gray head grieving 2 tha grave.’&quot;}, {&quot;n&quot;: &quot;44:30&quot;, &quot;text&quot;: &quot;His life is tied 2 tha boy’s life. If we return without him,&quot;}, {&quot;n&quot;: &quot;44:31&quot;, &quot;text&quot;: &quot;he’ll see tha boy’s gone N die. We’ll send our elderly father grieving 2 tha grave.&quot;}, {&quot;n&quot;: &quot;44:32&quot;, &quot;text&quot;: &quot;I guaranteed tha boy’s safety: ‘If I don’t bring him back, I’ll bear tha blame forever.’&quot;}, {&quot;n&quot;: &quot;44:33&quot;, &quot;text&quot;: &quot;Please let me remain as ur slave instead. Let tha boy return wit his brotherz.&quot;}, {&quot;n&quot;: &quot;44:34&quot;, &quot;text&quot;: &quot;How can I face my father without him? I couldn’t bear seeing tha disaster dat would hit him.”&quot;}], &quot;45&quot;: [{&quot;n&quot;: &quot;45:1&quot;, &quot;text&quot;: &quot;Joseph couldn’t hold back before his attendantz. “Everyone out!” Alone wit his brotherz, he revealed himself.&quot;}, {&quot;n&quot;: &quot;45:2&quot;, &quot;text&quot;: &quot;He wept so loudly tha Egyptians N Pharaoh’s household heard.&quot;}, {&quot;n&quot;: &quot;45:3&quot;, &quot;text&quot;: &quot;“I’m Joseph. Is my father still alive?” His brotherz were too stunned 2 answer.&quot;}, {&quot;n&quot;: &quot;45:4&quot;, &quot;text&quot;: &quot;“Come closer.” Dey approached. “I’m ur brother Joseph, whom u sold in2 Egypt.&quot;}, {&quot;n&quot;: &quot;45:5&quot;, &quot;text&quot;: &quot;Don’t tear yourselves apart over selling me. God sent me ahead 2 preserve life.&quot;}, {&quot;n&quot;: &quot;45:6&quot;, &quot;text&quot;: &quot;Tha famine’s lasted 2 yearz. 5 remain, wit no plowing or harvest.&quot;}, {&quot;n&quot;: &quot;45:7&quot;, &quot;text&quot;: &quot;God sent me ahead 2 preserve ur family line N save ur livez through a gr8 deliverance.&quot;}, {&quot;n&quot;: &quot;45:8&quot;, &quot;text&quot;: &quot;Ultimately God sent me here. He made me a father 2 Pharaoh, lord of his household, N ruler over Egypt.&quot;}, {&quot;n&quot;: &quot;45:9&quot;, &quot;text&quot;: &quot;Hurry 2 Father: ‘Joseph says God made him lord of Egypt. Come down immediately.&quot;}, {&quot;n&quot;: &quot;45:10&quot;, &quot;text&quot;: &quot;Live near me in Goshen—u, ur children N grandchildren, flockz, herdz, N everything u own.&quot;}, {&quot;n&quot;: &quot;45:11&quot;, &quot;text&quot;: &quot;I’ll provide 4 u through tha remaining 5 famine yearz, so ur household N possessionz don’t fall in2 poverty.’&quot;}, {&quot;n&quot;: &quot;45:12&quot;, &quot;text&quot;: &quot;U N Benjamin can see: I’m really tha 1 speaking 2 u.&quot;}, {&quot;n&quot;: &quot;45:13&quot;, &quot;text&quot;: &quot;Tell Father about my standing here N everything u saw. Hurry N bring him.”&quot;}, {&quot;n&quot;: &quot;45:14&quot;, &quot;text&quot;: &quot;He hugged Benjamin N wept. Benjamin wept on his neck too.&quot;}, {&quot;n&quot;: &quot;45:15&quot;, &quot;text&quot;: &quot;He kissed N wept over all his brotherz. Then dey spoke wit him.&quot;}, {&quot;n&quot;: &quot;45:16&quot;, &quot;text&quot;: &quot;Pharaoh N his officialz were pleased 2 hear Joseph’s brotherz had come.&quot;}, {&quot;n&quot;: &quot;45:17&quot;, &quot;text&quot;: &quot;Pharaoh told Joseph, “Tell ’em 2 load deir animalz N return 2 Canaan.&quot;}, {&quot;n&quot;: &quot;45:18&quot;, &quot;text&quot;: &quot;Bring ur father N householdz. I’ll give u Egypt’s best, N u’ll enjoy tha land’s abundance.&quot;}, {&quot;n&quot;: &quot;45:19&quot;, &quot;text&quot;: &quot;Take Egyptian wagonz 4 ur children N wivez. Bring ur father here.&quot;}, {&quot;n&quot;: &quot;45:20&quot;, &quot;text&quot;: &quot;Don’t worry about ur belongingz. Egypt’s best is urs.”&quot;}, {&quot;n&quot;: &quot;45:21&quot;, &quot;text&quot;: &quot;Israel’s sonz obeyed. Joseph gave ’em wagonz as Pharaoh ordered N travel provisionz.&quot;}, {&quot;n&quot;: &quot;45:22&quot;, &quot;text&quot;: &quot;Each received fresh clothez. Benjamin received 300 silver piecez N 5 outfitz.&quot;}, {&quot;n&quot;: &quot;45:23&quot;, &quot;text&quot;: &quot;Joseph sent Father 10 male donkeyz loaded wit Egypt’s finest N 10 female donkeyz carrying grain, bread, N travel food.&quot;}, {&quot;n&quot;: &quot;45:24&quot;, &quot;text&quot;: &quot;He sent his brotherz off: “Don’t start beef on tha road.” Dey bounced.&quot;}, {&quot;n&quot;: &quot;45:25&quot;, &quot;text&quot;: &quot;Dey traveled from Egypt 2 Jacob in Canaan.&quot;}, {&quot;n&quot;: &quot;45:26&quot;, &quot;text&quot;: &quot;“Joseph’s alive! He rulez all Egypt!” Jacob went numb; he didn’t believe ’em.&quot;}, {&quot;n&quot;: &quot;45:27&quot;, &quot;text&quot;: &quot;Dey repeated Joseph’s wordz. Seeing tha wagonz, Jacob’s spirit revived.&quot;}, {&quot;n&quot;: &quot;45:28&quot;, &quot;text&quot;: &quot;Israel said, “Dat’s enough. My son Joseph’s alive. I’ll see him before I die.”&quot;}], &quot;46&quot;: [{&quot;n&quot;: &quot;46:1&quot;, &quot;text&quot;: &quot;Israel set out wit everything he owned. At Beersheba he sacrificed 2 his father Isaac’s God.&quot;}, {&quot;n&quot;: &quot;46:2&quot;, &quot;text&quot;: &quot;In a nighttime vision God called, “Jacob! Jacob!” “Here I am.”&quot;}, {&quot;n&quot;: &quot;46:3&quot;, &quot;text&quot;: &quot;“I’m God, ur father’s God. Don’t b shook about going in2 Egypt. I’ll make u a gr8 nation there.&quot;}, {&quot;n&quot;: &quot;46:4&quot;, &quot;text&quot;: &quot;I’ll go wit u N surely bring u up again. Joseph’s hand will close ur eyez.”&quot;}, {&quot;n&quot;: &quot;46:5&quot;, &quot;text&quot;: &quot;Jacob’s sonz carried him, deir children, N deir wivez from Beersheba in Pharaoh’s wagonz.&quot;}, {&quot;n&quot;: &quot;46:6&quot;, &quot;text&quot;: &quot;Dey took deir livestock N Canaan-acquired belongingz. Jacob N all his offspring entered Egypt.&quot;}, {&quot;n&quot;: &quot;46:7&quot;, &quot;text&quot;: &quot;Sonz, grandsonz, daughterz, granddaughterz—he brought his whole family.&quot;}, {&quot;n&quot;: &quot;46:8&quot;, &quot;text&quot;: &quot;Here are Israel’s family namez: Jacob N his sonz. Reuben was tha firstborn.&quot;}, {&quot;n&quot;: &quot;46:9&quot;, &quot;text&quot;: &quot;Reuben’s sonz: Hanoch, Phallu, Hezron, N Carmi.&quot;}, {&quot;n&quot;: &quot;46:10&quot;, &quot;text&quot;: &quot;Simeon’s: Jemuel, Jamin, Ohad, Jachin, Zohar, N Shaul, whose mother was Canaanite.&quot;}, {&quot;n&quot;: &quot;46:11&quot;, &quot;text&quot;: &quot;Levi’s: Gershon, Kohath, N Merari.&quot;}, {&quot;n&quot;: &quot;46:12&quot;, &quot;text&quot;: &quot;Judah’s: Er, Onan, Shelah, Pharez, N Zarah. Er N Onan died in Canaan. Pharez’s sonz: Hezron N Hamul.&quot;}, {&quot;n&quot;: &quot;46:13&quot;, &quot;text&quot;: &quot;Issachar’s: Tola, Phuvah, Job, N Shimron.&quot;}, {&quot;n&quot;: &quot;46:14&quot;, &quot;text&quot;: &quot;Zebulun’s: Sered, Elon, N Jahleel.&quot;}, {&quot;n&quot;: &quot;46:15&quot;, &quot;text&quot;: &quot;These came through Leah in Padanaram, wit Dinah included. Dat family line numbered 33.&quot;}, {&quot;n&quot;: &quot;46:16&quot;, &quot;text&quot;: &quot;Gad’s sonz: Ziphion, Haggi, Shuni, Ezbon, Eri, Arodi, N Areli.&quot;}, {&quot;n&quot;: &quot;46:17&quot;, &quot;text&quot;: &quot;Asher’s: Jimnah, Ishuah, Isui, Beriah, N deir sister Serah. Beriah’s sonz: Heber N Malchiel.&quot;}, {&quot;n&quot;: &quot;46:18&quot;, &quot;text&quot;: &quot;These 16 came through Zilpah, tha servant Laban gave Leah.&quot;}, {&quot;n&quot;: &quot;46:19&quot;, &quot;text&quot;: &quot;Rachel’s sonz: Joseph N Benjamin.&quot;}, {&quot;n&quot;: &quot;46:20&quot;, &quot;text&quot;: &quot;In Egypt, Asenath, daughter of Potipherah, priest of On, bore Joseph Manasseh N Ephraim.&quot;}, {&quot;n&quot;: &quot;46:21&quot;, &quot;text&quot;: &quot;Benjamin’s sonz: Belah, Becher, Ashbel, Gera, Naaman, Ehi, Rosh, Muppim, Huppim, N Ard.&quot;}, {&quot;n&quot;: &quot;46:22&quot;, &quot;text&quot;: &quot;Rachel’s family line numbered 14.&quot;}, {&quot;n&quot;: &quot;46:23&quot;, &quot;text&quot;: &quot;Dan’s son: Hushim.&quot;}, {&quot;n&quot;: &quot;46:24&quot;, &quot;text&quot;: &quot;Naphtali’s: Jahzeel, Guni, Jezer, N Shillem.&quot;}, {&quot;n&quot;: &quot;46:25&quot;, &quot;text&quot;: &quot;These 7 came through Bilhah, tha servant Laban gave Rachel.&quot;}, {&quot;n&quot;: &quot;46:26&quot;, &quot;text&quot;: &quot;Jacob’s direct descendantz entering Egypt wit him totaled 66, excluding his sonz’ wivez.&quot;}, {&quot;n&quot;: &quot;46:27&quot;, &quot;text&quot;: &quot;Joseph had 2 sonz born in Egypt. Jacob’s whole household connected wit tha move totaled 70.&quot;}, {&quot;n&quot;: &quot;46:28&quot;, &quot;text&quot;: &quot;Jacob sent Judah ahead 2 Joseph 4 directionz 2 Goshen. Dey arrived there.&quot;}, {&quot;n&quot;: &quot;46:29&quot;, &quot;text&quot;: &quot;Joseph readied his chariot N met his father in Goshen. He hugged his neck N wept a long time.&quot;}, {&quot;n&quot;: &quot;46:30&quot;, &quot;text&quot;: &quot;Israel said, “Now I can die. I’ve seen ur face N know u’re alive.”&quot;}, {&quot;n&quot;: &quot;46:31&quot;, &quot;text&quot;: &quot;Joseph told his brotherz N household, “I’ll tell Pharaoh ur family from Canaan has arrived.&quot;}, {&quot;n&quot;: &quot;46:32&quot;, &quot;text&quot;: &quot;U’re shepherdz N livestock keeperz; u brought ur flockz, herdz, N everything.&quot;}, {&quot;n&quot;: &quot;46:33&quot;, &quot;text&quot;: &quot;When Pharaoh asks ur occupation,&quot;}, {&quot;n&quot;: &quot;46:34&quot;, &quot;text&quot;: &quot;say, ‘We N our ancestorz have tended livestock since youth.’ Then u can settle in Goshen, because Egyptians look down on shepherdz.”&quot;}], &quot;47&quot;: [{&quot;n&quot;: &quot;47:1&quot;, &quot;text&quot;: &quot;Joseph told Pharaoh, “My father N brotherz arrived from Canaan wit deir flockz, herdz, N everything. Dey’re in Goshen.”&quot;}, {&quot;n&quot;: &quot;47:2&quot;, &quot;text&quot;: &quot;He presented 5 of his brotherz 2 Pharaoh.&quot;}, {&quot;n&quot;: &quot;47:3&quot;, &quot;text&quot;: &quot;“What’s ur occupation?” “We’re shepherdz, like our ancestorz.”&quot;}, {&quot;n&quot;: &quot;47:4&quot;, &quot;text&quot;: &quot;“We came 2 stay awhile. Canaan’s famine left our flockz no pasture. Please let us settle in Goshen.”&quot;}, {&quot;n&quot;: &quot;47:5&quot;, &quot;text&quot;: &quot;Pharaoh told Joseph, “Ur father N brotherz have come 2 u.&quot;}, {&quot;n&quot;: &quot;47:6&quot;, &quot;text&quot;: &quot;Egypt’s open. Settle ’em in tha best land, in Goshen. If any are capable, put ’em over my livestock.”&quot;}, {&quot;n&quot;: &quot;47:7&quot;, &quot;text&quot;: &quot;Joseph brought Jacob before Pharaoh. Jacob blessed Pharaoh.&quot;}, {&quot;n&quot;: &quot;47:8&quot;, &quot;text&quot;: &quot;Pharaoh asked, “How old are u?”&quot;}, {&quot;n&quot;: &quot;47:9&quot;, &quot;text&quot;: &quot;“My wandering life has lasted 130 yearz. Few N difficult yearz, shorter than my ancestorz’ journeyz.”&quot;}, {&quot;n&quot;: &quot;47:10&quot;, &quot;text&quot;: &quot;Jacob blessed Pharaoh N bounced from his presence.&quot;}, {&quot;n&quot;: &quot;47:11&quot;, &quot;text&quot;: &quot;As Pharaoh ordered, Joseph gave his family property in Egypt’s finest region, tha land of Rameses.&quot;}, {&quot;n&quot;: &quot;47:12&quot;, &quot;text&quot;: &quot;He supplied his father, brotherz, N whole household wit food according 2 each family’s needz.&quot;}, {&quot;n&quot;: &quot;47:13&quot;, &quot;text&quot;: &quot;Elsewhere food was gone. Egypt N Canaan were wasting away under severe famine.&quot;}, {&quot;n&quot;: &quot;47:14&quot;, &quot;text&quot;: &quot;Joseph collected Egypt N Canaan’s money through grain salez N brought it in2 Pharaoh’s treasury.&quot;}, {&quot;n&quot;: &quot;47:15&quot;, &quot;text&quot;: &quot;When money ran out, tha Egyptians pleaded, “Give us bread. Why should we die before u? Our money’s gone.”&quot;}, {&quot;n&quot;: &quot;47:16&quot;, &quot;text&quot;: &quot;Joseph said, “Bring livestock. I’ll exchange food 4 ’em if ur money’s gone.”&quot;}, {&quot;n&quot;: &quot;47:17&quot;, &quot;text&quot;: &quot;Dey brought horsez, sheep, goatz, cattle, N donkeyz. He fed ’em dat year in exchange 4 deir livestock.&quot;}, {&quot;n&quot;: &quot;47:18&quot;, &quot;text&quot;: &quot;Next year dey said, “We won’t hide it: our money N livestock are urs. All we have left is our bodies N land.&quot;}, {&quot;n&quot;: &quot;47:19&quot;, &quot;text&quot;: &quot;Why let us N our land perish? Buy us N our fieldz 4 food. We’ll serve Pharaoh. Give us seed so we live N tha land isn’t deserted.”&quot;}, {&quot;n&quot;: &quot;47:20&quot;, &quot;text&quot;: &quot;Joseph bought Egypt’s fieldz 4 Pharaoh. Famine forced everyone 2 sell, N tha land became Pharaoh’s.&quot;}, {&quot;n&quot;: &quot;47:21&quot;, &quot;text&quot;: &quot;Throughout Egypt, Joseph moved tha people in2 citiez.&quot;}, {&quot;n&quot;: &quot;47:22&quot;, &quot;text&quot;: &quot;He didn’t buy tha priestz’ land. Pharaoh supported ’em wit an allowance, so dey didn’t sell.&quot;}, {&quot;n&quot;: &quot;47:23&quot;, &quot;text&quot;: &quot;Joseph told tha people, “Today I bought u N ur land 4 Pharaoh. Here’s seed. Plant tha fieldz.&quot;}, {&quot;n&quot;: &quot;47:24&quot;, &quot;text&quot;: &quot;Give Pharaoh 1/5 of tha harvest. Keep 4/5 4 seed N food 4 yourselves, ur householdz, N ur children.”&quot;}, {&quot;n&quot;: &quot;47:25&quot;, &quot;text&quot;: &quot;“U saved our livez,” dey answered. “Show us favor; we’ll serve Pharaoh.”&quot;}, {&quot;n&quot;: &quot;47:26&quot;, &quot;text&quot;: &quot;Joseph established tha law still in place: 1/5 belongz 2 Pharaoh. Only tha priestz’ land remained exempt.&quot;}, {&quot;n&quot;: &quot;47:27&quot;, &quot;text&quot;: &quot;Israel settled in Goshen, gained property, N multiplied greatly.&quot;}, {&quot;n&quot;: &quot;47:28&quot;, &quot;text&quot;: &quot;Jacob lived 17 yearz in Egypt, reaching 147 yearz altogether.&quot;}, {&quot;n&quot;: &quot;47:29&quot;, &quot;text&quot;: &quot;Near death, he called Joseph: “Please place ur hand under my thigh. Promise kindness N faithfulness. Don’t bury me in Egypt.&quot;}, {&quot;n&quot;: &quot;47:30&quot;, &quot;text&quot;: &quot;When I rest wit my ancestorz, carry me out N bury me in deir burial place.” “I’ll do it,” Joseph answered.&quot;}, {&quot;n&quot;: &quot;47:31&quot;, &quot;text&quot;: &quot;“Swear.” Joseph swore, N Israel bowed at tha head of his bed.&quot;}], &quot;48&quot;: [{&quot;n&quot;: &quot;48:1&quot;, &quot;text&quot;: &quot;Joseph heard his father was sick N brought Manasseh N Ephraim.&quot;}, {&quot;n&quot;: &quot;48:2&quot;, &quot;text&quot;: &quot;Told Joseph was coming, Israel gathered his strength N sat up in bed.&quot;}, {&quot;n&quot;: &quot;48:3&quot;, &quot;text&quot;: &quot;He told Joseph, “God Almighty appeared at Luz in Canaan N blessed me.&quot;}, {&quot;n&quot;: &quot;48:4&quot;, &quot;text&quot;: &quot;He promised fruitfulness, many descendantz, a community of peoplez, N dis land as deir everlasting possession.&quot;}, {&quot;n&quot;: &quot;48:5&quot;, &quot;text&quot;: &quot;Now Ephraim N Manasseh, born before I came 2 Egypt, are mine. Dey’ll stand as my sonz like Reuben N Simeon.&quot;}, {&quot;n&quot;: &quot;48:6&quot;, &quot;text&quot;: &quot;Any children u have afterward are urs. Deir inheritance will b counted under deir brotherz’ namez.&quot;}, {&quot;n&quot;: &quot;48:7&quot;, &quot;text&quot;: &quot;Returning from Padan, I lost Rachel in Canaan before reaching Ephrath. I buried her beside tha road 2 Ephrath—Bethlehem.”&quot;}, {&quot;n&quot;: &quot;48:8&quot;, &quot;text&quot;: &quot;Israel noticed Joseph’s sonz: “Who are these?”&quot;}, {&quot;n&quot;: &quot;48:9&quot;, &quot;text&quot;: &quot;“Tha sonz God gave me here.” “Bring ’em close. I’ll bless ’em.”&quot;}, {&quot;n&quot;: &quot;48:10&quot;, &quot;text&quot;: &quot;Age had dimmed Israel’s sight. Joseph brought ’em close; Jacob kissed N embraced ’em.&quot;}, {&quot;n&quot;: &quot;48:11&quot;, &quot;text&quot;: &quot;“I never expected 2 see ur face again,” Israel told Joseph, “N God let me see ur children too.”&quot;}, {&quot;n&quot;: &quot;48:12&quot;, &quot;text&quot;: &quot;Joseph moved ’em from Jacob’s kneez N bowed facedown.&quot;}, {&quot;n&quot;: &quot;48:13&quot;, &quot;text&quot;: &quot;He positioned Ephraim at Israel’s left N Manasseh at his right.&quot;}, {&quot;n&quot;: &quot;48:14&quot;, &quot;text&quot;: &quot;Israel deliberately crossed his handz: right on younger Ephraim, left on firstborn Manasseh.&quot;}, {&quot;n&quot;: &quot;48:15&quot;, &quot;text&quot;: &quot;He blessed Joseph: “Tha God Abraham N Isaac walked before, tha God who shepherded me all my life,&quot;}, {&quot;n&quot;: &quot;48:16&quot;, &quot;text&quot;: &quot;tha Angel who redeemed me from evil—bless these boyz. Let ’em carry my name N Abraham N Isaac’s namez, multiplying greatly on earth.”&quot;}, {&quot;n&quot;: &quot;48:17&quot;, &quot;text&quot;: &quot;Joseph disliked seeing tha right hand on Ephraim. He lifted it 2 move it 2 Manasseh.&quot;}, {&quot;n&quot;: &quot;48:18&quot;, &quot;text&quot;: &quot;“Not like dat, Father. Dis is tha firstborn. Put ur right hand here.”&quot;}, {&quot;n&quot;: &quot;48:19&quot;, &quot;text&quot;: &quot;Jacob refused: “I know, son. He’ll become a gr8 people too. But his younger brother will b greater; his offspring will become many nationz.”&quot;}, {&quot;n&quot;: &quot;48:20&quot;, &quot;text&quot;: &quot;He blessed ’em: “Israel will use ur namez in blessing: ‘May God make u like Ephraim N Manasseh.’” He placed Ephraim 1st.&quot;}, {&quot;n&quot;: &quot;48:21&quot;, &quot;text&quot;: &quot;Israel told Joseph, “I’m dying, but God will stay wit u N bring u back 2 ur ancestorz’ land.&quot;}, {&quot;n&quot;: &quot;48:22&quot;, &quot;text&quot;: &quot;I give u 1 portion more than ur brotherz, tha land I took from tha Amorites wit sword N bow.”&quot;}], &quot;49&quot;: [{&quot;n&quot;: &quot;49:1&quot;, &quot;text&quot;: &quot;Jacob called his sonz: “Gather around. I’ll tell u what will happen in tha dayz ahead.&quot;}, {&quot;n&quot;: &quot;49:2&quot;, &quot;text&quot;: &quot;Come together N listen, sonz of Jacob. Hear ur father Israel.&quot;}, {&quot;n&quot;: &quot;49:3&quot;, &quot;text&quot;: &quot;Reuben, my firstborn, my might N 1st strength—foremost in dignity N power.&quot;}, {&quot;n&quot;: &quot;49:4&quot;, &quot;text&quot;: &quot;Unsteady as water, u w <script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });

  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {

  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);

      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;

 there arose up a new king over Egypt, which knew not Joseph."},{"n":"1:9","text":"N he said 2 his people, Look, tha people of tha children of Israel r more N mightier than we:"},{"n":"1:10","text":"Come on, let us deal wisely wit ’em; lest they multiply, N it come 2 pass, dat, when there falleth out any war, they join also 2 our enemiez, N fight against us, N so get ’em up out of tha land."},{"n":"1:11","text":"Therefore dey set opps over ’em 2 afflict ’em wit heavy burdens. N they built 4 Pharaoh treasure citiez, Pithom N Raamses."},{"n":"1:12","text":"But tha more they afflicted ’em, tha more they multiplied N grew. N they were grieved because of tha children of Israel."},{"n":"1:13","text":"N tha Egyptianz made tha children of Israel 2 serve wit rigour:"},{"n":"1:14","text":"N they made their livez bitter wit hard bondage, in morter, N in brick, N in all manner of service in tha field: all their service, wherein they made ’em serve, was wit rigour."},{"n":"1:15","text":"N tha king of Egypt spoke 2 tha Hebrew midwives, of which tha name of tha one was Shiphrah, N tha name of tha other Puah:"},{"n":"1:16","text":"N he said, When y’all do tha office of a midwife 2 tha Hebrew women, N see ’em on tha stools; if it be a son, then y’all will kill him: but if it be a daughter, then she will live."},{"n":"1:17","text":"But tha midwives feared God, N did not as tha king of Egypt commanded ’em, but saved tha men children alive."},{"n":"1:18","text":"N tha king of Egypt called 4 tha midwives, N said 2 ’em, Why have y’all done dis thing, N have saved tha men children alive?"},{"n":"1:19","text":"N tha midwives said 2 Pharaoh, Because tha Hebrew women r not as tha Egyptian women; 4 they r lively, N dey give birth before tha midwivez arrive."},{"n":"1:20","text":"Therefore God dealt well wit tha midwives: N tha people multiplied, N waxed very mighty."},{"n":"1:21","text":"N it happened, because tha midwives feared God, dat he made ’em housez."},{"n":"1:22","text":"N Pharaoh charged all his people, saying, Every son dat is born y’all will cast in2 tha river, N every daughter y’all will save alive."}],"2":[{"n":"2:1","text":"N there went a man of tha house of Levi, N took 2 wife a daughter of Levi."},{"n":"2:2","text":"N tha woman conceived, N bare a son: N when she saw him dat he was a goodly child, she hid him three months."},{"n":"2:3","text":"N when she could not longer hide him, she took 4 him an ark of bulrushes, N daubed it wit slime N wit pitch, N put tha child therein; N she laid it in tha flags by tha river’s brink."},{"n":"2:4","text":"N his sister stood afar off, 2 wit what would be done 2 him."},{"n":"2:5","text":"N tha daughter of Pharaoh came down 2 wash herself at tha river; N her maidens walked along by tha river’s side; N when she saw tha ark among tha flags, she sent her maid 2 fetch it."},{"n":"2:6","text":"N when she had opened it, she saw tha child: N, look, tha babe wept. N she had compassion on him, N said, Dis is one of tha Hebrews’ children."},{"n":"2:7","text":"Then said his sister 2 Pharaoh’s daughter, Will I go N call 2 u a nurse of tha Hebrew women, dat she may nurse tha child 4 u?"},{"n":"2:8","text":"N Pharaoh’s daughter said 2 her, Go. N tha maid went N called tha child’s mother."},{"n":"2:9","text":"N Pharaoh’s daughter said 2 her, Take dis child away, N nurse it 4 me, N I will give u ur wages. N tha woman took tha child, N nursed it."},{"n":"2:10","text":"N tha child grew, N she brought him 2 Pharaoh’s daughter, N he became her son. N she called his name Moses: N she said, Because I drew him out of tha water."},{"n":"2:11","text":"N it happened in dose dayz, when Moses was grown, dat he went out 2 his brethren, N looked on their burdens: N he spied an Egyptian smiting an Hebrew, one of his brethren."},{"n":"2:12","text":"N he looked dis way N dat way, N when he saw dat there was no man, he slew tha Egyptian, N hid him in tha sand."},{"n":"2:13","text":"N when he went out tha second day, look, two men of tha Hebrews strove together: N he said 2 him dat did tha wrong, Wherefore smitest u ur fellow?"},{"n":"2:14","text":"N he said, Who made u a prince N a judge over us? intendest u 2 kill me, as u killedst tha Egyptian? N Moses feared, N said, Surely dis thing is known."},{"n":"2:15","text":"Now when Pharaoh heard dis thing, he sought 2 slay Moses. But Moses fled from tha face of Pharaoh, N dwelt in tha land of Midian: N he sat down by a well."},{"n":"2:16","text":"Now tha priest of Midian had seven daughterz: N they came N drew water, N filled tha troughs 2 water their father’s flock."},{"n":"2:17","text":"N tha shepherds came N drove ’em away: but Moses stood up N helped ’em, N watered their flock."},{"n":"2:18","text":"N when they came 2 Reuel their father, he said, How is it dat y’all r come so soon 2 day?"},{"n":"2:19","text":"N they said, An Egyptian delivered us out of tha hand of tha shepherds, N also drew water enough 4 us, N watered tha flock."},{"n":"2:20","text":"N he said 2 his daughterz, N where is he? why is it dat y’all have left tha man? call him, dat he may eat bread."},{"n":"2:21","text":"N Moses was content 2 dwell wit tha man: N he gave Moses Zipporah his daughter."},{"n":"2:22","text":"N she bare him a son, N he called his name Gershom: 4 he said, I have been a stranger in a strange land."},{"n":"2:23","text":"N it happened in process of time, dat tha king of Egypt died: N tha children of Israel sighed by reason of tha bondage, N they cried, N their cry came up 2 God by reason of tha bondage."},{"n":"2:24","text":"N God heard their groaning, N God remembered his covenant wit Abraham, wit Isaac, N wit Jacob."},{"n":"2:25","text":"N God looked on tha children of Israel, N God had respect 2 ’em."}],"3":[{"n":"3:1","text":"Now Moses kept tha flock of Jethro his father in law, tha priest of Midian: N he led tha flock 2 tha backside of tha desert, N came 2 tha mountain of God, even 2 Horeb."},{"n":"3:2","text":"N tha angel of tha LORD appeared 2 him in a flame of fire out of tha midst of a bush: N he looked, N, look, tha bush burned wit fire, N tha bush was not consumed."},{"n":"3:3","text":"N Moses said, I will now turn aside, N see dis great sight, why tha bush is not burnt."},{"n":"3:4","text":"N when tha LORD saw dat he turned aside 2 see, God called 2 him out of tha midst of tha bush, N said, Moses, Moses. N he said, Here am I."},{"n":"3:5","text":"N he said, Draw not nigh hither: put off ur shoes from off ur feet, 4 tha place whereon u standest is holy ground."},{"n":"3:6","text":"Moreover he said, I am tha God of ur father, tha God of Abraham, tha God of Isaac, N tha God of Jacob. N Moses hid his face; 4 he was afraid 2 look on God."},{"n":"3:7","text":"N tha LORD said, I have surely seen tha affliction of my people which r in Egypt, N have heard their cry by reason of their taskmasters; 4 I know their sorrows;"},{"n":"3:8","text":"N I am come down 2 deliver ’em out of tha hand of tha Egyptianz, N 2 bring ’em up out of dat land 2 a good land N a large, 2 a land flowing wit milk N honey; 2 tha place of tha Canaanites, N tha Hittites, N tha Amorites, N tha Perizzites, N tha Hivites, N tha Jebusites."},{"n":"3:9","text":"Now therefore, look, tha cry of tha children of Israel is come 2 me: N I have also seen tha oppression wherewith tha Egyptianz oppress ’em."},{"n":"3:10","text":"Come now therefore, N I will send u 2 Pharaoh, dat u mayest bring forth my people tha children of Israel out of Egypt."},{"n":"3:11","text":"N Moses said 2 God, Who am I, dat I should go 2 Pharaoh, N dat I should bring forth tha children of Israel out of Egypt?"},{"n":"3:12","text":"N he said, Certainly I will be wit u; N dis will be a token 2 u, dat I have sent u: When u have brought forth tha people out of Egypt, y’all will serve God on dis mountain."},{"n":"3:13","text":"N Moses said 2 God, Look, when I come 2 tha children of Israel, N will say 2 ’em, Tha God of ur fatherz has sent me 2 u; N they will say 2 me, What is his name? what will I say 2 ’em?"},{"n":"3:14","text":"N God said 2 Moses, I AM THAT I AM: N he said, Thus will u say 2 tha children of Israel, I AM has sent me 2 u."},{"n":"3:15","text":"N God said moreover 2 Moses, Thus will u say 2 tha children of Israel, Tha LORD God of ur fatherz, tha God of Abraham, tha God of Isaac, N tha God of Jacob, has sent me 2 u: dis is my name 4 ever, N dis is my memorial 2 all generations."},{"n":"3:16","text":"Go, N gather tha elders of Israel together, N say 2 ’em, Tha LORD God of ur fatherz, tha God of Abraham, of Isaac, N of Jacob, appeared 2 me, saying, I have surely visited u, N seen dat which is done 2 u in Egypt:"},{"n":"3:17","text":"N I have said, I will bring u up out of tha affliction of Egypt 2 tha land of tha Canaanites, N tha Hittites, N tha Amorites, N tha Perizzites, N tha Hivites, N tha Jebusites, 2 a land flowing wit milk N honey."},{"n":"3:18","text":"N they will hearken 2 ur voice: N u will come, u N tha elders of Israel, 2 tha king of Egypt, N y’all will say 2 him, Tha LORD God of tha Hebrews has met wit us: N now let us go, we beseech u, three dayz’ journey in2 tha wilderness, dat we may sacrifice 2 tha LORD our God."},{"n":"3:19","text":"N I am sure dat tha king of Egypt will not let u go, no, not by a mighty hand."},{"n":"3:20","text":"N I will stretch out my hand, N smite Egypt wit all my wonders which I will do in tha midst thereof: N after dat he will let u go."},{"n":"3:21","text":"N I will give dis people favour in tha sight of tha Egyptianz: N it will come 2 pass, dat, when y’all go, y’all will not go empty:"},{"n":"3:22","text":"But every woman will borrow of her neighbour, N of her dat sojourneth in her house, jewels of silver, N jewels of gold, N raiment: N y’all will put ’em on ur sonz, N on ur daughterz; N y’all will spoil tha Egyptianz."}],"4":[{"n":"4:1","text":"N Moses answered N said, But, look, they will not believe me, nor hearken 2 my voice: 4 they will say, Tha LORD has not appeared 2 u."},{"n":"4:2","t
