ext":"N tha LORD said 2 him, What is dat in urz hand? N he said, A rod."},{"n":"4:3","text":"N he said, Cast it on tha ground. N he cast it on tha ground, N it became a serpent; N Moses fled from before it."},{"n":"4:4","text":"N tha LORD said 2 Moses, Put forth urz hand, N take it by tha tail. N he put forth his hand, N caught it, N it became a rod in his hand:"},{"n":"4:5","text":"Dat they may believe dat tha LORD God of their fatherz, tha God of Abraham, tha God of Isaac, N tha God of Jacob, has appeared 2 u."},{"n":"4:6","text":"N tha LORD said furthermore 2 him, Put now urz hand in2 ur bosom. N he put his hand in2 his bosom: N when he took it out, look, his hand was leprous as snow."},{"n":"4:7","text":"N he said, Put urz hand in2 ur bosom again. N he put his hand in2 his bosom again; N plucked it out of his bosom, N, look, it was turned again as his other flesh."},{"n":"4:8","text":"N it will come 2 pass, if they will not believe u, neither hearken 2 tha voice of tha first sign, dat they will believe tha voice of tha latter sign."},{"n":"4:9","text":"N it will come 2 pass, if they will not believe also dese two signs, neither hearken 2 ur voice, dat u will take of tha water of tha river, N pour it on tha dry land: N tha water which u takest out of tha river will become blood on tha dry land."},{"n":"4:10","text":"N Moses said 2 tha LORD, O my LORD, I am not eloquent, neither heretofore, nor since u have spoken 2 ur servant: but I am slow of speech, N of a slow tongue."},{"n":"4:11","text":"N tha LORD said 2 him, Who has made man’s mouth? or who maketh tha dumb, or deaf, or tha seeing, or tha blind? have not I tha LORD?"},{"n":"4:12","text":"Now therefore go, N I will be wit ur mouth, N teach u what u will say."},{"n":"4:13","text":"N he said, O my LORD, send, I pray u, by tha hand of him whom u wilt send."},{"n":"4:14","text":"N tha anger of tha LORD was kindled against Moses, N he said, Is not Aaron tha Levite ur brother? I know dat he can speak well. N also, look, he cometh forth 2 meet u: N when he seeth u, he will be glad in his heart."},{"n":"4:15","text":"N u will speak 2 him, N put wordz in his mouth: N I will be wit ur mouth, N wit his mouth, N will teach u what y’all will do."},{"n":"4:16","text":"N he will be ur spokesman 2 tha people: N he will be, even he will be 2 u instead of a mouth, N u will be 2 him instead of God."},{"n":"4:17","text":"N u will take dis rod in urz hand, wherewith u will do signs."},{"n":"4:18","text":"N Moses went N returned 2 Jethro his father in law, N said 2 him, Let me go, I pray u, N return 2 my brethren which r in Egypt, N see whether they be yet alive. N Jethro said 2 Moses, Go in peace."},{"n":"4:19","text":"N tha LORD said 2 Moses in Midian, Go, return in2 Egypt: 4 all tha men r dead which sought ur life."},{"n":"4:20","text":"N Moses took his wife N his sonz, N set ’em on an ass, N he returned 2 tha land of Egypt: N Moses took tha rod of God in his hand."},{"n":"4:21","text":"N tha LORD said 2 Moses, When u goest 2 return in2 Egypt, see dat u do all dose wonders before Pharaoh, which I have put in urz hand: but I will harden his heart, dat he will not let tha people go."},{"n":"4:22","text":"N u will say 2 Pharaoh, Thus says tha LORD, Israel is my son, even my firstborn:"},{"n":"4:23","text":"N I say 2 u, Let my son go, dat he may serve me: N if u refuse 2 let him go, look, I will slay ur son, even ur firstborn."},{"n":"4:24","text":"N it happened by tha way in tha inn, dat tha LORD met him, N sought 2 kill him."},{"n":"4:25","text":"Then Zipporah took a sharp stone, N cut off tha foreskin of her son, N cast it at his feet, N said, Surely a bloody husband r u 2 me."},{"n":"4:26","text":"So he let him go: then she said, A bloody husband u r, because of tha circumcision."},{"n":"4:27","text":"N tha LORD said 2 Aaron, Go in2 tha wilderness 2 meet Moses. N he went, N met him in tha mount of God, N kissed him."},{"n":"4:28","text":"N Moses told Aaron all tha wordz of tha LORD who had sent him, N all tha signs which he had commanded him."},{"n":"4:29","text":"N Moses N Aaron went N gathered together all tha elders of tha children of Israel:"},{"n":"4:30","text":"N Aaron spoke all tha wordz which tha LORD had spoken 2 Moses, N did tha signs in tha sight of tha people."},{"n":"4:31","text":"N tha people believed: N when they heard dat tha LORD had visited tha children of Israel, N dat he had looked on their affliction, then they bowed their heads N worshipped."}],"5":[{"n":"5:1","text":"N afterward Moses N Aaron went in, N told Pharaoh, Thus says tha LORD God of Israel, Let my people go, dat they may hold a feast 2 me in tha wilderness."},{"n":"5:2","text":"N Pharaoh said, Who is tha LORD, dat I should obey his voice 2 let Israel go? I know not tha LORD, neither will I let Israel go."},{"n":"5:3","text":"N they said, Tha God of tha Hebrews has met wit us: let us go, we pray u, three dayz’ journey in2 tha desert, N sacrifice 2 tha LORD our God; lest he fall on us wit pestilence, or wit tha sword."},{"n":"5:4","text":"N tha king of Egypt said 2 ’em, Wherefore do y’all, Moses N Aaron, let tha people from their works? get u 2 ur burdens."},{"n":"5:5","text":"N Pharaoh said, Look, tha people of tha land now r many, N y’all make ’em rest from their burdens."},{"n":"5:6","text":"N Pharaoh commanded tha same day tha taskmasters of tha people, N their officers, saying,"},{"n":"5:7","text":"Y’all will no more give tha people straw 2 make brick, as heretofore: let ’em go N gather straw 4 themselves."},{"n":"5:8","text":"N tha tale of tha bricks, which they did make heretofore, y’all will lay on ’em; y’all will not diminish ought thereof: 4 they be idle; therefore they cry, saying, Let us go N sacrifice 2 our God."},{"n":"5:9","text":"Let there more work be laid on tha men, dat they may labour therein; N let ’em not regard vain wordz."},{"n":"5:10","text":"N tha taskmasters of tha people went out, N their officers, N they spoke 2 tha people, saying, Thus says Pharaoh, I will not give u straw."},{"n":"5:11","text":"Go y’all, get u straw where y’all can find it: yet not ought of ur work will be diminished."},{"n":"5:12","text":"So tha people were scattered abroad throughout all tha land of Egypt 2 gather stubble instead of straw."},{"n":"5:13","text":"N tha taskmasters hasted ’em, saying, Fulfil ur works, ur daily tasks, as when there was straw."},{"n":"5:14","text":"N tha officers of tha children of Israel, which Pharaoh’s taskmasters had set over ’em, were beaten, N demanded, Wherefore have y’all not fulfilled ur task in making brick both yesterday N 2 day, as heretofore?"},{"n":"5:15","text":"Then tha officers of tha children of Israel came N cried 2 Pharaoh, saying, Wherefore dealest u thus wit ur servantz?"},{"n":"5:16","text":"There is no straw given 2 ur servantz, N they say 2 us, Make brick: N, look, ur servantz r beaten; but tha fault is in urz own people."},{"n":"5:17","text":"But he said, Y’all r idle, y’all r idle: therefore y’all say, Let us go N do sacrifice 2 tha LORD."},{"n":"5:18","text":"Go therefore now, N work; 4 there will no straw be given u, yet will y’all deliver tha tale of bricks."},{"n":"5:19","text":"N tha officers of tha children of Israel did see dat they were in evil case, after it was said, Y’all will not minish ought from ur bricks of ur daily task."},{"n":"5:20","text":"N they met Moses N Aaron, who stood in tha way, as they came forth from Pharaoh:"},{"n":"5:21","text":"N they said 2 ’em, Tha LORD look on u, N judge; because y’all have made our savour 2 be abhorred in tha eyez of Pharaoh, N in tha eyez of his servantz, 2 put a sword in their hand 2 slay us."},{"n":"5:22","text":"N Moses returned 2 tha LORD, N said, LORD, wherefore have u so evil entreated dis people? why is it dat u have sent me?"},{"n":"5:23","text":"4 since I came 2 Pharaoh 2 speak in ur name, he has done evil 2 dis people; neither have u delivered ur people at all."}],"6":[{"n":"6:1","text":"Then tha LORD said 2 Moses, Now will u see what I will do 2 Pharaoh: 4 wit a strong hand will he let ’em go, N wit a strong hand will he drive ’em out of his land."},{"n":"6:2","text":"N God spoke 2 Moses, N said 2 him, I am tha LORD:"},{"n":"6:3","text":"N I appeared 2 Abraham, 2 Isaac, N 2 Jacob, by tha name of God Almighty, but by my name JEHOVAH was I not known 2 ’em."},{"n":"6:4","text":"N I have also established my covenant wit ’em, 2 give ’em tha land of Canaan, tha land of their pilgrimage, wherein they were strangers."},{"n":"6:5","text":"N I have also heard tha groaning of tha children of Israel, whom tha Egyptianz keep in bondage; N I have remembered my covenant."},{"n":"6:6","text":"Wherefore say 2 tha children of Israel, I am tha LORD, N I will bring u out from under tha burdens of tha Egyptianz, N I will rid u out of their bondage, N I will redeem u wit a stretched out arm, N wit great judgments:"},{"n":"6:7","text":"N I will take u 2 me 4 a people, N I will be 2 u a God: N y’all will know dat I am tha LORD ur God, which bringeth u out from under tha burdens of tha Egyptianz."},{"n":"6:8","text":"N I will bring u in 2 tha land, concerning tha which I did swear 2 give it 2 Abraham, 2 Isaac, N 2 Jacob; N I will give it u 4 an heritage: I am tha LORD."},{"n":"6:9","text":"N Moses spoke so 2 tha children of Israel: but they hearkened not 2 Moses 4 anguish of spirit, N 4 cruel bondage."},{"n":"6:10","text":"N tha LORD spoke 2 Moses, saying,"},{"n":"6:11","text":"Go in, speak 2 Pharaoh king of Egypt, dat he let tha children of Israel go out of his land."},{"n":"6:12","text":"N Moses spoke before tha LORD, saying, Look, tha children of Israel have not hearkened 2 me; how then will Pharaoh hear me, who am of uncircumcised lips?"},{"n":"6:13","text":"N tha LORD spoke 2 Moses N 2 Aaron, N gave ’em a charge 2 tha children of Israel, N 2 Pharaoh king of Egypt, 2 bring tha children of Israel out of tha land of Egypt."},{"n":"6:14","text":"Dese be tha heads of their fatherz’ housez: Tha sonz of Reuben tha firstborn of Israel; Hanoch, N Pallu, Hezron, N Carmi: dese be tha familiez of Reuben."},{"n":"6:15","text":"N tha sonz of Simeon; Jemuel, N Jamin, N Ohad, N Jachin, N Zohar, N Shaul tha son of a Canaanitish woman: dese r tha familiez of Simeon."},{"n":"6:16","text":"N dese r tha namez of tha sonz of Levi according 2 their generations; Gershon, N Kohath, N Merari: N tha yearz of tha life of Levi were a hundred thirty N seven yearz."},{"n":"6:17","text":"Tha sonz of Gershon; Libni, N Shimi, according 2 their familiez."},{"n":"6:18","text":"N tha sonz of Kohath; Amram, N Izhar, N Hebron, N Uzziel: N tha yearz of tha life of Kohath were a hundred thirty N three yearz."},{"n":"6:19","text":"N tha sonz of Merari; Mahali N Mushi: dese r tha familiez of Levi according 2 their generations."},{"n":"6:20","text":"N Amram took him Jochebed his father’s sister 2 wife; N she bare him Aaron N Moses: N tha yearz of tha life of Amram were a hundred N thirty N seven yearz."},{"n":"6:21","text":"N tha sonz of Izhar; Korah, N Nepheg, N Zichri."},{"n":"6:22","text":"N tha sonz of Uzziel; Mishael, N Elzaphan, N Zithri."},{"n":"6:23","text":"N Aaron took him Elisheba, daughter of Amminadab, sister of Naashon, 2 wife; N she bare him Nadab, N Abihu, Eleazar, N Ithamar."},{"n":"6:24","text":"N tha sonz of Korah; Assir, N Elkanah, N Abiasaph: dese r tha familiez of tha Korhites."},{"n":"6:25","text":"N Eleazar Aaron’s son took him one of tha daughterz of Putiel 2 wife; N she bare him Phinehas: dese r tha heads of tha fatherz of tha Levites according 2 their familiez."},{"n":"6:26","text":"Dese r dat Aaron N Moses, 2 whom tha LORD said, Bring out tha children of Israel from tha land of Egypt according 2 their armies."},{"n":"6:27","text":"Dese r they which spoke 2 Pharaoh king of Egypt, 2 bring out tha children of Israel from Egypt: dese r dat Moses N Aaron."},{"n":"6:28","text":"N it happened on tha day when tha LORD spoke 2 Moses in tha land of Egypt,"},{"n":"6:29","text":"Dat tha LORD spoke 2 Moses, saying, I am tha LORD: speak u 2 Pharaoh king of Egypt all dat I say 2 u."},{"n":"6:30","text":"N Moses said before tha LORD, Look, I am of uncircumcised lips, N how will Pharaoh hearken 2 me?"}],"7":[{"n":"7:1","text":"N tha LORD said 2 Moses, See, I have made u a god 2 Pharaoh: N Aaron ur brother will be ur prophet."},{"n":"7:2","text":"U will speak all dat I command u: N Aaron ur brother will speak 2 Pharaoh, dat he send tha children of Israel out of his land."},{"n":"7:3","text":"N I will harden Pharaoh’s heart, N multiply my signs N my wonders in tha land of Egypt."},{"n":"7:4","text":"But Pharaoh will not hearken 2 u, dat I may lay my hand on Egypt, N bring forth mine armies, N my people tha children of Israel, out of tha land of Egypt by great judgments."},{"n":"7:5","text":"N tha Egyptianz will know dat I am tha LORD, when I stretch forth mine hand on Egypt, N bring out tha children of Israel from among ’em."},{"n":"7:6","text":"N Moses N Aaron did as tha LORD commanded ’em, so did they."},{"n":"7:7","text":"N Moses was fourscore yearz old, N Aaron fourscore N three yearz old, when they spoke 2 Pharaoh."},{"n":"7:8","text":"N tha LORD spoke 2 Moses N 2 Aaron, saying,"},{"n":"7:9","text":"When Pharaoh will speak 2 u, saying, Shew a miracle 4 u: then u will say 2 Aaron, Take ur rod, N cast it before Pharaoh, N it will become a serpent."},{"n":"7:10","text":"N Moses N Aaron went in 2 Pharaoh, N they did so as tha LORD had commanded: N Aaron cast down his rod before Pharaoh, N before his servantz, N it became a serpent."},{"n":"7:11","text":"Then Pharaoh also called tha wise men N tha sorcerers: now tha magicians of Egypt, they also did in like manner wit their enchantments."},{"n":"7:12","text":"4 they cast down every man his rod, N they became serpents: but Aaron’s rod swallowed up their rods."},{"n":"7:13","text":"N he hardened Pharaoh’s heart, dat he hearkened not 2 ’em; as tha LORD had said."},{"n":"7:14","text":"N tha LORD said 2 Moses, Pharaoh’s heart is hardened, he refuseth 2 let tha people go."},{"n":"7:15","text":"Get u 2 Pharaoh in tha morning; lo, he goeth out 2 tha water; N u will stand by tha river’s brink against he come; N tha rod which was turned 2 a serpent will u take in urz hand."},{"n":"7:16","text":"N u will say 2 him, Tha LORD God of tha Hebrews has sent me 2 u, saying, Let my people go, dat they may serve me in tha wilderness: N, look, hitherto u wouldest not hear."},{"n":"7:17","text":"Thus says tha LORD, In dis u will know dat I am tha LORD: look, I will smite wit tha rod dat is in mine hand on tha waterz which r in tha river, N they will be turned 2 blood."},{"n":"7:18","text":"N tha fish dat is in tha river will die, N tha river will stink; N tha Egyptianz will lothe 2 drink of tha water of tha river."},{"n":"7:19","text":"N tha LORD spoke 2 Moses, Say 2 Aaron, Take ur rod, N stretch out urz hand on tha waterz of Egypt, on their streams, on their rivers, N on their ponds, N on all their pools of water, dat they may become blood; N dat there may be blood throughout all tha land of Egypt, both in vessels of wood, N in vessels of stone."},{"n":"7:20","text":"N Moses N Aaron did so, as tha LORD commanded; N he lifted up tha rod, N smote tha waterz dat were in tha river, in tha sight of Pharaoh, N in tha sight of his servantz; N all tha waterz dat were in tha river were turned 2 blood."},{"n":"7:21","text":"N tha fish dat was in tha river died; N tha river stank, N tha Egyptianz could not drink of tha water of tha river; N there was blood throughout all tha land of Egypt."},{"n":"7:22","text":"N tha magicians of Egypt did so wit their enchantments: N Pharaoh’s heart was hardened, neither did he hearken 2 ’em; as tha LORD had said."},{"n":"7:23","text":"N Pharaoh turned N went in2 his house, neither did he set his heart 2 dis also."},{"n":"7:24","text":"N all tha Egyptianz digged round about tha river 4 water 2 drink; 4 they could not drink of tha water of tha river."},{"n":"7:25","text":"N seven dayz were fulfilled, after dat tha LORD had smitten tha river."}],"8":[{"n":"8:1","text":"N tha LORD spoke 2 Moses, Go 2 Pharaoh, N say 2 him, Thus says tha LORD, Let my people go, dat they may serve me."},{"n":"8:2","text":"N if u refuse 2 let ’em go, look, I will smite all ur borders wit frogs:"},{"n":"8:3","text":"N tha river will bring forth frogs abundantly, which will go up N come in2 urz house, N in2 ur bedchamber, N on ur bed, N in2 tha house of ur servantz, N on ur people, N in2 urz ovens, N in2 ur kneadingtroughs:"},{"n":"8:4","text":"N tha frogs will come up both on u, N on ur people, N on all ur servantz."},{"n":"8:5","text":"N tha LORD spoke 2 Moses, Say 2 Aaron, Stretch forth urz hand wit ur rod over tha streams, over tha rivers, N over tha ponds, N cause frogs 2 come up on tha land of Egypt."},{"n":"8:6","text":"N Aaron stretched out his hand over tha waterz of Egypt; N tha frogs came up, N covered tha land of Egypt."},{"n":"8:7","text":"N tha magicians did so wit their enchantments, N brought up frogs on tha land of Egypt."},{"n":"8:8","text":"Then Pharaoh called 4 Moses N Aaron, N said, Intreat tha LORD, dat he may take away tha frogs from me, N from my people; N I will let tha people go, dat they may do sacrifice 2 tha LORD."},{"n":"8:9","text":"N Moses said 2 Pharaoh, Glory over me: when will I intreat 4 u, N 4 ur servantz, N 4 ur people, 2 destroy tha frogs from u N ur housez, dat they may remain in tha river only?"},{"n":"8:10","text":"N he said, 2 morrow. N he said, Be it according 2 ur word: dat u mayest know dat there is none like 2 tha LORD our God."},{"n":"8:11","text":"N tha frogs will depart from u, N from ur housez, N from ur servantz, N from ur people; they will remain in tha river only."},{"n":"8:12","text":"N Moses N Aaron went out from Pharaoh: N Moses cried 2 tha LORD because of tha frogs which he had brought against Pharaoh."},{"n":"8:13","text":"N tha LORD did according 2 tha word of Moses; N tha frogs died out of tha housez, out of tha villages, N out of tha fields."},{"n":"8:14","text":"N they gathered ’em together on heaps: N tha land stank."},{"n":"8:15","text":"But when Pharaoh saw dat there was respite, he hardened his heart, N hearkened not 2 ’em; as tha LORD had said."},{"n":"8:16","text":"N tha LORD said 2 Moses, Say 2 Aaron, Stretch out ur rod, N smite tha dust of tha land, dat it may become lice throughout all tha land of Egypt."},{"n":"8:17","text":"N they did so; 4 Aaron stretched out his hand wit his rod, N smote tha dust of tha earth, N it became lice in man, N in beast; all tha dust of tha land became lice throughout all tha land of Egypt."},{"n":"8:18","text":"N tha magicians did so wit their enchantments 2 bring forth lice, but they could not: so there were lice on man, N on beast."},{"n":"8:19","text":"Then tha magicians said 2 Pharaoh, Dis is tha finger of God: N Pharaoh’s heart was hardened, N he hearkened not 2 ’em; as tha LORD had said."},{"n":"8:20","text":"N tha LORD said 2 Moses, Rise up early in tha morning, N stand before Pharaoh; lo, he cometh forth 2 tha water; N say 2 him, Thus says tha LORD, Let my people go, dat they may serve me."},{"n":"8:21","text":"Else, if u wilt not let my people go, look, I will send swarms of flies on u, N on ur servantz, N on ur people, N in2 ur housez: N tha housez of tha Egyptianz will be full of swarms of flies, N also tha ground whereon they r."},{"n":"8:22","text":"N I will sever in dat day tha land of Goshen, in which my people dwell, dat no swarms of flies will be there; 2 tha end u mayest know dat I am tha LORD in tha midst of tha earth."},{"n":"8:23","text":"N I will put a division between my people N ur people: 2 morrow will dis sign be."},{"n":"8:24","text":"N tha LORD did so; N there came a grievous swarm of flies in2 tha house of Pharaoh, N in2 his servantz’ housez, N in2 all tha land of Egypt: tha land was corrupted by reason of tha swarm of flies."},{"n":"8:25","text":"N Pharaoh called 4 Moses N 4 Aaron, N said, Go y’all, sacrifice 2 ur God in tha land."},{"n":"8:26","text":"N Moses said, It is not meet so 2 do; 4 we will sacrifice tha abomination of tha Egyptianz 2 tha LORD our God: lo, will we sacrifice tha abomination of tha Egyptianz before their eyez, N will they not stone us?"},{"n":"8:27","text":"We will go three dayz’ journey in2 tha wilderness, N sacrifice 2 tha LORD our God, as he will command us."},{"n":"8:28","text":"N Pharaoh said, I will let u go, dat y’all may sacrifice 2 tha LORD ur God in tha wilderness; only y’all will not go very far away: intreat 4 me."},{"n":"8:29","text":"N Moses said, Look, I go out from u, N I will intreat tha LORD dat tha swarms of flies may depart from Pharaoh, from his servantz, N from his people, 2 morrow: but let not Pharaoh deal deceitfully any more in not letting tha people go 2 sacrifice 2 tha LORD."},{"n":"8:30","text":"N Moses went out from Pharaoh, N intreated tha LORD."},{"n":"8:31","text":"N tha LORD did according 2 tha word of Moses; N he removed tha swarms of flies from Pharaoh, from his servantz, N from his people; there remained not one."},{"n":"8:32","text":"N Pharaoh hardened his heart at dis time also, neither would he let tha people go."}],"9":[{"n":"9:1","text":"Then tha LORD said 2 Moses, Go in 2 Pharaoh, N tell him, Thus says tha LORD God of tha Hebrews, Let my people go, dat they may serve me."},{"n":"9:2","text":"4 if u refuse 2 let ’em go, N wilt hold ’em still,"},{"n":"9:3","text":"Look, tha hand of tha LORD is on ur cattle which is in tha field, on tha horsez, on tha asses, on tha camels, on tha oxen, N on tha sheep: there will be a very grievous murrain."},{"n":"9:4","text":"N tha LORD will sever between tha cattle of Israel N tha cattle of Egypt: N there will nothing die of all dat is tha children’s of Israel."},{"n":"9:5","text":"N tha LORD appointed a set time, saying, 2 morrow tha LORD will do dis thing in tha land."},{"n":"9:6","text":"N tha LORD did dat thing on tha morrow, N all tha cattle of Egypt died: but of tha cattle of tha children of Israel died not one."},{"n":"9:7","text":"N Pharaoh sent, N, look, there was not one of tha cattle of tha Israelitez dead. N tha heart of Pharaoh was hardened, N he did not let tha people go."},{"n":"9:8","text":"N tha LORD said 2 Moses N 2 Aaron, Take 2 u handfuls of ashes of tha furnace, N let Moses sprinkle it toward tha heaven in tha sight of Pharaoh."},{"n":"9:9","text":"N it will become small dust in all tha land of Egypt, N will be a boil breaking forth wit blains on man, N on beast, throughout all tha land of Egypt."},{"n":"9:10","text":"N they took ashes of tha furnace, N stood before Pharaoh; N Moses sprinkled it up toward heaven; N it became a boil breaking forth wit blains on man, N on beast."},{"n":"9:11","text":"N tha magicians could not stand before Moses because of tha boils; 4 tha boil was on tha magicians, N on all tha Egyptianz."},{"n":"9:12","text":"N tha LORD hardened tha heart of Pharaoh, N he hearkened not 2 ’em; as tha LORD had spoken 2 Moses."},{"n":"9:13","text":"N tha LORD said 2 Moses, Rise up early in tha morning, N stand before Pharaoh, N say 2 him, Thus says tha LORD God of tha Hebrews, Let my people go, dat they may serve me."},{"n":"9:14","text":"4 I will at dis time send all my plaguez on urz heart, N on ur servantz, N on ur people; dat u mayest know dat there is none like me in all tha earth."},{"n":"9:15","text":"4 now I will stretch out my hand, dat I may smite u N ur people wit pestilence; N u will be cut off from tha earth."},{"n":"9:16","text":"N in very deed 4 dis cause have I raised u up, 4 2 shew in u my power; N dat my name may be declared throughout all tha earth."},{"n":"9:17","text":"As yet exaltest u thyself against my people, dat u wilt not let ’em go?"},{"n":"9:18","text":"Look, 2 morrow about dis time I will cause it 2 rain a very grievous hail, such as has not been in Egypt since tha foundation thereof even until now."},{"n":"9:19","text":"Send therefore now, N gather ur cattle, N all dat u have in tha field; 4 on every man N beast which will be found in tha field, N will not be brought home, tha hail will come down on ’em, N they will die."},{"n":"9:20","text":"He dat feared tha word of tha LORD among tha servantz of Pharaoh made his servantz N his cattle flee in2 tha housez:"},{"n":"9:21","text":"N he dat regarded not tha word of tha LORD left his servantz N his cattle in tha field."},{"n":"9:22","text":"N tha LORD said 2 Moses, Stretch forth urz hand toward heaven, dat there may be hail in all tha land of Egypt, on man, N on beast, N on every herb of tha field, throughout tha land of Egypt."},{"n":"9:23","text":"N Moses stretched forth his rod toward heaven: N tha LORD sent thunder N hail, N tha fire ran along on tha ground; N tha LORD rained hail on tha land of Egypt."},{"n":"9:24","text":"So there was hail, N fire mingled wit tha hail, very grievous, such as there was none like it in all tha land of Egypt since it became a nation."},{"n":"9:25","text":"N tha hail smote throughout all tha land of Egypt all dat was in tha field, both man N beast; N tha hail smote every herb of tha field, N brake every tree of tha field."},{"n":"9:26","text":"Only in tha land of Goshen, where tha children of Israel were, was there no hail."},{"n":"9:27","text":"N Pharaoh sent, N called 4 Moses N Aaron, N said 2 ’em, I have sinned dis time: tha LORD is righteous, N I N my people r wicked."},{"n":"9:28","text":"Intreat tha LORD (4 it is enough) dat there be no more mighty thunderings N hail; N I will let u go, N y’all will stay no longer."},{"n":"9:29","text":"N Moses said 2 him, As soon as I am gone out of tha city, I will spread abroad my handz 2 tha LORD; N tha thunder will cease, neither will there be any more hail; dat u mayest know how dat tha earth is tha LORD’s."},{"n":"9:30","text":"But as 4 u N ur servantz, I know dat y’all will not yet fear tha LORD God."},{"n":"9:31","text":"N tha flax N tha barley was smitten: 4 tha barley was in tha ear, N tha flax was bolled."},{"n":"9:32","text":"But tha wheat N tha rie were not smitten: 4 they were not grown up."},{"n":"9:33","text":"N Moses went out of tha city from Pharaoh, N spread abroad his handz 2 tha LORD: N tha thunders N hail ceased, N tha rain was not poured on tha earth."},{"n":"9:34","text":"N when Pharaoh saw dat tha rain N tha hail N tha thunders were ceased, he sinned yet more, N hardened his heart, he N his servantz."},{"n":"9:35","text":"N tha heart of Pharaoh was hardened, neither would he let tha children of Israel go; as tha LORD had spoken by Moses."}],"10":[{"n":"10:1","text":"N tha LORD said 2 Moses, Go in 2 Pharaoh: 4 I have hardened his heart, N tha heart of his servantz, dat I might shew dese my signs before him:"},{"n":"10:2","text":"N dat u mayest tell in tha earz of ur son, N of ur son’s son, what things I have wrought in Egypt, N my signs which I have done among ’em; dat y’all may know how dat I am tha LORD."},{"n":"10:3","text":"N Moses N Aaron came in 2 Pharaoh, N said 2 him, Thus says tha LORD God of tha Hebrews, How long wilt u refuse 2 humble thyself before me? let my people go, dat they may serve me."},{"n":"10:4","text":"Else, if u refuse 2 let my people go, look, 2 morrow will I bring tha locusts in2 ur coast:"},{"n":"10:5","text":"N they will cover tha face of tha earth, dat one cannot be able 2 see tha earth: N they will eat tha residue of dat which is escaped, which remaineth 2 u from tha hail, N will eat every tree which groweth 4 u out of tha field:"},{"n":"10:6","text":"N they will fill ur housez, N tha housez of all ur servantz, N tha housez of all tha Egyptianz; which neither ur fatherz, nor ur fatherz’ fatherz have seen, since tha day dat they were on tha earth 2 dis day. N he turned himself, N went out from Pharaoh."},{"n":"10:7","text":"N Pharaoh’s servantz said 2 him, How long will dis man be a snare 2 us? let tha men go, dat they may serve tha LORD their God: knowest u not yet dat Egypt is destroyed?"},{"n":"10:8","text":"N Moses N Aaron were brought again 2 Pharaoh: N he said 2 ’em, Go, serve tha LORD ur God: but who r they dat will go?"},{"n":"10:9","text":"N Moses said, We will go wit our young N wit our old, wit our sonz N wit our daughterz, wit our flocks N wit our herds will we go; 4 we must hold a feast 2 tha LORD."},{"n":"10:10","text":"N he said 2 ’em, Let tha LORD be so wit u, as I will let u go, N ur little ones: look 2 it; 4 evil is before u."},{"n":"10:11","text":"Not so: go now y’all dat r men, N serve tha LORD; 4 dat y’all did desire. N they were driven out from Pharaoh’s presence."},{"n":"10:12","text":"N tha LORD said 2 Moses, Stretch out urz hand over tha land of Egypt 4 tha locusts, dat they may come up on tha land of Egypt, N eat every herb of tha land, even all dat tha hail has left."},{"n":"10:13","text":"N Moses stretched forth his rod over tha land of Egypt, N tha LORD brought an east wind on tha land all dat day, N all dat night; N when it was morning, tha east wind brought tha locusts."},{"n":"10:14","text":"N tha locusts went up over all tha land of Egypt, N rested in all tha coasts of Egypt: very grievous were they; before ’em there were no such locusts as they, neither after ’em will be such."},{"n":"10:15","text":"4 they covered tha face of tha whole earth, so dat tha land was darkened; N they did eat every herb of tha land, N all tha fruit of tha trees which tha hail had left: N there remained not any green thing in tha trees, or in tha herbs of tha field, through all tha land of Egypt."},{"n":"10:16","text":"Then Pharaoh called 4 Moses N Aaron in haste; N he said, I have sinned against tha LORD ur God, N against u."},{"n":"10:17","text":"Now therefore forgive, I pray u, my sin only dis once, N intreat tha LORD ur God, dat he may take away from me dis death only."},{"n":"10:18","text":"N he went out from Pharaoh, N intreated tha LORD."},{"n":"10:19","text":"N tha LORD turned a mighty strong west wind, which took away tha locusts, N cast ’em in2 tha Red sea; there remained not one locust in all tha coasts of Egypt."},{"n":"10:20","text":"But tha LORD hardened Pharaoh’s heart, so dat he would not let tha children of Israel go."},{"n":"10:21","text":"N tha LORD said 2 Moses, Stretch out urz hand toward heaven, dat there may be darkness over tha land of Egypt, even darkness which may be felt."},{"n":"10:22","text":"N Moses stretched forth his hand toward heaven; N there was a thick darkness in all tha land of Egypt three dayz:"},{"n":"10:23","text":"They saw not one another, neither rose any from his place 4 three dayz: but all tha children of Israel had light in their dwellings."},{"n":"10:24","text":"N Pharaoh called 2 Moses, N said, Go y’all, serve tha LORD; only let ur flocks N ur herds be stayed: let ur little ones also go wit u."},{"n":"10:25","text":"N Moses said, U must give us also sacrifices N burnt offeringz, dat we may sacrifice 2 tha LORD our God."},{"n":"10:26","text":"Our cattle also will go wit us; there will not an hoof be left behind; 4 thereof must we take 2 serve tha LORD our God; N we know not wit what we must serve tha LORD, until we come thither."},{"n":"10:27","text":"But tha LORD hardened Pharaoh’s heart, N he would not let ’em go."},{"n":"10:28","text":"N Pharaoh said 2 him, Get u from me, take heed 2 thyself, see my face no more; 4 in dat day u seest my face u will die."},{"n":"10:29","text":"N Moses said, U have spoken well, I will see ur face again no more."}],"11":[{"n":"11:1","text":"N tha LORD said 2 Moses, Yet will I bring one plague more on Pharaoh, N on Egypt; afterwards he will let u go hence: when he will let u go, he will surely thrust u out hence altogether."},{"n":"11:2","text":"Speak now in tha earz of tha people, N let every man borrow of his neighbour, N every woman of her neighbour, jewels of silver, N jewels of gold."},{"n":"11:3","text":"N tha LORD gave tha people favour in tha sight of tha Egyptianz. Moreover tha man Moses was very great in tha land of Egypt, in tha sight of Pharaoh’s servantz, N in tha sight of tha people."},{"n":"11:4","text":"N Moses said, Thus says tha LORD, About midnight will I go out in2 tha midst of Egypt:"},{"n":"11:5","text":"N all tha firstborn in tha land of Egypt will die, from tha first born of Pharaoh dat sitteth on his throne, even 2 tha firstborn of tha maidservant dat is behind tha mill; N all tha firstborn of beasts."},{"n":"11:6","text":"N there will be a great cry throughout all tha land of Egypt, such as there was none like it, nor will be like it any more."},{"n":"11:7","text":"But against any of tha children of Israel will not a dog move his tongue, against man or beast: dat y’all may know how dat tha LORD does put a difference between tha Egyptianz N Israel."},{"n":"11:8","text":"N all dese ur servantz will come down 2 me, N bow down themselves 2 me, saying, Get u out, N all tha people dat follow u: N after dat I will go out. N he went out from Pharaoh in a great anger."},{"n":"11:9","text":"N tha LORD said 2 Moses, Pharaoh will not hearken 2 u; dat my wonders may be multiplied in tha land of Egypt."},{"n":"11:10","text":"N Moses N Aaron did all dese wonders before Pharaoh: N tha LORD hardened Pharaoh’s heart, so dat he would not let tha children of Israel go out of his land."}],"12":[{"n":"12:1","text":"N tha LORD spoke 2 Moses N Aaron in tha land of Egypt, saying,"},{"n":"12:2","text":"Dis month will be 2 u tha beginning of months: it will be tha first month of tha year 2 u."},{"n":"12:3","text":"Speak y’all 2 all tha congregation of Israel, saying, In tha tenth day of dis month they will take 2 ’em every man a lamb, according 2 tha house of their fatherz, a lamb 4 an house:"},{"n":"12:4","text":"N if tha household be too little 4 tha lamb, let him N his neighbour next 2 his house take it according 2 tha number of tha souls; every man according 2 his eating will make ur count 4 tha lamb."},{"n":"12:5","text":"Ur lamb will be without blemish, a male of tha first year: y’all will take it out from tha sheep, or from tha goats:"},{"n":"12:6","text":"N y’all will keep it up until tha fourteenth day of tha same month: N tha whole assembly of tha congregation of Israel will kill it in tha evening."},{"n":"12:7","text":"N they will take of tha blood, N strike it on tha two side posts N on tha upper door post of tha housez, wherein they will eat it."},{"n":"12:8","text":"N they will eat tha flesh in dat night, roast wit fire, N unleavened bread; N wit bitter herbs they will eat it."},{"n":"12:9","text":"Eat not of it raw, nor sodden at all wit water, but roast wit fire; his head wit his legs, N wit tha purtenance thereof."},{"n":"12:10","text":"N y’all will let nothing of it remain until tha morning; N dat which remaineth of it until tha morning y’all will burn wit fire."},{"n":"12:11","text":"N thus will y’all eat it; wit ur loins girded, ur shoes on ur feet, N ur staff in ur hand; N y’all will eat it in haste: it is tha LORD’s passover."},{"n":"12:12","text":"4 I will pass through tha land of Egypt dis night, N will smite all tha firstborn in tha land of Egypt, both man N beast; N against all tha godz of Egypt I will execute judgment: I am tha LORD."},{"n":"12:13","text":"N tha blood will be 2 u 4 a token on tha housez where y’all r: N when I see tha blood, I will pass over u, N tha plague will not be on u 2 destroy u, when I smite tha land of Egypt."},{"n":"12:14","text":"N dis day will be 2 u 4 a memorial; N y’all will keep it a feast 2 tha LORD throughout ur generations; y’all will keep it a feast by an ordinance 4 ever."},{"n":"12:15","text":"Seven dayz will y’all eat unleavened bread; even tha first day y’all will put away leaven out of ur housez: 4 whosoever eateth leavened bread from tha first day until tha seventh day, dat soul will be cut off from Israel."},{"n":"12:16","text":"N in tha first day there will be an holy convocation, N in tha seventh day there will be an holy convocation 2 u; no manner of work will be done in ’em, save dat which every man must eat, dat only may be done of u."},{"n":"12:17","text":"N y’all will observe tha feast of unleavened bread; 4 in dis selfsame day have I brought ur armies out of tha land of Egypt: therefore will y’all observe dis day in ur generations by an ordinance 4 ever."},{"n":"12:18","text":"In tha first month, on tha fourteenth day of tha month at even, y’all will eat unleavened bread, until tha one N twentieth day of tha month at even."},{"n":"12:19","text":"Seven dayz will there be no leaven found in ur housez: 4 whosoever eateth dat which is leavened, even dat soul will be cut off from tha congregation of Israel, whether he be a stranger, or born in tha land."},{"n":"12:20","text":"Y’all will eat nothing leavened; in all ur habitations will y’all eat unleavened bread."},{"n":"12:21","text":"Then Moses called 4 all tha elders of Israel, N said 2 ’em, Draw out N take u a lamb according 2 ur familiez, N kill tha passover."},{"n":"12:22","text":"N y’all will take a bunch of hyssop, N dip it in tha blood dat is in tha bason, N strike tha lintel N tha two side posts wit tha blood dat is in tha bason; N none of u will go out at tha door of his house until tha morning."},{"n":"12:23","text":"4 tha LORD will pass through 2 smite tha Egyptianz; N when he seeth tha blood on tha lintel, N on tha two side posts, tha LORD will pass over tha door, N will not suffer tha destroyer 2 come in 2 ur housez 2 smite u."},{"n":"12:24","text":"N y’all will observe dis thing 4 an ordinance 2 u N 2 ur sonz 4 ever."},{"n":"12:25","text":"N it will come 2 pass, when y’all be come 2 tha land which tha LORD will give u, according as he has promised, dat y’all will keep dis service."},{"n":"12:26","text":"N it will come 2 pass, when ur children will say 2 u, What mean y’all by dis service?"},{"n":"12:27","text":"Dat y’all will say, It is tha sacrifice of tha LORD’s passover, who passed over tha housez of tha children of Israel in Egypt, when he smote tha Egyptianz, N delivered our housez. N tha people bowed tha head N worshipped."},{"n":"12:28","text":"N tha children of Israel went away, N did as tha LORD had commanded Moses N Aaron, so did they."},{"n":"12:29","text":"N it happened, dat at midnight tha LORD smote all tha firstborn in tha land of Egypt, from tha firstborn of Pharaoh dat sat on his throne 2 tha firstborn of tha captive dat was in tha dungeon; N all tha firstborn of cattle."},{"n":"12:30","text":"N Pharaoh rose up in tha night, he, N all his servantz, N all tha Egyptianz; N there was a great cry in Egypt; 4 there was not a house where there was not one dead."},{"n":"12:31","text":"N he called 4 Moses N Aaron by night, N said, Rise up, N get u forth from among my people, both y’all N tha children of Israel; N go, serve tha LORD, as y’all have said."},{"n":"12:32","text":"Also take ur flocks N ur herds, as y’all have said, N be gone; N bless me also."},{"n":"12:33","text":"N tha Egyptianz were urgent on tha people, dat they might send ’em out of tha land in haste; 4 they said, We be all dead men."},{"n":"12:34","text":"N tha people took their dough before it was leavened, their kneadingtroughs being bound up in their clothes on their shoulders."},{"n":"12:35","text":"N tha children of Israel did according 2 tha word of Moses; N they borrowed of tha Egyptianz jewels of silver, N jewels of gold, N raiment:"},{"n":"12:36","text":"N tha LORD gave tha people favour in tha sight of tha Egyptianz, so dat they lent 2 ’em such things as they required. N they spoiled tha Egyptianz."},{"n":"12:37","text":"N tha children of Israel journeyed from Rameses 2 Succoth, about six hundred thousand on foot dat were men, beside children."},{"n":"12:38","text":"N a mixed multitude went up also wit ’em; N flocks, N herds, even very much cattle."},{"n":"12:39","text":"N they baked unleavened cakes of tha dough which they brought forth out of Egypt, 4 it was not leavened; because they were thrust out of Egypt, N could not tarry, neither had they prepared 4 themselves any victual."},{"n":"12:40","text":"Now tha sojourning of tha children of Israel, who dwelt in Egypt, was four hundred N thirty yearz."},{"n":"12:41","text":"N it happened at tha end of tha four hundred N thirty yearz, even tha selfsame day it happened, dat all tha hosts of tha LORD went out from tha land of Egypt."},{"n":"12:42","text":"It is a night 2 be much observed 2 tha LORD 4 bringing ’em out from tha land of Egypt: dis is dat night of tha LORD 2 be observed of all tha children of Israel in their generations."},{"n":"12:43","text":"N tha LORD said 2 Moses N Aaron, Dis is tha ordinance of tha passover: There will no stranger eat thereof:"},{"n":"12:44","text":"But every man’s servant dat is bought 4 money, when u have circumcised him, then will he eat thereof."},{"n":"12:45","text":"A foreigner N an hired servant will not eat thereof."},{"n":"12:46","text":"In one house will it be eaten; u will not carry forth ought of tha flesh abroad out of tha house; neither will y’all break a bone thereof."},{"n":"12:47","text":"All tha congregation of Israel will keep it."},{"n":"12:48","text":"N when a stranger will sojourn wit u, N will keep tha passover 2 tha LORD, let all his males be circumcised, N then let him come near N keep it; N he will be as one dat is born in tha land: 4 no uncircumcised person will eat thereof."},{"n":"12:49","text":"One law will be 2 him dat is homeborn, N 2 tha stranger dat sojourneth among u."},{"n":"12:50","text":"Thus did all tha children of Israel; as tha LORD commanded Moses N Aaron, so did they."},{"n":"12:51","text":"N it happened tha selfsame day, dat tha LORD did bring tha children of Israel out of tha land of Egypt by their armies."}],"13":[{"n":"13:1","text":"N tha LORD spoke 2 Moses, saying,"},{"n":"13:2","text":"Sanctify 2 me all tha firstborn, whatsoever openeth tha womb among tha children of Israel, both of man N of beast: it is mine."},{"n":"13:3","text":"N Moses said 2 tha people, Remember dis day, in which y’all came out from Egypt, out of tha house of bondage; 4 by strength of hand tha LORD brought u out from dis place: there will no leavened bread be eaten."},{"n":"13:4","text":"Dis day came y’all out in tha month Abib."},{"n":"13:5","text":"N it will be when tha LORD will bring u in2 tha land of tha Canaanites, N tha Hittites, N tha Amorites, N tha Hivites, N tha Jebusites, which he sware 2 ur fatherz 2 give u, a land flowing wit milk N honey, dat u will keep dis service in dis month."},{"n":"13:6","text":"Seven dayz u will eat unleavened bread, N in tha seventh day will be a feast 2 tha LORD."},{"n":"13:7","text":"Unleavened bread will be eaten seven dayz; N there will no leavened bread be seen wit u, neither will there be leaven seen wit u in all ur quarters."},{"n":"13:8","text":"N u will shew ur son in dat day, saying, Dis is done because of dat which tha LORD did 2 me when I came forth out of Egypt."},{"n":"13:9","text":"N it will be 4 a sign 2 u on urz hand, N 4 a memorial between urz eyez, dat tha LORD’s law may be in ur mouth: 4 wit a strong hand has tha LORD brought u out of Egypt."},{"n":"13:10","text":"U will therefore keep dis ordinance in his season from year 2 year."},{"n":"13:11","text":"N it will be when tha LORD will bring u in2 tha land of tha Canaanites, as he sware 2 u N 2 ur fatherz, N will give it u,"},{"n":"13:12","text":"Dat u will set apart 2 tha LORD all dat openeth tha matrix, N every firstling dat cometh of a beast which u have; tha males will be tha LORD’s."},{"n":"13:13","text":"N every firstling of an ass u will redeem wit a lamb; N if u wilt not redeem it, then u will break his neck: N all tha firstborn of man among ur children will u redeem."},{"n":"13:14","text":"N it will be when ur son asketh u in time 2 come, saying, What is dis? dat u will say 2 him, By strength of hand tha LORD brought us out from Egypt, from tha house of bondage:"},{"n":"13:15","text":"N it happened, when Pharaoh would hardly let us go, dat tha LORD slew all tha firstborn in tha land of Egypt, both tha firstborn of man, N tha firstborn of beast: therefore I sacrifice 2 tha LORD all dat openeth tha matrix, being males; but all tha firstborn of my children I redeem."},{"n":"13:16","text":"N it will be 4 a token on urz hand, N 4 frontlets between urz eyez: 4 by strength of hand tha LORD brought us forth out of Egypt."},{"n":"13:17","text":"N it happened, when Pharaoh had let tha people go, dat God led ’em not through tha way of tha land of tha Philistines, although dat was near; 4 God said, Lest peradventure tha people repent when they see war, N they return 2 Egypt:"},{"n":"13:18","text":"But God led tha people about, through tha way of tha wilderness of tha Red sea: N tha children of Israel went up harnessed out of tha land of Egypt."},{"n":"13:19","text":"N Moses took tha bones of Joseph wit him: 4 he had straitly sworn tha children of Israel, saying, God will surely visit u; N y’all will carry up my bones away hence wit u."},{"n":"13:20","text":"N they took their journey from Succoth, N encamped in Etham, in tha edge of tha wilderness."},{"n":"13:21","text":"N tha LORD went before ’em by day in a pillar of a cloud, 2 lead ’em tha way; N by night in a pillar of fire, 2 give ’em light; 2 go by day N night:"},{"n":"13:22","text":"He took not away tha pillar of tha cloud by day, nor tha pillar of fire by night, from before tha people."}],"14":[{"n":"14:1","text":"N tha LORD spoke 2 Moses, saying,"},{"n":"14:2","text":"Speak 2 tha children of Israel, dat they turn N encamp before Pihahiroth, between Migdol N tha sea, over against Baalzephon: before it will y’all encamp by tha sea."},{"n":"14:3","text":"4 Pharaoh will say of tha children of Israel, They r entangled in tha land, tha wilderness has shut ’em in."},{"n":"14:4","text":"N I will harden Pharaoh’s heart, dat he will follow after ’em; N I will be honoured on Pharaoh, N on all his host; dat tha Egyptianz may know dat I am tha LORD. N they did so."},{"n":"14:5","text":"N it was told tha king of Egypt dat tha people fled: N tha heart of Pharaoh N of his servantz was turned against tha people, N they said, Why have we done dis, dat we have let Israel go from serving us?"},{"n":"14:6","text":"N he made ready his chariot, N took his people wit him:"},{"n":"14:7","text":"N he took six hundred chosen chariotz, N all tha chariotz of Egypt, N captains over every one of ’em."},{"n":"14:8","text":"N tha LORD hardened tha heart of Pharaoh king of Egypt, N he pursued after tha children of Israel: N tha children of Israel went out wit an high hand."},{"n":"14:9","text":"But tha Egyptianz pursued after ’em, all tha horsez N chariotz of Pharaoh, N his horsemen, N his army, N overtook ’em encamping by tha sea, beside Pihahiroth, before Baalzephon."},{"n":"14:10","text":"N when Pharaoh drew nigh, tha children of Israel lifted up their eyez, N, look, tha Egyptianz marched after ’em; N they were sore afraid: N tha children of Israel cried out 2 tha LORD."},{"n":"14:11","text":"N they said 2 Moses, Because there were no graves in Egypt, have u taken us away 2 die in tha wilderness? wherefore have u dealt thus wit us, 2 carry us forth out of Egypt?"},{"n":"14:12","text":"Is not dis tha word dat we did tell u in Egypt, saying, Let us alone, dat we may serve tha Egyptianz? 4 it had been better 4 us 2 serve tha Egyptianz, than dat we should die in tha wilderness."},{"n":"14:13","text":"N Moses said 2 tha people, Fear y’all not, stand still, N see tha salvation of tha LORD, which he will shew 2 u 2 day: 4 tha Egyptianz whom y’all have seen 2 day, y’all will see ’em again no more 4 ever."},{"n":"14:14","text":"Tha LORD will fight 4 u, N y’all will hold ur peace."},{"n":"14:15","text":"N tha LORD said 2 Moses, Wherefore criest u 2 me? speak 2 tha children of Israel, dat they go forward:"},{"n":"14:16","text":"But lift u up ur rod, N stretch out urz hand over tha sea, N divide it: N tha children of Israel will go on dry ground through tha midst of tha sea."},{"n":"14:17","text":"N I, look, I will harden tha hearts of tha Egyptianz, N they will follow ’em: N I will get me honour on Pharaoh, N on all his host, on his chariotz, N on his horsemen."},{"n":"14:18","text":"N tha Egyptianz will know dat I am tha LORD, when I have gotten me honour on Pharaoh, on his chariotz, N on his horsemen."},{"n":"14:19","text":"N tha angel of God, which went before tha camp of Israel, removed N went behind ’em; N tha pillar of tha cloud went from before their face, N stood behind ’em:"},{"n":"14:20","text":"N it came between tha camp of tha Egyptianz N tha camp of Israel; N it was a cloud N darkness 2 ’em, but it gave light by night 2 dese: so dat tha one came not near tha other all tha night."},{"n":"14:21","text":"N Moses stretched out his hand over tha sea; N tha LORD caused tha sea 2 go back by a strong east wind all dat night, N made tha sea dry land, N tha waterz were divided."},{"n":"14:22","text":"N tha children of Israel went in2 tha midst of tha sea on tha dry ground: N tha waterz were a wall 2 ’em on their right hand, N on their left."},{"n":"14:23","text":"N tha Egyptianz pursued, N went in after ’em 2 tha midst of tha sea, even all Pharaoh’s horsez, his chariotz, N his horsemen."},{"n":"14:24","text":"N it happened, dat in tha morning watch tha LORD looked 2 tha host of tha Egyptianz through tha pillar of fire N of tha cloud, N troubled tha host of tha Egyptianz,"},{"n":"14:25","text":"N took off their chariot wheelz, dat they drave ’em heavily: so dat tha Egyptianz said, Let us flee from tha face of Israel; 4 tha LORD fighteth 4 ’em against tha Egyptianz."},{"n":"14:26","text":"N tha LORD said 2 Moses, Stretch out urz hand over tha sea, dat tha waterz may come again on tha Egyptianz, on their chariotz, N on their horsemen."},{"n":"14:27","text":"N Moses stretched forth his hand over tha sea, N tha sea returned 2 his strength when tha morning appeared; N tha Egyptianz fled against it; N tha LORD overthrew tha Egyptianz in tha midst of tha sea."},{"n":"14:28","text":"N tha waterz returned, N covered tha chariotz, N tha horsemen, N all tha host of Pharaoh dat came in2 tha sea after ’em; there remained not so much as one of ’em."},{"n":"14:29","text":"But tha children of Israel walked on dry land in tha midst of tha sea; N tha waterz were a wall 2 ’em on their right hand, N on their left."},{"n":"14:30","text":"Thus tha LORD saved Israel dat day out of tha hand of tha Egyptianz; N Israel saw tha Egyptianz dead on tha sea shore."},{"n":"14:31","text":"N Israel saw dat great work which tha LORD did on tha Egyptianz: N tha people feared tha LORD, N believed tha LORD, N his servant Moses."}],"15":[{"n":"15:1","text":"Then sang Moses N tha children of Israel dis song 2 tha LORD, N spoke, saying, I will sing 2 tha LORD, 4 he has triumphed gloriously: tha horse N his rider has he thrown in2 tha sea."},{"n":"15:2","text":"Tha LORD is my strength N song, N he is become my salvation: he is my God, N I will prepare him an habitation; my father’s God, N I will exalt him."},{"n":"15:3","text":"Tha LORD is a man of war: tha LORD is his name."},{"n":"15:4","text":"Pharaoh’s chariotz N his host has he cast in2 tha sea: his chosen captains also r drowned in tha Red sea."},{"n":"15:5","text":"Tha depths have covered ’em: they sank in2 tha bottom as a stone."},{"n":"15:6","text":"Ur right hand, O LORD, is become glorious in power: ur right hand, O LORD, has dashed in pieces tha enemy."},{"n":"15:7","text":"N in tha greatness of urz excellency u have overthrown ’em dat rose up against u: u sentest forth ur wrath, which consumed ’em as stubble."},{"n":"15:8","text":"N wit tha blast of ur nostrils tha waterz were gathered together, tha floods stood upright as an heap, N tha depths were congealed in tha heart of tha sea."},{"n":"15:9","text":"Tha enemy said, I will pursue, I will overtake, I will divide tha spoil; my lust will be satisfied on ’em; I will draw my sword, my hand will destroy ’em."},{"n":"15:10","text":"U didst blow wit ur wind, tha sea covered ’em: they sank as lead in tha mighty waterz."},{"n":"15:11","text":"Who is like 2 u, O LORD, among tha godz? who is like u, glorious in holiness, fearful in praises, doing wonders?"},{"n":"15:12","text":"U stretchedst out ur right hand, tha earth swallowed ’em."},{"n":"15:13","text":"U in ur mercy have led forth tha people which u have redeemed: u have guided ’em in ur strength 2 ur holy habitation."},{"n":"15:14","text":"Tha people will hear, N be afraid: sorrow will take hold on tha inhabitants of Palestina."},{"n":"15:15","text":"Then tha dukes of Edom will be amazed; tha mighty men of Moab, trembling will take hold on ’em; all tha inhabitants of Canaan will melt away."},{"n":"15:16","text":"Fear N dread will fall on ’em; by tha greatness of urz arm they will be as still as a stone; till ur people pass over, O LORD, till tha people pass over, which u have purchased."},{"n":"15:17","text":"U will bring ’em in, N plant ’em in tha mountain of urz inheritance, in tha place, O LORD, which u have made 4 u 2 dwell in, in tha Sanctuary, O LORD, which ur handz have established."},{"n":"15:18","text":"Tha LORD will reign 4 ever N ever."},{"n":"15:19","text":"4 tha horse of Pharaoh went in wit his chariotz N wit his horsemen in2 tha sea, N tha LORD brought again tha waterz of tha sea on ’em; but tha children of Israel went on dry land in tha midst of tha sea."},{"n":"15:20","text":"N Miriam tha prophetess, tha sister of Aaron, took a timbrel in her hand; N all tha women went out after her wit timbrels N wit dances."},{"n":"15:21","text":"N Miriam answered ’em, Sing y’all 2 tha LORD, 4 he has triumphed gloriously; tha horse N his rider has he thrown in2 tha sea."},{"n":"15:22","text":"So Moses brought Israel from tha Red sea, N they went out in2 tha wilderness of Shur; N they went three dayz in tha wilderness, N found no water."},{"n":"15:23","text":"N when they came 2 Marah, they could not drink of tha waterz of Marah, 4 they were bitter: therefore tha name of it was called Marah."},{"n":"15:24","text":"N tha people murmured against Moses, saying, What will we drink?"},{"n":"15:25","text":"N he cried 2 tha LORD; N tha LORD shewed him a tree, which when he had cast in2 tha waterz, tha waterz were made sweet: there he made 4 ’em a statute N an ordinance, N there he proved ’em,"},{"n":"15:26","text":"N said, If u wilt diligently hearken 2 tha voice of tha LORD ur God, N wilt do dat which is right in his sight, N wilt give ear 2 his commandmentz, N keep all his statutes, I will put none of dese diseases on u, which I have brought on tha Egyptianz: 4 I am tha LORD dat healeth u."},{"n":"15:27","text":"N they came 2 Elim, where were twelve wells of water, N threescore N ten palm trees: N they encamped there by tha waterz."}],"16":[{"n":"16:1","text":"N they took their journey from Elim, N all tha congregation of tha children of Israel came 2 tha wilderness of Sin, which is between Elim N Sinai, on tha fifteenth day of tha second month after their departing out of tha land of Egypt."},{"n":"16:2","text":"N tha whole congregation of tha children of Israel murmured against Moses N Aaron in tha wilderness:"},{"n":"16:3","text":"N tha children of Israel said 2 ’em, Would 2 God we had died by tha hand of tha LORD in tha land of Egypt, when we sat by tha flesh pots, N when we did eat bread 2 tha full; 4 y’all have brought us forth in2 dis wilderness, 2 kill dis whole assembly wit hunger."},{"n":"16:4","text":"Then said tha LORD 2 Moses, Look, I will rain bread from heaven 4 u; N tha people will go out N gather a certain rate every day, dat I may prove ’em, whether they will walk in my law, or no."},{"n":"16:5","text":"N it will come 2 pass, dat on tha sixth day they will prepare dat which they bring in; N it will be twice as much as they gather daily."},{"n":"16:6","text":"N Moses N Aaron said 2 all tha children of Israel, At even, then y’all will know dat tha LORD has brought u out from tha land of Egypt:"},{"n":"16:7","text":"N in tha morning, then y’all will see tha glory of tha LORD; 4 dat he heareth ur murmurings against tha LORD: N what r we, dat y’all murmur against us?"},{"n":"16:8","text":"N Moses said, Dis will be, when tha LORD will give u in tha evening flesh 2 eat, N in tha morning bread 2 tha full; 4 dat tha LORD heareth ur murmurings which y’all murmur against him: N what r we? ur murmurings r not against us, but against tha LORD."},{"n":"16:9","text":"N Moses spoke 2 Aaron, Say 2 all tha congregation of tha children of Israel, Come near before tha LORD: 4 he has heard ur murmurings."},{"n":"16:10","text":"N it happened, as Aaron spoke 2 tha whole congregation of tha children of Israel, dat they looked toward tha wilderness, N, look, tha glory of tha LORD appeared in tha cloud."},{"n":"16:11","text":"N tha LORD spoke 2 Moses, saying,"},{"n":"16:12","text":"I have heard tha murmurings of tha children of Israel: speak 2 ’em, saying, At even y’all will eat flesh, N in tha morning y’all will be filled wit bread; N y’all will know dat I am tha LORD ur God."},{"n":"16:13","text":"N it happened, dat at even tha quails came up, N covered tha camp: N in tha morning tha dew lay round about tha host."},{"n":"16:14","text":"N when tha dew dat lay was gone up, look, on tha face of tha wilderness there lay a small round thing, as small as tha hoar frost on tha ground."},{"n":"16:15","text":"N when tha children of Israel saw it, they said one 2 another, It is manna: 4 they wist not what it was. N Moses said 2 ’em, Dis is tha bread which tha LORD has given u 2 eat."},{"n":"16:16","text":"Dis is tha thing which tha LORD has commanded, Gather of it every man according 2 his eating, an omer 4 every man, according 2 tha number of ur persons; take y’all every man 4 ’em which r in his tents."},{"n":"16:17","text":"N tha children of Israel did so, N gathered, some more, some less."},{"n":"16:18","text":"N when they did mete it wit an omer, he dat gathered much had nothing over, N he dat gathered little had no lack; they gathered every man according 2 his eating."},{"n":"16:19","text":"N Moses said, Let no man leave of it till tha morning."},{"n":"16:20","text":"Notwithstanding they hearkened not 2 Moses; but some of ’em left of it until tha morning, N it bred worms, N stank: N Moses was wroth wit ’em."},{"n":"16:21","text":"N they gathered it every morning, every man according 2 his eating: N when tha sun waxed hot, it melted."},{"n":"16:22","text":"N it happened, dat on tha sixth day they gathered twice as much bread, two omers 4 one man: N all tha rulers of tha congregation came N told Moses."},{"n":"16:23","text":"N he said 2 ’em, Dis is dat which tha LORD has said, 2 morrow is tha rest of tha holy sabbath 2 tha LORD: bake dat which y’all will bake 2 day, N seethe dat y’all will seethe; N dat which remaineth over lay up 4 u 2 be kept until tha morning."},{"n":"16:24","text":"N they laid it up till tha morning, as Moses bade: N it did not stink, neither was there any worm therein."},{"n":"16:25","text":"N Moses said, Eat dat 2 day; 4 2 day is a sabbath 2 tha LORD: 2 day y’all will not find it in tha field."},{"n":"16:26","text":"Six dayz y’all will gather it; but on tha seventh day, which is tha sabbath, in it there will be none."},{"n":"16:27","text":"N it happened, dat there went out some of tha people on tha seventh day 4 2 gather, N they found none."},{"n":"16:28","text":"N tha LORD said 2 Moses, How long refuse y’all 2 keep my commandmentz N my laws?"},{"n":"16:29","text":"See, 4 dat tha LORD has given u tha sabbath, therefore he giveth u on tha sixth day tha bread of two dayz; abide y’all every man in his place, let no man go out of his place on tha seventh day."},{"n":"16:30","text":"So tha people rested on tha seventh day."},{"n":"16:31","text":"N tha house of Israel called tha name thereof Manna: N it was like coriander seed, white; N tha taste of it was like wafers made wit honey."},{"n":"16:32","text":"N Moses said, Dis is tha thing which tha LORD commandeth, Fill an omer of it 2 be kept 4 ur generations; dat they may see tha bread wherewith I have fed u in tha wilderness, when I brought u forth from tha land of Egypt."},{"n":"16:33","text":"N Moses said 2 Aaron, Take a pot, N put an omer full of manna therein, N lay it up before tha LORD, 2 be kept 4 ur generations."},{"n":"16:34","text":"As tha LORD commanded Moses, so Aaron laid it up before tha Testimony, 2 be kept."},{"n":"16:35","text":"N tha children of Israel did eat manna forty yearz, until they came 2 a land inhabited; they did eat manna, until they came 2 tha borders of tha land of Canaan."},{"n":"16:36","text":"Now an omer is tha tenth part of an ephah."}],"17":[{"n":"17:1","text":"N all tha congregation of tha children of Israel journeyed from tha wilderness of Sin, after their journeys, according 2 tha commandment of tha LORD, N pitched in Rephidim: N there was no water 4 tha people 2 drink."},{"n":"17:2","text":"Wherefore tha people did chide wit Moses, N said, Give us water dat we may drink. N Moses said 2 ’em, Why chide y’all wit me? wherefore do y’all tempt tha LORD?"},{"n":"17:3","text":"N tha people thirsted there 4 water; N tha people murmured against Moses, N said, Wherefore is dis dat u have brought us up out of Egypt, 2 kill us N our children N our cattle wit thirst?"},{"n":"17:4","text":"N Moses cried 2 tha LORD, saying, What will I do 2 dis people? they be almost ready 2 stone me."},{"n":"17:5","text":"N tha LORD said 2 Moses, Go on before tha people, N take wit u of tha elders of Israel; N ur rod, wherewith u smotest tha river, take in urz hand, N go."},{"n":"17:6","text":"Look, I will stand before u there on tha rock in Horeb; N u will smite tha rock, N there will come water out of it, dat tha people may drink. N Moses did so in tha sight of tha elders of Israel."},{"n":"17:7","text":"N he called tha name of tha place Massah, N Meribah, because of tha chiding of tha children of Israel, N because they tempted tha LORD, saying, Is tha LORD among us, or not?"},{"n":"17:8","text":"Then came Amalek, N fought wit Israel in Rephidim."},{"n":"17:9","text":"N Moses said 2 Joshua, Choose us out men, N go out, fight wit Amalek: 2 morrow I will stand on tha top of tha hill wit tha rod of God in mine hand."},{"n":"17:10","text":"So Joshua did as Moses had said 2 him, N fought wit Amalek: N Moses, Aaron, N Hur went up 2 tha top of tha hill."},{"n":"17:11","text":"N it happened, when Moses held up his hand, dat Israel prevailed: N when he let down his hand, Amalek prevailed."},{"n":"17:12","text":"But Moses’ handz were heavy; N they took a stone, N put it under him, N he sat thereon; N Aaron N Hur stayed up his handz, tha one on tha one side, N tha other on tha other side; N his handz were steady until tha going down of tha sun."},{"n":"17:13","text":"N Joshua discomfited Amalek N his people wit tha edge of tha sword."},{"n":"17:14","text":"N tha LORD said 2 Moses, Write dis 4 a memorial in a book, N rehearse it in tha earz of Joshua: 4 I will utterly put out tha remembrance of Amalek from under heaven."},{"n":"17:15","text":"N Moses built an altar, N called tha name of it Jehovahnissi:"},{"n":"17:16","text":"4 he said, Because tha LORD has sworn dat tha LORD will have war wit Amalek from generation 2 generation."}],"18":[{"n":"18:1","text":"When Jethro, tha priest of Midian, Moses’ father in law, heard of all dat God had done 4 Moses, N 4 Israel his people, N dat tha LORD had brought Israel out of Egypt;"},{"n":"18:2","text":"Then Jethro, Moses’ father in law, took Zipporah, Moses’ wife, after he had sent her back,"},{"n":"18:3","text":"N her two sonz; of which tha name of tha one was Gershom; 4 he said, I have been an alien in a strange land:"},{"n":"18:4","text":"N tha name of tha other was Eliezer; 4 tha God of my father, said he, was mine help, N delivered me from tha sword of Pharaoh:"},{"n":"18:5","text":"N Jethro, Moses’ father in law, came wit his sonz N his wife 2 Moses in2 tha wilderness, where he encamped at tha mount of God:"},{"n":"18:6","text":"N he said 2 Moses, I ur father in law Jethro am come 2 u, N ur wife, N her two sonz wit her."},{"n":"18:7","text":"N Moses went out 2 meet his father in law, N did obeisance, N kissed him; N they asked each other of their welfare; N they came in2 tha tent."},{"n":"18:8","text":"N Moses told his father in law all dat tha LORD had done 2 Pharaoh N 2 tha Egyptianz 4 Israel’s sake, N all tha travail dat had come on ’em by tha way, N how tha LORD delivered ’em."},{"n":"18:9","text":"N Jethro rejoiced 4 all tha goodness which tha LORD had done 2 Israel, whom he had delivered out of tha hand of tha Egyptianz."},{"n":"18:10","text":"N Jethro said, Blessed be tha LORD, who has delivered u out of tha hand of tha Egyptianz, N out of tha hand of Pharaoh, who has delivered tha people from under tha hand of tha Egyptianz."},{"n":"18:11","text":"Now I know dat tha LORD is greater than all godz: 4 in tha thing wherein they dealt proudly he was above ’em."},{"n":"18:12","text":"N Jethro, Moses’ father in law, took a burnt offering N sacrifices 4 God: N Aaron came, N all tha elders of Israel, 2 eat bread wit Moses’ father in law before God."},{"n":"18:13","text":"N it happened on tha morrow, dat Moses sat 2 judge tha people: N tha people stood by Moses from tha morning 2 tha evening."},{"n":"18:14","text":"N when Moses’ father in law saw all dat he did 2 tha people, he said, What is dis thing dat u doest 2 tha people? why sittest u thyself alone, N all tha people stand by u from morning 2 even?"},{"n":"18:15","text":"N Moses said 2 his father in law, Because tha people come 2 me 2 enquire of God:"},{"n":"18:16","text":"When they have a matter, they come 2 me; N I judge between one N another, N I do make ’em know tha statutes of God, N his laws."},{"n":"18:17","text":"N Moses’ father in law said 2 him, Tha thing dat u doest is not good."},{"n":"18:18","text":"U wilt surely wear away, both u, N dis people dat is wit u: 4 dis thing is too heavy 4 u; u r not able 2 perform it thyself alone."},{"n":"18:19","text":"Hearken now 2 my voice, I will give u counsel, N God will be wit u: Be u 4 tha people 2 God-ward, dat u mayest bring tha causes 2 God:"},{"n":"18:20","text":"N u will teach ’em ordinances N laws, N will shew ’em tha way wherein they must walk, N tha work dat they must do."},{"n":"18:21","text":"Moreover u will provide out of all tha people able men, such as fear God, men of truth, hating covetousness; N place such over ’em, 2 be rulers of thousands, N rulers of hundreds, rulers of fifties, N rulers of tens:"},{"n":"18:22","text":"N let ’em judge tha people at all seasons: N it will be, dat every great matter they will bring 2 u, but every small matter they will judge: so will it be easier 4 thyself, N they will bear tha burden wit u."},{"n":"18:23","text":"If u will do dis thing, N God command u so, then u will be able 2 endure, N all dis people will also go 2 their place in peace."},{"n":"18:24","text":"So Moses hearkened 2 tha voice of his father in law, N did all dat he had said."},{"n":"18:25","text":"N Moses chose able men out of all Israel, N made ’em heads over tha people, rulers of thousands, rulers of hundreds, rulers of fifties, N rulers of tens."},{"n":"18:26","text":"N they judged tha people at all seasons: tha hard causes they brought 2 Moses, but every small matter they judged themselves."},{"n":"18:27","text":"N Moses let his father in law depart; N he went his way in2 his own land."}],"19":[{"n":"19:1","text":"In tha third month, when tha children of Israel were gone forth out of tha land of Egypt, tha same day came they in2 tha wilderness of Sinai."},{"n":"19:2","text":"4 they were departed from Rephidim, N were come 2 tha desert of Sinai, N had pitched in tha wilderness; N there Israel camped before tha mount."},{"n":"19:3","text":"N Moses went up 2 God, N tha LORD called 2 him out of tha mountain, saying, Thus will u say 2 tha house of Jacob, N tell tha children of Israel;"},{"n":"19:4","text":"Y’all have seen what I did 2 tha Egyptianz, N how I bare u on eagles’ wings, N brought u 2 myself."},{"n":"19:5","text":"Now therefore, if y’all will obey my voice indeed, N keep my covenant, then y’all will be a peculiar treasure 2 me above all people: 4 all tha earth is mine:"},{"n":"19:6","text":"N y’all will be 2 me a kingdom of priestz, N an holy nation. Dese r tha wordz which u will speak 2 tha children of Israel."},{"n":"19:7","text":"N Moses came N called 4 tha elders of tha people, N laid before their faces all dese wordz which tha LORD commanded him."},{"n":"19:8","text":"N all tha people answered together, N said, All dat tha LORD has spoken we will do. N Moses returned tha wordz of tha people 2 tha LORD."},{"n":"19:9","text":"N tha LORD said 2 Moses, Lo, I come 2 u in a thick cloud, dat tha people may hear when I speak wit u, N believe u 4 ever. N Moses told tha wordz of tha people 2 tha LORD."},{"n":"19:10","text":"N tha LORD said 2 Moses, Go 2 tha people, N sanctify ’em 2 day N 2 morrow, N let ’em wash their clothes,"},{"n":"19:11","text":"N be ready against tha third day: 4 tha third day tha LORD will come down in tha sight of all tha people on mount Sinai."},{"n":"19:12","text":"N u will set bounds 2 tha people round about, saying, Take heed 2 yourselves, dat y’all go not up in2 tha mount, or touch tha border of it: whosoever toucheth tha mount will be surely put 2 death:"},{"n":"19:13","text":"There will not an hand touch it, but he will surely be stoned, or shot through; whether it be beast or man, it will not live: when tha trumpet soundeth long, they will come up 2 tha mount."},{"n":"19:14","text":"N Moses went down from tha mount 2 tha people, N sanctified tha people; N they washed their clothes."},{"n":"19:15","text":"N he said 2 tha people, Be ready against tha third day: come not at ur wivez."},{"n":"19:16","text":"N it happened on tha third day in tha morning, dat there were thunders N lightnings, N a thick cloud on tha mount, N tha voice of tha trumpet exceeding loud; so dat all tha people dat was in tha camp trembled."},{"n":"19:17","text":"N Moses brought forth tha people out of tha camp 2 meet wit God; N they stood at tha nether part of tha mount."},{"n":"19:18","text":"N mount Sinai was altogether on a smoke, because tha LORD descended on it in fire: N tha smoke thereof ascended as tha smoke of a furnace, N tha whole mount quaked greatly."},{"n":"19:19","text":"N when tha voice of tha trumpet sounded long, N waxed louder N louder, Moses spoke, N God answered him by a voice."},{"n":"19:20","text":"N tha LORD came down on mount Sinai, on tha top of tha mount: N tha LORD called Moses up 2 tha top of tha mount; N Moses went up."},{"n":"19:21","text":"N tha LORD said 2 Moses, Go down, charge tha people, lest they break through 2 tha LORD 2 gaze, N many of ’em perish."},{"n":"19:22","text":"N let tha priestz also, which come near 2 tha LORD, sanctify themselves, lest tha LORD break forth on ’em."},{"n":"19:23","text":"N Moses said 2 tha LORD, Tha people cannot come up 2 mount Sinai: 4 u chargedst us, saying, Set bounds about tha mount, N sanctify it."},{"n":"19:24","text":"N tha LORD said 2 him, Away, get u down, N u will come up, u, N Aaron wit u: but let not tha priestz N tha people break through 2 come up 2 tha LORD, lest he break forth on ’em."},{"n":"19:25","text":"So Moses went down 2 tha people, N spoke 2 ’em."}],"20":[{"n":"20:1","text":"N God spoke all dese wordz, saying,"},{"n":"20:2","text":"I am tha LORD ur God, which have brought u out of tha land of Egypt, out of tha house of bondage."},{"n":"20:3","text":"U will have no other godz before me."},{"n":"20:4","text":"U will not make 2 u any graven image, or any likeness of any thing dat is in heaven above, or dat is in tha earth beneath, or dat is in tha water under tha earth:"},{"n":"20:5","text":"U will not bow down thyself 2 ’em, nor serve ’em: 4 I tha LORD ur God am a jealous God, visiting tha iniquity of tha fatherz on tha children 2 tha third N fourth generation of ’em dat hate me;"},{"n":"20:6","text":"N shewing mercy 2 thousands of ’em dat love me, N keep my commandmentz."},{"n":"20:7","text":"U will not take tha name of tha LORD ur God in vain; 4 tha LORD will not hold him guiltless dat taketh his name in vain."},{"n":"20:8","text":"Remember tha sabbath day, 2 keep it holy."},{"n":"20:9","text":"Six dayz will u labour, N do all ur work:"},{"n":"20:10","text":"But tha seventh day is tha sabbath of tha LORD ur God: in it u will not do any work, u, nor ur son, nor ur daughter, ur manservant, nor ur maidservant, nor ur cattle, nor ur stranger dat is within ur gates:"},{"n":"20:11","text":"4 in six dayz tha LORD made heaven N earth, tha sea, N all dat in ’em is, N rested tha seventh day: wherefore tha LORD blessed tha sabbath day, N hallowed it."},{"n":"20:12","text":"Honour ur father N ur mother: dat ur dayz may be long on tha land which tha LORD ur God giveth u."},{"n":"20:13","text":"U will not kill."},{"n":"20:14","text":"U will not commit adultery."},{"n":"20:15","text":"U will not steal."},{"n":"20:16","text":"U will not bear false witness against ur neighbour."},{"n":"20:17","text":"U will not covet ur neighbour’s house, u will not covet ur neighbour’s wife, nor his manservant, nor his maidservant, nor his ox, nor his ass, nor any thing dat is ur neighbour’s."},{"n":"20:18","text":"N all tha people saw tha thunderings, N tha lightnings, N tha noise of tha trumpet, N tha mountain smoking: N when tha people saw it, they removed, N stood afar off."},{"n":"20:19","text":"N they said 2 Moses, Speak u wit us, N we will hear: but let not God speak wit us, lest we die."},{"n":"20:20","text":"N Moses said 2 tha people, Fear not: 4 God is come 2 prove u, N dat his fear may be before ur faces, dat y’all sin not."},{"n":"20:21","text":"N tha people stood afar off, N Moses drew near 2 tha thick darkness where God was."},{"n":"20:22","text":"N tha LORD said 2 Moses, Thus u will say 2 tha children of Israel, Y’all have seen dat I have talked wit u from heaven."},{"n":"20:23","text":"Y’all will not make wit me godz of silver, neither will y’all make 2 u godz of gold."},{"n":"20:24","text":"An altar of earth u will make 2 me, N will sacrifice thereon ur burnt offeringz, N ur peace offeringz, ur sheep, N urz oxen: in all places where I record my name I will come 2 u, N I will bless u."},{"n":"20:25","text":"N if u wilt make me an altar of stone, u will not build it of hewn stone: 4 if u lift up ur tool on it, u have polluted it."},{"n":"20:26","text":"Neither will u go up by steps 2 mine altar, dat ur nakedness be not discovered thereon."}],"21":[{"n":"21:1","text":"Now dese r tha judgments which u will set before ’em."},{"n":"21:2","text":"If u buy an Hebrew servant, six yearz he will serve: N in tha seventh he will go out free 4 nothing."},{"n":"21:3","text":"If he came in by himself, he will go out by himself: if he were married, then his wife will go out wit him."},{"n":"21:4","text":"If his master have given him a wife, N she have born him sonz or daughterz; tha wife N her children will be her master’s, N he will go out by himself."},{"n":"21:5","text":"N if tha servant will plainly say, I love my master, my wife, N my children; I will not go out free:"},{"n":"21:6","text":"Then his master will bring him 2 tha judges; he will also bring him 2 tha door, or 2 tha door post; N his master will bore his ear through wit an aul; N he will serve him 4 ever."},{"n":"21:7","text":"N if a man sell his daughter 2 be a maidservant, she will not go out as tha menservants do."},{"n":"21:8","text":"If she please not her master, who has betrothed her 2 himself, then will he let her be redeemed: 2 sell her 2 a strange nation he will have no power, seeing he has dealt deceitfully wit her."},{"n":"21:9","text":"N if he have betrothed her 2 his son, he will deal wit her after tha manner of daughterz."},{"n":"21:10","text":"If he take him another wife; her food, her raiment, N her duty of marriage, will he not diminish."},{"n":"21:11","text":"N if he do not dese three 2 her, then will she go out free without money."},{"n":"21:12","text":"He dat smiteth a man, so dat he die, will be surely put 2 death."},{"n":"21:13","text":"N if a man lie not in wait, but God deliver him in2 his hand; then I will appoint u a place whither he will flee."},{"n":"21:14","text":"But if a man come presumptuously on his neighbour, 2 slay him wit guile; u will take him from mine altar, dat he may die."},{"n":"21:15","text":"N he dat smiteth his father, or his mother, will be surely put 2 death."},{"n":"21:16","text":"N he dat stealeth a man, N selleth him, or if he be found in his hand, he will surely be put 2 death."},{"n":"21:17","text":"N he dat curseth his father, or his mother, will surely be put 2 death."},{"n":"21:18","text":"N if men strive together, N one smite another wit a stone, or wit his fist, N he die not, but keepeth his bed:"},{"n":"21:19","text":"If he rise again, N walk abroad on his staff, then will he dat smote him be quit: only he will pay 4 tha loss of his time, N will cause him 2 be thoroughly healed."},{"n":"21:20","text":"N if a man smite his servant, or his maid, wit a rod, N he die under his hand; he will be surely punished."},{"n":"21:21","text":"Notwithstanding, if he continue a day or two, he will not be punished: 4 he is his money."},{"n":"21:22","text":"If men strive, N hurt a woman wit child, so dat her fruit depart from her, N yet no mischief follow: he will be surely punished, according as tha woman’s husband will lay on him; N he will pay as tha judges determine."},{"n":"21:23","text":"N if any mischief follow, then u will give life 4 life,"},{"n":"21:24","text":"Eye 4 eye, tooth 4 tooth, hand 4 hand, foot 4 foot,"},{"n":"21:25","text":"Burning 4 burning, wound 4 wound, stripe 4 stripe."},{"n":"21:26","text":"N if a man smite tha eye of his servant, or tha eye of his maid, dat it perish; he will let him go free 4 his eye’s sake."},{"n":"21:27","text":"N if he smite out his manservant’s tooth, or his maidservant’s tooth; he will let him go free 4 his tooth’s sake."},{"n":"21:28","text":"If an ox gore a man or a woman, dat they die: then tha ox will be surely stoned, N his flesh will not be eaten; but tha owner of tha ox will be quit."},{"n":"21:29","text":"But if tha ox were wont 2 push wit his horn in time past, N it has been testified 2 his owner, N he has not kept him in, but dat he has killed a man or a woman; tha ox will be stoned, N his owner also will be put 2 death."},{"n":"21:30","text":"If there be laid on him a sum of money, then he will give 4 tha ransom of his life whatsoever is laid on him."},{"n":"21:31","text":"Whether he have gored a son, or have gored a daughter, according 2 dis judgment will it be done 2 him."},{"n":"21:32","text":"If tha ox will push a manservant or a maidservant; he will give 2 their master thirty shekels of silver, N tha ox will be stoned."},{"n":"21:33","text":"N if a man will open a pit, or if a man will dig a pit, N not cover it, N an ox or an ass fall therein;"},{"n":"21:34","text":"Tha owner of tha pit will make it good, N give money 2 tha owner of ’em; N tha dead beast will be his."},{"n":"21:35","text":"N if one man’s ox hurt another’s, dat he die; then they will sell tha live ox, N divide tha money of it; N tha dead ox also they will divide."},{"n":"21:36","text":"Or if it be known dat tha ox has used 2 push in time past, N his owner has not kept him in; he will surely pay ox 4 ox; N tha dead will be his own."}],"22":[{"n":"22:1","text":"If a man will steal an ox, or a sheep, N kill it, or sell it; he will restore five oxen 4 an ox, N four sheep 4 a sheep."},{"n":"22:2","text":"If a thief be found breaking up, N be smitten dat he die, there will no blood be shed 4 him."},{"n":"22:3","text":"If tha sun be risen on him, there will be blood shed 4 him; 4 he should make full re
