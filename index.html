  &lt;script type=&quot;application/json&quot; id=&quot;eota-test-data&quot;&gt;{&quot;1&quot;: [{&quot;n&quot;: &quot;1:1&quot;, &quot;text&quot;: &quot;Before anything had a name, God made tha heavenz N tha earth. Whole creation started wit him.&quot;}, {&quot;n&quot;: &quot;1:2&quot;, &quot;text&quot;: &quot;Earth had no shape, nothing filled tha space. Darkness over tha deep, but God’s Spirit was swaggin over tha waterz.&quot;}, {&quot;n&quot;: &quot;1:3&quot;, &quot;text&quot;: &quot;God said, “Let there b light.” He spoke it; light showed up.&quot;}, {&quot;n&quot;: &quot;1:4&quot;, &quot;text&quot;: &quot;God peeped tha light was good N separated it from tha darkness. Each had its place.&quot;}, {&quot;n&quot;: &quot;1:5&quot;, &quot;text&quot;: &quot;He named tha light Day N tha darkness Night. Evening, then morning—day 1.&quot;}, {&quot;n&quot;: &quot;1:6&quot;, &quot;text&quot;: &quot;God said, “Put an expanse between tha waterz. Give tha waterz a dividing line.”&quot;}, {&quot;n&quot;: &quot;1:7&quot;, &quot;text&quot;: &quot;He made tha expanse, separating tha waterz below from tha waterz above. Exactly how he called it.&quot;}, {&quot;n&quot;: &quot;1:8&quot;, &quot;text&quot;: &quot;God named tha expanse Heaven. Evening, then morning—day 2.&quot;}, {&quot;n&quot;: &quot;1:9&quot;, &quot;text&quot;: &quot;God said, “Waterz under heaven, gather in 1 place. Let dry ground show itself.” N it happened.&quot;}, {&quot;n&quot;: &quot;1:10&quot;, &quot;text&quot;: &quot;Dry ground got tha name Earth; tha gathered waterz, Seaz. God peeped it was good.&quot;}, {&quot;n&quot;: &quot;1:11&quot;, &quot;text&quot;: &quot;God said, “Earth, bring up grass, seed-bearing plantz, N fruit treez wit seed inside their fruit. Each growin according 2 its kind.” N it happened.&quot;}, {&quot;n&quot;: &quot;1:12&quot;, &quot;text&quot;: &quot;Ground brought out grass, plantz carrying seed, N treez carrying fruit wit seed inside—each according 2 its kind. God peeped it was good.&quot;}, {&quot;n&quot;: &quot;1:13&quot;, &quot;text&quot;: &quot;Evening, then morning—day 3.&quot;}, {&quot;n&quot;: &quot;1:14&quot;, &quot;text&quot;: &quot;God said, “Let lightz fill heaven’s expanse, separating day from night. Let ’em mark signs, seasons, dayz, N yearz.”&quot;}, {&quot;n&quot;: &quot;1:15&quot;, &quot;text&quot;: &quot;“Let ’em shine above N put light on tha earth.” N it happened.&quot;}, {&quot;n&quot;: &quot;1:16&quot;, &quot;text&quot;: &quot;God made 2 gr8 lightz: tha greater 2 rule tha day, tha lesser 2 rule tha night. Tha starz were his work too.&quot;}, {&quot;n&quot;: &quot;1:17&quot;, &quot;text&quot;: &quot;He set ’em in heaven’s expanse 2 light tha earth,&quot;}, {&quot;n&quot;: &quot;1:18&quot;, &quot;text&quot;: &quot;2 govern day N night N separate light from darkness. God peeped it was good.&quot;}, {&quot;n&quot;: &quot;1:19&quot;, &quot;text&quot;: &quot;Evening, then morning—day 4.&quot;}, {&quot;n&quot;: &quot;1:20&quot;, &quot;text&quot;: &quot;God said, “Let tha waterz swarm wit living creaturez. Let birdz fly over tha earth across heaven’s open expanse.”&quot;}, {&quot;n&quot;: &quot;1:21&quot;, &quot;text&quot;: &quot;God created tha gr8 sea creaturez N every living thing movin through tha waterz, each according 2 its kind. Every winged bird too. He peeped it was good.&quot;}, {&quot;n&quot;: &quot;1:22&quot;, &quot;text&quot;: &quot;God blessed ’em: “B fruitful, multiply, fill tha seaz. Birdz, multiply across tha earth.”&quot;}, {&quot;n&quot;: &quot;1:23&quot;, &quot;text&quot;: &quot;Evening, then morning—day 5.&quot;}, {&quot;n&quot;: &quot;1:24&quot;, &quot;text&quot;: &quot;God said, “Earth, bring out living creaturez: livestock, crawlin thingz, wild animalz—each according 2 its kind.” N it happened.&quot;}, {&quot;n&quot;: &quot;1:25&quot;, &quot;text&quot;: &quot;God made wild animalz, livestock, N everything crawlin on tha ground according 2 their kindz. He peeped it was good.&quot;}, {&quot;n&quot;: &quot;1:26&quot;, &quot;text&quot;: &quot;God said, “Let us make humankind in our image, after our likeness. Let ’em rule over tha fish, birdz, livestock, all tha earth, N everything crawlin across it.”&quot;}, {&quot;n&quot;: &quot;1:27&quot;, &quot;text&quot;: &quot;God created humankind in his own image. His image stamped on humanity—male N female, he created ’em.&quot;}, {&quot;n&quot;: &quot;1:28&quot;, &quot;text&quot;: &quot;God blessed ’em: “B fruitful. Multiply. Fill tha earth N bring it under ur care N authority. Rule over tha fish, birdz, N every living thing movin here.”&quot;}, {&quot;n&quot;: &quot;1:29&quot;, &quot;text&quot;: &quot;God said, “I’m givin y’all every seed-bearing plant on earth N every tree wit seed-bearing fruit. Dat’s ur food.”&quot;}, {&quot;n&quot;: &quot;1:30&quot;, &quot;text&quot;: &quot;“Every wild animal, bird, N crawlin creature wit tha breath of life gets green plantz 4 food.” N dat’s how it was.&quot;}, {&quot;n&quot;: &quot;1:31&quot;, &quot;text&quot;: &quot;God looked over everything he’d made. All of it—very good. Evening, then morning—day 6.&quot;}], &quot;2&quot;: [{&quot;n&quot;: &quot;2:1&quot;, &quot;text&quot;: &quot;Tha heavenz, tha earth, N everything in ’em were finished. Creation complete.&quot;}, {&quot;n&quot;: &quot;2:2&quot;, &quot;text&quot;: &quot;By tha 7th day, God had finished his work. On dat day, he rested from all he’d done.&quot;}, {&quot;n&quot;: &quot;2:3&quot;, &quot;text&quot;: &quot;He blessed tha 7th day N made it holy, cuz dat was when he rested from all his creating work.&quot;}, {&quot;n&quot;: &quot;2:4&quot;, &quot;text&quot;: &quot;Dis is tha account of tha heavenz N earth when dey were created, when tha LORD God made earth N heaven.&quot;}, {&quot;n&quot;: &quot;2:5&quot;, &quot;text&quot;: &quot;Field plantz hadn’t sprouted; field herbs hadn’t grown. Tha LORD God hadn’t sent rain, N nobody was there 2 work tha soil.&quot;}, {&quot;n&quot;: &quot;2:6&quot;, &quot;text&quot;: &quot;But mist rose from tha earth N watered tha whole surface of tha ground.&quot;}, {&quot;n&quot;: &quot;2:7&quot;, &quot;text&quot;: &quot;Tha LORD God formed tha man from ground dust, then breathed life into his nostrilz. Dust got breath; tha man became a living soul.&quot;}, {&quot;n&quot;: &quot;2:8&quot;, &quot;text&quot;: &quot;Tha LORD God planted a garden eastward in Eden N placed tha man he’d formed right there.&quot;}, {&quot;n&quot;: &quot;2:9&quot;, &quot;text&quot;: &quot;He made treez rise from tha ground—beautiful 2 see, good 4 food. In tha middle stood tha tree of life N tha tree of tha knowledge of good N evil.&quot;}, {&quot;n&quot;: &quot;2:10&quot;, &quot;text&quot;: &quot;A river flowed from Eden, watering tha garden. From there, it divided in2 4 branchez.&quot;}, {&quot;n&quot;: &quot;2:11&quot;, &quot;text&quot;: &quot;Tha 1st was Pison, flowin around tha whole land of Havilah, where tha gold was.&quot;}, {&quot;n&quot;: &quot;2:12&quot;, &quot;text&quot;: &quot;Dat land’s gold was good. Bdellium N onyx were there too.&quot;}, {&quot;n&quot;: &quot;2:13&quot;, &quot;text&quot;: &quot;Tha 2nd river was Gihon, flowin around tha whole land of Ethiopia.&quot;}, {&quot;n&quot;: &quot;2:14&quot;, &quot;text&quot;: &quot;Tha 3rd, Hiddekel, flowed east of Assyria. Tha 4th was Euphrates.&quot;}, {&quot;n&quot;: &quot;2:15&quot;, &quot;text&quot;: &quot;Tha LORD God put tha man in Eden’s garden 2 work it N keep it. A place 2 live, a responsibility 2 carry.&quot;}, {&quot;n&quot;: &quot;2:16&quot;, &quot;text&quot;: &quot;He commanded tha man, “U can freely eat from every tree in tha garden,&quot;}, {&quot;n&quot;: &quot;2:17&quot;, &quot;text&quot;: &quot;except tha tree of tha knowledge of good N evil. Don’t eat from dat 1. Tha day u do, u will surely die.”&quot;}, {&quot;n&quot;: &quot;2:18&quot;, &quot;text&quot;: &quot;Tha LORD God said, “It ain’t good 4 tha man 2 b alone. I’ll make him a helper suited 2 him.”&quot;}, {&quot;n&quot;: &quot;2:19&quot;, &quot;text&quot;: &quot;God formed tha wild animalz N birdz from tha ground N brought ’em 2 Adam 2 see what he’d call ’em. Whatever he called each living creature became its name.&quot;}, {&quot;n&quot;: &quot;2:20&quot;, &quot;text&quot;: &quot;Adam named tha livestock, birdz, N wild animalz. Namez all around, but no helper suited 2 him was found.&quot;}, {&quot;n&quot;: &quot;2:21&quot;, &quot;text&quot;: &quot;Tha LORD God put Adam into a deep sleep, took 1 of his ribz, N closed tha flesh back over.&quot;}, {&quot;n&quot;: &quot;2:22&quot;, &quot;text&quot;: &quot;From tha rib he’d taken, God made a woman N brought her 2 tha man.&quot;}, {&quot;n&quot;: &quot;2:23&quot;, &quot;text&quot;: &quot;Adam said, “Dis right here is bone of my bonez, flesh of my flesh. She’ll b called Woman, cuz she was taken outta Man.”&quot;}, {&quot;n&quot;: &quot;2:24&quot;, &quot;text&quot;: &quot;Dat’s why a man leavez his father N mother, joins himself 2 his wife, N tha 2 become 1 flesh.&quot;}, {&quot;n&quot;: &quot;2:25&quot;, &quot;text&quot;: &quot;Tha man N his wife were both naked. No shame between ’em.&quot;}], &quot;3&quot;: [{&quot;n&quot;: &quot;3:1&quot;, &quot;text&quot;: &quot;Tha serpent was slicker than any wild animal tha LORD God had made. It asked tha woman, “Did God really say y’all can’t eat from any tree in tha garden?”&quot;}, {&quot;n&quot;: &quot;3:2&quot;, &quot;text&quot;: &quot;She said, “We can eat tha fruit from tha garden’s treez.&quot;}, {&quot;n&quot;: &quot;3:3&quot;, &quot;text&quot;: &quot;But tha fruit from tha tree in tha middle? God said, ‘Don’t eat it. Don’t touch it, or y’all will die.’”&quot;}, {&quot;n&quot;: &quot;3:4&quot;, &quot;text&quot;: &quot;Tha serpent told her, “Y’all ain’t surely gonna die.&quot;}, {&quot;n&quot;: &quot;3:5&quot;, &quot;text&quot;: &quot;God knows when y’all eat it, ur eyez will open. Y’all will b like gods, knowin good N evil.”&quot;}, {&quot;n&quot;: &quot;3:6&quot;, &quot;text&quot;: &quot;She saw food worth eatin, something good 2 look at, something promising wisdom. She took tha fruit N ate. Gave some 2 her husband there wit her; he ate too.&quot;}, {&quot;n&quot;: &quot;3:7&quot;, &quot;text&quot;: &quot;Both deir eyez opened. Dey realized dey were naked N stitched fig leavez into coveringz.&quot;}, {&quot;n&quot;: &quot;3:8&quot;, &quot;text&quot;: &quot;Dey heard tha LORD God movin through tha garden in tha cool of tha day. Adam N his wife hid among tha treez, away from his presence.&quot;}, {&quot;n&quot;: &quot;3:9&quot;, &quot;text&quot;: &quot;Tha LORD God called 2 Adam: “Where u at?”&quot;}, {&quot;n&quot;: &quot;3:10&quot;, &quot;text&quot;: &quot;Adam answered, “I heard u in tha garden. I was naked and got shook, so I hid.”&quot;}, {&quot;n&quot;: &quot;3:11&quot;, &quot;text&quot;: &quot;God said, “Who told u dat u were naked? Did u eat from tha tree I commanded u 2 leave alone?”&quot;}, {&quot;n&quot;: &quot;3:12&quot;, &quot;text&quot;: &quot;Tha man said, “Tha woman u put here wit me gave me tha fruit. I ate it.”&quot;}, {&quot;n&quot;: &quot;3:13&quot;, &quot;text&quot;: &quot;Tha LORD God asked tha woman, “What have u done?” She said, “Tha serpent deceived me. I ate.”&quot;}, {&quot;n&quot;: &quot;3:14&quot;, &quot;text&quot;: &quot;God told tha serpent, “Cuz u did dis, u’re cursed above tha livestock N wild animalz. On ur belly u’ll move; dust u’ll eat all ur dayz.&quot;}, {&quot;n&quot;: &quot;3:15&quot;, &quot;text&quot;: &quot;I’ll put hostility between u N tha woman, between ur offspring N hers. Her offspring will bruise ur head; u’ll bruise his heel.”&quot;}, {&quot;n&quot;: &quot;3:16&quot;, &quot;text&quot;: &quot;He told tha woman, “I’ll greatly multiply ur pain in childbearing. In pain u’ll bring forth children. Ur desire will b 4 ur husband, N he’ll rule over u.”&quot;}, {&quot;n&quot;: &quot;3:17&quot;, &quot;text&quot;: &quot;He told Adam, “U listened 2 ur wife N ate from tha tree I commanded u not 2 eat from. Now tha ground is cursed because of u. U’ll struggle 2 eat from it all ur dayz.&quot;}, {&quot;n&quot;: &quot;3:18&quot;, &quot;text&quot;: &quot;It’ll grow thornz N thistlez 4 u. U’ll eat tha plantz of tha field.&quot;}, {&quot;n&quot;: &quot;3:19&quot;, &quot;text&quot;: &quot;Bread will come by tha sweat of ur face until u return 2 tha ground. U came from dust; back 2 dust u’ll go.”&quot;}, {&quot;n&quot;: &quot;3:20&quot;, &quot;text&quot;: &quot;Adam named his wife Eve, cuz she was tha mother of all living.&quot;}, {&quot;n&quot;: &quot;3:21&quot;, &quot;text&quot;: &quot;Tha LORD God made garmentz from skinz 4 Adam N his wife N clothed ’em.&quot;}, {&quot;n&quot;: &quot;3:22&quot;, &quot;text&quot;: &quot;God said, “Tha man has become like 1 of us, knowin good N evil. He must not reach out, eat from tha tree of life too, N live forever.”&quot;}, {&quot;n&quot;: &quot;3:23&quot;, &quot;text&quot;: &quot;So tha LORD God sent him outta Eden’s garden 2 work tha ground he’d been taken from.&quot;}, {&quot;n&quot;: &quot;3:24&quot;, &quot;text&quot;: &quot;He drove tha man out N stationed cherubim east of Eden, wit a flaming sword turnin every way, guarding tha path 2 tha tree of life.&quot;}], &quot;4&quot;: [{&quot;n&quot;: &quot;4:1&quot;, &quot;text&quot;: &quot;Adam slept wit Eve, his wife. She conceived N gave birth 2 Cain, saying, “Wit tha LORD’s help, I’ve brought forth a man.”&quot;}, {&quot;n&quot;: &quot;4:2&quot;, &quot;text&quot;: &quot;She gave birth 2 his brother Abel too. Abel kept sheep; Cain worked tha soil.&quot;}, {&quot;n&quot;: &quot;4:3&quot;, &quot;text&quot;: &quot;Time passed. Cain brought tha LORD an offering from tha cropz he’d grown.&quot;}, {&quot;n&quot;: &quot;4:4&quot;, &quot;text&quot;: &quot;Abel brought tha firstborn of his flock N deir fat portionz. Tha LORD looked favorably on Abel N his offering.&quot;}, {&quot;n&quot;: &quot;4:5&quot;, &quot;text&quot;: &quot;Cain N his offering didn’t receive dat favor. Cain got heated, N his face told tha story.&quot;}, {&quot;n&quot;: &quot;4:6&quot;, &quot;text&quot;: &quot;Tha LORD asked, “Why u so angry? Why ur face fallen like dat?&quot;}, {&quot;n&quot;: &quot;4:7&quot;, &quot;text&quot;: &quot;If u do right, won’t u b accepted? But if u don’t, sin is crouchin at ur door. It wants control of u; u gotta rule over it.”&quot;}, {&quot;n&quot;: &quot;4:8&quot;, &quot;text&quot;: &quot;Cain talked wit Abel. Out in tha field, Cain rose against his own brother N killed him.&quot;}, {&quot;n&quot;: &quot;4:9&quot;, &quot;text&quot;: &quot;Tha LORD asked Cain, “Where’s Abel, ur brother?” He said, “I don’t know. Am I supposed 2 b my brother’s keeper?”&quot;}, {&quot;n&quot;: &quot;4:10&quot;, &quot;text&quot;: &quot;God said, “What have u done? Ur brother’s blood has a voice—it’s cryin 2 me from tha ground.&quot;}, {&quot;n&quot;: &quot;4:11&quot;, &quot;text&quot;: &quot;Now u’re cursed from tha ground dat opened its mouth 2 receive ur brother’s blood from ur hand.&quot;}, {&quot;n&quot;: &quot;4:12&quot;, &quot;text&quot;: &quot;Work dat soil; it won’t give u its strength anymore. U’ll b a fugitive N wanderer on tha earth.”&quot;}, {&quot;n&quot;: &quot;4:13&quot;, &quot;text&quot;: &quot;Cain said, “Dis punishment is more than I can bear.&quot;}, {&quot;n&quot;: &quot;4:14&quot;, &quot;text&quot;: &quot;Today u’re drivin me off tha land N away from ur presence. I’ll wander as a fugitive. Anybody who finds me could kill me.”&quot;}, {&quot;n&quot;: &quot;4:15&quot;, &quot;text&quot;: &quot;Tha LORD said, “Whoever kills Cain will face vengeance 7-fold.” He put a mark on Cain so whoever found him wouldn’t kill him.&quot;}, {&quot;n&quot;: &quot;4:16&quot;, &quot;text&quot;: &quot;Cain left tha LORD’s presence N settled in Nod, east of Eden.&quot;}, {&quot;n&quot;: &quot;4:17&quot;, &quot;text&quot;: &quot;Cain slept wit his wife; she conceived N bore Enoch. Cain built a city N named it after his son, Enoch.&quot;}, {&quot;n&quot;: &quot;4:18&quot;, &quot;text&quot;: &quot;Enoch fathered Irad; Irad fathered Mehujael; Mehujael fathered Methusael; Methusael fathered Lamech.&quot;}, {&quot;n&quot;: &quot;4:19&quot;, &quot;text&quot;: &quot;Lamech took 2 wivez: Adah N Zillah.&quot;}, {&quot;n&quot;: &quot;4:20&quot;, &quot;text&quot;: &quot;Adah bore Jabal, ancestor of tha people who lived in tentz N raised livestock.&quot;}, {&quot;n&quot;: &quot;4:21&quot;, &quot;text&quot;: &quot;His brother Jubal was ancestor of tha people who played tha harp N pipe.&quot;}, {&quot;n&quot;: &quot;4:22&quot;, &quot;text&quot;: &quot;Zillah bore Tubal-cain, who instructed workerz in brass N iron. His sister was Naamah.&quot;}, {&quot;n&quot;: &quot;4:23&quot;, &quot;text&quot;: &quot;Lamech told his wivez, “Adah, Zillah, hear me. Listen 2 my wordz: I killed a man 4 woundin me, a young man 4 strikin me.&quot;}, {&quot;n&quot;: &quot;4:24&quot;, &quot;text&quot;: &quot;If Cain is avenged 7-fold, Lamech is avenged 77-fold.”&quot;}, {&quot;n&quot;: &quot;4:25&quot;, &quot;text&quot;: &quot;Adam slept wit his wife again. She bore a son N named him Seth: “God has appointed another child 4 me in Abel’s place, cuz Cain killed him.”&quot;}, {&quot;n&quot;: &quot;4:26&quot;, &quot;text&quot;: &quot;Seth had a son N named him Enos. Dat was when people began calling on tha name of tha LORD.&quot;}], &quot;5&quot;: [{&quot;n&quot;: &quot;5:1&quot;, &quot;text&quot;: &quot;Here’s Adam’s family record. When God created humankind, he made ’em in his likeness.&quot;}, {&quot;n&quot;: &quot;5:2&quot;, &quot;text&quot;: &quot;Male N female, he created ’em, blessed ’em, N named ’em humankind when dey were made.&quot;}, {&quot;n&quot;: &quot;5:3&quot;, &quot;text&quot;: &quot;At 130, Adam fathered a son in his own likeness, carrying his image. He named him Seth.&quot;}, {&quot;n&quot;: &quot;5:4&quot;, &quot;text&quot;: &quot;After Seth’s birth, Adam lived another 800 yearz N had other sonz N daughterz.&quot;}, {&quot;n&quot;: &quot;5:5&quot;, &quot;text&quot;: &quot;Adam’s whole life came 2 930 yearz. Then he died.&quot;}, {&quot;n&quot;: &quot;5:6&quot;, &quot;text&quot;: &quot;Seth was 105 when he fathered Enos.&quot;}, {&quot;n&quot;: &quot;5:7&quot;, &quot;text&quot;: &quot;After Enos, Seth lived another 807 yearz N had other sonz N daughterz.&quot;}, {&quot;n&quot;: &quot;5:8&quot;, &quot;text&quot;: &quot;Seth lived 912 yearz altogether. Then he died.&quot;}, {&quot;n&quot;: &quot;5:9&quot;, &quot;text&quot;: &quot;Enos was 90 when he fathered Cainan.&quot;}, {&quot;n&quot;: &quot;5:10&quot;, &quot;text&quot;: &quot;After Cainan, Enos lived another 815 yearz N had other sonz N daughterz.&quot;}, {&quot;n&quot;: &quot;5:11&quot;, &quot;text&quot;: &quot;Enos lived 905 yearz altogether. Then he died.&quot;}, {&quot;n&quot;: &quot;5:12&quot;, &quot;text&quot;: &quot;Cainan was 70 when he fathered Mahalaleel.&quot;}, {&quot;n&quot;: &quot;5:13&quot;, &quot;text&quot;: &quot;After Mahalaleel, Cainan lived another 840 yearz N had other sonz N daughterz.&quot;}, {&quot;n&quot;: &quot;5:14&quot;, &quot;text&quot;: &quot;Cainan lived 910 yearz altogether. Then he died.&quot;}, {&quot;n&quot;: &quot;5:15&quot;, &quot;text&quot;: &quot;Mahalaleel was 65 when he fathered Jared.&quot;}, {&quot;n&quot;: &quot;5:16&quot;, &quot;text&quot;: &quot;After Jared, Mahalaleel lived another 830 yearz N had other sonz N daughterz.&quot;}, {&quot;n&quot;: &quot;5:17&quot;, &quot;text&quot;: &quot;Mahalaleel lived 895 yearz altogether. Then he died.&quot;}, {&quot;n&quot;: &quot;5:18&quot;, &quot;text&quot;: &quot;Jared was 162 when he fathered Enoch.&quot;}, {&quot;n&quot;: &quot;5:19&quot;, &quot;text&quot;: &quot;After Enoch, Jared lived another 800 yearz N had other sonz N daughterz.&quot;}, {&quot;n&quot;: &quot;5:20&quot;, &quot;text&quot;: &quot;Jared lived 962 yearz altogether. Then he died.&quot;}, {&quot;n&quot;: &quot;5:21&quot;, &quot;text&quot;: &quot;Enoch was 65 when he fathered Methuselah.&quot;}, {&quot;n&quot;: &quot;5:22&quot;, &quot;text&quot;: &quot;After Methuselah, Enoch walked wit God 4 another 300 yearz N had other sonz N daughterz.&quot;}, {&quot;n&quot;: &quot;5:23&quot;, &quot;text&quot;: &quot;Enoch’s whole life came 2 365 yearz.&quot;}, {&quot;n&quot;: &quot;5:24&quot;, &quot;text&quot;: &quot;Enoch walked wit God. Then he was no longer here, cuz God took him.&quot;}, {&quot;n&quot;: &quot;5:25&quot;, &quot;text&quot;: &quot;Methuselah was 187 when he fathered Lamech.&quot;}, {&quot;n&quot;: &quot;5:26&quot;, &quot;text&quot;: &quot;After Lamech, Methuselah lived another 782 yearz N had other sonz N daughterz.&quot;}, {&quot;n&quot;: &quot;5:27&quot;, &quot;text&quot;: &quot;Methuselah lived 969 yearz altogether. Then he died.&quot;}, {&quot;n&quot;: &quot;5:28&quot;, &quot;text&quot;: &quot;Lamech was 182 when he fathered a son.&quot;}, {&quot;n&quot;: &quot;5:29&quot;, &quot;text&quot;: &quot;He named him Noah, saying, “Dis 1 will bring us comfort from our work, from handz worn down on tha ground tha LORD cursed.”&quot;}, {&quot;n&quot;: &quot;5:30&quot;, &quot;text&quot;: &quot;After Noah, Lamech lived another 595 yearz N had other sonz N daughterz.&quot;}, {&quot;n&quot;: &quot;5:31&quot;, &quot;text&quot;: &quot;Lamech lived 777 yearz altogether. Then he died.&quot;}, {&quot;n&quot;: &quot;5:32&quot;, &quot;text&quot;: &quot;After Noah reached 500, he became father 2 Shem, Ham, N Japheth.&quot;}], &quot;6&quot;: [{&quot;n&quot;: &quot;6:1&quot;, &quot;text&quot;: &quot;People multiplied across tha earth, N daughterz were born 2 ’em.&quot;}, {&quot;n&quot;: &quot;6:2&quot;, &quot;text&quot;: &quot;Tha sonz of God saw dat tha daughterz of humankind were beautiful N took whichever ones dey chose as wivez.&quot;}, {&quot;n&quot;: &quot;6:3&quot;, &quot;text&quot;: &quot;Tha LORD said, “My Spirit won’t contend wit humankind forever. Dey’re flesh; deir dayz will b 120 yearz.”&quot;}, {&quot;n&quot;: &quot;6:4&quot;, &quot;text&quot;: &quot;Giants were on tha earth in those dayz—N afterward too—when tha sonz of God went in 2 human daughterz N had children by ’em. Those became tha mighty figurez of old, namez everybody knew.&quot;}, {&quot;n&quot;: &quot;6:5&quot;, &quot;text&quot;: &quot;God saw how deep human wickedness ran. Every plan forming in deir heartz kept turning toward evil, all tha time.&quot;}, {&quot;n&quot;: &quot;6:6&quot;, &quot;text&quot;: &quot;Tha LORD regretted making humankind on tha earth. It grieved him down 2 his heart.&quot;}, {&quot;n&quot;: &quot;6:7&quot;, &quot;text&quot;: &quot;He said, “I’ll wipe tha people I created off tha earth—people, animalz, crawlin thingz, N birdz. I regret making ’em.”&quot;}, {&quot;n&quot;: &quot;6:8&quot;, &quot;text&quot;: &quot;But Noah found favor in tha LORD’s eyez. Grace still had his name.&quot;}, {&quot;n&quot;: &quot;6:9&quot;, &quot;text&quot;: &quot;Here’s Noah’s account: he was righteous, blameless among tha people of his time. Noah walked wit God.&quot;}, {&quot;n&quot;: &quot;6:10&quot;, &quot;text&quot;: &quot;He had 3 sonz: Shem, Ham, N Japheth.&quot;}, {&quot;n&quot;: &quot;6:11&quot;, &quot;text&quot;: &quot;Earth had gone corrupt before God. Violence filled tha place.&quot;}, {&quot;n&quot;: &quot;6:12&quot;, &quot;text&quot;: &quot;God looked over tha earth: corruption everywhere. All flesh had twisted its way.&quot;}, {&quot;n&quot;: &quot;6:13&quot;, &quot;text&quot;: &quot;God told Noah, “Tha end of all flesh is before me. Dey’ve filled tha earth wit violence. I’m bringing destruction on ’em N tha earth.&quot;}, {&quot;n&quot;: &quot;6:14&quot;, &quot;text&quot;: &quot;Build urself an ark from gopher wood. Make roomz inside; seal it inside N outside wit pitch.&quot;}, {&quot;n&quot;: &quot;6:15&quot;, &quot;text&quot;: &quot;Here are tha dimensions: 300 cubitz long, 50 wide, 30 high.&quot;}, {&quot;n&quot;: &quot;6:16&quot;, &quot;text&quot;: &quot;Give tha ark an opening near tha roof, finishing it a cubit from tha top. Put tha door in its side. Build lower, middle, N upper deckz.&quot;}, {&quot;n&quot;: &quot;6:17&quot;, &quot;text&quot;: &quot;I’m bringing floodwaterz over tha earth 2 destroy every creature under heaven wit tha breath of life. Everything on earth will die.&quot;}, {&quot;n&quot;: &quot;6:18&quot;, &quot;text&quot;: &quot;But I’ll establish my covenant wit u. U’ll enter tha ark wit ur wife, ur sonz, N deir wivez.&quot;}, {&quot;n&quot;: &quot;6:19&quot;, &quot;text&quot;: &quot;Bring 2 of every kind of living creature aboard—male N female—2 keep ’em alive wit u.&quot;}, {&quot;n&quot;: &quot;6:20&quot;, &quot;text&quot;: &quot;Birdz, livestock, N crawlin thingz, each according 2 its kind: 2 of every kind will come 2 u 2 stay alive.&quot;}, {&quot;n&quot;: &quot;6:21&quot;, &quot;text&quot;: &quot;Gather every kind of food people N animalz eat. Store it 4 urself N 4 ’em.”&quot;}, {&quot;n&quot;: &quot;6:22&quot;, &quot;text&quot;: &quot;Noah did it. Every instruction God gave, he followed through.&quot;}], &quot;7&quot;: [{&quot;n&quot;: &quot;7:1&quot;, &quot;text&quot;: &quot;Tha LORD told Noah, “Bring ur whole household into tha ark. Among dis generation, I’ve seen u standing righteous before me.&quot;}, {&quot;n&quot;: &quot;7:2&quot;, &quot;text&quot;: &quot;Take tha clean animalz by 7s, male N female; tha unclean animalz by 2s, male N female.&quot;}, {&quot;n&quot;: &quot;7:3&quot;, &quot;text&quot;: &quot;Birdz by 7s too, male N female, keeping deir offspring alive across tha earth.&quot;}, {&quot;n&quot;: &quot;7:4&quot;, &quot;text&quot;: &quot;7 dayz from now, I’ll send rain 4 40 dayz N 40 nights. I’ll wipe every living thing I made off tha ground.”&quot;}, {&quot;n&quot;: &quot;7:5&quot;, &quot;text&quot;: &quot;Noah did everything tha LORD commanded him.&quot;}, {&quot;n&quot;: &quot;7:6&quot;, &quot;text&quot;: &quot;Noah was 600 when tha floodwaterz came over tha earth.&quot;}, {&quot;n&quot;: &quot;7:7&quot;, &quot;text&quot;: &quot;He entered tha ark wit his sonz, his wife, N his sonz’ wivez 2 escape tha floodwaterz.&quot;}, {&quot;n&quot;: &quot;7:8&quot;, &quot;text&quot;: &quot;Clean animalz, unclean animalz, birdz, N everything crawlin on tha ground&quot;}, {&quot;n&quot;: &quot;7:9&quot;, &quot;text&quot;: &quot;went into tha ark wit Noah 2 by 2, male N female, just as God commanded.&quot;}, {&quot;n&quot;: &quot;7:10&quot;, &quot;text&quot;: &quot;7 dayz passed. Then tha floodwaterz came over tha earth.&quot;}, {&quot;n&quot;: &quot;7:11&quot;, &quot;text&quot;: &quot;In Noah’s 600th year, 2nd month, 17th day, tha gr8 deep broke open N heaven’s floodgatez opened.&quot;}, {&quot;n&quot;: &quot;7:12&quot;, &quot;text&quot;: &quot;Rain came down 4 40 dayz N 40 nights.&quot;}, {&quot;n&quot;: &quot;7:13&quot;, &quot;text&quot;: &quot;On dat very day, Noah entered tha ark wit Shem, Ham, Japheth, his wife, N his sonz’ 3 wivez.&quot;}, {&quot;n&quot;: &quot;7:14&quot;, &quot;text&quot;: &quot;Wit ’em came every kind of wild animal, livestock, crawlin creature, N bird—every kind of winged thing.&quot;}, {&quot;n&quot;: &quot;7:15&quot;, &quot;text&quot;: &quot;Every kind of flesh carrying tha breath of life came 2 Noah in tha ark, 2 by 2.&quot;}, {&quot;n&quot;: &quot;7:16&quot;, &quot;text&quot;: &quot;Male N female entered as God commanded. Then tha LORD shut him in. God closed tha door.&quot;}, {&quot;n&quot;: &quot;7:17&quot;, &quot;text&quot;: &quot;Tha flood kept coming 4 40 dayz. Rising water lifted tha ark clean off tha earth.&quot;}, {&quot;n&quot;: &quot;7:18&quot;, &quot;text&quot;: &quot;Water grew stronger N rose higher. Tha ark moved over tha surface.&quot;}, {&quot;n&quot;: &quot;7:19&quot;, &quot;text&quot;: &quot;It rose so high dat every high mountain under tha whole heaven was covered.&quot;}, {&quot;n&quot;: &quot;7:20&quot;, &quot;text&quot;: &quot;Tha waterz rose 15 cubitz above tha mountainz, covering ’em.&quot;}, {&quot;n&quot;: &quot;7:21&quot;, &quot;text&quot;: &quot;Every living thing movin on land died: birdz, livestock, wild animalz, swarming creaturez, N  &quot;text&quot;: &quot;It returned dat evening wit a freshly plucked olive leaf in its beak. Noah knew tha water had gone down.&quot;}, {&quot;n&quot;: &quot;8:12&quot;, &quot;text&quot;: &quot;He waited another 7 dayz N sent it out. Dis time, tha dove didn’t come back.&quot;}, {&quot;n&quot;: &quot;8:13&quot;, &quot;text&quot;: &quot;In Noah’s 601st year, 1st month, 1st day, tha water had dried from tha earth. He removed tha ark’s covering N looked: tha ground’s surface was dry.&quot;}, {&quot;n&quot;: &quot;8:14&quot;, &quot;text&quot;: &quot;By tha 2nd month, 27th day, tha earth was dry.&quot;}, {&quot;n&quot;: &quot;8:15&quot;, &quot;text&quot;: &quot;Then God spoke 2 Noah:&quot;}, {&quot;n&quot;: &quot;8:16&quot;, &quot;text&quot;: &quot;“Come outta tha ark wit ur wife, ur sonz, N deir wivez.&quot;}, {&quot;n&quot;: &quot;8:17&quot;, &quot;text&quot;: &quot;Bring every living creature out wit u—birdz, livestock, crawlin thingz—so dey can spread, b fruitful, N multiply across tha earth.”&quot;}, {&quot;n&quot;: &quot;8:18&quot;, &quot;text&quot;: &quot;Noah came out wit his sonz, his wife, N his sonz’ wivez.&quot;}, {&quot;n&quot;: &quot;8:19&quot;, &quot;text&quot;: &quot;Every animal, crawlin creature, N bird came outta tha ark by deir kindz.&quot;}, {&quot;n&quot;: &quot;8:20&quot;, &quot;text&quot;: &quot;Noah built an altar 2 tha LORD. He took some of every clean animal N clean bird N offered burnt offeringz there.&quot;}, {&quot;n&quot;: &quot;8:21&quot;, &quot;text&quot;: &quot;Tha LORD received tha pleasing aroma N said in his heart, “I won’t curse tha ground again because of humankind, even though deir heartz lean toward evil from youth. I won’t strike down every living thing again as I’ve done.&quot;}, {&quot;n&quot;: &quot;8:22&quot;, &quot;text&quot;: &quot;As long as tha earth remains, sowing N harvest, cold N heat, summer N winter, day N night will keep coming.”&quot;}], &quot;9&quot;: [{&quot;n&quot;: &quot;9:1&quot;, &quot;text&quot;: &quot;God blessed Noah N his sonz: “B fruitful, multiply, fill tha earth again.&quot;}, {&quot;n&quot;: &quot;9:2&quot;, &quot;text&quot;: &quot;Wild animalz, birdz, creaturez movin on tha ground, N fish in tha sea will b shook around y’all. Dey’re placed in ur handz.&quot;}, {&quot;n&quot;: &quot;9:3&quot;, &quot;text&quot;: &quot;Every living, movin thing will b food 4 u. Just as I gave u green plantz, now I give u all dis.&quot;}, {&quot;n&quot;: &quot;9:4&quot;, &quot;text&quot;: &quot;But don’t eat meat wit its life—its blood—still in it.&quot;}, {&quot;n&quot;: &quot;9:5&quot;, &quot;text&quot;: &quot;I’ll demand an account 4 ur lifeblood. From animalz N from people, I’ll require it. Whoever takes another person’s life will answer 4 it.&quot;}, {&quot;n&quot;: &quot;9:6&quot;, &quot;text&quot;: &quot;Whoever sheds human blood, by humanz will dat person’s blood b shed. God made humankind in his own image.&quot;}, {&quot;n&quot;: &quot;9:7&quot;, &quot;text&quot;: &quot;As 4 y’all, b fruitful N multiply. Bring forth life abundantly; spread across tha earth.”&quot;}, {&quot;n&quot;: &quot;9:8&quot;, &quot;text&quot;: &quot;God spoke 2 Noah N tha sonz wit him:&quot;}, {&quot;n&quot;: &quot;9:9&quot;, &quot;text&quot;: &quot;“I’m establishing my covenant wit y’all N tha descendantz coming after u,&quot;}, {&quot;n&quot;: &quot;9:10&quot;, &quot;text&quot;: &quot;N wit every living creature beside u—birdz, livestock, wild animalz—everything dat came outta tha ark, every animal on earth.&quot;}, {&quot;n&quot;: &quot;9:11&quot;, &quot;text&quot;: &quot;Dis is my covenant: never again will floodwaterz wipe out all flesh. Never again will a flood destroy tha earth.”&quot;}, {&quot;n&quot;: &quot;9:12&quot;, &quot;text&quot;: &quot;God said, “Here’s tha sign of tha covenant between me, y’all, N every living creature wit u, 4 every generation 2 come:&quot;}, {&quot;n&quot;: &quot;9:13&quot;, &quot;text&quot;: &quot;I’ve set my bow in tha cloudz. It’s tha sign of tha covenant between me N tha earth.&quot;}, {&quot;n&quot;: &quot;9:14&quot;, &quot;text&quot;: &quot;When I bring cloudz over tha earth N tha bow appears in ’em,&quot;}, {&quot;n&quot;: &quot;9:15&quot;, &quot;text&quot;: &quot;I’ll remember my covenant wit u N every living creature. Water will never again become a flood destroying all flesh.&quot;}, {&quot;n&quot;: &quot;9:16&quot;, &quot;text&quot;: &quot;Tha bow will b in tha cloudz. I’ll see it N remember tha everlasting covenant between God N every living creature on earth.”&quot;}, {&quot;n&quot;: &quot;9:17&quot;, &quot;text&quot;: &quot;God told Noah, “Dat’s tha sign of tha covenant I’ve established between me N all flesh on earth.”&quot;}, {&quot;n&quot;: &quot;9:18&quot;, &quot;text&quot;: &quot;Noah’s sonz who came outta tha ark were Shem, Ham, N Japheth. Ham was Canaan’s father.&quot;}, {&quot;n&quot;: &quot;9:19&quot;, &quot;text&quot;: &quot;From these 3 sonz of Noah, people spread across tha whole earth.&quot;}, {&quot;n&quot;: &quot;9:20&quot;, &quot;text&quot;: &quot;Noah began working tha soil N planted a vineyard.&quot;}, {&quot;n&quot;: &quot;9:21&quot;, &quot;text&quot;: &quot;He drank tha wine, got drunk, N lay uncovered inside his tent.&quot;}, {&quot;n&quot;: &quot;9:22&quot;, &quot;text&quot;: &quot;Ham, Canaan’s father, saw his father naked N went outside 2 tell his 2 brotherz.&quot;}, {&quot;n&quot;: &quot;9:23&quot;, &quot;text&quot;: &quot;Shem N Japheth laid a garment across deir shoulders, walked backward, N covered deir father. Faces turned away; dey didn’t look at his nakedness.&quot;}, {&quot;n&quot;: &quot;9:24&quot;, &quot;text&quot;: &quot;Noah woke from tha wine N learned what his younger son had done.&quot;}, {&quot;n&quot;: &quot;9:25&quot;, &quot;text&quot;: &quot;He said, “Cursed b Canaan. Tha lowest servant he’ll b 2 his brotherz.”&quot;}, {&quot;n&quot;: &quot;9:26&quot;, &quot;text&quot;: &quot;He said, “Blessed b tha LORD, tha God of Shem. Let Canaan b Shem’s servant.&quot;}, {&quot;n&quot;: &quot;9:27&quot;, &quot;text&quot;: &quot;May God enlarge Japheth, N may he live in Shem’s tentz. Let Canaan b his servant.”&quot;}, {&quot;n&quot;: &quot;9:28&quot;, &quot;text&quot;: &quot;Noah lived another 350 yearz after tha flood.&quot;}, {&quot;n&quot;: &quot;9:29&quot;, &quot;text&quot;: &quot;His whole life came 2 950 yearz. Then he died.&quot;}], &quot;10&quot;: [{&quot;n&quot;: &quot;10:1&quot;, &quot;text&quot;: &quot;Here’s tha family record of Noah’s sonz—Shem, Ham, N Japheth. Sonz were born 2 ’em after tha flood.&quot;}, {&quot;n&quot;: &quot;10:2&quot;, &quot;text&quot;: &quot;Japheth’s sonz were Gomer, Magog, Madai, Javan, Tubal, Meshech, N Tiras.&quot;}, {&quot;n&quot;: &quot;10:3&quot;, &quot;text&quot;: &quot;Gomer’s sonz were Ashkenaz, Riphath, N Togarmah.&quot;}, {&quot;n&quot;: &quot;10:4&quot;, &quot;text&quot;: &quot;Javan’s sonz were Elishah, Tarshish, Kittim, N Dodanim.&quot;}, {&quot;n&quot;: &quot;10:5&quot;, &quot;text&quot;: &quot;From these familiez, tha coastland peoplez spread into deir territoriez, each wit its own language, clanz, N nation.&quot;}, {&quot;n&quot;: &quot;10:6&quot;, &quot;text&quot;: &quot;Ham’s sonz were Cush, Mizraim, Phut, N Canaan.&quot;}, {&quot;n&quot;: &quot;10:7&quot;, &quot;text&quot;: &quot;Cush’s sonz were Seba, Havilah, Sabtah, Raamah, N Sabtechah. Raamah’s sonz were Sheba N Dedan.&quot;}, {&quot;n&quot;: &quot;10:8&quot;, &quot;text&quot;: &quot;Cush fathered Nimrod, who became a mighty figure on tha earth.&quot;}, {&quot;n&quot;: &quot;10:9&quot;, &quot;text&quot;: &quot;He was a mighty hunter before tha LORD. Dat’s where tha saying came from: “Like Nimrod, a mighty hunter before tha LORD.”&quot;}, {&quot;n&quot;: &quot;10:10&quot;, &quot;text&quot;: &quot;His kingdom began wit Babel, Erech, Accad, N Calneh in Shinar.&quot;}, {&quot;n&quot;: &quot;10:11&quot;, &quot;text&quot;: &quot;From dat land Asshur went out N built Nineveh, Rehoboth, N Calah,&quot;}, {&quot;n&quot;: &quot;10:12&quot;, &quot;text&quot;: &quot;N Resen, between Nineveh N Calah. Dat was tha gr8 city.&quot;}, {&quot;n&quot;: &quot;10:13&quot;, &quot;text&quot;: &quot;Mizraim fathered tha Ludim, Anamim, Lehabim, N Naphtuhim,&quot;}, {&quot;n&quot;: &quot;10:14&quot;, &quot;text&quot;: &quot;tha Pathrusim, Casluhim—from whom tha Philistines came—N Caphtorim.&quot;}, {&quot;n&quot;: &quot;10:15&quot;, &quot;text&quot;: &quot;Canaan fathered Sidon, his firstborn, N Heth,&quot;}, {&quot;n&quot;: &quot;10:16&quot;, &quot;text&quot;: &quot;N tha Jebusites, Amorites, N Girgasites,&quot;}, {&quot;n&quot;: &quot;10:17&quot;, &quot;text&quot;: &quot;tha Hivites, Arkites, N Sinites,&quot;}, {&quot;n&quot;: &quot;10:18&quot;, &quot;text&quot;: &quot;tha Arvadites, Zemarites, N Hamathites. Later, tha Canaanite clanz spread out.&quot;}, {&quot;n&quot;: &quot;10:19&quot;, &quot;text&quot;: &quot;Canaanite territory ran from Sidon toward Gerar as far as Gaza, then toward Sodom, Gomorrah, Admah, N Zeboim, as far as Lasha.&quot;}, {&quot;n&quot;: &quot;10:20&quot;, &quot;text&quot;: &quot;Those were Ham’s descendantz, according 2 deir clanz, languagez, landz, N nationz.&quot;}, {&quot;n&quot;: &quot;10:21&quot;, &quot;text&quot;: &quot;Shem had children too. He was ancestor of all Eber’s children N brother of Japheth tha elder.&quot;}, {&quot;n&quot;: &quot;10:22&quot;, &quot;text&quot;: &quot;Shem’s sonz were Elam, Asshur, Arphaxad, Lud, N Aram.&quot;}, {&quot;n&quot;: &quot;10:23&quot;, &quot;text&quot;: &quot;Aram’s sonz were Uz, Hul, Gether, N Mash.&quot;}, {&quot;n&quot;: &quot;10:24&quot;, &quot;text&quot;: &quot;Arphaxad fathered Salah; Salah fathered Eber.&quot;}, {&quot;n&quot;: &quot;10:25&quot;, &quot;text&quot;: &quot;Eber had 2 sonz. 1 was named Peleg, cuz tha earth was divided in his dayz. His brother was Joktan.&quot;}, {&quot;n&quot;: &quot;10:26&quot;, &quot;text&quot;: &quot;Joktan fathered Almodad, Sheleph, Hazarmaveth, N Jerah,&quot;}, {&quot;n&quot;: &quot;10:27&quot;, &quot;text&quot;: &quot;Hadoram, Uzal, N Diklah,&quot;}, {&quot;n&quot;: &quot;10:28&quot;, &quot;text&quot;: &quot;Obal, Abimael, N Sheba,&quot;}, {&quot;n&quot;: &quot;10:29&quot;, &quot;text&quot;: &quot;Ophir, Havilah, N Jobab. All these were Joktan’s sonz.&quot;}, {&quot;n&quot;: &quot;10:30&quot;, &quot;text&quot;: &quot;Dey lived across tha territory from Mesha toward Sephar, tha eastern hill country.&quot;}, {&quot;n&quot;: &quot;10:31&quot;, &quot;text&quot;: &quot;Those were Shem’s descendantz, according 2 deir clanz, languagez, landz, N nationz.&quot;}, {&quot;n&quot;: &quot;10:32&quot;, &quot;text&quot;: &quot;These were tha clanz of Noah’s sonz, by deir family lines N nationz. From ’em, tha nationz spread across tha earth after tha flood.&quot;}], &quot;11&quot;: [{&quot;n&quot;: &quot;11:1&quot;, &quot;text&quot;: &quot;Tha whole earth had 1 language. Everybody spoke tha same wordz.&quot;}, {&quot;n&quot;: &quot;11:2&quot;, &quot;text&quot;: &quot;Traveling from tha east, dey found a plain in Shinar N settled there.&quot;}, {&quot;n&quot;: &quot;11:3&quot;, &quot;text&quot;: &quot;Dey told each other, “Come on, let’s make bricks N fire ’em hard.” Bricks took tha place of stone; tar served as mortar.&quot;}, {&quot;n&quot;: &quot;11:4&quot;, &quot;text&quot;: &quot;Dey said, “Let’s build ourselves a city N a tower wit its top in tha heavenz. Make a name 4 ourselves, so we won’t get scattered across tha earth.”&quot;}, {&quot;n&quot;: &quot;11:5&quot;, &quot;text&quot;: &quot;Tha LORD came down 2 see tha city N tower tha people were building.&quot;}, {&quot;n&quot;: &quot;11:6&quot;, &quot;text&quot;: &quot;He said, “1 people, 1 language—N dis is what dey’ve begun. Now nothing dey plan will seem beyond deir reach.&quot;}, {&quot;n&quot;: &quot;11:7&quot;, &quot;text&quot;: &quot;Come, let us go down N confuse deir language, so dey can’t understand 1 another.”&quot;}, {&quot;n&quot;: &quot;11:8&quot;, &quot;text&quot;: &quot;Tha LORD scattered ’em from there across tha earth. Construction on tha city stopped.&quot;}, {&quot;n&quot;: &quot;11:9&quot;, &quot;text&quot;: &quot;Dat’s why it was called Babel: tha LORD confused tha earth’s language there, then scattered tha people across tha whole earth.&quot;}, {&quot;n&quot;: &quot;11:10&quot;, &quot;text&quot;: &quot;Here’s Shem’s family line. At 100, 2 yearz after tha flood, Shem fathered Arphaxad.&quot;}, {&quot;n&quot;: &quot;11:11&quot;, &quot;text&quot;: &quot;After Arphaxad, Shem lived another 500 yearz N had other sonz N daughterz.&quot;}, {&quot;n&quot;: &quot;11:12&quot;, &quot;text&quot;: &quot;Arphaxad was 35 when he fathered Salah.&quot;}, {&quot;n&quot;: &quot;11:13&quot;, &quot;text&quot;: &quot;After Salah, he lived another 403 yearz N had other sonz N daughterz.&quot;}, {&quot;n&quot;: &quot;11:14&quot;, &quot;text&quot;: &quot;Salah was 30 when he fathered Eber.&quot;}, {&quot;n&quot;: &quot;11:15&quot;, &quot;text&quot;: &quot;After Eber, he lived another 403 yearz N had other sonz N daughterz.&quot;}, {&quot;n&quot;: &quot;11:16&quot;, &quot;text&quot;: &quot;Eber was 34 when he fathered Peleg.&quot;}, {&quot;n&quot;: &quot;11:17&quot;, &quot;text&quot;: &quot;After Peleg, he lived another 430 yearz N had other sonz N daughterz.&quot;}, {&quot;n&quot;: &quot;11:18&quot;, &quot;text&quot;: &quot;Peleg was 30 when he fathered Reu.&quot;}, {&quot;n&quot;: &quot;11:19&quot;, &quot;text&quot;: &quot;After Reu, he lived another 209 yearz N had other sonz N daughterz.&quot;}, {&quot;n&quot;: &quot;11:20&quot;, &quot;text&quot;: &quot;Reu was 32 when he fathered Serug.&quot;}, {&quot;n&quot;: &quot;11:21&quot;, &quot;text&quot;: &quot;After Serug, he lived another 207 yearz N had other sonz N daughterz.&quot;}, {&quot;n&quot;: &quot;11:22&quot;, &quot;text&quot;: &quot;Serug was 30 when he fathered Nahor.&quot;}, {&quot;n&quot;: &quot;11:23&quot;, &quot;text&quot;: &quot;After Nahor, he lived another 200 yearz N had other sonz N daughterz.&quot;}, {&quot;n&quot;: &quot;11:24&quot;, &quot;text&quot;: &quot;Nahor was 29 when he fathered Terah.&quot;}, {&quot;n&quot;: &quot;11:25&quot;, &quot;text&quot;: &quot;After Terah, he lived another 119 yearz N had other sonz N daughterz.&quot;}, {&quot;n&quot;: &quot;11:26&quot;, &quot;text&quot;: &quot;After reaching 70, Terah became father 2 Abram, Nahor, N Haran.&quot;}, {&quot;n&quot;: &quot;11:27&quot;, &quot;text&quot;: &quot;Here’s Terah’s family record: he fathered Abram, Nahor, N Haran. Haran fathered Lot.&quot;}, {&quot;n&quot;: &quot;11:28&quot;, &quot;text&quot;: &quot;Haran died while his father Terah was still alive, in Ur of tha Chaldees, tha land where he’d been born.&quot;}, {&quot;n&quot;: &quot;11:29&quot;, &quot;text&quot;: &quot;Abram N Nahor married. Abram’s wife was Sarai. Nahor’s wife was Milcah, daughter of Haran, who was father 2 Milcah N Iscah.&quot;}, {&quot;n&quot;: &quot;11:30&quot;, &quot;text&quot;: &quot;Sarai couldn’t conceive. She had no child.&quot;}, {&quot;n&quot;: &quot;11:31&quot;, &quot;text&quot;: &quot;Terah took his son Abram, his grandson Lot—Haran’s son—N his daughter-in-law Sarai, Abram’s wife. Dey left Ur of tha Chaldees heading 4 Canaan, but reached Haran N settled there.&quot;}, {&quot;n&quot;: &quot;11:32&quot;, &quot;text&quot;: &quot;Terah lived 205 yearz N died in Haran.&quot;}], &quot;12&quot;: [{&quot;n&quot;: &quot;12:1&quot;, &quot;text&quot;: &quot;Tha LORD had told Abram, “Leave ur country, ur relativez, N ur father’s household. Go 2 tha land I’ll show u.&quot;}, {&quot;n&quot;: &quot;12:2&quot;, &quot;text&quot;: &quot;I’ll make u a gr8 nation. I’ll bless u N make ur name gr8, N u’ll b a blessing.&quot;}, {&quot;n&quot;: &quot;12:3&quot;, &quot;text&quot;: &quot;I’ll bless those who bless u; whoever curses u, I’ll curse. Through u, every family on earth will b blessed.”&quot;}, {&quot;n&quot;: &quot;12:4&quot;, &quot;text&quot;: &quot;Abram moved as tha LORD told him. Lot went too. Abram was 75 when he left Haran.&quot;}, {&quot;n&quot;: &quot;12:5&quot;, &quot;text&quot;: &quot;He took Sarai, his nephew Lot, everything dey’d gathered, N tha people acquired in Haran. Dey set out 4 Canaan N arrived there.&quot;}, {&quot;n&quot;: &quot;12:6&quot;, &quot;text&quot;: &quot;Abram traveled through tha land 2 Sichem, by tha plain of Moreh. Tha Canaanites were living in tha land then.&quot;}, {&quot;n&quot;: &quot;12:7&quot;, &quot;text&quot;: &quot;Tha LORD appeared 2 Abram: “I’ll give dis land 2 ur descendantz.” Abram built an altar there 2 tha LORD who’d appeared 2 him.&quot;}, {&quot;n&quot;: &quot;12:8&quot;, &quot;text&quot;: &quot;He moved 2 tha hills east of Bethel N pitched his tent—Bethel west, Hai east. There he built an altar N called on tha LORD’s name.&quot;}, {&quot;n&quot;: &quot;12:9&quot;, &quot;text&quot;: &quot;Abram kept traveling south.&quot;}, {&quot;n&quot;: &quot;12:10&quot;, &quot;text&quot;: &quot;A severe famine hit tha land. Abram went down 2 Egypt 2 stay awhile, cuz tha hunger was heavy.&quot;}, {&quot;n&quot;: &quot;12:11&quot;, &quot;text&quot;: &quot;Near Egypt, he told Sarai, “Look, I know u’re a beautiful woman.&quot;}, {&quot;n&quot;: &quot;12:12&quot;, &quot;text&quot;: &quot;When tha Egyptians see u, dey’ll say, ‘Dat’s his wife.’ Dey’ll kill me N keep u alive.&quot;}, {&quot;n&quot;: &quot;12:13&quot;, &quot;text&quot;: &quot;Please say u’re my sister, so dey’ll treat me well because of u N let me live.”&quot;}, {&quot;n&quot;: &quot;12:14&quot;, &quot;text&quot;: &quot;When Abram entered Egypt, tha Egyptians saw how beautiful Sarai was.&quot;}, {&quot;n&quot;: &quot;12:15&quot;, &quot;text&quot;: &quot;Pharaoh’s officialz saw her N praised her 2 Pharaoh. She was taken into his household.&quot;}, {&quot;n&quot;: &quot;12:16&quot;, &quot;text&quot;: &quot;Because of her, Pharaoh treated Abram well. Abram received sheep, cattle, male N female donkeyz, male N female servantz, N camelz.&quot;}, {&quot;n&quot;: &quot;12:17&quot;, &quot;text&quot;: &quot;But tha LORD struck Pharaoh N his household wit gr8 plagues because of Sarai, Abram’s wife.&quot;}, {&quot;n&quot;: &quot;12:18&quot;, &quot;text&quot;: &quot;Pharaoh called Abram: “What have u done 2 me? Why didn’t u tell me she was ur wife?&quot;}, {&quot;n&quot;: &quot;12:19&quot;, &quot;text&quot;: &quot;Why say, ‘She’s my sister,’ so I might take her as my wife? Here’s ur wife. Take her N bounce.”&quot;}, {&quot;n&quot;: &quot;12:20&quot;, &quot;text&quot;: &quot;Pharaoh gave his men orders about Abram. Dey sent him away wit his wife N everything he had.&quot;}], &quot;13&quot;: [{&quot;n&quot;: &quot;13:1&quot;, &quot;text&quot;: &quot;Abram came up outta Egypt, heading south wit his wife, everything he owned, N Lot beside him.&quot;}, {&quot;n&quot;: &quot;13:2&quot;, &quot;text&quot;: &quot;Abram had serious wealth: livestock, silver, N gold. His holdings were heavy.&quot;}, {&quot;n&quot;: &quot;13:3&quot;, &quot;text&quot;: &quot;He traveled in stages from tha south back 2 Bethel, where his tent had first stood between Bethel N Hai,&quot;}, {&quot;n&quot;: &quot;13:4&quot;, &quot;text&quot;: &quot;back 2 tha altar he’d built before. There he called on tha LORD’s name again.&quot;}, {&quot;n&quot;: &quot;13:5&quot;, &quot;text&quot;: &quot;Lot, who traveled wit Abram, had his own flockz, herds, N tentz too.&quot;}, {&quot;n&quot;: &quot;13:6&quot;, &quot;text&quot;: &quot;Dey had so much dat tha land couldn’t support ’em together. Deir possessionz had grown; deir room hadn’t.&quot;}, {&quot;n&quot;: &quot;13:7&quot;, &quot;text&quot;: &quot;Abram’s herderz N Lot’s herderz started beefing. Tha Canaanites N Perizzites were living in tha land then too.&quot;}, {&quot;n&quot;: &quot;13:8&quot;, &quot;text&quot;: &quot;Abram told Lot, “Let’s keep tha beef out from between us—N our herderz too. We’re family.&quot;}, {&quot;n&quot;: &quot;13:9&quot;, &quot;text&quot;: &quot;Tha whole land is in front of u. Let’s separate. U take left, I’ll go right. U take right, I’ll go left.”&quot;}, {&quot;n&quot;: &quot;13:10&quot;, &quot;text&quot;: &quot;Lot looked over tha Jordan plain: water everywhere, like tha LORD’s garden, like Egypt toward Zoar. Dis was before tha LORD destroyed Sodom N Gomorrah.&quot;}, {&quot;n&quot;: &quot;13:11&quot;, &quot;text&quot;: &quot;Lot chose tha whole Jordan plain N traveled east. Dat’s how dey parted ways.&quot;}, {&quot;n&quot;: &quot;13:12&quot;, &quot;text&quot;: &quot;Abram stayed in Canaan. Lot settled among tha plain’s cities N pitched his tentz toward Sodom.&quot;}, {&quot;n&quot;: &quot;13:13&quot;, &quot;text&quot;: &quot;But tha people of Sodom were deeply wicked, sinning heavily against tha LORD.&quot;}, {&quot;n&quot;: &quot;13:14&quot;, &quot;text&quot;: &quot;After Lot left, tha LORD told Abram, “Lift ur eyez. From where u stand, look north, south, east, N west.&quot;}, {&quot;n&quot;: &quot;13:15&quot;, &quot;text&quot;: &quot;All tha land u see, I’ll give 2 u N ur descendantz forever.&quot;}, {&quot;n&quot;: &quot;13:16&quot;, &quot;text&quot;: &quot;I’ll make ur descendantz like tha earth’s dust. If somebody can count tha dust, dey can count ur family line.&quot;}, {&quot;n&quot;: &quot;13:17&quot;, &quot;text&quot;: &quot;Get up. Walk tha land’s length N width. I’m giving it 2 u.”&quot;}, {&quot;n&quot;: &quot;13:18&quot;, &quot;text&quot;: &quot;Abram moved his tent N settled by tha plain of Mamre in Hebron. There he built an altar 2 tha LORD.&quot;}], &quot;14&quot;: [{&quot;n&quot;: &quot;14:1&quot;, &quot;text&quot;: &quot;Dis happened in tha dayz of Amraphel, king of Shinar; Arioch, king of Ellasar; Chedorlaomer, king of Elam; N Tidal, king of nationz.&quot;}, {&quot;n&quot;: &quot;14:2&quot;, &quot;text&quot;: &quot;Dey went 2 war against Bera, king of Sodom; Birsha, king of Gomorrah; Shinab, king of Admah; Shemeber, king of Zeboiim; N tha king of Bela, also called Zoar.&quot;}, {&quot;n&quot;: &quot;14:3&quot;, &quot;text&quot;: &quot;These 5 joined forcez in tha Valley of Siddim, where tha Salt Sea is.&quot;}, {&quot;n&quot;: &quot;14:4&quot;, &quot;text&quot;: &quot;12 yearz dey’d served Chedorlaomer. Year 13, dey rebelled.&quot;}, {&quot;n&quot;: &quot;14:5&quot;, &quot;text&quot;: &quot;Year 14, Chedorlaomer came wit his allied kingz. Dey defeated tha Rephaim in Ashteroth Karnaim, tha Zuzim in Ham, N tha Emim in Shaveh Kiriathaim,&quot;}, {&quot;n&quot;: &quot;14:6&quot;, &quot;text&quot;: &quot;N tha Horites in Seir’s hill country, as far as Elparan beside tha wilderness.&quot;}, {&quot;n&quot;: &quot;14:7&quot;, &quot;text&quot;: &quot;Dey turned back 2 Enmishpat, also called Kadesh, defeating tha whole territory of tha Amalekites N tha Amorites living in Hazezontamar.&quot;}, {&quot;n&quot;: &quot;14:8&quot;, &quot;text&quot;: &quot;Tha kingz of Sodom, Gomorrah, Admah, Zeboiim, N Bela—Zoar—marched out N lined up 4 battle in Siddim,&quot;}, {&quot;n&quot;: &quot;14:9&quot;, &quot;text&quot;: &quot;against Chedorlaomer of Elam, Tidal king of nationz, Amraphel of Shinar, N Arioch of Ellasar. 4 kingz against 5.&quot;}, {&quot;n&quot;: &quot;14:10&quot;, &quot;text&quot;: &quot;Siddim was full of tar pits. Tha kingz of Sodom N Gomorrah fled N fell there; tha survivorz escaped 2 tha hills.&quot;}, {&quot;n&quot;: &quot;14:11&quot;, &quot;text&quot;: &quot;Tha victorz took Sodom N Gomorrah’s goodz N food suppliez, then left.&quot;}, {&quot;n&quot;: &quot;14:12&quot;, &quot;text&quot;: &quot;Dey took Abram’s nephew Lot too, along wit his possessionz. He’d been living in Sodom.&quot;}, {&quot;n&quot;: &quot;14:13&quot;, &quot;text&quot;: &quot;An escapee brought tha news 2 Abram tha Hebrew. Abram lived by Mamre tha Amorite, brother of Eshcol N Aner. All 3 were his allies.&quot;}, {&quot;n&quot;: &quot;14:14&quot;, &quot;text&quot;: &quot;When Abram heard his relative was captive, he armed 318 trained men born in his household N chased tha captorz as far as Dan.&quot;}, {&quot;n&quot;: &quot;14:15&quot;, &quot;text&quot;: &quot;At night he divided his forcez, attacked, defeated ’em, N pursued ’em as far as Hobah, north of Damascus.&quot;}, {&quot;n&quot;: &quot;14:16&quot;, &quot;text&quot;: &quot;He brought back all tha goodz, Lot N his possessionz, tha women, N tha other people. He recovered people along wit property.&quot;}, {&quot;n&quot;: &quot;14:17&quot;, &quot;text&quot;: &quot;After Abram returned from defeating Chedorlaomer N tha allied kingz, Sodom’s king met him in tha Valley of Shaveh—tha King’s Valley.&quot;}, {&quot;n&quot;: &quot;14:18&quot;, &quot;text&quot;: &quot;Melchizedek, king of Salem N priest of God Most High, brought out bread N wine.&quot;}, {&quot;n&quot;: &quot;14:19&quot;, &quot;text&quot;: &quot;He blessed Abram: “Blessed b Abram by God Most High, possessor of heaven N earth.&quot;}, {&quot;n&quot;: &quot;14:20&quot;, &quot;text&quot;: &quot;Blessed b God Most High, who delivered ur enemies into ur hand.” Abram gave him 1/10 of everything.&quot;}, {&quot;n&quot;: &quot;14:21&quot;, &quot;text&quot;: &quot;Sodom’s king told Abram, “Give me tha people. Keep tha goodz 4 urself.”&quot;}, {&quot;n&quot;: &quot;14:22&quot;, &quot;text&quot;: &quot;Abram answered, “I’ve raised my hand in an oath 2 tha LORD, God Most High, possessor of heaven N earth:&quot;}, {&quot;n&quot;: &quot;14:23&quot;, &quot;text&quot;: &quot;I won’t take a thread, a sandal strap, anything dat belongs 2 u. U won’t get 2 say, ‘I made Abram rich.’&quot;}, {&quot;n&quot;: &quot;14:24&quot;, &quot;text&quot;: &quot;Except what tha young men already ate, N tha sharez belonging 2 Aner, Eshcol, N Mamre, who came wit me. Let ’em take deir portion.”&quot;}], &quot;15&quot;: [{&quot;n&quot;: &quot;15:1&quot;, &quot;text&quot;: &quot;After all dis, tha LORD’s word came 2 Abram in a vision: “Don’t b shook, Abram. I’m ur shield, ur exceedingly gr8 reward.”&quot;}, {&quot;n&quot;: &quot;15:2&quot;, &quot;text&quot;: &quot;Abram said, “Lord GOD, what will u give me? I still have no child. Eliezer of Damascus manages my household.&quot;}, {&quot;n&quot;: &quot;15:3&quot;, &quot;text&quot;: &quot;U haven’t given me offspring. Somebody from my household is set 2 inherit what I have.”&quot;}, {&quot;n&quot;: &quot;15:4&quot;, &quot;text&quot;: &quot;Tha LORD’s word answered: “Dat man won’t b ur heir. Ur own son, from ur own body, will inherit.”&quot;}, {&quot;n&quot;: &quot;15:5&quot;, &quot;text&quot;: &quot;God took him outside: “Look toward heaven. Count tha starz—if u can.” Then he said, “Dat’s how numerous ur descendantz will b.”&quot;}, {&quot;n&quot;: &quot;15:6&quot;, &quot;text&quot;: &quot;Abram believed tha LORD. God counted dat faith 2 him as righteousness.&quot;}, {&quot;n&quot;: &quot;15:7&quot;, &quot;text&quot;: &quot;He told him, “I’m tha LORD who brought u outta Ur of tha Chaldees 2 give u dis land as ur inheritance.”&quot;}, {&quot;n&quot;: &quot;15:8&quot;, &quot;text&quot;: &quot;Abram asked, “Lord GOD, how will I know I’ll possess it?”&quot;}, {&quot;n&quot;: &quot;15:9&quot;, &quot;text&quot;: &quot;God said, “Bring me a 3-year-old heifer, a 3-year-old female goat, a 3-year-old ram, a turtledove, N a young pigeon.”&quot;}, {&quot;n&quot;: &quot;15:10&quot;, &quot;text&quot;: &quot;Abram brought ’em, cut tha animalz in half, N laid tha halves opposite each other. He didn’t split tha birdz.&quot;}, {&quot;n&quot;: &quot;15:11&quot;, &quot;text&quot;: &quot;Birdz of prey came down on tha carcassez. Abram drove ’em off.&quot;}, {&quot;n&quot;: &quot;15:12&quot;, &quot;text&quot;: &quot;As tha sun went down, a deep sleep fell on Abram. A heavy darkness came over him N left him shook.&quot;}, {&quot;n&quot;: &quot;15:13&quot;, &quot;text&quot;: &quot;God told him, “Know dis 4 certain: ur descendantz will live as strangers in a land dey don’t own. Dey’ll serve its people N face oppression 4 400 yearz.&quot;}, {&quot;n&quot;: &quot;15:14&quot;, &quot;text&quot;: &quot;But I’ll judge tha nation dey serve. Afterward, dey’ll come out wit gr8 possessionz.&quot;}, {&quot;n&quot;: &quot;15:15&quot;, &quot;text&quot;: &quot;U’ll go 2 ur ancestorz in peace. U’ll b buried at a good old age.&quot;}, {&quot;n&quot;: &quot;15:16&quot;, &quot;text&quot;: &quot;Tha 4th generation will return here, cuz tha Amorites’ wrongdoing hasn’t yet reached its full measure.”&quot;}, {&quot;n&quot;: &quot;15:17&quot;, &quot;text&quot;: &quot;After sunset, in tha darkness, a smoking firepot N flaming torch passed between tha divided piecez.&quot;}, {&quot;n&quot;: &quot;15:18&quot;, &quot;text&quot;: &quot;Dat day tha LORD made a covenant wit Abram: “I give ur descendantz dis land, from Egypt’s river 2 tha gr8 river Euphrates:&quot;}, {&quot;n&quot;: &quot;15:19&quot;, &quot;text&quot;: &quot;tha land of tha Kenites, Kenizzites, N Kadmonites,&quot;}, {&quot;n&quot;: &quot;15:20&quot;, &quot;text&quot;: &quot;tha Hittites, Perizzites, N Rephaim,&quot;}, {&quot;n&quot;: &quot;15:21&quot;, &quot;text&quot;: &quot;tha Amorites, Canaanites, Girgashites, N Jebusites.”&quot;}], &quot;16&quot;: [{&quot;n&quot;: &quot;16:1&quot;, &quot;text&quot;: &quot;Abram’s wife Sarai had borne him no children. She had an Egyptian female servant named Hagar.&quot;}, {&quot;n&quot;: &quot;16:2&quot;, &quot;text&quot;: &quot;Sarai told Abram, “Tha LORD has kept me from having children. Go in 2 my servant; maybe I can build a family through her.” Abram listened 2 Sarai.&quot;}, {&quot;n&quot;: &quot;16:3&quot;, &quot;text&quot;: &quot;After Abram had lived 10 yearz in Canaan, Sarai took Hagar, her Egyptian servant, N gave her 2 Abram as a wife.&quot;}, {&quot;n&quot;: &quot;16:4&quot;, &quot;text&quot;: &quot;Abram slept wit Hagar, N she conceived. When she realized she was pregnant, she began looking down on her mistress.&quot;}, {&quot;n&quot;: &quot;16:5&quot;, &quot;text&quot;: &quot;Sarai told Abram, “Dis wrong against me is on u. I put my servant in ur arms, N now she’s pregnant N treats me wit contempt. Let tha LORD judge between us.”&quot;}, {&quot;n&quot;: &quot;16:6&quot;, &quot;text&quot;: &quot;Abram said, “Ur servant is in ur handz. Do what u think best.” Sarai treated Hagar harshly, N Hagar ran away.&quot;}, {&quot;n&quot;: &quot;16:7&quot;, &quot;text&quot;: &quot;Tha angel of tha LORD found her beside a spring in tha wilderness, on tha road 2 Shur.&quot;}, {&quot;n&quot;: &quot;16:8&quot;, &quot;text&quot;: &quot;He said, “Hagar, Sarai’s servant, where u coming from? Where u headed?” She answered, “I’m running from my mistress Sarai.”&quot;}, {&quot;n&quot;: &quot;16:9&quot;, &quot;text&quot;: &quot;Tha angel of tha LORD told her, “Return 2 ur mistress N submit 2 her authority.”&quot;}, {&quot;n&quot;: &quot;16:10&quot;, &quot;text&quot;: &quot;He said, “I’ll multiply ur descendantz so greatly nobody will b able 2 count ’em.”&quot;}, {&quot;n&quot;: &quot;16:11&quot;, &quot;text&quot;: &quot;He told her, “U’re pregnant N will bear a son. Name him Ishmael, cuz tha LORD has heard ur affliction.&quot;}, {&quot;n&quot;: &quot;16:12&quot;, &quot;text&quot;: &quot;He’ll b wild like a wild donkey: his hand against everyone, everyone’s hand against him. He’ll live in tha presence of all his brotherz.”&quot;}, {&quot;n&quot;: &quot;16:13&quot;, &quot;text&quot;: &quot;Hagar named tha LORD who spoke 2 her, “U are tha God who sees me.” She said, “Have I really seen here tha 1 who sees me?”&quot;}, {&quot;n&quot;: &quot;16:14&quot;, &quot;text&quot;: &quot;Dat’s why tha well was called Beerlahairoi. It’s between Kadesh N Bered.&quot;}, {&quot;n&quot;: &quot;16:15&quot;, &quot;text&quot;: &quot;Hagar bore Abram a son. Abram named tha son she bore Ishmael.&quot;}, {&quot;n&quot;: &quot;16:16&quot;, &quot;text&quot;: &quot;Abram was 86 when Hagar gave birth 2 Ishmael.&quot;}], &quot;17&quot;: [{&quot;n&quot;: &quot;17:1&quot;, &quot;text&quot;: &quot;When Abram was 99, tha LORD appeared 2 him: “I’m God Almighty. Walk before me N live blamelessly.&quot;}, {&quot;n&quot;: &quot;17:2&quot;, &quot;text&quot;: &quot;I’ll establish my covenant between me N u, N multiply ur descendantz greatly.”&quot;}, {&quot;n&quot;: &quot;17:3&quot;, &quot;text&quot;: &quot;Abram fell facedown. God kept speaking 2 him:&quot;}, {&quot;n&quot;: &quot;17:4&quot;, &quot;text&quot;: &quot;“Here’s my covenant wit u: u’ll b father 2 many nationz.&quot;}, {&quot;n&quot;: &quot;17:5&quot;, &quot;text&quot;: &quot;Abram won’t b ur name anymore. Ur name will b Abraham, cuz I’ve made u father of many nationz.&quot;}, {&quot;n&quot;: &quot;17:6&quot;, &quot;text&quot;: &quot;I’ll make u exceedingly fruitful. Nationz will come from u; kingz will come from ur family line.&quot;}, {&quot;n&quot;: &quot;17:7&quot;, &quot;text&quot;: &quot;I’ll establish my covenant wit u N ur descendantz through deir generationz—an everlasting covenant. I’ll b ur God N tha God of those coming after u.&quot;}, {&quot;n&quot;: &quot;17:8&quot;, &quot;text&quot;: &quot;I’ll give u N ur descendantz tha land where u’re living as a stranger—all of Canaan—as an everlasting possession. I’ll b deir God.”&quot;}, {&quot;n&quot;: &quot;17:9&quot;, &quot;text&quot;: &quot;God told Abraham, “U N ur descendantz must keep my covenant through every generation.&quot;}, {&quot;n&quot;: &quot;17:10&quot;, &quot;text&quot;: &quot;Dis is tha covenant y’all must keep between me, u, N ur descendantz: every male among u must b circumcised.&quot;}, {&quot;n&quot;: &quot;17:11&quot;, &quot;text&quot;: &quot;Circumcise tha flesh of ur foreskin. Dat will b tha sign of tha covenant between me N u.&quot;}, {&quot;n&quot;: &quot;17:12&quot;, &quot;text&quot;: &quot;Every male child must b circumcised at 8 dayz old, generation after generation—including those born in ur household N those bought from foreigners who aren’t ur descendantz.&quot;}, {&quot;n&quot;: &quot;17:13&quot;, &quot;text&quot;: &quot;Those born in ur household N those bought wit ur money must b circumcised. My covenant will b marked in ur flesh as an everlasting covenant.&quot;}, {&quot;n&quot;: &quot;17:14&quot;, &quot;text&quot;: &quot;Any uncircumcised male will b cut off from his people. He has broken my covenant.”&quot;}, {&quot;n&quot;: &quot;17:15&quot;, &quot;text&quot;: &quot;God told Abraham, “Ur wife Sarai won’t b called Sarai anymore. Her name will b Sarah.&quot;}, {&quot;n&quot;: &quot;17:16&quot;, &quot;text&quot;: &quot;I’ll bless her N give u a son through her. Yes, I’ll bless her. She’ll become mother of nationz; kingz of peoplez will come from her.”&quot;}, {&quot;n&quot;: &quot;17:17&quot;, &quot;text&quot;: &quot;Abraham fell facedown N laughed, thinking, “A child born 2 a man who’s 100? Sarah giving birth at 90?”&quot;}, {&quot;n&quot;: &quot;17:18&quot;, &quot;text&quot;: &quot;Abraham said 2 God, “If only Ishmael could live under ur favor!”&quot;}, {&quot;n&quot;: &quot;17:19&quot;, &quot;text&quot;: &quot;God said, “Sarah, ur wife, will indeed bear u a son. Name him Isaac. I’ll establish my covenant wit him N his descendantz after him, an everlasting covenant.&quot;}, {&quot;n&quot;: &quot;17:20&quot;, &quot;text&quot;: &quot;As 4 Ishmael, I’ve heard u. I’ve blessed him. I’ll make him fruitful N multiply him greatly. He’ll father 12 princez, N I’ll make him a gr8 nation.&quot;}, {&quot;n&quot;: &quot;17:21&quot;, &quot;text&quot;: &quot;But my covenant I’ll establish wit Isaac, whom Sarah will bear 2 u at dis appointed time next year.”&quot;}, {&quot;n&quot;: &quot;17:22&quot;, &quot;text&quot;: &quot;When God finished speaking, he went up from Abraham.&quot;}, {&quot;n&quot;: &quot;17:23&quot;, &quot;text&quot;: &quot;Dat very day, Abraham took Ishmael N every male in his household—those born there N those bought wit his money—N circumcised ’em as God had told him.&quot;}, {&quot;n&quot;: &quot;17:24&quot;, &quot;text&quot;: &quot;Abraham was 99 when he was circumcised.&quot;}, {&quot;n&quot;: &quot;17:25&quot;, &quot;text&quot;: &quot;His son Ishmael was 13 when he was circumcised.&quot;}, {&quot;n&quot;: &quot;17:26&quot;, &quot;text&quot;: &quot;Abraham N Ishmael were circumcised on tha same day.&quot;}, {&quot;n&quot;: &quot;17:27&quot;, &quot;text&quot;: &quot;Every male in Abraham’s household, whether born there or bought from a foreigner, was circumcised wit him.&quot;}], &quot;18&quot;: [{&quot;n&quot;: &quot;18:1&quot;, &quot;text&quot;: &quot;Tha LORD appeared 2 Abraham by tha plain of Mamre. Abraham was sitting at his tent’s entrance in tha heat of tha day.&quot;}, {&quot;n&quot;: &quot;18:2&quot;, &quot;text&quot;: &quot;He looked up N saw 3 men standing nearby. When he saw ’em, he ran from tha entrance 2 meet ’em N bowed low 2 tha ground.&quot;}, {&quot;n&quot;: &quot;18:3&quot;, &quot;text&quot;: &quot;He said, “My lord, if I’ve found favor in ur eyez, please don’t pass ur servant by.&quot;}, {&quot;n&quot;: &quot;18:4&quot;, &quot;text&quot;: &quot;Let us bring a little water. Wash ur feet N rest under dis tree.&quot;}, {&quot;n&quot;: &quot;18:5&quot;, &quot;text&quot;: &quot;I’ll bring some bread so u can refresh yourselves, then go on ur way, since u’ve come 2 ur servant.” Dey said, “Go ahead. Do as u’ve said.”&quot;}, {&quot;n&quot;: &quot;18:6&quot;, &quot;text&quot;: &quot;Abraham hurried into tha tent: “Sarah, quick! 3 measurez of fine flour—knead it N make bread.”&quot;}, {&quot;n&quot;: &quot;18:7&quot;, &quot;text&quot;: &quot;He ran 2 tha herd, picked a tender, good calf, N gave it 2 a young servant, who hurried 2 prepare it.&quot;}, {&quot;n&quot;: &quot;18:8&quot;, &quot;text&quot;: &quot;Abraham brought butter, milk, N tha prepared calf N set it before ’em. While dey ate, he stood beside ’em under tha tree.&quot;}, {&quot;n&quot;: &quot;18:9&quot;, &quot;text&quot;: &quot;Dey asked, “Where’s Sarah, ur wife?” He said, “There, in tha tent.”&quot;}, {&quot;n&quot;: &quot;18:10&quot;, &quot;text&quot;: &quot;1 said, “I’ll surely return 2 u at tha appointed season, N Sarah, ur wife, will have a son.” Sarah was listening at tha tent entrance behind him.&quot;}, {&quot;n&quot;: &quot;18:11&quot;, &quot;text&quot;: &quot;Abraham N Sarah were old, advanced in yearz. Sarah was past tha time of monthly periodz.&quot;}, {&quot;n&quot;: &quot;18:12&quot;, &quot;text&quot;: &quot;Sarah laughed 2 herself: “After I’ve grown old, will I have dis pleasure? My husband’s old too.”&quot;}, {&quot;n&quot;: &quot;18:13&quot;, &quot;text&quot;: &quot;Tha LORD asked Abraham, “Why did Sarah laugh N say, ‘Am I really gonna have a child when I’m old?’&quot;}, {&quot;n&quot;: &quot;18:14&quot;, &quot;text&quot;: &quot;Is anything too hard 4 tha LORD? At tha appointed time I’ll return 2 u, N Sarah will have a son.”&quot;}, {&quot;n&quot;: &quot;18:15&quot;, &quot;text&quot;: &quot;Sarah was shook N denied it: “I didn’t laugh.” He answered, “Yes, u did laugh.”&quot;}, {&quot;n&quot;: &quot;18:16&quot;, &quot;text&quot;: &quot;Tha men got up N looked toward Sodom. Abraham walked wit ’em 2 see ’em on deir way.&quot;}, {&quot;n&quot;: &quot;18:17&quot;, &quot;text&quot;: &quot;Tha LORD said, “Should I hide from Abraham what I’m about 2 do,&quot;}, {&quot;n&quot;: &quot;18:18&quot;, &quot;text&quot;: &quot;when he’ll surely become a gr8 N mighty nation, N every nation on earth will b blessed through him?&quot;}, {&quot;n&quot;: &quot;18:19&quot;, &quot;text&quot;: &quot;I know him: he’ll direct his children N household after him 2 keep tha LORD’s way, doing righteousness N justice, so I can bring about what I promised him.”&quot;}, {&quot;n&quot;: &quot;18:20&quot;, &quot;text&quot;: &quot;Tha LORD said, “Tha outcry against Sodom N Gomorrah is gr8. Deir sin is heavy.&quot;}, {&quot;n&quot;: &quot;18:21&quot;, &quot;text&quot;: &quot;I’ll go down N see whether dey’ve done all dat tha outcry reaching me says. If not, I’ll know.”&quot;}, {&quot;n&quot;: &quot;18:22&quot;, &quot;text&quot;: &quot;Tha men turned N headed toward Sodom. Abraham remained standing before tha LORD.&quot;}, {&quot;n&quot;: &quot;18:23&quot;, &quot;text&quot;: &quot;Abraham came closer: “Will u sweep away tha righteous wit tha wicked?&quot;}, {&quot;n&quot;: &quot;18:24&quot;, &quot;text&quot;: &quot;Suppose 50 righteous people are in tha city. Will u still destroy it? Won’t u spare tha place 4 tha 50 inside?&quot;}, {&quot;n&quot;: &quot;18:25&quot;, &quot;text&quot;: &quot;Far b it from u 2 kill tha righteous wit tha wicked, treating ’em both tha same. Far b it. Won’t tha Judge of all tha earth do what’s right?”&quot;}, {&quot;n&quot;: &quot;18:26&quot;, &quot;text&quot;: &quot;Tha LORD said, “If I find 50 righteous people in Sodom, I’ll spare tha whole place 4 deir sake.”&quot;}, {&quot;n&quot;: &quot;18:27&quot;, &quot;text&quot;: &quot;Abraham answered, “Here I am, taking it on myself 2 speak 2 tha Lord, when I’m only dust N ashes.&quot;}, {&quot;n&quot;: &quot;18:28&quot;, &quot;text&quot;: &quot;Suppose tha 50 are short by 5. Will u destroy tha whole city over 5 missing people?” He said, “If I find 45 there, I won’t destroy it.”&quot;}, {&quot;n&quot;: &quot;18:29&quot;, &quot;text&quot;: &quot;Abraham spoke again: “Suppose 40 are found there?” He answered, “4 tha sake of 40, I won’t do it.”&quot;}, {&quot;n&quot;: &quot;18:30&quot;, &quot;text&quot;: &quot;Abraham said, “Please don’t b angry, Lord. Let me speak. Suppose 30 are found there?” He answered, “If I find 30 there, I won’t do it.”&quot;}, {&quot;n&quot;: &quot;18:31&quot;, &quot;text&quot;: &quot;Abraham said, “I’ve taken it on myself 2 speak 2 tha Lord. Suppose 20 are found there?” He answered, “4 tha sake of 20, I won’t destroy it.”&quot;}, {&quot;n&quot;: &quot;18:32&quot;, &quot;text&quot;: &quot;Abraham said, “Please don’t b angry, Lord. Just 1 more time: suppose 10 are found there?” He answered, “4 tha sake of 10, I won’t destroy it.”&quot;}, {&quot;n&quot;: &quot;18:33&quot;, &quot;text&quot;: &quot;When tha LORD finished speaking wit Abraham, he bounced. Abraham returned home.&quot;}], &quot;19&quot;: [{&quot;n&quot;: &quot;19:1&quot;, &quot;text&quot;: &quot;That evening, 2 angelz reached Sodom. Lot was sitting at tha gate. He got up, met ’em, N bowed low.&quot;}, {&quot;n&quot;: &quot;19:2&quot;, &quot;text&quot;: &quot;“My lordz, stay at ur servant’s house tonight. Wash ur feet; bounce early tomorrow.” Dey answered, “We’ll spend tha night in tha square.”&quot;}, {&quot;n&quot;: &quot;19:3&quot;, &quot;text&quot;: &quot;Lot kept urging ’em, so dey came home wit him. He prepared a feast, baked unleavened bread, N dey ate.&quot;}, {&quot;n&quot;: &quot;19:4&quot;, &quot;text&quot;: &quot;Before bedtime, Sodom’s men surrounded tha house—young N old, from every part of tha city.&quot;}, {&quot;n&quot;: &quot;19:5&quot;, &quot;text&quot;: &quot;Dey called, “Lot! Where are tha men who came tonight? Bring ’em out so we can have sex wit ’em.”&quot;}, {&quot;n&quot;: &quot;19:6&quot;, &quot;text&quot;: &quot;Lot stepped outside N shut tha door behind him.&quot;}, {&quot;n&quot;: &quot;19:7&quot;, &quot;text&quot;: &quot;“Please, my brotherz, don’t do dis wicked thing.&quot;}, {&quot;n&quot;: &quot;19:8&quot;, &quot;text&quot;: &quot;I have 2 daughterz who haven’t slept wit a man. Let me bring ’em out; do what u want wit ’em. But leave these men alone. Dey came under my roof’s protection.”&quot;}, {&quot;n&quot;: &quot;19:9&quot;, &quot;text&quot;: &quot;“Move!” dey said. “Dis outsider thinks he can judge us? We’ll treat u worse than them!” Dey pressed Lot hard N nearly broke tha door.&quot;}, {&quot;n&quot;: &quot;19:10&quot;, &quot;text&quot;: &quot;Tha visitorz reached out, pulled Lot inside, N shut tha door.&quot;}, {&quot;n&quot;: &quot;19:11&quot;, &quot;text&quot;: &quot;Dey struck tha men outside wit blindness, young N old. Tha crowd wore itself out searching 4 tha door.&quot;}, {&quot;n&quot;: &quot;19:12&quot;, &quot;text&quot;: &quot;Tha visitorz asked Lot, “Anybody else here belonging 2 u—sonz-in-law, sonz, daughterz? Get everyone out.&quot;}, {&quot;n&quot;: &quot;19:13&quot;, &quot;text&quot;: &quot;We’re destroying dis place. Tha outcry against it has grown gr8 before tha LORD. He sent us 2 destroy it.”&quot;}, {&quot;n&quot;: &quot;19:14&quot;, &quot;text&quot;: &quot;Lot warned tha sonz-in-law pledged 2 his daughterz: “Get up! Bounce! Tha LORD will destroy dis city.” Dey thought he was joking.&quot;}, {&quot;n&quot;: &quot;19:15&quot;, &quot;text&quot;: &quot;At dawn tha angelz hurried him: “Take ur wife N tha 2 daughterz here, or u’ll b swept away wit tha city’s punishment.”&quot;}, {&quot;n&quot;: &quot;19:16&quot;, &quot;text&quot;: &quot;Lot hesitated. Tha men grabbed his hand, his wife’s hand, N his daughterz’ handz N led ’em outside. Tha LORD had mercy on him.&quot;}, {&quot;n&quot;: &quot;19:17&quot;, &quot;text&quot;: &quot;Outside, 1 said, “Run 4 ur life! Don’t look back or stop anywhere on tha plain. Escape 2 tha mountainz or b swept away!”&quot;}, {&quot;n&quot;: &quot;19:18&quot;, &quot;text&quot;: &quot;Lot answered, “Please, my lord, not there!&quot;}, {&quot;n&quot;: &quot;19:19&quot;, &quot;text&quot;: &quot;U’ve shown ur servant gr8 favor N mercy by saving my life. I can’t reach tha mountainz; disaster might catch me N I’ll die.&quot;}, {&quot;n&quot;: &quot;19:20&quot;, &quot;text&quot;: &quot;Dat town nearby is small. Please let me escape there—it’s only little—so I can live.”&quot;}, {&quot;n&quot;: &quot;19:21&quot;, &quot;text&quot;: &quot;He answered, “I’ll grant dis too. I won’t overthrow tha town u’ve mentioned.&quot;}, {&quot;n&quot;: &quot;19:22&quot;, &quot;text&quot;: &quot;Hurry there. I can’t act until u arrive.” Dat’s why tha town was named Zoar.&quot;}, {&quot;n&quot;: &quot;19:23&quot;, &quot;text&quot;: &quot;Tha sun had risen when Lot entered Zoar.&quot;}, {&quot;n&quot;: &quot;19:24&quot;, &quot;text&quot;: &quot;Then tha LORD rained burning sulfur N fire from heaven onto Sodom N Gomorrah.&quot;}, {&quot;n&quot;: &quot;19:25&quot;, &quot;text&quot;: &quot;He overthrew those citiez, tha whole plain, everyone living there, N everything growing from tha ground.&quot;}, {&quot;n&quot;: &quot;19:26&quot;, &quot;text&quot;: &quot;But Lot’s wife looked back from behind him N became a pillar of salt.&quot;}, {&quot;n&quot;: &quot;19:27&quot;, &quot;text&quot;: &quot;Early next morning Abraham returned 2 where he’d stood before tha LORD.&quot;}, {&quot;n&quot;: &quot;19:28&quot;, &quot;text&quot;: &quot;He looked toward Sodom, Gomorrah, N tha whole plain. Smoke rose from tha land like smoke from a furnace.&quot;}, {&quot;n&quot;: &quot;19:29&quot;, &quot;text&quot;: &quot;When God destroyed tha plain’s citiez, he remembered Abraham N brought Lot outta tha overthrow of tha citiez where he’d lived.&quot;}, {&quot;n&quot;: &quot;19:30&quot;, &quot;text&quot;: &quot;Lot was shook about staying in Zoar. He moved in2 tha mountainz wit his 2 daughterz N lived in a cave.&quot;}, {&quot;n&quot;: &quot;19:31&quot;, &quot;text&quot;: &quot;Tha older daughter told tha younger, “Our father’s old. There’s no man around 2 sleep wit us as people normally do.&quot;}, {&quot;n&quot;: &quot;19:32&quot;, &quot;text&quot;: &quot;Let’s give our father wine N sleep wit him, so we can preserve his family line.”&quot;}, {&quot;n&quot;: &quot;19:33&quot;, &quot;text&quot;: &quot;Dat night dey got deir father drinking. Tha older daughter slept wit him; he didn’t know when she lay down or got up.&quot;}, {&quot;n&quot;: &quot;19:34&quot;, &quot;text&quot;: &quot;Next day she said, “I slept wit him last night. Let’s give him wine again; u sleep wit him tonight 2 preserve our father’s line.”&quot;}, {&quot;n&quot;: &quot;19:35&quot;, &quot;text&quot;: &quot;Dey gave him wine again. Tha younger slept wit him; he didn’t know when she lay down or got up.&quot;}, {&quot;n&quot;: &quot;19:36&quot;, &quot;text&quot;: &quot;Both Lot’s daughterz became pregnant by deir father.&quot;}, {&quot;n&quot;: &quot;19:37&quot;, &quot;text&quot;: &quot;Tha older bore a son N named him Moab, ancestor of today’s Moabites.&quot;}, {&quot;n&quot;: &quot;19:38&quot;, &quot;text&quot;: &quot;Tha younger bore a son N named him Benammi, ancestor of today’s Ammonites.&quot;}], &quot;20&quot;: [{&quot;n&quot;: &quot;20:1&quot;, &quot;text&quot;: &quot;Abraham traveled south, living between Kadesh N Shur N staying awhile in Gerar.&quot;}, {&quot;n&quot;: &quot;20:2&quot;, &quot;text&quot;: &quot;He said Sarah was his sister. Abimelech, Gerar’s king, sent 4 her N took her.&quot;}, {&quot;n&quot;: &quot;20:3&quot;, &quot;text&quot;: &quot;God came 2 Abimelech in a nighttime dream: “U’re a dead man because of tha woman u took. She’s married.”&quot;}, {&quot;n&quot;: &quot;20:4&quot;, &quot;text&quot;: &quot;Abimelech hadn’t approached her. He asked, “Lord, would u destroy an innocent nation?&quot;}, {&quot;n&quot;: &quot;20:5&quot;, &quot;text&quot;: &quot;He told me, ‘She’s my sister.’ She said, ‘He’s my brother.’ My heart was honest; my handz were clean.”&quot;}, {&quot;n&quot;: &quot;20:6&quot;, &quot;text&quot;: &quot;God answered, “I know ur heart was honest. I kept u from sinning against me; dat’s why I didn’t let u touch her.&quot;}, {&quot;n&quot;: &quot;20:7&quot;, &quot;text&quot;: &quot;Return tha man’s wife. He’s a prophet; he’ll pray 4 u N u’ll live. Refuse, N u N everyone belonging 2 u will surely die.”&quot;}, {&quot;n&quot;: &quot;20:8&quot;, &quot;text&quot;: &quot;Abimelech got up early N told all his servantz. Dey were seriously shook.&quot;}, {&quot;n&quot;: &quot;20:9&quot;, &quot;text&quot;: &quot;He called Abraham: “What have u done 2 us? How did I wrong u, dat u brought dis gr8 sin on me N my kingdom? Dis shouldn’t happen.”&quot;}, {&quot;n&quot;: &quot;20:10&quot;, &quot;text&quot;: &quot;Abimelech asked, “What did u see dat made u do dis?”&quot;}, {&quot;n&quot;: &quot;20:11&quot;, &quot;text&quot;: &quot;Abraham said, “I thought nobody here stood in awe of God, N dey’d kill me over my wife.&quot;}, {&quot;n&quot;: &quot;20:12&quot;, &quot;text&quot;: &quot;Besides, she really is my sister—same father, different mother. She became my wife.&quot;}, {&quot;n&quot;: &quot;20:13&quot;, &quot;text&quot;: &quot;When God had me wander from my father’s house, I asked her, ‘Show me dis kindness: wherever we go, call me ur brother.’”&quot;}, {&quot;n&quot;: &quot;20:14&quot;, &quot;text&quot;: &quot;Abimelech gave Abraham sheep, cattle, N male N female servantz. He returned Sarah too.&quot;}, {&quot;n&quot;: &quot;20:15&quot;, &quot;text&quot;: &quot;“My land is open 2 u,” he said. “Live wherever u please.”&quot;}, {&quot;n&quot;: &quot;20:16&quot;, &quot;text&quot;: &quot;He told Sarah, “I’ve given ur brother 1,000 silver piecez. Before everyone wit u, dis clears ur name.” She was vindicated.&quot;}, {&quot;n&quot;: &quot;20:17&quot;, &quot;text&quot;: &quot;Abraham prayed. God healed Abimelech, his wife, N his female servantz, so dey could have children again.&quot;}, {&quot;n&quot;: &quot;20:18&quot;, &quot;text&quot;: &quot;Tha LORD had closed every womb in Abimelech’s household because of Sarah, Abraham’s wife.&quot;}], &quot;21&quot;: [{&quot;n&quot;: &quot;21:1&quot;, &quot;text&quot;: &quot;Tha LORD attended 2 Sarah exactly as he’d promised. His word became her reality.&quot;}, {&quot;n&quot;: &quot;21:2&quot;, &quot;text&quot;: &quot;She conceived N bore Abraham a son in his old age, right at tha time God had appointed.&quot;}, {&quot;n&quot;: &quot;21:3&quot;, &quot;text&quot;: &quot;Abraham named tha son Sarah bore him Isaac.&quot;}, {&quot;n&quot;: &quot;21:4&quot;, &quot;text&quot;: &quot;At 8 dayz old, Abraham circumcised Isaac as God commanded.&quot;}, {&quot;n&quot;: &quot;21:5&quot;, &quot;text&quot;: &quot;Abraham was 100 when Isaac was born.&quot;}, {&quot;n&quot;: &quot;21:6&quot;, &quot;text&quot;: &quot;Sarah said, “God has given me laughter. Everyone who hearz will laugh wit me.”&quot;}, {&quot;n&quot;: &quot;21:7&quot;, &quot;text&quot;: &quot;“Who would’ve told Abraham dat Sarah would nurse children? Yet I’ve borne him a son in his old age.”&quot;}, {&quot;n&quot;: &quot;21:8&quot;, &quot;text&quot;:
