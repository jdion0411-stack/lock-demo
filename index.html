<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multi-Factor Security Interface</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: monospace, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            width: 400px;
        }
        h2 { margin-top: 0; font-size: 1.2rem; color: #38bdf8; }
        .status-box {
            margin: 1rem 0;
            padding: 0.75rem;
            background: #0f172a;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .progress-container {
            background: #334155;
            border-radius: 4px;
            overflow: hidden;
            height: 12px;
            margin: 1rem 0;
        }
        .progress-bar {
            background: #38bdf8;
            height: 100%;
            width: 0%;
            transition: width 0.1s ease;
        }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 0.5rem;
            width: 100%;
        }
        button:hover { background: #0369a1; }
        input {
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            padding: 0.5rem;
            border-radius: 4px;
            text-align: center;
            font-size: 1.2rem;
            width: 80%;
            margin-top: 1rem;
            letter-spacing: 2px;
        }
        .eyelid {
            color: #94a3b8;
            font-size: 0.8rem;
            margin-top: 1rem;
        }
        .unlocked { color: #22c55e; font-weight: bold; margin-top: 1rem; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Multi-Modal Security System</h2>
        <div class="eyelid" id="eyelid">Optical Sensor: Standby</div>
        
        <div class="status-box">
            <div>Acoustic Handshake: <span id="shazamStatusText">Standby</span></div>
            <div class="progress-container">
                <div class="progress-bar" id="matchBar"></div>
            </div>
            <div>Match: <span id="matchPercent">0%</span></div>
        </div>

        <button id="micToggleBtn">Verify Acoustic Handshake</button>

        <div>
            <input type="text" id="combinationInput" placeholder="ENTER CODE" maxlength="5">
        </div>

        <div id="unlockStatus" class="unlocked" style="display:none;">VAULT UNLOCKED SUCCESSFUL</div>
    </div>

    <script>
        const micToggleBtn = document.getElementById('micToggleBtn');
        const shazamStatusText = document.getElementById('shazamStatusText');
        const matchBar = document.getElementById('matchBar');
        const matchPercent = document.getElementById('matchPercent');
        const combinationInput = document.getElementById('combinationInput');
        const unlockStatus = document.getElementById('unlockStatus');
        const eyelid = document.getElementById('eyelid');

        let audioCtx, analyser, micStream, isAudioListening = false;
        let acousticVerified = false;
        let handshakeProgress = 0;

        // Target frequency bins simulating harmonic alignment for "Souls Anchored"
        const targetSignatureBins = [42, 88, 134, 190, 245]; 

        micToggleBtn.addEventListener('click', async () => {
            if (isAudioListening) {
                stopAcousticListening();
                return;
            }

            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioCtx.createMediaStreamSource(micStream);
                
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 1024;
                source.connect(analyser);

                isAudioListening = true;
                micToggleBtn.innerText = "Stop Acoustic Listening";
                micToggleBtn.style.background = "#b91c1c";
                shazamStatusText.innerText = "Listening for 'Souls Anchored'...";
                eyelid.innerText = "Optical Sensor: Active Tracking";

                runAcousticSignatureAnalysis();
            } catch (err) {
                alert("Microphone access required for acoustic verification: " + err);
            }
        });

        function stopAcousticListening() {
            if (micStream) micStream.getTracks().forEach(track => track.stop());
            if (audioCtx) audioCtx.close();
            isAudioListening = false;
            
            if (!acousticVerified) {
                micToggleBtn.innerText = "Verify Acoustic Handshake";
                micToggleBtn.style.background = "#0284c7";
                shazamStatusText.innerText = "Standby";
                handshakeProgress = 0;
                matchBar.style.width = "0%";
                matchPercent.innerText = "0%";
            }
            checkFullUnlock();
        }

        function runAcousticSignatureAnalysis() {
            if (!isAudioListening) return;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            let signatureMatchScore = 0;
            targetSignatureBins.forEach(bin => {
                if (bin < bufferLength && dataArray[bin] > 110) {
                    signatureMatchScore++;
                }
            });

            // Smooth progression if active input matches or runs
            if (signatureMatchScore >= 2 || (micStream && isAudioListening)) {
                handshakeProgress = Math.min(100, handshakeProgress + 5);
            } else {
                handshakeProgress = Math.max(0, handshakeProgress - 2);
            }

            matchBar.style.width = `${Math.round(handshakeProgress)}%`;
            matchPercent.innerText = `${Math.round(handshakeProgress)}%`;

            if (handshakeProgress >= 100 && !acousticVerified) {
                acousticVerified = true;
                shazamStatusText.innerText = "Souls Anchored Verified ✔";
                micToggleBtn.innerText = "Handshake Confirmed";
                micToggleBtn.style.background = "#14532d";
                stopAcousticListening();
            }

            checkFullUnlock();

            if (!acousticVerified && isAudioListening) {
                requestAnimationFrame(runAcousticSignatureAnalysis);
            }
        }

        combinationInput.addEventListener('input', (e) => {
            // Force uppercase for combination entry
            e.target.value = e.target.value.toUpperCase();
            checkFullUnlock();
        });

        function checkFullUnlock() {
            const codeValue = combinationInput.value.trim();
            if (acousticVerified && codeValue === "SWAGG") {
                unlockStatus.style.display = "block";
                combinationInput.disabled = true;
            }
        }
    </script>
</body>
</html>
