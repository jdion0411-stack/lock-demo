&quot;n&quot;: &quot;38:24&quot;, &quot;text&quot;: &quot;About 3 monthz later, Judah heard Tamar was pregnant through prostitution. “Bring her out N burn her!” he ordered.&quot;}, {&quot;n&quot;: &quot;38:25&quot;, &quot;text&quot;: &quot;Being brought out, she sent tha pledge: “I’m pregnant by tha owner of these. Recognize tha seal, cord, N staff?”&quot;}, {&quot;n&quot;: &quot;38:26&quot;, &quot;text&quot;: &quot;Judah recognized ’em: “She’s more righteous than me. I didn’t give her Shelah.” He never slept wit her again.&quot;}, {&quot;n&quot;: &quot;38:27&quot;, &quot;text&quot;: &quot;When she gave birth, she had twinz.&quot;}, {&quot;n&quot;: &quot;38:28&quot;, &quot;text&quot;: &quot;1 put out a hand. Tha midwife tied scarlet thread around it: “Dis 1 came 1st.”&quot;}, {&quot;n&quot;: &quot;38:29&quot;, &quot;text&quot;: &quot;He drew back, N his brother came out. “What a breakthrough u made!” she said. He was named Pharez.&quot;}, {&quot;n&quot;: &quot;38:30&quot;, &quot;text&quot;: &quot;Then came his brother wit tha scarlet thread. He was named Zarah.&quot;}], &quot;39&quot;: [{&quot;n&quot;: &quot;39:1&quot;, &quot;text&quot;: &quot;Joseph reached Egypt. Potiphar, Pharaoh’s Egyptian official N guard captain, bought him from tha Ishmaelites.&quot;}, {&quot;n&quot;: &quot;39:2&quot;, &quot;text&quot;: &quot;Tha LORD stayed wit Joseph, giving him success in his Egyptian master’s house.&quot;}, {&quot;n&quot;: &quot;39:3&quot;, &quot;text&quot;: &quot;Potiphar saw tha LORD wit him N everything he handled prospering.&quot;}, {&quot;n&quot;: &quot;39:4&quot;, &quot;text&quot;: &quot;Joseph won his favor. Potiphar put him over tha household N entrusted everything 2 him.&quot;}, {&quot;n&quot;: &quot;39:5&quot;, &quot;text&quot;: &quot;From then on, tha LORD blessed Potiphar’s house N fieldz because of Joseph.&quot;}, {&quot;n&quot;: &quot;39:6&quot;, &quot;text&quot;: &quot;He left everything 2 Joseph, worrying only about his food. Joseph was well-built N handsome.&quot;}, {&quot;n&quot;: &quot;39:7&quot;, &quot;text&quot;: &quot;His master’s wife noticed him. “Sleep wit me.”&quot;}, {&quot;n&quot;: &quot;39:8&quot;, &quot;text&quot;: &quot;He refused: “My master doesn’t worry about anything here. He trusted me wit everything.&quot;}, {&quot;n&quot;: &quot;39:9&quot;, &quot;text&quot;: &quot;Nobody in dis house rankz above me. He withheld only u, his wife. How could I do dis gr8 evil N sin against God?”&quot;}, {&quot;n&quot;: &quot;39:10&quot;, &quot;text&quot;: &quot;Day after day she pressured him. He refused 2 sleep wit her or even stay beside her.&quot;}, {&quot;n&quot;: &quot;39:11&quot;, &quot;text&quot;: &quot;1 day Joseph went inside 2 work. No other household men were there.&quot;}, {&quot;n&quot;: &quot;39:12&quot;, &quot;text&quot;: &quot;She grabbed his garment: “Sleep wit me!” He left it in her hand N bounced outside.&quot;}, {&quot;n&quot;: &quot;39:13&quot;, &quot;text&quot;: &quot;Seeing he’d fled N left tha garment,&quot;}, {&quot;n&quot;: &quot;39:14&quot;, &quot;text&quot;: &quot;she called tha household men: “Look! He brought dis Hebrew here 2 insult us. He tried 2 sleep wit me; I screamed!&quot;}, {&quot;n&quot;: &quot;39:15&quot;, &quot;text&quot;: &quot;When he heard me scream, he left his garment N ran outside.”&quot;}, {&quot;n&quot;: &quot;39:16&quot;, &quot;text&quot;: &quot;She kept tha garment till his master returned.&quot;}, {&quot;n&quot;: &quot;39:17&quot;, &quot;text&quot;: &quot;She told him, “Dat Hebrew servant u brought tried 2 make a mockery of me.&quot;}, {&quot;n&quot;: &quot;39:18&quot;, &quot;text&quot;: &quot;When I screamed, he left his garment N fled.”&quot;}, {&quot;n&quot;: &quot;39:19&quot;, &quot;text&quot;: &quot;Hearing his wife’s accusation, Joseph’s master became furious.&quot;}, {&quot;n&quot;: &quot;39:20&quot;, &quot;text&quot;: &quot;He put Joseph in tha prison holding tha king’s prisonerz. Joseph remained there.&quot;}, {&quot;n&quot;: &quot;39:21&quot;, &quot;text&quot;: &quot;But tha LORD stayed wit Joseph, showing kindness N giving him tha prison keeper’s favor.&quot;}, {&quot;n&quot;: &quot;39:22&quot;, &quot;text&quot;: &quot;Tha keeper entrusted Joseph wit all tha prisonerz N everything done there.&quot;}, {&quot;n&quot;: &quot;39:23&quot;, &quot;text&quot;: &quot;He didn’t need 2 inspect Joseph’s work. Tha LORD was wit Joseph N made his work prosper.&quot;}], &quot;40&quot;: [{&quot;n&quot;: &quot;40:1&quot;, &quot;text&quot;: &quot;Later Egypt’s royal cupbearer N baker offended deir king.&quot;}, {&quot;n&quot;: &quot;40:2&quot;, &quot;text&quot;: &quot;Pharaoh became angry wit both chief officialz.&quot;}, {&quot;n&quot;: &quot;40:3&quot;, &quot;text&quot;: &quot;He confined ’em in tha guard captain’s house, tha prison holding Joseph.&quot;}, {&quot;n&quot;: &quot;40:4&quot;, &quot;text&quot;: &quot;Tha captain assigned Joseph 2 attend ’em. Dey stayed in custody awhile.&quot;}, {&quot;n&quot;: &quot;40:5&quot;, &quot;text&quot;: &quot;1 night both men dreamed, each dream carrying its own meaning.&quot;}, {&quot;n&quot;: &quot;40:6&quot;, &quot;text&quot;: &quot;Joseph saw ’em next morning looking troubled.&quot;}, {&quot;n&quot;: &quot;40:7&quot;, &quot;text&quot;: &quot;“Why tha long facez today?” he asked.&quot;}, {&quot;n&quot;: &quot;40:8&quot;, &quot;text&quot;: &quot;“We dreamed, but nobody can interpret.” Joseph said, “Interpretationz belong 2 God. Tell me.”&quot;}, {&quot;n&quot;: &quot;40:9&quot;, &quot;text&quot;: &quot;Tha chief cupbearer said, “I saw a vine.&quot;}, {&quot;n&quot;: &quot;40:10&quot;, &quot;text&quot;: &quot;It had 3 branchez. It budded, blossomed, N produced ripe grapez.&quot;}, {&quot;n&quot;: &quot;40:11&quot;, &quot;text&quot;: &quot;I held Pharaoh’s cup, squeezed tha grapez in2 it, N placed it in his hand.”&quot;}, {&quot;n&quot;: &quot;40:12&quot;, &quot;text&quot;: &quot;Joseph said, “Tha 3 branchez mean 3 dayz.&quot;}, {&quot;n&quot;: &quot;40:13&quot;, &quot;text&quot;: &quot;Within 3 dayz Pharaoh will lift ur head N restore ur position. U’ll serve his cup again.&quot;}, {&quot;n&quot;: &quot;40:14&quot;, &quot;text&quot;: &quot;When things go well, remember me. Show kindness, mention me 2 Pharaoh, N get me out.&quot;}, {&quot;n&quot;: &quot;40:15&quot;, &quot;text&quot;: &quot;I was kidnapped from Hebrew territory. Here too, I did nothing deserving dis dungeon.”&quot;}, {&quot;n&quot;: &quot;40:16&quot;, &quot;text&quot;: &quot;Hearing tha favorable meaning, tha chief baker said, “I dreamed of 3 white basketz on my head.&quot;}, {&quot;n&quot;: &quot;40:17&quot;, &quot;text&quot;: &quot;Tha top 1 held Pharaoh’s baked foodz. Birdz ate from it.”&quot;}, {&quot;n&quot;: &quot;40:18&quot;, &quot;text&quot;: &quot;Joseph answered, “Tha 3 basketz mean 3 dayz.&quot;}, {&quot;n&quot;: &quot;40:19&quot;, &quot;text&quot;: &quot;Within 3 dayz Pharaoh will lift ur head off u N hang u on a tree. Birdz will eat ur flesh.”&quot;}, {&quot;n&quot;: &quot;40:20&quot;, &quot;text&quot;: &quot;Tha 3rd day was Pharaoh’s birthday. At his feast, he brought tha 2 chiefz before his servantz.&quot;}, {&quot;n&quot;: &quot;40:21&quot;, &quot;text&quot;: &quot;He restored tha cupbearer, who again placed tha cup in his hand.&quot;}, {&quot;n&quot;: &quot;40:22&quot;, &quot;text&quot;: &quot;He hanged tha baker, exactly as Joseph interpreted.&quot;}, {&quot;n&quot;: &quot;40:23&quot;, &quot;text&quot;: &quot;But tha cupbearer didn’t remember Joseph. He forgot him.&quot;}], &quot;41&quot;: [{&quot;n&quot;: &quot;41:1&quot;, &quot;text&quot;: &quot;2 full yearz later, Pharaoh dreamed he stood beside tha river.&quot;}, {&quot;n&quot;: &quot;41:2&quot;, &quot;text&quot;: &quot;7 healthy, fat cowz came up N grazed among tha reedz.&quot;}, {&quot;n&quot;: &quot;41:3&quot;, &quot;text&quot;: &quot;7 ugly, thin cowz followed N stood beside ’em.&quot;}, {&quot;n&quot;: &quot;41:4&quot;, &quot;text&quot;: &quot;Tha thin cowz ate tha 7 healthy cowz. Pharaoh woke.&quot;}, {&quot;n&quot;: &quot;41:5&quot;, &quot;text&quot;: &quot;He slept N dreamed again: 7 full, healthy grain headz grew on 1 stalk.&quot;}, {&quot;n&quot;: &quot;41:6&quot;, &quot;text&quot;: &quot;7 thin headz, scorched by tha east wind, sprouted afterward.&quot;}, {&quot;n&quot;: &quot;41:7&quot;, &quot;text&quot;: &quot;Tha thin headz swallowed tha full headz. Pharaoh woke N realized it was a dream.&quot;}, {&quot;n&quot;: &quot;41:8&quot;, &quot;text&quot;: &quot;Troubled next morning, he summoned Egypt’s magicianz N wise men. Nobody could explain tha dreamz.&quot;}, {&quot;n&quot;: &quot;41:9&quot;, &quot;text&quot;: &quot;Tha cupbearer said, “Today I remember my failure.&quot;}, {&quot;n&quot;: &quot;41:10&quot;, &quot;text&quot;: &quot;Pharaoh once confined me N tha chief baker in tha guard captain’s house.&quot;}, {&quot;n&quot;: &quot;41:11&quot;, &quot;text&quot;: &quot;We both dreamed tha same night, each dream wit its own meaning.&quot;}, {&quot;n&quot;: &quot;41:12&quot;, &quot;text&quot;: &quot;A young Hebrew, tha captain’s servant, interpreted each dream 4 us.&quot;}, {&quot;n&quot;: &quot;41:13&quot;, &quot;text&quot;: &quot;It happened exactly as he said: I was restored; tha baker was hanged.”&quot;}, {&quot;n&quot;: &quot;41:14&quot;, &quot;text&quot;: &quot;Pharaoh summoned Joseph. Dey rushed him from tha dungeon. He shaved, changed clothez, N came before Pharaoh.&quot;}, {&quot;n&quot;: &quot;41:15&quot;, &quot;text&quot;: &quot;“Nobody can explain my dream. I hear u can understand N interpret dreamz.”&quot;}, {&quot;n&quot;: &quot;41:16&quot;, &quot;text&quot;: &quot;Joseph answered, “Dat ability isn’t mine. God will give Pharaoh tha answer he needz.”&quot;}, {&quot;n&quot;: &quot;41:17&quot;, &quot;text&quot;: &quot;Pharaoh said, “I stood on tha riverbank.&quot;}, {&quot;n&quot;: &quot;41:18&quot;, &quot;text&quot;: &quot;7 healthy, fat cowz came out N grazed.&quot;}, {&quot;n&quot;: &quot;41:19&quot;, &quot;text&quot;: &quot;7 terribly ugly, thin cowz followed—worse than any I’ve seen in Egypt.&quot;}, {&quot;n&quot;: &quot;41:20&quot;, &quot;text&quot;: &quot;Dey ate tha 7 fat cowz.&quot;}, {&quot;n&quot;: &quot;41:21&quot;, &quot;text&quot;: &quot;After eating, dey looked just as thin. U couldn’t tell dey’d eaten. Then I woke.&quot;}, {&quot;n&quot;: &quot;41:22&quot;, &quot;text&quot;: &quot;In another dream, 7 full, healthy grain headz grew on 1 stalk.&quot;}, {&quot;n&quot;: &quot;41:23&quot;, &quot;text&quot;: &quot;Then 7 withered, thin headz scorched by tha east wind sprouted.&quot;}, {&quot;n&quot;: &quot;41:24&quot;, &quot;text&quot;: &quot;Tha thin headz swallowed tha 7 good headz. No magician could explain it.”&quot;}, {&quot;n&quot;: &quot;41:25&quot;, &quot;text&quot;: &quot;Joseph said, “Both dreamz carry 1 message. God showed Pharaoh what he’s about 2 do.&quot;}, {&quot;n&quot;: &quot;41:26&quot;, &quot;text&quot;: &quot;Tha 7 good cowz N 7 good grain headz mean 7 yearz. Same dream.&quot;}, {&quot;n&quot;: &quot;41:27&quot;, &quot;text&quot;: &quot;Tha 7 thin cowz N empty, wind-scorched headz mean 7 yearz of famine.&quot;}, {&quot;n&quot;: &quot;41:28&quot;, &quot;text&quot;: &quot;Like I said, God revealed his coming action 2 Pharaoh.&quot;}, {&quot;n&quot;: &quot;41:29&quot;, &quot;text&quot;: &quot;7 yearz of gr8 abundance are coming throughout Egypt.&quot;}, {&quot;n&quot;: &quot;41:30&quot;, &quot;text&quot;: &quot;Then 7 famine yearz will swallow all memory of abundance N devastate tha land.&quot;}, {&quot;n&quot;: &quot;41:31&quot;, &quot;text&quot;: &quot;Tha famine will b so severe dat tha earlier abundance won’t b remembered.&quot;}, {&quot;n&quot;: &quot;41:32&quot;, &quot;text&quot;: &quot;Tha repeated dream meanz God has fixed dis N will bring it soon.&quot;}, {&quot;n&quot;: &quot;41:33&quot;, &quot;text&quot;: &quot;Choose a discerning, wise man 2 oversee Egypt.&quot;}, {&quot;n&quot;: &quot;41:34&quot;, &quot;text&quot;: &quot;Appoint officialz 2 collect 1/5 of tha harvest during tha 7 abundant yearz.&quot;}, {&quot;n&quot;: &quot;41:35&quot;, &quot;text&quot;: &quot;Gather tha coming food surplus N store grain in tha citiez under Pharaoh’s authority.&quot;}, {&quot;n&quot;: &quot;41:36&quot;, &quot;text&quot;: &quot;Keep it 4 tha 7 famine yearz, so Egypt doesn’t perish.”&quot;}, {&quot;n&quot;: &quot;41:37&quot;, &quot;text&quot;: &quot;Pharaoh N his officialz approved tha plan.&quot;}, {&quot;n&quot;: &quot;41:38&quot;, &quot;text&quot;: &quot;Pharaoh asked, “Can we find another man like dis, carrying God’s Spirit?”&quot;}, {&quot;n&quot;: &quot;41:39&quot;, &quot;text&quot;: &quot;He told Joseph, “God showed u all dis. Nobody’s as discerning N wise.&quot;}, {&quot;n&quot;: &quot;41:40&quot;, &quot;text&quot;: &quot;U’ll oversee my household. My people will obey ur orderz. Only tha throne will place me above u.”&quot;}, {&quot;n&quot;: &quot;41:41&quot;, &quot;text&quot;: &quot;“I put u over all Egypt.”&quot;}, {&quot;n&quot;: &quot;41:42&quot;, &quot;text&quot;: &quot;Pharaoh gave Joseph his signet ring N royal swag: fine linen N a gold chain around his neck.&quot;}, {&quot;n&quot;: &quot;41:43&quot;, &quot;text&quot;: &quot;He rode in Pharaoh’s 2nd chariot. People called, “Bow tha knee!” Joseph was appointed over Egypt.&quot;}, {&quot;n&quot;: &quot;41:44&quot;, &quot;text&quot;: &quot;Pharaoh said, “I’m Pharaoh, but nobody in Egypt will lift a hand or foot without ur authorization.”&quot;}, {&quot;n&quot;: &quot;41:45&quot;, &quot;text&quot;: &quot;He named Joseph Zaphnathpaaneah N gave him Asenath, daughter of Potipherah, priest of On, as a wife. Joseph toured Egypt.&quot;}, {&quot;n&quot;: &quot;41:46&quot;, &quot;text&quot;: &quot;Joseph was 30 when he entered Pharaoh’s service. He bounced from Pharaoh’s presence N traveled throughout Egypt.&quot;}, {&quot;n&quot;: &quot;41:47&quot;, &quot;text&quot;: &quot;During tha 7 abundant yearz, tha land produced huge harvestz.&quot;}, {&quot;n&quot;: &quot;41:48&quot;, &quot;text&quot;: &quot;He gathered tha surplus N stored each region’s food in its nearby city.&quot;}, {&quot;n&quot;: &quot;41:49&quot;, &quot;text&quot;: &quot;Grain piled up like seashore sand. He stopped counting; there was too much 2 measure.&quot;}, {&quot;n&quot;: &quot;41:50&quot;, &quot;text&quot;: &quot;Before tha famine, Asenath bore Joseph 2 sonz.&quot;}, {&quot;n&quot;: &quot;41:51&quot;, &quot;text&quot;: &quot;He named tha firstborn Manasseh: “God made me forget my hardship N my father’s household.”&quot;}, {&quot;n&quot;: &quot;41:52&quot;, &quot;text&quot;: &quot;He named tha 2nd Ephraim: “God made me fruitful in tha land of my suffering.”&quot;}, {&quot;n&quot;: &quot;41:53&quot;, &quot;text&quot;: &quot;Egypt’s 7 abundant yearz ended.&quot;}, {&quot;n&quot;: &quot;41:54&quot;, &quot;text&quot;: &quot;Tha 7 famine yearz began, as Joseph predicted. Other landz hungered, but Egypt had bread.&quot;}, {&quot;n&quot;: &quot;41:55&quot;, &quot;text&quot;: &quot;When Egypt grew hungry, people cried 2 Pharaoh. “Go 2 Joseph. Do what he tellz u.”&quot;}, {&quot;n&quot;: &quot;41:56&quot;, &quot;text&quot;: &quot;Famine covered tha earth. Joseph opened tha storehousez N sold grain 2 tha Egyptians as hunger worsened.&quot;}, {&quot;n&quot;: &quot;41:57&quot;, &quot;text&quot;: &quot;People from every country came 2 Joseph 4 grain because famine gripped every land.&quot;}], &quot;42&quot;: [{&quot;n&quot;: &quot;42:1&quot;, &quot;text&quot;: &quot;Jacob heard Egypt had grain. “Why are u just looking at each other?” he asked his sonz.&quot;}, {&quot;n&quot;: &quot;42:2&quot;, &quot;text&quot;: &quot;“Go buy food there so we live instead of dying.”&quot;}, {&quot;n&quot;: &quot;42:3&quot;, &quot;text&quot;: &quot;Joseph’s 10 brotherz went down 2 Egypt 4 grain.&quot;}, {&quot;n&quot;: &quot;42:4&quot;, &quot;text&quot;: &quot;Jacob kept Benjamin home, worrying harm might reach him.&quot;}, {&quot;n&quot;: &quot;42:5&quot;, &quot;text&quot;: &quot;Israel’s sonz joined tha buyerz because Canaan was starving too.&quot;}, {&quot;n&quot;: &quot;42:6&quot;, &quot;text&quot;: &quot;Joseph governed Egypt N handled grain salez. His brotherz came N bowed facedown before him.&quot;}, {&quot;n&quot;: &quot;42:7&quot;, &quot;text&quot;: &quot;He recognized ’em but acted like a stranger, speaking harshly. “Where u from?” “Canaan. We came 4 food.”&quot;}, {&quot;n&quot;: &quot;42:8&quot;, &quot;text&quot;: &quot;Joseph knew ’em. Dey didn’t know him.&quot;}, {&quot;n&quot;: &quot;42:9&quot;, &quot;text&quot;: &quot;Remembering his dreamz, he said, “U’re spiez, here 2 inspect our weakness.”&quot;}, {&quot;n&quot;: &quot;42:10&quot;, &quot;text&quot;: &quot;“No, my lord! Ur servantz came 2 buy food.&quot;}, {&quot;n&quot;: &quot;42:11&quot;, &quot;text&quot;: &quot;We’re all 1 man’s sonz. Honest men, no spiez.”&quot;}, {&quot;n&quot;: &quot;42:12&quot;, &quot;text&quot;: &quot;“No. U came 2 see where tha land’s unprotected.”&quot;}, {&quot;n&quot;: &quot;42:13&quot;, &quot;text&quot;: &quot;“We’re 12 brotherz from Canaan. Tha youngest is wit our father; 1 is gone.”&quot;}, {&quot;n&quot;: &quot;42:14&quot;, &quot;text&quot;: &quot;Joseph said, “Exactly what I said—spiez!&quot;}, {&quot;n&quot;: &quot;42:15&quot;, &quot;text&quot;: &quot;Here’s ur test. By Pharaoh’s life, u won’t bounce unless ur youngest brother comez.&quot;}, {&quot;n&quot;: &quot;42:16&quot;, &quot;text&quot;: &quot;Send 1 2 fetch him. Tha rest stay imprisoned till ur story’s checked. Otherwise, by Pharaoh’s life, u’re spiez.”&quot;}, {&quot;n&quot;: &quot;42:17&quot;, &quot;text&quot;: &quot;He jailed ’em together 4 3 dayz.&quot;}, {&quot;n&quot;: &quot;42:18&quot;, &quot;text&quot;: &quot;On tha 3rd day Joseph said, “Do dis N live. I revere God.&quot;}, {&quot;n&quot;: &quot;42:19&quot;, &quot;text&quot;: &quot;If u’re honest, leave 1 brother in custody. Tha rest can take grain 2 ur starving householdz.&quot;}, {&quot;n&quot;: &quot;42:20&quot;, &quot;text&quot;: &quot;Bring tha youngest back. Dat’ll prove ur story N spare ur livez.” Dey agreed.&quot;}, {&quot;n&quot;: &quot;42:21&quot;, &quot;text&quot;: &quot;Dey told each other, “We’re guilty over our brother. We saw his anguish N ignored his pleading. Dat’s why dis trouble hit us.”&quot;}, {&quot;n&quot;: &quot;42:22&quot;, &quot;text&quot;: &quot;Reuben said, “Didn’t I warn u not 2 sin against tha boy? U wouldn’t listen. Now his blood demandz an account.”&quot;}, {&quot;n&quot;: &quot;42:23&quot;, &quot;text&quot;: &quot;Dey didn’t know Joseph understood; he’d been using an interpreter.&quot;}, {&quot;n&quot;: &quot;42:24&quot;, &quot;text&quot;: &quot;He turned away N wept, then returned. He took Simeon N bound him before deir eyez.&quot;}, {&quot;n&quot;: &quot;42:25&quot;, &quot;text&quot;: &quot;Joseph ordered grain 4 deir sackz, each man’s money returned secretly, N provisionz 4 tha road. It was done.&quot;}, {&quot;n&quot;: &quot;42:26&quot;, &quot;text&quot;: &quot;Dey loaded deir donkeyz N bounced.&quot;}, {&quot;n&quot;: &quot;42:27&quot;, &quot;text&quot;: &quot;At a lodging place, 1 opened his sack 2 feed his donkey N found his money at tha top.&quot;}, {&quot;n&quot;: &quot;42:28&quot;, &quot;text&quot;: &quot;“My money’s back!” Deir heartz sank. Shook, dey asked, “What has God done 2 us?”&quot;}, {&quot;n&quot;: &quot;42:29&quot;, &quot;text&quot;: &quot;In Canaan, dey told Jacob everything:&quot;}, {&quot;n&quot;: &quot;42:30&quot;, &quot;text&quot;: &quot;“Tha land’s ruler spoke harshly N called us spiez.&quot;}, {&quot;n&quot;: &quot;42:31&quot;, &quot;text&quot;: &quot;We told him, ‘We’re honest, no spiez.&quot;}, {&quot;n&quot;: &quot;42:32&quot;, &quot;text&quot;: &quot;We’re 12 brotherz. 1 is gone; tha youngest is wit our father in Canaan.’&quot;}, {&quot;n&quot;: &quot;42:33&quot;, &quot;text&quot;: &quot;He said, ‘Leave 1 brother. Take food 4 ur starving householdz N bounce.&quot;}, {&quot;n&quot;: &quot;42:34&quot;, &quot;text&quot;: &quot;Bring ur youngest. Then I’ll know u’re honest, release ur brother, N let u trade here.’”&quot;}, {&quot;n&quot;: &quot;42:35&quot;, &quot;text&quot;: &quot;Emptying deir sackz, every man found his money bundle. Dey N deir father were shook.&quot;}, {&quot;n&quot;: &quot;42:36&quot;, &quot;text&quot;: &quot;Jacob said, “U’ve robbed me of my children! Joseph’s gone, Simeon’s gone, N now Benjamin? Everything’s against me!”&quot;}, {&quot;n&quot;: &quot;42:37&quot;, &quot;text&quot;: &quot;Reuben said, “Kill my 2 sonz if I don’t bring him back. Entrust him 2 me; I’ll return him.”&quot;}, {&quot;n&quot;: &quot;42:38&quot;, &quot;text&quot;: &quot;“My son won’t go. His brother’s dead; he alone remainz. If harm reachz him, u’ll send my gray head grieving 2 tha grave.”&quot;}], &quot;43&quot;: [{&quot;n&quot;: &quot;43:1&quot;, &quot;text&quot;: &quot;Tha famine kept hitting hard.&quot;}, {&quot;n&quot;: &quot;43:2&quot;, &quot;text&quot;: &quot;When Egypt’s grain ran out, Jacob said, “Go back N buy some food.”&quot;}, {&quot;n&quot;: &quot;43:3&quot;, &quot;text&quot;: &quot;Judah answered, “Tha man warned us: ‘U won’t see me unless ur brother’s wit u.’&quot;}, {&quot;n&quot;: &quot;43:4&quot;, &quot;text&quot;: &quot;Send our brother N we’ll buy ur food.&quot;}, {&quot;n&quot;: &quot;43:5&quot;, &quot;text&quot;: &quot;Otherwise we’re not going. He said we can’t face him without Benjamin.”&quot;}, {&quot;n&quot;: &quot;43:6&quot;, &quot;text&quot;: &quot;Israel asked, “Why do me like dis? Why tell him u had another brother?”&quot;}, {&quot;n&quot;: &quot;43:7&quot;, &quot;text&quot;: &quot;“He questioned us closely about our family: ‘Is ur father alive? Another brother?’ We answered. How could we know he’d demand him?”&quot;}, {&quot;n&quot;: &quot;43:8&quot;, &quot;text&quot;: &quot;Judah said, “Send tha boy wit me. Let’s move so we, u, N our children can live.&quot;}, {&quot;n&quot;: &quot;43:9&quot;, &quot;text&quot;: &quot;I’ll personally guarantee him. Hold me responsible. If I don’t return him, I’ll bear tha blame forever.&quot;}, {&quot;n&quot;: &quot;43:10&quot;, &quot;text&quot;: &quot;Without all dis delay, we could’ve gone N returned twice.”&quot;}, {&quot;n&quot;: &quot;43:11&quot;, &quot;text&quot;: &quot;Israel answered, “If it must happen, take a gift of our land’s best: balm, honey, spicez, myrrh, nutz, N almondz.&quot;}, {&quot;n&quot;: &quot;43:12&quot;, &quot;text&quot;: &quot;Take double tha money N return what was in ur sackz. Maybe it was a mistake.&quot;}, {&quot;n&quot;: &quot;43:13&quot;, &quot;text&quot;: &quot;Take ur brother. Go back 2 tha man.&quot;}, {&quot;n&quot;: &quot;43:14&quot;, &quot;text&quot;: &quot;May God Almighty give u mercy so he releasez Simeon N Benjamin. If I lose my children, I lose ’em.”&quot;}, {&quot;n&quot;: &quot;43:15&quot;, &quot;text&quot;: &quot;Dey took tha gift, double money, N Benjamin, N went 2 stand before Joseph in Egypt.&quot;}, {&quot;n&quot;: &quot;43:16&quot;, &quot;text&quot;: &quot;Seeing Benjamin, Joseph told his steward, “Bring these men home. Prepare an animal; dey’ll eat wit me at noon.”&quot;}, {&quot;n&quot;: &quot;43:17&quot;, &quot;text&quot;: &quot;Tha steward obeyed N brought ’em in2 Joseph’s house.&quot;}, {&quot;n&quot;: &quot;43:18&quot;, &quot;text&quot;: &quot;Dey were shook: “It’s tha returned money. He’ll accuse us, attack us, N seize us as slavez, along wit our donkeyz.”&quot;}, {&quot;n&quot;: &quot;43:19&quot;, &quot;text&quot;: &quot;At tha entrance, dey approached tha steward.&quot;}, {&quot;n&quot;: &quot;43:20&quot;, &quot;text&quot;: &quot;“Sir, our 1st trip was 2 buy food.&quot;}, {&quot;n&quot;: &quot;43:21&quot;, &quot;text&quot;: &quot;At tha lodging place, each of us found all his money in his sack. We brought it back.&quot;}, {&quot;n&quot;: &quot;43:22&quot;, &quot;text&quot;: &quot;We brought more 4 food. We don’t know who put tha money there.”&quot;}, {&quot;n&quot;: &quot;43:23&quot;, &quot;text&quot;: &quot;He answered, “Peace. Don’t b shook. Ur God N ur father’s God gave u treasure. I received ur payment.” He brought Simeon out.&quot;}, {&quot;n&quot;: &quot;43:24&quot;, &quot;text&quot;: &quot;He led ’em inside, gave water 4 deir feet, N fed deir donkeyz.&quot;}, {&quot;n&quot;: &quot;43:25&quot;, &quot;text&quot;: &quot;Dey readied tha gift 4 Joseph’s noon arrival, knowing dey’d eat there.&quot;}, {&quot;n&quot;: &quot;43:26&quot;, &quot;text&quot;: &quot;When he came home, dey presented tha gift N bowed 2 tha ground.&quot;}, {&quot;n&quot;: &quot;43:27&quot;, &quot;text&quot;: &quot;He asked how dey were: “Ur elderly father—is he well? Still alive?”&quot;}, {&quot;n&quot;: &quot;43:28&quot;, &quot;text&quot;: &quot;“Ur servant our father is alive N well.” Dey bowed again.&quot;}, {&quot;n&quot;: &quot;43:29&quot;, &quot;text&quot;: &quot;Joseph saw Benjamin, his own mother’s son. “Dis ur youngest brother? God b gracious 2 u, my son.”&quot;}, {&quot;n&quot;: &quot;43:30&quot;, &quot;text&quot;: &quot;Overcome wit love 4 his brother, Joseph hurried in2 a private room N wept.&quot;}, {&quot;n&quot;: &quot;43:31&quot;, &quot;text&quot;: &quot;He washed his face, regained control, N returned: “Serve tha food.”&quot;}, {&quot;n&quot;: &quot;43:32&quot;, &quot;text&quot;: &quot;Joseph ate separately, his brotherz separately, N tha Egyptians separately, because Egyptians considered eating wit Hebrews unacceptable.&quot;}, {&quot;n&quot;: &quot;43:33&quot;, &quot;text&quot;: &quot;Tha brotherz were seated by age, oldest 2 youngest. Dey looked at each other amazed.&quot;}, {&quot;n&quot;: &quot;43:34&quot;, &quot;text&quot;: &quot;Joseph sent portionz from his table. Benjamin received 5 timez as much. Dey drank N celebrated wit him.&quot;}], &quot;44&quot;: [{&quot;n&quot;: &quot;44:1&quot;, &quot;text&quot;: &quot;Joseph told his steward, “Fill deir sackz wit all tha food dey can carry. Return each man’s money 2 his sack.&quot;}, {&quot;n&quot;: &quot;44:2&quot;, &quot;text&quot;: &quot;Put my silver cup in tha youngest’s sack beside his grain money.” Tha steward obeyed.&quot;}, {&quot;n&quot;: &quot;44:3&quot;, &quot;text&quot;: &quot;At dawn, tha men N deir donkeyz were sent off.&quot;}, {&quot;n&quot;: &quot;44:4&quot;, &quot;text&quot;: &quot;Before dey got far, Joseph ordered, “Catch ’em. Ask, ‘Why repay kindness wit evil?&quot;}, {&quot;n&quot;: &quot;44:5&quot;, &quot;text&quot;: &quot;Dat’s my master’s drinking cup, used 4 divination. U’ve done wickedly.’”&quot;}, {&quot;n&quot;: &quot;44:6&quot;, &quot;text&quot;: &quot;Tha steward caught ’em N repeated tha charge.&quot;}, {&quot;n&quot;: &quot;44:7&quot;, &quot;text&quot;: &quot;Dey answered, “Why accuse ur servantz? We’d never do dat!&quot;}, {&quot;n&quot;: &quot;44:8&quot;, &quot;text&quot;: &quot;We returned tha money from Canaan. Why would we steal silver or gold from ur master?&quot;}, {&quot;n&quot;: &quot;44:9&quot;, &quot;text&quot;: &quot;Whoever has tha cup can die. Tha rest of us will become ur master’s slavez.”&quot;}, {&quot;n&quot;: &quot;44:10&quot;, &quot;text&quot;: &quot;He said, “Whoever has it will become my slave. Tha rest will b innocent.”&quot;}, {&quot;n&quot;: &quot;44:11&quot;, &quot;text&quot;: &quot;Dey quickly lowered N opened deir sackz.&quot;}, {&quot;n&quot;: &quot;44:12&quot;, &quot;text&quot;: &quot;He searched oldest 2 youngest. Tha cup was in Benjamin’s sack.&quot;}, {&quot;n&quot;: &quot;44:13&quot;, &quot;text&quot;: &quot;Dey tore deir clothez, reloaded deir donkeyz, N returned 2 tha city.&quot;}, {&quot;n&quot;: &quot;44:14&quot;, &quot;text&quot;: &quot;Joseph was still home. Judah N his brotherz fell before him.&quot;}, {&quot;n&quot;: &quot;44:15&quot;, &quot;text&quot;: &quot;“What have u done? Don’t u know a man like me can uncover thingz through divination?”&quot;}, {&quot;n&quot;: &quot;44:16&quot;, &quot;text&quot;: &quot;Judah answered, “What can we say? How can we clear ourselves? God exposed our guilt. We’re all ur slavez, including tha man wit tha cup.”&quot;}, {&quot;n&quot;: &quot;44:17&quot;, &quot;text&quot;: &quot;“I won’t do dat. Only tha man wit tha cup stayz as my slave. Tha rest can bounce home in peace.”&quot;}, {&quot;n&quot;: &quot;44:18&quot;, &quot;text&quot;: &quot;Judah stepped closer: “Please, my lord, hear ur servant. Don’t get angry. U’re like Pharaoh himself.&quot;}, {&quot;n&quot;: &quot;44:19&quot;, &quot;text&quot;: &quot;U asked whether we had a father or brother.&quot;}, {&quot;n&quot;: &quot;44:20&quot;, &quot;text&quot;: &quot;We told u: an old father N a young son born in his old age. His brother’s dead; he alone remainz from his mother. Father lovez him.&quot;}, {&quot;n&quot;: &quot;44:21&quot;, &quot;text&quot;: &quot;U told us 2 bring him so u could see him.&quot;}, {&quot;n&quot;: &quot;44:22&quot;, &quot;text&quot;: &quot;We said tha boy couldn’t leave his father. If he did, his father would die.&quot;}, {&quot;n&quot;: &quot;44:23&quot;, &quot;text&quot;: &quot;U said we couldn’t see u without our youngest brother.&quot;}, {&quot;n&quot;: &quot;44:24&quot;, &quot;text&quot;: &quot;We returned N told our father ur wordz.&quot;}, {&quot;n&quot;: &quot;44:25&quot;, &quot;text&quot;: &quot;Later he said, ‘Go buy some food.’&quot;}, {&quot;n&quot;: &quot;44:26&quot;, &quot;text&quot;: &quot;We answered, ‘We can’t go unless Benjamin comez. We won’t b admitted without him.’&quot;}, {&quot;n&quot;: &quot;44:27&quot;, &quot;text&quot;: &quot;Father said, ‘U know my wife bore me 2 sonz.&quot;}, {&quot;n&quot;: &quot;44:28&quot;, &quot;text&quot;: &quot;1 bounced N never returned. I said he must’ve been torn apart.&quot;}, {&quot;n&quot;: &quot;44:29&quot;, &quot;text&quot;: &quot;Take dis 1 too, N if harm comez, u’ll send my gray head grieving 2 tha grave.’&quot;}, {&quot;n&quot;: &quot;44:30&quot;, &quot;text&quot;: &quot;His life is tied 2 tha boy’s life. If we return without him,&quot;}, {&quot;n&quot;: &quot;44:31&quot;, &quot;text&quot;: &quot;he’ll see tha boy’s gone N die. We’ll send our elderly father grieving 2 tha grave.&quot;}, {&quot;n&quot;: &quot;44:32&quot;, &quot;text&quot;: &quot;I guaranteed tha boy’s safety: ‘If I don’t bring him back, I’ll bear tha blame forever.’&quot;}, {&quot;n&quot;: &quot;44:33&quot;, &quot;text&quot;: &quot;Please let me remain as ur slave instead. Let tha boy return wit his brotherz.&quot;}, {&quot;n&quot;: &quot;44:34&quot;, &quot;text&quot;: &quot;How can I face my father without him? I couldn’t bear seeing tha disaster dat would hit him.”&quot;}], &quot;45&quot;: [{&quot;n&quot;: &quot;45:1&quot;, &quot;text&quot;: &quot;Joseph couldn’t hold back before his attendantz. “Everyone out!” Alone wit his brotherz, he revealed himself.&quot;}, {&quot;n&quot;: &quot;45:2&quot;, &quot;text&quot;: &quot;He wept so loudly tha Egyptians N Pharaoh’s household heard.&quot;}, {&quot;n&quot;: &quot;45:3&quot;, &quot;text&quot;: &quot;“I’m Joseph. Is my father still alive?” His brotherz were too stunned 2 answer.&quot;}, {&quot;n&quot;: &quot;45:4&quot;, &quot;text&quot;: &quot;“Come closer.” Dey approached. “I’m ur brother Joseph, whom u sold in2 Egypt.&quot;}, {&quot;n&quot;: &quot;45:5&quot;, &quot;text&quot;: &quot;Don’t tear yourselves apart over selling me. God sent me ahead 2 preserve life.&quot;}, {&quot;n&quot;: &quot;45:6&quot;, &quot;text&quot;: &quot;Tha famine’s lasted 2 yearz. 5 remain, wit no plowing or harvest.&quot;}, {&quot;n&quot;: &quot;45:7&quot;, &quot;text&quot;: &quot;God sent me ahead 2 preserve ur family line N save ur livez through a gr8 deliverance.&quot;}, {&quot;n&quot;: &quot;45:8&quot;, &quot;text&quot;: &quot;Ultimately God sent me here. He made me a father 2 Pharaoh, lord of his household, N ruler over Egypt.&quot;}, {&quot;n&quot;: &quot;45:9&quot;, &quot;text&quot;: &quot;Hurry 2 Father: ‘Joseph says God made him lord of Egypt. Come down immediately.&quot;}, {&quot;n&quot;: &quot;45:10&quot;, &quot;text&quot;: &quot;Live near me in Goshen—u, ur children N grandchildren, flockz, herdz, N everything u own.&quot;}, {&quot;n&quot;: &quot;45:11&quot;, &quot;text&quot;: &quot;I’ll provide 4 u through tha remaining 5 famine yearz, so ur household N possessionz don’t fall in2 poverty.’&quot;}, {&quot;n&quot;: &quot;45:12&quot;, &quot;text&quot;: &quot;U N Benjamin can see: I’m really tha 1 speaking 2 u.&quot;}, {&quot;n&quot;: &quot;45:13&quot;, &quot;text&quot;: &quot;Tell Father about my standing here N everything u saw. Hurry N bring him.”&quot;}, {&quot;n&quot;: &quot;45:14&quot;, &quot;text&quot;: &quot;He hugged Benjamin N wept. Benjamin wept on his neck too.&quot;}, {&quot;n&quot;: &quot;45:15&quot;, &quot;text&quot;: &quot;He kissed N wept over all his brotherz. Then dey spoke wit him.&quot;}, {&quot;n&quot;: &quot;45:16&quot;, &quot;text&quot;: &quot;Pharaoh N his officialz were pleased 2 hear Joseph’s brotherz had come.&quot;}, {&quot;n&quot;: &quot;45:17&quot;, &quot;text&quot;: &quot;Pharaoh told Joseph, “Tell ’em 2 load deir animalz N return 2 Canaan.&quot;}, {&quot;n&quot;: &quot;45:18&quot;, &quot;text&quot;: &quot;Bring ur father N householdz. I’ll give u Egypt’s best, N u’ll enjoy tha land’s abundance.&quot;}, {&quot;n&quot;: &quot;45:19&quot;, &quot;text&quot;: &quot;Take Egyptian wagonz 4 ur children N wivez. Bring ur father here.&quot;}, {&quot;n&quot;: &quot;45:20&quot;, &quot;text&quot;: &quot;Don’t worry about ur belongingz. Egypt’s best is urs.”&quot;}, {&quot;n&quot;: &quot;45:21&quot;, &quot;text&quot;: &quot;Israel’s sonz obeyed. Joseph gave ’em wagonz as Pharaoh ordered N travel provisionz.&quot;}, {&quot;n&quot;: &quot;45:22&quot;, &quot;text&quot;: &quot;Each received fresh clothez. Benjamin received 300 silver piecez N 5 outfitz.&quot;}, {&quot;n&quot;: &quot;45:23&quot;, &quot;text&quot;: &quot;Joseph sent Father 10 male donkeyz loaded wit Egypt’s finest N 10 female donkeyz carrying grain, bread, N travel food.&quot;}, {&quot;n&quot;: &quot;45:24&quot;, &quot;text&quot;: &quot;He sent his brotherz off: “Don’t start beef on tha road.” Dey bounced.&quot;}, {&quot;n&quot;: &quot;45:25&quot;, &quot;text&quot;: &quot;Dey traveled from Egypt 2 Jacob in Canaan.&quot;}, {&quot;n&quot;: &quot;45:26&quot;, &quot;text&quot;: &quot;“Joseph’s alive! He rulez all Egypt!” Jacob went numb; he didn’t believe ’em.&quot;}, {&quot;n&quot;: &quot;45:27&quot;, &quot;text&quot;: &quot;Dey repeated Joseph’s wordz. Seeing tha wagonz, Jacob’s spirit revived.&quot;}, {&quot;n&quot;: &quot;45:28&quot;, &quot;text&quot;: &quot;Israel said, “Dat’s enough. My son Joseph’s alive. I’ll see him before I die.”&quot;}], &quot;46&quot;: [{&quot;n&quot;: &quot;46:1&quot;, &quot;text&quot;: &quot;Israel set out wit everything he owned. At Beersheba he sacrificed 2 his father Isaac’s God.&quot;}, {&quot;n&quot;: &quot;46:2&quot;, &quot;text&quot;: &quot;In a nighttime vision God called, “Jacob! Jacob!” “Here I am.”&quot;}, {&quot;n&quot;: &quot;46:3&quot;, &quot;text&quot;: &quot;“I’m God, ur father’s God. Don’t b shook about going in2 Egypt. I’ll make u a gr8 nation there.&quot;}, {&quot;n&quot;: &quot;46:4&quot;, &quot;text&quot;: &quot;I’ll go wit u N surely bring u up again. Joseph’s hand will close ur eyez.”&quot;}, {&quot;n&quot;: &quot;46:5&quot;, &quot;text&quot;: &quot;Jacob’s sonz carried him, deir children, N deir wivez from Beersheba in Pharaoh’s wagonz.&quot;}, {&quot;n&quot;: &quot;46:6&quot;, &quot;text&quot;: &quot;Dey took deir livestock N Canaan-acquired belongingz. Jacob N all his offspring entered Egypt.&quot;}, {&quot;n&quot;: &quot;46:7&quot;, &quot;text&quot;: &quot;Sonz, grandsonz, daughterz, granddaughterz—he brought his whole family.&quot;}, {&quot;n&quot;: &quot;46:8&quot;, &quot;text&quot;: &quot;Here are Israel’s family namez: Jacob N his sonz. Reuben was tha firstborn.&quot;}, {&quot;n&quot;: &quot;46:9&quot;, &quot;text&quot;: &quot;Reuben’s sonz: Hanoch, Phallu, Hezron, N Carmi.&quot;}, {&quot;n&quot;: &quot;46:10&quot;, &quot;text&quot;: &quot;Simeon’s: Jemuel, Jamin, Ohad, Jachin, Zohar, N Shaul, whose mother was Canaanite.&quot;}, {&quot;n&quot;: &quot;46:11&quot;, &quot;text&quot;: &quot;Levi’s: Gershon, Kohath, N Merari.&quot;}, {&quot;n&quot;: &quot;46:12&quot;, &quot;text&quot;: &quot;Judah’s: Er, Onan, Shelah, Pharez, N Zarah. Er N Onan died in Canaan. Pharez’s sonz: Hezron N Hamul.&quot;}, {&quot;n&quot;: &quot;46:13&quot;, &quot;text&quot;: &quot;Issachar’s: Tola, Phuvah, Job, N Shimron.&quot;}, {&quot;n&quot;: &quot;46:14&quot;, &quot;text&quot;: &quot;Zebulun’s: Sered, Elon, N Jahleel.&quot;}, {&quot;n&quot;: &quot;46:15&quot;, &quot;text&quot;: &quot;These came through Leah in Padanaram, wit Dinah included. Dat family line numbered 33.&quot;}, {&quot;n&quot;: &quot;46:16&quot;, &quot;text&quot;: &quot;Gad’s sonz: Ziphion, Haggi, Shuni, Ezbon, Eri, Arodi, N Areli.&quot;}, {&quot;n&quot;: &quot;46:17&quot;, &quot;text&quot;: &quot;Asher’s: Jimnah, Ishuah, Isui, Beriah, N deir sister Serah. Beriah’s sonz: Heber N Malchiel.&quot;}, {&quot;n&quot;: &quot;46:18&quot;, &quot;text&quot;: &quot;These 16 came through Zilpah, tha servant Laban gave Leah.&quot;}, {&quot;n&quot;: &quot;46:19&quot;, &quot;text&quot;: &quot;Rachel’s sonz: Joseph N Benjamin.&quot;}, {&quot;n&quot;: &quot;46:20&quot;, &quot;text&quot;: &quot;In Egypt, Asenath, daughter of Potipherah, priest of On, bore Joseph Manasseh N Ephraim.&quot;}, {&quot;n&quot;: &quot;46:21&quot;, &quot;text&quot;: &quot;Benjamin’s sonz: Belah, Becher, Ashbel, Gera, Naaman, Ehi, Rosh, Muppim, Huppim, N Ard.&quot;}, {&quot;n&quot;: &quot;46:22&quot;, &quot;text&quot;: &quot;Rachel’s family line numbered 14.&quot;}, {&quot;n&quot;: &quot;46:23&quot;, &quot;text&quot;: &quot;Dan’s son: Hushim.&quot;}, {&quot;n&quot;: &quot;46:24&quot;, &quot;text&quot;: &quot;Naphtali’s: Jahzeel, Guni, Jezer, N Shillem.&quot;}, {&quot;n&quot;: &quot;46:25&quot;, &quot;text&quot;: &quot;These 7 came through Bilhah, tha servant Laban gave Rachel.&quot;}, {&quot;n&quot;: &quot;46:26&quot;, &quot;text&quot;: &quot;Jacob’s direct descendantz entering Egypt wit him totaled 66, excluding his sonz’ wivez.&quot;}, {&quot;n&quot;: &quot;46:27&quot;, &quot;text&quot;: &quot;Joseph had 2 sonz born in Egypt. Jacob’s whole household connected wit tha move totaled 70.&quot;}, {&quot;n&quot;: &quot;46:28&quot;, &quot;text&quot;: &quot;Jacob sent Judah ahead 2 Joseph 4 directionz 2 Goshen. Dey arrived there.&quot;}, {&quot;n&quot;: &quot;46:29&quot;, &quot;text&quot;: &quot;Joseph readied his chariot N met his father in Goshen. He hugged his neck N wept a long time.&quot;}, {&quot;n&quot;: &quot;46:30&quot;, &quot;text&quot;: &quot;Israel said, “Now I can die. I’ve seen ur face N know u’re alive.”&quot;}, {&quot;n&quot;: &quot;46:31&quot;, &quot;text&quot;: &quot;Joseph told his brotherz N household, “I’ll tell Pharaoh ur family from Canaan has arrived.&quot;}, {&quot;n&quot;: &quot;46:32&quot;, &quot;text&quot;: &quot;U’re shepherdz N livestock keeperz; u brought ur flockz, herdz, N everything.&quot;}, {&quot;n&quot;: &quot;46:33&quot;, &quot;text&quot;: &quot;When Pharaoh asks ur occupation,&quot;}, {&quot;n&quot;: &quot;46:34&quot;, &quot;text&quot;: &quot;say, ‘We N our ancestorz have tended livestock since youth.’ Then u can settle in Goshen, because Egyptians look down on shepherdz.”&quot;}], &quot;47&quot;: [{&quot;n&quot;: &quot;47:1&quot;, &quot;text&quot;: &quot;Joseph told Pharaoh, “My father N brotherz arrived from Canaan wit deir flockz, herdz, N everything. Dey’re in Goshen.”&quot;}, {&quot;n&quot;: &quot;47:2&quot;, &quot;text&quot;: &quot;He presented 5 of his brotherz 2 Pharaoh.&quot;}, {&quot;n&quot;: &quot;47:3&quot;, &quot;text&quot;: &quot;“What’s ur occupation?” “We’re shepherdz, like our ancestorz.”&quot;}, {&quot;n&quot;: &quot;47:4&quot;, &quot;text&quot;: &quot;“We came 2 stay awhile. Canaan’s famine left our flockz no pasture. Please let us settle in Goshen.”&quot;}, {&quot;n&quot;: &quot;47:5&quot;, &quot;text&quot;: &quot;Pharaoh told Joseph, “Ur father N brotherz have come 2 u.&quot;}, {&quot;n&quot;: &quot;47:6&quot;, &quot;text&quot;: &quot;Egypt’s open. Settle ’em in tha best land, in Goshen. If any are capable, put ’em over my livestock.”&quot;}, {&quot;n&quot;: &quot;47:7&quot;, &quot;text&quot;: &quot;Joseph brought Jacob before Pharaoh. Jacob blessed Pharaoh.&quot;}, {&quot;n&quot;: &quot;47:8&quot;, &quot;text&quot;: &quot;Pharaoh asked, “How old are u?”&quot;}, {&quot;n&quot;: &quot;47:9&quot;, &quot;text&quot;: &quot;“My wandering life has lasted 130 yearz. Few N difficult yearz, shorter than my ancestorz’ journeyz.”&quot;}, {&quot;n&quot;: &quot;47:10&quot;, &quot;text&quot;: &quot;Jacob blessed Pharaoh N bounced from his presence.&quot;}, {&quot;n&quot;: &quot;47:11&quot;, &quot;text&quot;: &quot;As Pharaoh ordered, Joseph gave his family property in Egypt’s finest region, tha land of Rameses.&quot;}, {&quot;n&quot;: &quot;47:12&quot;, &quot;text&quot;: &quot;He supplied his father, brotherz, N whole household wit food according 2 each family’s needz.&quot;}, {&quot;n&quot;: &quot;47:13&quot;, &quot;text&quot;: &quot;Elsewhere food was gone. Egypt N Canaan were wasting away under severe famine.&quot;}, {&quot;n&quot;: &quot;47:14&quot;, &quot;text&quot;: &quot;Joseph collected Egypt N Canaan’s money through grain salez N brought it in2 Pharaoh’s treasury.&quot;}, {&quot;n&quot;: &quot;47:15&quot;, &quot;text&quot;: &quot;When money ran out, tha Egyptians pleaded, “Give us bread. Why should we die before u? Our money’s gone.”&quot;}, {&quot;n&quot;: &quot;47:16&quot;, &quot;text&quot;: &quot;Joseph said, “Bring livestock. I’ll exchange food 4 ’em if ur money’s gone.”&quot;}, {&quot;n&quot;: &quot;47:17&quot;, &quot;text&quot;: &quot;Dey brought horsez, sheep, goatz, cattle, N donkeyz. He fed ’em dat year in exchange 4 deir livestock.&quot;}, {&quot;n&quot;: &quot;47:18&quot;, &quot;text&quot;: &quot;Next year dey said, “We won’t hide it: our money N livestock are urs. All we have left is our bodies N land.&quot;}, {&quot;n&quot;: &quot;47:19&quot;, &quot;text&quot;: &quot;Why let us N our land perish? Buy us N our fieldz 4 food. We’ll serve Pharaoh. Give us seed so we live N tha land isn’t deserted.”&quot;}, {&quot;n&quot;: &quot;47:20&quot;, &quot;text&quot;: &quot;Joseph bought Egypt’s fieldz 4 Pharaoh. Famine forced everyone 2 sell, N tha land became Pharaoh’s.&quot;}, {&quot;n&quot;: &quot;47:21&quot;, &quot;text&quot;: &quot;Throughout Egypt, Joseph moved tha people in2 citiez.&quot;}, {&quot;n&quot;: &quot;47:22&quot;, &quot;text&quot;: &quot;He didn’t buy tha priestz’ land. Pharaoh supported ’em wit an allowance, so dey didn’t sell.&quot;}, {&quot;n&quot;: &quot;47:23&quot;, &quot;text&quot;: &quot;Joseph told tha people, “Today I bought u N ur land 4 Pharaoh. Here’s seed. Plant tha fieldz.&quot;}, {&quot;n&quot;: &quot;47:24&quot;, &quot;text&quot;: &quot;Give Pharaoh 1/5 of tha harvest. Keep 4/5 4 seed N food 4 yourselves, ur householdz, N ur children.”&quot;}, {&quot;n&quot;: &quot;47:25&quot;, &quot;text&quot;: &quot;“U saved our livez,” dey answered. “Show us favor; we’ll serve Pharaoh.”&quot;}, {&quot;n&quot;: &quot;47:26&quot;, &quot;text&quot;: &quot;Joseph established tha law still in place: 1/5 belongz 2 Pharaoh. Only tha priestz’ land remained exempt.&quot;}, {&quot;n&quot;: &quot;47:27&quot;, &quot;text&quot;: &quot;Israel settled in Goshen, gained property, N multiplied greatly.&quot;}, {&quot;n&quot;: &quot;47:28&quot;, &quot;text&quot;: &quot;Jacob lived 17 yearz in Egypt, reaching 147 yearz altogether.&quot;}, {&quot;n&quot;: &quot;47:29&quot;, &quot;text&quot;: &quot;Near death, he called Joseph: “Please place ur hand under my thigh. Promise kindness N faithfulness. Don’t bury me in Egypt.&quot;}, {&quot;n&quot;: &quot;47:30&quot;, &quot;text&quot;: &quot;When I rest wit my ancestorz, carry me out N bury me in deir burial place.” “I’ll do it,” Joseph answered.&quot;}, {&quot;n&quot;: &quot;47:31&quot;, &quot;text&quot;: &quot;“Swear.” Joseph swore, N Israel bowed at tha head of his be
