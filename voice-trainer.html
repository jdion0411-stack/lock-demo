<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EOTA Deep Voice Trainer</title><style>html,body{margin:0;padding:0;background:transparent;color-scheme:dark}body{overflow:hidden}</style></head><body><div id="eota-voice-lab" >
<style>
#eota-voice-lab{padding:8px;font-family:Arial,sans-serif;color:#e9dec1}#eota-voice-lab *{box-sizing:border-box}#eota-voice-lab .shell{position:relative;width:100%;max-width:780px;aspect-ratio:1;margin:auto;border-radius:50%;background:linear-gradient(135deg,#69869e,#2b4358 45%,#516f88 78%,#132735);padding:3.7%;box-shadow:inset 0 0 0 1px #111e2c,inset 0 0 0 3px #91a1aa,0 4px 12px #0003;container-type:inline-size}#eota-voice-lab .glass{position:relative;width:100%;height:100%;overflow:hidden;border-radius:50%;background:radial-gradient(ellipse at 30% 30%,#142e48,transparent 60%),#071320;box-shadow:inset 0 0 0 2px #09111a}#eota-voice-lab .stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 30px 20px,#d3e6f4 99%,transparent),radial-gradient(1px 1px at 90px 80px,#c7d9ed 99%,transparent),radial-gradient(1.4px 1.4px at 140px 45px,#fff 99%,transparent),radial-gradient(.8px .8px at 55px 145px,#a5c1d9 99%,transparent),radial-gradient(1px 1px at 175px 170px,#d4d7c8 99%,transparent);background-size:210px 210px;opacity:.5}#eota-voice-lab .music-art{position:absolute;inset:0;pointer-events:none}#eota-voice-lab .music-art>svg{width:100%;height:100%;display:block}#eota-voice-lab .inner-lines{position:absolute;inset:18%;width:64%;height:64%;pointer-events:none}#eota-voice-lab .inner-lines circle{fill:none;stroke:#a1956b;stroke-opacity:.24;stroke-width:.7}#eota-voice-lab .chart{position:absolute;inset:20%;width:60%;height:60%;pointer-events:none}#eota-voice-lab .readout{position:absolute;inset:28% 25% 27%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:4px;pointer-events:none}#eota-voice-lab .eyebrow{font-size:clamp(11px,2.3cqw,16px);letter-spacing:1.5px}#eota-voice-lab .small{font-size:clamp(11px,1.8cqw,13px);color:#bacbd0}#eota-voice-lab .note{font-size:clamp(38px,10cqw,76px);line-height:1.1;color:#e5cc89;font-weight:400}#eota-voice-lab .hz{font-size:clamp(12px,2.4cqw,18px)}#eota-voice-lab .cents{font-size:clamp(11px,1.9cqw,14px);color:#bdd6ce}#eota-voice-lab .source{font-size:11px;color:#bdc7cc;margin-bottom:3px}#eota-voice-lab .target-line{margin-top:7px;font-size:clamp(11px,1.9cqw,14px)}#eota-voice-lab .orbit{position:absolute;left:50%;top:50%;width:14%;height:5.4%;min-height:30px;max-height:44px;transform:translate(-50%,-50%);padding:1px 3px;border:1px solid #66818b;border-radius:50% / 38%;color:#f6ebc7;background:var(--enamel,#315d6e);font:clamp(11px,1.9cqw,14px) Arial,sans-serif;white-space:nowrap;display:grid;place-items:center;z-index:4;box-shadow:inset 0 1px 4px #ffffff15}#eota-voice-lab .orbit:disabled{opacity:.5}#eota-voice-lab .orbit.glow{box-shadow:0 0 12px #e1bb5b99,inset 0 1px 4px #fff2;border-color:#ddc584;background:#746543}#eota-voice-lab .status{position:absolute;top:69%;left:28%;width:44%;text-align:center;font-size:clamp(11px,1.7cqw,12px);color:#b7c9d1;z-index:3;max-height:11%;overflow:hidden}#eota-voice-lab .panel{position:absolute;inset:26%;border-radius:50%;background:#0c1a29;border:1px solid #796f51;padding:6% 6%;z-index:6;color:#efe3c6;display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:8px;text-align:center;font-size:clamp(11px,1.9cqw,14px)}#eota-voice-lab .panel h3{font-size:clamp(12px,2.8cqw,20px);font-weight:400;margin:0 0 3px}#eota-voice-lab .panel label{font-size:clamp(11px,1.9cqw,14px);display:block}#eota-voice-lab .panel select,#eota-voice-lab .panel button{background:#203d50;border:1px solid #648596;color:#f7e8b8;padding:7px;border-radius:12px;font:inherit;width:100%;min-height:32px}#eota-voice-lab input{width:100%;accent-color:#c0b16e}#eota-voice-lab .panel audio{width:100%;height:34px}#eota-voice-lab .panel [hidden],#eota-voice-lab [hidden],#eota-voice-lab .hidden{display:none!important}#eota-voice-lab .dove{position:absolute;width:5%;height:5%;left:47.5%;top:24%;object-fit:contain;pointer-events:none}#eota-voice-lab .etch{position:absolute;bottom:1%;left:47%;width:6%;height:1%;border-top:1px solid #b4ab8655}#eota-voice-lab .etch:before{content:"";position:absolute;width:1px;height:13px;left:50%;top:-4px;background:#b4ab8655}@media(pointer:coarse){#eota-voice-lab .orbit{min-height:44px}}@media(max-width:400px){#eota-voice-lab .readout{gap:1px;inset:30% 24% 27%}#eota-voice-lab .source{font-size:11px}#eota-voice-lab .target-line{margin-top:2px}#eota-voice-lab .panel{padding:6% 7%;gap:4px}#eota-voice-lab .status{top:67%}}
</style>

<script>

(()=>{const root=document.getElementById('eota-voice-lab'),q=id=>root.querySelector('#voice-'+id);let midi=36,ctx=null,drone=null,stream=null,analyser=null,source=null,timer=null,recorder=null,chunks=[],url=null,live=false,recordStart=0;const names=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];const hz=m=>440*Math.pow(2,(m-69)/12),name=m=>names[(Math.round(m)%12+12)%12]+(Math.floor(Math.round(m)/12)-1);const energy=q('energy');let rings=[];[123,146,169,192].forEach(r=>{let c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',220);c.setAttribute('cy',220);c.setAttribute('r',r);energy.append(c);rings.push(c)});
function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();return ctx.resume()}
function draw(freq,amps,measured){if(!freq){q('note').textContent='—';q('hz').textContent='No clear pitch';q('cents').textContent='Listening';return}const m=69+12*Math.log2(freq/440),cents=1200*Math.log2(freq/hz(midi));q('note').textContent=name(m);q('hz').textContent=freq.toFixed(2)+' Hz';q('cents').textContent=(Math.abs(cents)<5?'On target':(cents>0?'+':'')+Math.round(cents)+' cents')+(measured?' · estimate':' · simulated');const a=Math.max(-1,Math.min(1,cents/100))*.78;q('marker').setAttribute('cx',220+172*Math.sin(a));q('marker').setAttribute('cy',220-172*Math.cos(a));rings.forEach((c,i)=>{const len=2*Math.PI*[123,146,169,192][i],v=Math.max(.015,Math.min(.96,amps[i]||0));c.setAttribute('stroke-dasharray',(v*len)+' '+len);c.setAttribute('opacity',.45+v*.5)});}
function demo(){if(live)return;const focus=+q('focus').value;let amps=[.4,.25,.15,.08];amps[focus-1]=.85;draw(hz(midi)*Math.pow(2,+q('offset').value/1200),amps,false);q('offset-value').textContent=q('offset').value+' cents';q('focus-value').textContent=focus+'× harmonic';}
function update(){q('target').textContent=name(midi)+' · '+hz(midi).toFixed(2)+' Hz';if(drone)drone.frequency.setTargetAtTime(hz(midi),ctx.currentTime,.04);demo()}
q('lower').onclick=()=>{midi=Math.max(28,midi-1);update()};q('higher').onclick=()=>{midi=Math.min(48,midi+1);update()};q('offset').oninput=demo;q('focus').oninput=demo;
q('mode').onchange=()=>{let mode=q('mode').value;q('ring-label').textContent=mode==='sub'?'COMPARE FUNDAMENTAL + HARMONICS':mode==='over'?'FOCUS ON THE OUTER HARMONIC RINGS':'HARMONICS · 1× 2× 3× 4×';q('status').textContent=mode==='sub'?'Explore acoustic patterns; this does not identify vocal-fold technique.':mode==='over'?'Compare relative energy across four harmonics.':live?'Microphone active — pitch is an estimate.':'Simulated input — no voice is being measured.';};
q('drone').onclick=async()=>{try{await audio();if(drone){drone.stop();drone=null;q('drone').textContent='TONE';return}drone=ctx.createOscillator();let gain=ctx.createGain();gain.gain.value=.06;drone.type='sine';drone.frequency.value=hz(midi);drone.connect(gain).connect(ctx.destination);drone.start();q('drone').textContent='STOP TONE';}catch(e){q('status').textContent='Reference audio is unavailable in this preview.'}};
function finishRecord(){if(recorder&&recorder.state==='recording')recorder.stop()}
function stopMic(){finishRecord();clearInterval(timer);timer=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;source?.disconnect();analyser=null;live=false;q('mic').textContent='MIC';q('record').disabled=true;q('demo-panel').hidden=false;q('source').textContent='Simulated input';q('reading-label').textContent='SIMULATED PITCH';demo()}
function estimate(samples,rate){let x=[];for(let i=0;i<samples.length;i+=4)x.push(samples[i]);let n=x.length,fs=rate/4,rms=Math.sqrt(x.reduce((a,v)=>a+v*v,0)/n);if(rms<.008)return null;let min=Math.floor(fs/350),max=Math.min(Math.floor(fs/30),Math.floor(n/2)),best=-1,lag=0,prev=0;let corr=[];for(let l=min;l<=max;l++){let sum=0,a=0,b=0;for(let i=0;i<n-max;i++){sum+=x[i]*x[i+l];a+=x[i]*x[i];b+=x[i+l]*x[i+l]}corr[l]=sum/Math.sqrt(a*b||1)}for(let l=min+1;l<max;l++){if(corr[l]>.82&&corr[l]>corr[l-1]&&corr[l]>=corr[l+1]){lag=l;best=corr[l];break}}return lag?fs/lag:null}
q('mic').onclick=async()=>{if(live){stopMic();q('status').textContent='Microphone stopped. Simulated input restored.';return}q('status').textContent='Requesting microphone access…';try{if(!navigator.mediaDevices?.getUserMedia)throw Error('unsupported');await audio();stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});source=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=8192;source.connect(analyser);live=true;q('mic').textContent='STOP MIC';q('record').disabled=typeof MediaRecorder==='undefined';q('demo-panel').hidden=true;q('source').textContent='Microphone active';q('reading-label').textContent='ESTIMATED PITCH';q('status').textContent='Microphone active. Use headphones for the reference tone.';let samples=new Float32Array(analyser.fftSize),spectrum=new Float32Array(analyser.frequencyBinCount);timer=setInterval(()=>{if(!live)return;analyser.getFloatTimeDomainData(samples);let f=estimate(samples,ctx.sampleRate);analyser.getFloatFrequencyData(spectrum);let values=[];for(let k=1;k<=4;k++){let bin=Math.round((f||hz(midi))*k*analyser.fftSize/ctx.sampleRate),db=Math.max(...Array.from(spectrum.slice(Math.max(0,bin-1),bin+2)));values.push(Math.max(0,Math.min(1,(db+85)/65)))}draw(f,values,true)},130)}catch(e){stopMic();q('status').textContent='Microphone access is unavailable here. The demo sliders still work.'}};

<script id="rhiyme-visible-copy">(()=>{const pattern=/\b(?:rhyme|rhime)\b/gi;function visit(root){if(root.nodeType===3){const parent=root.parentElement;if(parent&&!parent.closest('script,style,textarea,input,code,pre,a[href^="mailto:"]')){const value=root.nodeValue.replace(pattern,'RHIYME');if(value!==root.nodeValue)root.nodeValue=value;}return;}if(root.nodeType!==1&&root.nodeType!==9)return;if(root.nodeType===1){for(const name of ['title','alt','aria-label','placeholder']){const value=root.getAttribute(name);if(value){const next=value.replace(pattern,'RHIYME');if(next!==value)root.setAttribute(name,next);}}}for(const child of [...root.childNodes])visit(child);}visit(document.documentElement);new MutationObserver(records=>{for(const record of records){if(record.type==='characterData')visit(record.target);else if(record.type==='attributes')visit(record.target);else for(const node of record.addedNodes)visit(node);}}).observe(document.documentElement,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['title','alt','aria-label','placeholder']});})();</script></body></html>
