<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EOTA Voice Trainer</title><style>*{box-sizing:border-box}body{margin:0;background:transparent;color:#eddbaf;font-family:Arial}.dial{position:relative;width:min(100vw,760px);margin:auto}.shell{display:block;width:100%}.screen{position:absolute;left:25%;top:12%;width:50%;height:52%;border-radius:50%;background:#07131c;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px #8d7956;overflow:hidden}.panel{width:78%;text-align:center;font-size:clamp(8px,1.65vw,13px)}h1{font-size:1.1em;margin:0 0 .5em;letter-spacing:.1em}.note{font-size:3.5em;line-height:1.1}p{margin:.5em 0}canvas{width:100%;height:3.5em}button,select,a{font:inherit;color:#eddbaf;background:#152735;border:1px solid #887653;border-radius:20px;padding:.5em .7em;text-decoration:none}button{cursor:pointer}button:disabled{opacity:.45}.row{display:flex;justify-content:center;gap:.4em;margin:.5em 0;flex-wrap:wrap}audio{width:100%;height:26px}#status{min-height:2em;font-size:.85em}small{display:block;font-size:.8em}</style><div class="dial"><img class="shell" src="/assets/eota-gallery-voice-v1.svg" alt="EOTA bandanna and metal voice trainer dial"><div class="screen"><div class="panel"><h1>EOTA VOICE TRAINER</h1><small>BASSO PROFUNDO · OKTAVIST</small><div class="note" id="note">—</div><p id="pitch">Enable mic to begin</p><canvas id="spectrum" width="400" height="90" aria-label="Live harmonic spectrum"></canvas><div class="row"><label>Target <select id="target" aria-label="Target note"></select></label><button id="tone">Tone</button></div><div class="row"><button id="mic">Start mic</button><button id="record" disabled>Record</button></div><audio id="playback" controls hidden></audio><a id="save" hidden>Save take</a><p id="status" role="status">Use a comfortable range; stop if strained.</p><small>Pitch estimates can jump octaves on complex voices.</small></div></div></div><script>
const $=id=>document.getElementById(id),names=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];for(let m=24;m<=60;m++){let o=document.createElement('option');o.value=m;o.textContent=names[m%12]+(Math.floor(m/12)-1);o.selected=m===36;$('target').append(o)}let ctx,stream,analyser,timer,osc,gain,rec,chunks=[],url;const freq=m=>440*2**((m-69)/12);function stopTone(){if(osc){osc.stop();osc=null;$('tone').textContent='Tone'}}$('tone').onclick=async()=>{if(osc){stopTone();return}ctx??=new AudioContext;await ctx.resume();osc=ctx.createOscillator();gain=ctx.createGain();gain.gain.value=.07;osc.frequency.value=freq(+$('target').value);osc.connect(gain).connect(ctx.destination);osc.start();$('tone').textContent='Stop tone'};$('target').onchange=()=>{if(osc)osc.frequency.value=freq(+$('target').value)};
function frame(){if(document.hidden)return;const data=new Float32Array(8192);analyser.getFloatTimeDomainData(data);let rms=Math.sqrt(data.reduce((a,b)=>a+b*b,0)/data.length);let f=0;if(rms>.008){const step=4,N=1024,down=new Float32Array(N);for(let i=0;i<N;i++)down[i]=data[i*step];const rate=ctx.sampleRate/step,min=Math.floor(rate/300),max=Math.min(Math.floor(rate/30),N/2),scores=[];let best=0,lag=0;for(let k=min;k<=max;k++){let cross=0,a=0,b=0;for(let i=0;i<N-max;i++){cross+=down[i]*down[i+k];a+=down[i]**2;b+=down[i+k]**2}scores[k]=cross/Math.sqrt(a*b||1);if(scores[k]>best){best=scores[k];lag=k}}for(let k=min+1;k<max;k++)if(scores[k]>.92*best&&scores[k]>.8&&scores[k]>scores[k-1]&&scores[k]>scores[k+1]){lag=k;break}if(best>.8)f=rate/lag}if(f){let m=Math.round(69+12*Math.log2(f/440)),c=Math.round(1200*Math.log2(f/freq(+$('target').value)));$('note').textContent=names[(m%12+12)%12]+(Math.floor(m/12)-1);$('pitch').textContent=f.toFixed(1)+' Hz · '+(c>0?'+':'')+c+' cents to target'}else{$('note').textContent='—';$('pitch').textContent='Listening…'}const bins=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(bins);let c=$('spectrum').getContext('2d');c.clearRect(0,0,400,90);c.fillStyle='#d7ba74';for(let i=0;i<100;i++)c.fillRect(i*4,90-bins[i]/3,3,bins[i]/3)}
function stopMic(){if(rec?.state==='recording')rec.stop();clearInterval(timer);stream?.getTracks().forEach(t=>t.stop());stream=null;$('mic').textContent='Start mic';$('record').disabled=true;$('pitch').textContent='Mic stopped';$('note').textContent='—'}$('mic').onclick=async()=>{if(stream){stopMic();return}try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});ctx??=new AudioContext;await ctx.resume();analyser=ctx.createAnalyser();analyser.fftSize=8192;ctx.createMediaStreamSource(stream).connect(analyser);timer=setInterval(frame,120);$('mic').textContent='Stop mic';$('record').disabled=!window.MediaRecorder;$('status').textContent='Mic active. Recordings stay in this browser until saved.'}catch(e){$('status').textContent='Microphone unavailable. Allow access and try again.'}};$('record').onclick=()=>{if(rec?.state==='recording'){rec.stop();return}stopTone();chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType}));$('playback').src=url;$('playback').hidden=false;$('save').href=url;$('save').download='EOTA-voice-take.'+(rec.mimeType.includes('mp4')?'m4a':'webm');$('save').hidden=false;$('record').textContent='Record';$('status').textContent='Take ready to play or save.'};rec.start();$('record').textContent='Stop take';$('status').textContent='Recording…'};addEventListener('pagehide',()=>{stopTone();stopMic();ctx?.close()});
</script></html>
