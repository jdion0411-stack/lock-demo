<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RHYME DIAL</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#f6e4b0}button,input{font:inherit;-webkit-tap-highlight-color:transparent}#dial{position:absolute;left:50%;top:50%;width:720px;height:720px;transform-origin:center;isolation:isolate;user-select:none;touch-action:manipulation}.dial-face{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#alphabet,#wordSlots{position:absolute;inset:0;pointer-events:none}.alphabet-letter{position:absolute;transform:translate(-50%,-50%) rotate(var(--turn));width:40px;height:44px;padding:0;display:grid;place-items:center;pointer-events:auto;border:0;background:transparent;color:#edce8c;font:36px/1 Georgia,serif;text-shadow:0 1px 1px #2e1c06;cursor:pointer;border-radius:5px}.alphabet-letter[aria-pressed=true]{color:#fff3bd;text-shadow:0 0 6px #ffdc7a}.alphabet-letter:focus-visible{outline:2px solid #f6d68b;outline-offset:2px}#wordSlots{z-index:4}.slot{position:absolute;left:var(--x);top:var(--y);width:43px;height:50px;transform:translate(-50%,-50%) rotate(var(--turn));pointer-events:auto}.slot-letter{width:100%;height:100%;padding:0;border:0;background:transparent;color:#251c10;font:34px/1 Georgia,serif;cursor:pointer;text-shadow:0 1px #fff8}.slot-letter:focus-visible,.slot.active .slot-letter{outline:2px solid #b98430;outline-offset:0;border-radius:2px}.slot.locked .slot-letter{color:#173f5e;text-shadow:0 0 1px #fff}.slot.locked:after{content:'';position:absolute;left:8px;right:8px;bottom:0;height:3px;background:#1c6b91;box-shadow:0 0 3px #fff;pointer-events:none}.slot-lock{position:absolute;left:-20px;top:-12px;width:24px;height:24px;border:0;background:transparent;border-radius:50%;padding:0;cursor:pointer}.slot-lock[aria-pressed=true]{background:#23648388;box-shadow:inset 0 0 0 2px #e9cf8c}.slot-lock:focus-visible{outline:2px solid #fff}#pointer{position:absolute;inset:0;z-index:5;pointer-events:none;transform-origin:50% 47.1%;transition:transform .24s ease-out}#pointer img{position:absolute;left:31.5%;top:7.1%;width:37%;height:55.8%;object-fit:fill;clip-path:polygon(49.5% 1%,55% 5%,56% 66%,58% 70%,68% 73%,68% 76%,58% 77%,56% 91%,54% 98%,46% 98%,43% 94%,44% 77%,32% 76%,32% 73%,42% 70%,44% 66%,45% 5%);filter:drop-shadow(0 1px 1px #0008)}#pivot{position:absolute;left:50%;top:47.1%;transform:translate(-50%,-50%);width:50px;height:50px;border:0;border-radius:50%;background:transparent;z-index:7;cursor:grab;touch-action:none}#pivot:active{cursor:grabbing}#pivot:focus-visible{outline:2px solid #ffe9a5}#wordEntry{position:absolute;left:50%;top:67%;transform:translate(-50%,-50%);width:25%;height:32px;padding:2px 6px;z-index:6;border:1px solid #b89550;border-radius:12px;background:linear-gradient(#fff9ebee,#e8dcc5ee);color:#132e45;box-shadow:0 1px 2px #55330e33;text-align:center;font:20px Georgia,serif;user-select:text}#wordEntry:focus{outline:2px solid #eccb7e;outline-offset:2px}.turning #pointer{transition:none}.step{position:absolute;top:55%;width:30px;height:30px;border:1px solid #c2a16c;border-radius:50%;background:#f8eddae8;color:#12304a;font:24px Georgia,serif;padding:0;z-index:6;cursor:pointer}#previous{left:36%}#next{right:36%}@media(prefers-reduced-motion:reduce){#pointer{transition:none}}</style></head><body><main id="dial" aria-label="Interactive circular Rhyme Dial"><img class="dial-face" src="/assets/rhyme-mechanical-face.svg" alt="Ornate navy and gold dial with lion shield and circular brass letter rollers" fetchpriority="high"><div id="alphabet"></div><div id="wordSlots" role="group" aria-label="Word letters and individual locks"></div><div id="pointer"><img src="/assets/rhyme-mechanical-sword.svg" alt=""></div><button id="pivot" aria-label="Turn sword"></button><input id="wordEntry" aria-label="Type a word" autocomplete="off" spellcheck="false" value="SUFFER"><button id="previous" class="step" aria-label="Previous letter">‹</button><button id="next" class="step" aria-label="Next letter">›</button></main><script>(()=>{const dial=document.getElementById('dial'),alphabet=document.getElementById('alphabet'),slots=document.getElementById('wordSlots'),input=document.getElementById('wordEntry'),pointer=document.getElementById('pointer'),pivot=document.getElementById('pivot');const ABC='ABCDEFGHIJKLMNOPQRSTUVWXYZ',N=14;let chars=[...'SUFFER'],active=0,angle=0,current=17,locked=new Set(),timer=null;
function fit(){dial.style.transform='translate(-50%,-50%) scale('+Math.min(innerWidth/720,innerHeight/720)*.99+')'}fit();addEventListener('resize',fit);
const letters=[...ABC].map((c,i)=>{const a=i*2*Math.PI/26-Math.PI/2,b=document.createElement('button');b.type='button';b.className='alphabet-letter';b.textContent=c;b.style.left=(50+44*Math.cos(a))+'%';b.style.top=(47.1+40.8*Math.sin(a))+'%';b.style.setProperty('--turn',(i*360/26)+'deg');b.setAttribute('aria-label','Rhyme letter '+c);b.onclick=()=>choose(i);alphabet.append(b);return b});
let cells=[];function buildCells(){slots.replaceChildren();const total=Math.max(N,chars.length);cells=Array.from({length:total},(_,i)=>{const a=i*2*Math.PI/total-Math.PI/2,box=document.createElement('div');box.className='slot';box.style.setProperty('--x',(50+30*Math.cos(a))+'%');box.style.setProperty('--y',(45.8+29*Math.sin(a))+'%');box.style.setProperty('--turn',(i*360/total)+'deg');const b=document.createElement('button'),l=document.createElement('button');b.type=l.type='button';b.className='slot-letter';l.className='slot-lock';b.onclick=()=>{if(locked.has(i)){locked.delete(i);active=i}else if(active===i){locked.add(i);active=null}else{active=i}render();const c=chars[active]?.toUpperCase();if(c&&ABC.includes(c))point(ABC.indexOf(c))};l.onclick=()=>{locked.has(i)?locked.delete(i):locked.add(i);render()};box.append(b);slots.append(box);const size=Math.min(43,Math.floor(2*210*Math.sin(Math.PI/total)-5));box.style.width=size+'px';box.style.height=Math.min(50,size*1.16)+'px';b.style.fontSize=Math.min(34,size*.78)+'px';return{box,b,l}})}buildCells();
function render(){if(cells.length!==Math.max(N,chars.length))buildCells();input.value=chars.join('').trimEnd();cells.forEach(({box,b,l},i)=>{b.textContent=chars[i]||'';b.setAttribute('aria-label',(locked.has(i)?'Unlock and select position ':active===i?'Lock selected position ':'Select word position ')+(i+1)+': '+(chars[i]||'blank'));b.setAttribute('aria-pressed',String(active===i));l.setAttribute('aria-label',(locked.has(i)?'Unlock':'Lock')+' word position '+(i+1));l.setAttribute('aria-pressed',String(locked.has(i)));box.classList.toggle('active',active===i);box.classList.toggle('locked',locked.has(i))});letters.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===current)));pivot.setAttribute('aria-label','Turn sword, selected '+ABC[current])}
function point(index){index=(index+26)%26;let delta=index*360/26-((angle%360+360)%360);if(delta>180)delta-=360;if(delta< -180)delta+=360;angle+=delta;current=index;pointer.style.transform='rotate('+angle+'deg)';letters.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));pivot.setAttribute('aria-label','Turn sword, selected '+ABC[index])}
function choose(i){i=(i+26)%26;point(i);if(active!==null&&!locked.has(active)){while(chars.length<=active)chars.push(' ');chars[active]=ABC[i]}render()}
input.addEventListener('input',()=>{chars=[...input.value];locked=new Set([...locked].filter(i=>i<chars.length));if(active!==null&&active>=chars.length)active=Math.max(0,chars.length-1);const c=chars[active]?.toUpperCase();if(c&&ABC.includes(c))point(ABC.indexOf(c));render()});
document.getElementById('previous').onclick=()=>choose(current-1);document.getElementById('next').onclick=()=>choose(current+1);pivot.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowUp'){e.preventDefault();choose(current+1)}if(e.key==='ArrowLeft'||e.key==='ArrowDown'){e.preventDefault();choose(current-1)}});
let drag=null,last=0,moved=false;const polar=e=>{const r=dial.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height*.471),e.clientX-(r.left+r.width*.5))*180/Math.PI+90};pivot.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY};moved=false;last=polar(e);pivot.setPointerCapture(e.pointerId);dial.classList.add('turning')});pivot.addEventListener('pointermove',e=>{if(e.pointerId!==drag?.id)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>3)moved=true;if(!moved)return;const now=polar(e);let d=now-last;if(d>180)d-=360;if(d< -180)d+=360;last=now;angle+=d;pointer.style.transform='rotate('+angle+'deg)';current=((Math.round(angle/(360/26))%26)+26)%26;if(active!==null&&!locked.has(active)){while(chars.length<=active)chars.push(' ');chars[active]=ABC[current]}render()});function release(e){if(e.pointerId!==drag?.id)return;drag=null;dial.classList.remove('turning');point(current)}pivot.addEventListener('pointerup',release);pivot.addEventListener('pointercancel',release);pivot.addEventListener('click',()=>{if(!moved)choose(current+1);moved=false});
function stop(){clearInterval(timer);timer=null}function demo(){stop();chars=[...'BATTLE'];active=0;locked=new Set([1,2,3,4,5]);point(1);render();let n=0;timer=setInterval(()=>{choose([2,17,1][n++%3])},1300)}addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='rhyme-physical-demo')return;e.data.play?demo():stop()});document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});point(ABC.indexOf(chars[0]));render()})();</script></body></html>
