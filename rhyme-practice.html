<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RHYME DIAL</title><style>

/* ==========================================================
   VARIABLES
========================================================== */

:root {
    --bg: #0b0f19;
    --panel: #151c2c;
    --blue: #0284c7;
    --cyan: #00f2ff;
    --gold: #ffb700;
    --green: #00ff88;
    --dark: #0f172a;
    --light: #f8fafc;

    /*
       The dial uses a conservative viewport-based size.
       This prevents the circular lock from ever exceeding
       the available mobile width.
    */
    --dial-size: min(480px, calc(100vw - 24px));
}

/* ==========================================================
   GLOBAL
========================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

html {
    width: 100%;
    min-height: 100%;
    background: var(--bg);
    overflow-x: hidden;
}

body {
    width: 100%;
    min-height: 100vh;

    /*
       EOTA KNIGHT + DOVE BACKGROUND
       The supplied artwork is embedded directly into this HTML,
       so the background works without a separate image file.
    */
    background:#0b101b;

    color: var(--light);

    padding: 20px 12px 40px;

    overflow-x: hidden;
    overflow-y: auto;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}

button {
    font-family: Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

/* ==========================================================
   APP
========================================================== */

.app {
    width: 100%;
    max-width: 620px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
}

.main-layout {
    width: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 18px;

    transition:
        opacity .7s ease,
        transform .7s ease,
        filter .7s ease;
}

.main-layout.fade {
    opacity: 0;
    transform: scale(.95);
    filter: blur(10px);
    pointer-events: none;
}

/* ==========================================================
   DIAL
========================================================== */

.lock-container {
    position: relative;

    width: var(--dial-size);
    height: var(--dial-size);

    max-width: 480px;
    max-height: 480px;

    flex: 0 0 auto;

    background: #01030b;

    border: 7px solid #1e293b;

    border-radius: 50%;

    box-shadow:
        0 0 45px rgba(0,242,255,.18),
        0 0 90px rgba(0,242,255,.05),
        inset 0 0 30px rgba(0,0,0,.08);

    overflow: hidden;

    user-select: none;
    -webkit-user-select: none;

    touch-action: manipulation;

    cursor: pointer;
}

/* ==========================================================
   NYC AFTER-DARK URBAN CENTER

   The original EOTA lock remains intact. This layer replaces
   the flat white field with an original, stylized New York
   night scene: glowing skyline, lit windows, street-level
   color, soft haze, and slow city motion.
========================================================== */

.space-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    border-radius: 50%;
    background:
        radial-gradient(circle at 50% 24%, rgba(0,213,255,.18) 0%, rgba(0,110,185,.06) 18%, transparent 42%),
        linear-gradient(180deg, #07152a 0%, #10284a 35%, #172d42 55%, #090e19 100%);
}

/* soft city haze */
.space-bg::before {
    content: '';
    position: absolute;
    inset: -14%;
    background:
        radial-gradient(ellipse at 25% 40%, rgba(0,242,255,.15) 0%, transparent 34%),
        radial-gradient(ellipse at 78% 36%, rgba(255,54,167,.13) 0%, transparent 31%),
        radial-gradient(ellipse at 58% 76%, rgba(255,183,0,.12) 0%, transparent 30%);
    filter: blur(15px);
    animation: eyeotaCityHaze 16s ease-in-out infinite alternate;
}

/* distant skyline silhouette */
.space-skyline-back {
    position: absolute;
    left: -4%;
    bottom: 17%;
    width: 108%;
    height: 38%;
    opacity: .94;
    background:
        linear-gradient(#07111f 0 0) 3% 35%/9% 65% no-repeat,
        linear-gradient(#091422 0 0) 12% 20%/8% 80% no-repeat,
        linear-gradient(#081321 0 0) 21% 42%/7% 58% no-repeat,
        linear-gradient(#0a1726 0 0) 29% 10%/9% 90% no-repeat,
        linear-gradient(#091321 0 0) 39% 30%/6% 70% no-repeat,
        linear-gradient(#0a1624 0 0) 46% 14%/10% 86% no-repeat,
        linear-gradient(#08121f 0 0) 58% 34%/8% 66% no-repeat,
        linear-gradient(#091321 0 0) 67% 20%/7% 80% no-repeat,
        linear-gradient(#07111f 0 0) 75% 3%/10% 97% no-repeat,
        linear-gradient(#08121e 0 0) 86% 25%/7% 75% no-repeat,
        linear-gradient(#07111d 0 0) 94% 42%/7% 58% no-repeat;
    filter: drop-shadow(0 -5px 16px rgba(0,0,0,.28));
    transform: translateX(0);
    animation: eyeotaCityParallax 20s ease-in-out infinite alternate;
}

/* a stylized tower inspired by NYC's vertical profile, not a replica */
.space-tower {
    position: absolute;
    z-index: 2;
    left: 43%;
    bottom: 17%;
    width: 11%;
    height: 57%;
    background: linear-gradient(90deg, #0b1727, #12263c 45%, #08121f);
    clip-path: polygon(22% 100%, 31% 19%, 40% 10%, 47% 0, 54% 10%, 63% 19%, 72% 100%);
    box-shadow: 0 0 20px rgba(0,0,0,.35);
}

.space-tower::before {
    content: '';
    position: absolute;
    left: 46%;
    top: -10%;
    width: 8%;
    height: 18%;
    background: #102239;
    transform: skewX(-18deg);
    box-shadow: 0 0 12px rgba(0,242,255,.12);
}

/* warm/cool apartment windows */
.space-windows {
    position: absolute;
    z-index: 3;
    left: 0;
    right: 0;
    bottom: 21%;
    height: 28%;
    background-image:
        radial-gradient(circle at 6% 23%, rgba(255,213,105,.85) 0 1.5px, transparent 2.4px),
        radial-gradient(circle at 11% 58%, rgba(0,242,255,.55) 0 1.2px, transparent 2.2px),
        radial-gradient(circle at 16% 35%, rgba(255,91,169,.72) 0 1.3px, transparent 2.2px),
        radial-gradient(circle at 22% 68%, rgba(255,211,111,.82) 0 1.4px, transparent 2.4px),
        radial-gradient(circle at 28% 26%, rgba(155,223,255,.72) 0 1.2px, transparent 2.1px),
        radial-gradient(circle at 34% 50%, rgba(255,209,98,.92) 0 1.5px, transparent 2.4px),
        radial-gradient(circle at 40% 73%, rgba(0,242,255,.60) 0 1.2px, transparent 2.2px),
        radial-gradient(circle at 47% 30%, rgba(255,213,105,.86) 0 1.5px, transparent 2.4px),
        radial-gradient(circle at 52% 63%, rgba(255,82,168,.75) 0 1.25px, transparent 2.2px),
        radial-gradient(circle at 58% 39%, rgba(167,224,255,.72) 0 1.2px, transparent 2.1px),
        radial-gradient(circle at 64% 72%, rgba(255,220,120,.86) 0 1.4px, transparent 2.3px),
        radial-gradient(circle at 71% 27%, rgba(0,242,255,.62) 0 1.2px, transparent 2.1px),
        radial-gradient(circle at 78% 56%, rgba(255,201,101,.90) 0 1.5px, transparent 2.4px),
        radial-gradient(circle at 85% 34%, rgba(255,82,166,.68) 0 1.2px, transparent 2.1px),
        radial-gradient(circle at 92% 65%, rgba(165,226,255,.76) 0 1.3px, transparent 2.2px);
    opacity: .82;
    animation: eyeotaWindowPulse 5s ease-in-out infinite alternate;
}

/* foreground rooftops */
.space-rooftops {
    position: absolute;
    left: -10%;
    bottom: 8%;
    width: 120%;
    height: 15%;
    background:
        linear-gradient(90deg, transparent 0 4%, #0a1019 4% 17%, transparent 17% 20%, #0c131e 20% 38%, transparent 38% 43%, #0a1018 43% 60%, transparent 60% 65%, #0c131d 65% 83%, transparent 83% 87%, #09111b 87% 100%);
    opacity: .95;
    box-shadow: inset 0 10px 14px rgba(0,0,0,.2);
}

/* street / wet pavement reflection at the bottom */
.space-street {
    position: absolute;
    z-index: 5;
    left: -15%;
    bottom: -4%;
    width: 130%;
    height: 30%;
    background:
        linear-gradient(180deg, rgba(8,13,21,.05), rgba(3,7,12,.95)),
        repeating-linear-gradient(90deg, rgba(0,242,255,.10) 0 1px, transparent 1px 13px),
        linear-gradient(90deg, rgba(255,64,170,.18), transparent 24%, rgba(255,190,68,.13) 48%, transparent 75%, rgba(0,242,255,.14));
    filter: blur(.4px);
    transform: skewX(-10deg);
    animation: eyeotaStreetFlow 7s ease-in-out infinite alternate;
}

/* subtle neon strips */
.space-neon {
    position: absolute;
    z-index: 6;
    left: 13%;
    right: 13%;
    bottom: 27%;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(0,242,255,.75), rgba(255,71,173,.7), rgba(255,201,84,.75), transparent);
    filter: blur(.8px);
    opacity: .75;
    animation: eyeotaNeonPulse 3.8s ease-in-out infinite;
}

@keyframes eyeotaCityHaze {
    0%   { transform: translate3d(-2%, 1%, 0) scale(1.05); }
    100% { transform: translate3d(3%, -2%, 0) scale(1.12); }
}

@keyframes eyeotaCityParallax {
    0%   { transform: translateX(-1.5%); }
    100% { transform: translateX(1.5%); }
}

@keyframes eyeotaWindowPulse {
    0%,100% { opacity: .62; }
    50% { opacity: .94; }
}

@keyframes eyeotaStreetFlow {
    0%   { transform: skewX(-10deg) translateX(-2%); opacity: .62; }
    100% { transform: skewX(-10deg) translateX(3%); opacity: .82; }
}

@keyframes eyeotaNeonPulse {
    0%,100% { opacity: .50; }
    50% { opacity: .92; }
}

@media (prefers-reduced-motion: reduce) {
    .space-bg::before,
    .space-skyline-back,
    .space-windows,
    .space-street,
    .space-neon {
        animation: none;
    }
}

/* ==========================================================
   DIAL SVG
========================================================== */

.dial-svg {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    pointer-events: none;

    z-index: 1;
}

/* ==========================================================
   MUSIC NOTE TRACK
   Keeps the musical ring visually separated from the outer stroke.
========================================================== */

.note-track {
    position: absolute;
    inset: 4%;
    z-index: 25;
    border: 2px solid rgba(203,213,225,.46);
    border-radius: 50%;
    box-shadow:
        0 0 0 6px rgba(5,15,30,.10),
        inset 0 0 0 1px rgba(0,242,255,.08);
    pointer-events: none;
}

/* ==========================================================
   TOP POINTER
========================================================== */

.top-pointer {
    position: absolute;

    top: 4px;
    left: 50%;

    transform: translateX(-50%);

    width: 0;
    height: 0;

    border-left: clamp(7px, 2vw, 10px) solid transparent;
    border-right: clamp(7px, 2vw, 10px) solid transparent;
    border-top: clamp(10px, 2.8vw, 14px) solid #0284c7;

    z-index: 50;

    pointer-events: none;
}

/* ==========================================================
   CENTER ARTWORK
========================================================== */

.center-artwork {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 30%;
    height: 42%;

    display: flex;

    align-items: center;
    justify-content: center;

    z-index: 40;

    pointer-events: none;
}

.center-artwork svg {
    display: block;

    width: 100%;
    height: 100%;
}

/* ==========================================================
   VINYL RECORD CENTER
   Replaces the old eye/fingerprint mark while keeping the
   existing EOTA dial dimensions and placement.
========================================================== */

.vinyl-record {
    transform-origin: 70px 100px;
    transform-box: view-box;
    transition: filter .16s ease;
}

.vinyl-surface {
    filter: drop-shadow(0 0 5px rgba(0,0,0,.38));
}

.vinyl-groove {
    fill: none;
    stroke: rgba(255,255,255,.16);
    stroke-width: 1.4;
}

.vinyl-label {
    fill: url(#vinylLabelGradient);
}

/* Healing + audio emblem for the vinyl center. No lettering. */
.healing-audio-mark {
    transform-box: fill-box;
    transform-origin: center;
    animation: healingPulse 3.6s ease-in-out infinite;
    filter: drop-shadow(0 0 4px rgba(0,242,255,.28));
}

.healing-cross {
    fill: rgba(226,232,240,.96);
    stroke: rgba(0,242,255,.56);
    stroke-width: .7;
}

.healing-bar {
    fill: #e0f2fe;
    opacity: .95;
}

.healing-bar-bright {
    fill: #67e8f9;
    opacity: 1;
}

.healing-wave {
    fill: none;
    stroke: #f8fafc;
    stroke-width: 1.25;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.healing-wave-glow {
    fill: none;
    stroke: rgba(0,242,255,.44);
    stroke-width: 3.2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

@keyframes healingPulse {
    0%,100% { transform: scale(.98); opacity: .92; }
    50% { transform: scale(1.035); opacity: 1; }
}

#dial.eyeota-healing-hit .healing-audio-mark {
    animation: healingHit .28s cubic-bezier(.2,.9,.25,1);
}

@keyframes healingHit {
    0% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(0,242,255,.30)); }
    45% { transform: scale(1.14); filter: drop-shadow(0 0 11px rgba(0,242,255,.85)); }
    100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(0,242,255,.30)); }
}

.vinyl-highlight {
    fill: none;
    stroke: rgba(255,255,255,.30);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 24 160;
    transform-origin: 70px 100px;
    animation: vinylShimmer 4.5s linear infinite;
}

@keyframes vinylShimmer {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
}

#dial.eyeota-vinyl-hit .vinyl-record {
    animation: vinylHit .22s cubic-bezier(.2,.9,.25,1);
    filter: drop-shadow(0 0 9px rgba(0,242,255,.55));
}

@keyframes vinylHit {
    0%   { transform: rotate(0deg) scale(1); }
    45%  { transform: rotate(9deg) scale(1.025); }
    100% { transform: rotate(0deg) scale(1); }
}

/* ==========================================================
   RINGS
========================================================== */

.ring {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    transform-origin: 50% 50%;

    will-change: transform;
}

.outer-ring {
    z-index: 45;
    /* The ring itself must not block the letters underneath.
       Only the individual music-note controls receive pointer events. */
    pointer-events: none;
}

.inner-ring {
    z-index: 40;
}

/* ==========================================================
   LETTERS
========================================================== */

.letter {
    position: absolute;

    /*
       Scales with the dial rather than with viewport width.
       This keeps spacing proportional at 320px phones.
    */
    width: clamp(22px, 6.7%, 32px);
    height: clamp(22px, 6.7%, 32px);

    margin-left:
        calc(clamp(22px, 6.7%, 32px) / -2);

    margin-top:
        calc(clamp(22px, 6.7%, 32px) / -2);

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: #ffffff;

    font-family: "Courier New", monospace;

    font-weight: bold;

    font-size: clamp(10px, 3.3%, 16px);

    cursor: pointer;

    border: 2px solid rgba(15,23,42,.35);

    text-shadow:
        0 2px 3px rgba(0,0,0,.98),
        0 0 7px rgba(0,0,0,.95);

    box-shadow:
        0 0 0 3px rgba(3,9,22,.78),
        0 3px 10px rgba(0,0,0,.65),
        inset 0 0 0 1px rgba(255,255,255,.24);

    transition:
        background .4s ease,
        color .2s ease,
        box-shadow .2s ease;

    user-select: none;
    -webkit-user-select: none;

    -webkit-tap-highlight-color: transparent;

    touch-action: manipulation;

}

.letter.selected {
    border: 3px solid #0f172a;

    box-shadow:
        0 0 0 3px rgba(255,255,255,.95),
        0 0 18px rgba(0,242,255,.95);

    z-index: 100;
}

/* ==========================================================
   MUSICAL NOTES
========================================================== */

.note {
    position: absolute;

    width: clamp(19px, 5.8%, 28px);
    height: clamp(19px, 5.8%, 28px);

    margin-left:
        calc(clamp(19px, 5.8%, 28px) / -2);

    margin-top:
        calc(clamp(19px, 5.8%, 28px) / -2);

    display: flex;

    align-items: center;
    justify-content: center;

    color: #ffffff;

    font-size: clamp(12px, 3.7%, 18px);

    font-weight: 700;

    background:
        radial-gradient(circle at 35% 30%, rgba(12, 36, 66, .96), rgba(3, 9, 22, .96) 72%);

    border: 1px solid rgba(255,255,255,.42);

    border-radius: 50%;

    text-shadow:
        0 0 4px rgba(0,0,0,.95),
        0 1px 4px rgba(0,0,0,.95),
        0 0 10px rgba(0,242,255,.55);

    box-shadow:
        0 0 0 2px rgba(0,242,255,.16),
        0 0 10px rgba(0,242,255,.16),
        0 3px 9px rgba(0,0,0,.55);

    cursor: pointer;

    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

.note:hover {
    filter: brightness(1.25);
    box-shadow:
        0 0 0 2px rgba(0,242,255,.35),
        0 0 16px rgba(0,242,255,.42),
        0 3px 9px rgba(0,0,0,.55);
}

.note.eyeota-note-hit {
    filter: brightness(1.35);
    box-shadow:
        0 0 0 3px rgba(255,255,255,.82),
        0 0 18px rgba(0,242,255,.95),
        0 3px 9px rgba(0,0,0,.55);
    transform: scale(1.12);
}

/* ==========================================================
   BRAND
========================================================== */

.brand {
    width: 100%;
    text-align: center;
    padding: 11px 14px;
    background: rgba(2, 6, 23, .76);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 14px;
    box-shadow: 0 10px 28px rgba(0,0,0,.32);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}

.brand h1 {
    font-size: clamp(25px, 8vw, 34px);

    letter-spacing:
        clamp(4px, 2vw, 8px);

    line-height: 1;
}

.brand p {
    margin-top: 5px;

    font-size: 10px;

    letter-spacing: 3px;

    color: #94a3b8;
}

/* ==========================================================
   PERSONAL RECORDS GATEWAY NOTICE
========================================================== */

.personal-gateway {
    width: 100%;
    background: rgba(4,10,22,.78);
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);

    padding: 13px 15px;

    background:
        linear-gradient(
            135deg,
            rgba(2,132,199,.10),
            rgba(0,255,136,.045)
        ),
        rgba(4,10,22,.90);

    border: 1px solid rgba(0,242,255,.28);

    border-radius: 12px;

    box-shadow:
        0 0 18px rgba(0,242,255,.055);
}

.gateway-top {
    display: flex;

    align-items: center;

    gap: 10px;
}

.gateway-icon {
    width: 30px;
    height: 30px;

    flex: 0 0 auto;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 8px;

    color: var(--cyan);

    background: rgba(0,242,255,.08);

    border: 1px solid rgba(0,242,255,.25);

    font-size: 16px;
}

.gateway-title {
    color: #ffffff;

    font-size: 12px;

    font-weight: bold;

    letter-spacing: 1.2px;

    text-transform: uppercase;
}

.gateway-subtitle {
    margin-top: 4px;

    color: #94a3b8;

    font-size: 11px;

    line-height: 1.4;
}

.gateway-note {
    margin-top: 9px;

    padding-top: 9px;

    border-top: 1px solid rgba(148,163,184,.12);

    color: #64748b;

    font-size: 9px;

    line-height: 1.45;
}

/* ==========================================================
   AUDIO BANNER
========================================================== */

.banner {
    width: 100%;

    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 10px;

    padding: 12px 15px;

    background: rgba(15,23,42,.9);

    border: 1px solid rgba(0,242,255,.3);

    border-radius: 12px;

    box-shadow:
        0 0 15px rgba(0,242,255,.08);
}

.banner-left {
    min-width: 0;

    display: flex;

    align-items: center;

    gap: 10px;
}

.banner-icon {
    flex: 0 0 auto;
    font-size: 22px;
}

.banner h3 {
    font-size: 14px;
    line-height: 1.2;
}

.banner p {
    margin-top: 3px;

    color: #94a3b8;

    font-size: 11px;

    line-height: 1.3;
}

.status {
    flex: 0 0 auto;

    white-space: nowrap;

    padding: 5px 9px;

    border-radius: 20px;

    color: var(--green);

    border: 1px solid var(--green);

    background: rgba(0,255,136,.1);

    font-size: 10px;

    font-weight: bold;

    letter-spacing: 1px;
}

/* ==========================================================
   COLOR PANEL
========================================================== */

.color-panel {
    width: 100%;

    padding: 14px;

    background: var(--panel);

    border: 1px solid #334155;

    border-radius: 14px;

    box-shadow:
        0 0 20px rgba(0,242,255,.05);
}

.color-panel-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 10px;

    margin-bottom: 12px;
}

.color-panel-title {
    font-size: 12px;

    color: #94a3b8;

    text-transform: uppercase;

    letter-spacing: 1px;
}

.selected-letter-name {
    color: #ffffff;

    font-size: 18px;

    font-weight: bold;
}

.selected-color-info {
    display: flex;

    align-items: center;

    gap: 8px;

    color: #94a3b8;

    font-size: 11px;
}

.selected-color-dot {
    width: 28px;
    height: 28px;

    border-radius: 50%;

    border: 2px solid white;

    background: #64748b;

    box-shadow:
        0 0 12px rgba(0,0,0,.5);
}

/* ==========================================================
   COLOR SWATCHES
========================================================== */

.color-choice-title {
    margin-bottom: 8px;

    color: #94a3b8;

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: 1px;
}

.color-swatches {
    display: grid;

    grid-template-columns:
        repeat(13, minmax(0, 1fr));

    gap: 5px;

    width: 100%;
}

.color-swatch {
    width: 100%;

    aspect-ratio: 1 / 1;

    min-width: 0;

    min-height: 28px;

    padding: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 6px;

    border: 2px solid rgba(15,23,42,.5);

    cursor: pointer;

    font-size: 8px;

    font-weight: bold;

    line-height: 1;

    text-shadow:
        0 1px 2px rgba(0,0,0,.6);

    transition:
        transform .15s ease,
        box-shadow .15s ease,
        border-color .15s ease;
}

.color-swatch:hover {
    transform: scale(1.08);

    box-shadow:
        0 0 10px rgba(255,255,255,.4);
}

.color-swatch.active {
    border-color: #ffffff;

    box-shadow:
        0 0 0 2px #00f2ff,
        0 0 12px rgba(0,242,255,.8);

    transform: scale(1.08);
}

/* ==========================================================
   COLOR HELP
========================================================== */

.color-help {
    margin-top: 9px;

    color: #64748b;

    font-size: 10px;

    line-height: 1.4;
}

/* ==========================================================
   COLOR SHUFFLING STATUS
========================================================== */

.shuffle-status {
    display: flex;

    align-items: center;

    gap: 7px;

    margin-top: 9px;

    color: #64748b;

    font-size: 9px;

    letter-spacing: .5px;
}

.shuffle-dot {
    width: 7px;
    height: 7px;

    flex: 0 0 auto;

    border-radius: 50%;

    background: #00ff88;

    box-shadow:
        0 0 8px #00ff88;

    animation:
        pulse 1s infinite;
}

@keyframes pulse {

    0%,100% {
        opacity: .35;
    }

    50% {
        opacity: 1;
    }

}

/* ==========================================================
   CONTROL PANEL
========================================================== */

.panel {
    width: 100%;

    padding: 18px;

    background: var(--panel);

    border: 1px solid #334155;

    border-radius: 14px;

    display: flex;

    flex-direction: column;

    gap: 12px;
}

/* ==========================================================
   STATUS ROW
========================================================== */

.row {
    min-height: 42px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 10px;

    padding: 11px 14px;

    background: var(--dark);

    border-radius: 8px;

    font-family: monospace;

    font-size: 13px;
}

/* ==========================================================
   BADGES
========================================================== */

.badge {
    flex: 0 0 auto;

    padding: 6px 10px;

    border-radius: 6px;

    font-size: 11px;

    font-weight: bold;

    text-align: center;
}

.locked {
    background: #7f1d1d;
    color: #fca5a5;
}

.unlocked {
    background: #14532d;
    color: #86efac;
}

/* ==========================================================
   PROGRESS
========================================================== */

.progress-box {
    padding: 11px;

    background: var(--dark);

    border-radius: 8px;
}

.progress-label {
    display: flex;

    justify-content: space-between;

    gap: 10px;

    margin-bottom: 7px;

    color: #94a3b8;

    font-size: 12px;
}

.progress {
    height: 17px;

    background: #1e293b;

    border-radius: 6px;

    overflow: hidden;
}

.progress-fill {
    width: 0%;

    height: 100%;

    background:
        linear-gradient(
            90deg,
            #0284c7,
            #00ff88
        );

    transition:
        width .3s ease;
}

/* ==========================================================
   CODE BOX
========================================================== */

.code-box {
    min-height: 46px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 10px;

    padding: 11px 14px;

    background: var(--dark);

    border-radius: 8px;

    font-family: monospace;

    font-size: 13px;
}

.code {
    display: flex;

    align-items: center;
    justify-content: flex-end;

    gap: 2px;

    min-height: 30px;

    font-size: 18px;

    letter-spacing: 2px;

    font-weight: bold;
}

.code-letter {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    min-width: 24px;

    height: 28px;

    border-radius: 5px;

    color: #ffffff;

    text-shadow:
        0 1px 3px rgba(0,0,0,.7);

    transition:
        background .2s ease,
        transform .2s ease;
}

.code-letter.active {
    transform: scale(1.08);
}
/* MUSIC SYMBOL LOCK FACTOR */
.music-code-box{margin-top:9px;padding:10px 14px;background:var(--dark);border-radius:8px}.music-code-label{display:flex;justify-content:space-between;align-items:center;color:#94a3b8;font-size:11px;margin-bottom:7px}.music-code{display:grid;grid-template-columns:repeat(8,minmax(28px,1fr));align-items:center;justify-items:center;gap:6px;min-height:72px;width:100%}.music-code-symbol{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;background:#0b1220;border:1px solid rgba(0,242,255,.38);color:#ffffff;font-size:19px;line-height:1;text-shadow:0 0 7px rgba(0,242,255,.65);transition:transform .2s ease,background .2s ease,box-shadow .2s ease}.music-code-symbol.active{background:#075985;border-color:#00f2ff;box-shadow:0 0 10px rgba(0,242,255,.55);transform:scale(1.08)}.note{cursor:pointer;pointer-events:auto;user-select:none;touch-action:manipulation;z-index:70;opacity:1;visibility:visible}.note:hover{transform:scale(1.15)}.note.music-selected{border-color:#00f2ff;box-shadow:0 0 0 3px rgba(0,242,255,.35),0 0 18px rgba(0,242,255,.8);color:#00f2ff;background:#061a2e}.letter{z-index:65;opacity:1;visibility:visible}.letter.selected{z-index:100}


/* ==========================================================
   BUTTONS
========================================================== */

button {
    min-height: 44px;

    border: 0;

    border-radius: 8px;

    padding: 11px 14px;

    color: white;

    font-weight: bold;

    cursor: pointer;

    transition:
        background .2s ease,
        transform .15s ease,
        opacity .2s ease;

    touch-action: manipulation;
}

button:active {
    transform: scale(.98);
}

.primary {
    width: 100%;
    background: #0284c7;
}

.primary:hover {
    background: #0369a1;
}

.primary:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.secondary {
    background: #334155;
}

.secondary:hover {
    background: #475569;
}

.buttons {
    width: 100%;

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 9px;
}

.buttons .wide {
    grid-column: span 2;
}

/* ==========================================================
   PIN MODAL
========================================================== */

.modal-overlay {
    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 15px;

    background: rgba(0,0,0,.75);

    z-index: 500;

    overscroll-behavior: contain;
}

.modal-overlay.show {
    display: flex;
}

.pin-modal {
    width: min(360px, 100%);

    max-height: calc(100vh - 30px);

    overflow-y: auto;

    padding: 25px;

    background: #151c2c;

    border: 1px solid #334155;

    border-radius: 16px;

    box-shadow:
        0 25px 60px rgba(0,0,0,.8);

    text-align: center;
}

.pin-modal h2 {
    margin-bottom: 8px;
    font-size: 22px;
}

.pin-modal p {
    color: #94a3b8;

    font-size: 13px;

    line-height: 1.4;

    margin-bottom: 18px;
}

.pin-display {
    width: 100%;

    min-height: 52px;

    margin-bottom: 15px;

    padding: 13px;

    background: #0f172a;

    border: 1px solid #334155;

    border-radius: 8px;

    color: var(--gold);

    font-size: 24px;

    letter-spacing: 7px;

    text-align: center;
}

.pin-keypad {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;
}

.pin-keypad button {
    min-height: 50px;

    background: #334155;

    font-size: 17px;
}

.pin-keypad button:hover {
    background: #475569;
}

.pin-error {
    min-height: 18px;

    margin-top: 10px;

    color: #fca5a5;

    font-size: 12px;
}

/* ==========================================================
   SECURE PERSONAL PORTAL
========================================================== */

.portal {
    position: fixed;

    top: 50%;
    left: 50%;

    width: min(800px, calc(100vw - 24px));

    max-height: 90vh;

    overflow-y: auto;

    -webkit-overflow-scrolling: touch;

    padding:
        clamp(20px, 5vw, 30px);

    background: #151c2c;

    border: 1px solid #334155;

    border-radius: 16px;

    box-shadow:
        0 25px 60px rgba(0,0,0,.8),
        0 0 30px rgba(0,255,136,.15);

    transform:
        translate(-50%,-50%)
        scale(.9);

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .6s ease,
        transform .6s ease;

    z-index: 400;
}

.portal.active {
    opacity: 1;

    transform:
        translate(-50%,-50%)
        scale(1);

    pointer-events: auto;
}

.portal-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 15px;

    padding-bottom: 15px;

    margin-bottom: 20px;

    border-bottom: 1px solid #334155;
}

.portal-title {
    display: flex;

    align-items: center;

    gap: 10px;

    min-width: 0;
}

.portal-title h2 {
    font-size:
        clamp(18px, 5vw, 24px);

    line-height: 1.2;
}

.granted {
    flex: 0 0 auto;

    padding: 6px 11px;

    white-space: nowrap;

    border: 1px solid var(--green);

    border-radius: 20px;

    color: var(--green);

    background: rgba(0,255,136,.1);

    font-size: 10px;

    font-weight: bold;
}

.portal-notice {
    margin-bottom: 18px;

    padding: 12px 14px;

    background: rgba(0,242,255,.045);

    border-left: 3px solid var(--cyan);

    border-radius: 6px;

    color: #94a3b8;

    font-size: 12px;

    line-height: 1.45;
}

.portal-notice strong {
    color: #ffffff;
}

.records {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(190px, 1fr)
        );

    gap: 12px;
}

.record {
    padding: 14px;

    background: var(--dark);

    border: 1px solid #1e293b;

    border-radius: 10px;
}

.record label {
    display: block;

    margin-bottom: 5px;

    color: #94a3b8;

    font-size: 10px;

    letter-spacing: 1px;

    text-transform: uppercase;
}

.record strong {
    color: var(--cyan);

    font-size: 14px;

    line-height: 1.35;
}

.portal-text {
    margin: 20px 0;

    color: #94a3b8;

    font-size: 13px;

    line-height: 1.5;
}

.relock {
    width: 100%;
    background: #b91c1c;
}

.relock:hover {
    background: #991b1b;
}

/* ==========================================================
   MOBILE
========================================================== */

    color: #94a3b8;

.rhyme-word-row{display:flex;gap:9px;margin-bottom:12px;}
.rhyme-word-input{flex:1;min-width:0;border:1px solid rgba(0,242,255,.32);border-radius:9px;background:#08111f;color:#fff;padding:11px 12px;font-size:15px;outline:none;}
.rhyme-word-input:focus,.rap-pad:focus{border-color:#00f2ff;box-shadow:0 0 0 2px rgba(0,242,255,.12);}
.rhyme-hint{min-height:20px;color:#67e8f9;font-size:12px;margin:0 0 10px;}
.rap-pad{display:block;width:100%;min-height:240px;resize:vertical;border:1px solid rgba(148,163,184,.25);border-radius:10px;background:#050b16;color:#f8fafc;padding:15px;font:15px/1.7 Consolas,Monaco,monospace;outline:none;}
.rap-meta{display:flex;justify-content:space-between;gap:12px;margin-top:9px;color:#64748b;font-size:11px;}
body.rhyme-mode .personal-gateway,body.rhyme-mode .banner,body.rhyme-mode .color-panel,body.rhyme-mode .panel{display:none!important;}
body.rhyme-mode .rhyme-workspace{display:block;}
body.rhyme-mode #dial .note-track,body.rhyme-mode #dial .note{display:none!important;}
body.rhyme-mode #dial .letter{pointer-events:auto!important;cursor:pointer!important;}
body.rhyme-mode #dial .wave-network{opacity:.42;}
body.rhyme-mode #dial .center-artwork{filter:hue-rotate(30deg) saturate(.9);}
@media(max-width:620px){.dial-mode-arrow{right:4px;top:50%;width:42px;height:42px;background:rgba(5,15,30,.96)}.mode-chip{top:5px}.rhyme-workspace{margin-top:14px;padding:14px}.rap-pad{min-height:210px}}



.rhyme-cycle-controls{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 13px}.rhyme-cycle-controls button{width:48px;height:42px;border-radius:10px;border:1px solid rgba(0,242,255,.48);background:#081728;color:#e9fdff;font-size:24px;font-weight:900;cursor:pointer;box-shadow:0 0 13px rgba(0,242,255,.12)}.rhyme-cycle-controls button:hover{border-color:#00f2ff;box-shadow:0 0 19px rgba(0,242,255,.34)}#rhymeCycleLetter{min-width:52px;text-align:center;font:900 24px/1 Courier New,monospace;color:#fff;text-shadow:0 0 12px rgba(0,242,255,.85)}body.rhyme-mode #dial .letter.rhyme-current-letter{box-shadow:0 0 0 3px rgba(255,255,255,.98),0 0 0 7px rgba(0,242,255,.60),0 0 32px rgba(0,242,255,1)!important;filter:brightness(1.3)!important;z-index:150!important}

/* RHYME DIAL V3 */
.analysis-options,.rhyme-results{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 12px}.analysis-chip,.rhyme-result{border:1px solid rgba(0,242,255,.3);background:#081526;color:#e8fbff;border-radius:999px;padding:7px 10px;cursor:pointer;font-size:12px}.analysis-chip.active{border-color:#ffb700;color:#ffd76b}.rhyme-result{font-size:14px;font-weight:700}.rhyme-result:hover{border-color:#00f2ff}.family-label{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.8px;margin-top:6px}.active-piece-line{color:#fff;font-size:13px;margin:6px 0}.active-piece-line strong{color:#ffd76b}

.rhyme-choice-row{display:grid;grid-template-columns:auto minmax(190px,1fr) minmax(150px,.8fr);gap:8px;align-items:center;margin:10px 0 12px}.rhyme-choice-row label{font-size:12px;font-weight:800;color:#dffcff}.rhyme-choice-row select,.rhyme-choice-row input{min-width:0;border:1px solid rgba(0,242,255,.34);border-radius:9px;background:#08111f;color:#fff;padding:10px 11px}.rhyme-choice-row input[hidden]{display:none!important}@media(max-width:620px){.rhyme-choice-row{grid-template-columns:1fr}.rhyme-choice-row label{margin-top:2px}}

        <button id="rhymeClose" aria-label="Back to desktop" title="Back to desktop">BACK</button></div><script>const ring=document.getElementById('innerRing'),colors=['#FF1744','#FF6D00','#FFC400','#E6FF00','#76FF03','#00C853','#00BFA5','#00E5FF','#0091EA','#304FFE','#6200EA','#0066FF','#AA00FF','#D500F9','#FF00CC','#FF4081','#F50057','#FF5252','#795548','#607D8B','#37474F','#8D6E63','#9E9D24','#827717','#00897B','#5E35B1'];ring.replaceChildren();[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].forEach((letter,i)=>{const a=(i*360/26-90)*Math.PI/180,node=document.createElement('button');node.type='button';node.className='letter';node.textContent=letter;node.dataset.letter=letter;node.style.left=(50+Math.cos(a)*33.75)+'%';node.style.top=(50+Math.sin(a)*33.75)+'%';node.style.background=colors[i];node.setAttribute('aria-label','Rhyme letter '+letter);node.onclick=()=>{ring.querySelectorAll('.letter').forEach(e=>e.classList.toggle('rhyme-current-letter',e===node))};ring.append(node)});function placeRhymeSymbols(){ring.querySelectorAll('.letter').forEach(letter=>{const a=Math.atan2(parseFloat(letter.style.top)-50,parseFloat(letter.style.left)-50),c=Math.cos(a),n=Math.sin(a);letter.style.setProperty('--rhyme-marker-x',`calc(${50+c*50}% + ${c*12}px)`);letter.style.setProperty('--rhyme-marker-y',`calc(${50+n*50}% + ${n*12}px)`);if(['L','B','P','D','T'].includes(letter.dataset.letter)){letter.style.setProperty('--rhyme-pair-x',`calc(${50+c*50}% + ${c*34}px)`);letter.style.setProperty('--rhyme-pair-y',`calc(${50+n*50}% + ${n*34}px)`)}})}placeRhymeSymbols();function fit(){document.getElementById('dial').style.transform='translate(-50%,-50%) scale('+Math.min(document.getElementById('dialStage').clientWidth/620,document.getElementById('dialStage').clientHeight/620)*.96+')'}fit();addEventListener('resize',fit);const back=document.getElementById('rhymeClose'),orbit=document.createElement('div');orbit.id='rhymeBackOrbit';document.getElementById('dial').append(orbit);orbit.append(back);back.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();parent.postMessage({type:'eota-rhyme-close'},'*')});</script><script>
(()=>{
 const dial=document.getElementById('dial'),knob=document.getElementById('letterKnob'),pointer=document.getElementById('letterPointer'),rotor=document.getElementById('knobRotor'),label=document.getElementById('dialSelection');
 const letters=[...document.querySelectorAll('#innerRing .letter')],step=360/26;
 let current=0,angle=0,active=null,startX=0,startY=0,moved=false;
 const wordInput=document.getElementById('rhymeWord'),positions=document.getElementById('wordPositions');
 dial.append(positions);
 letters.forEach((node,i)=>{const a=(i*360/26-90)*Math.PI/180,c=Math.cos(a),n=Math.sin(a);node.style.left=(50+c*42)+'%';node.style.top=(50+n*42)+'%';node.style.setProperty('--rhyme-marker-x',`calc(${50-c*50}% - ${c*12}px)`);node.style.setProperty('--rhyme-marker-y',`calc(${50-n*50}% - ${n*12}px)`);node.style.setProperty('--rhyme-pair-x',`calc(${50-c*50}% - ${c*34}px)`);node.style.setProperty('--rhyme-pair-y',`calc(${50-n*50}% - ${n*34}px)`)});
 const caption=document.createElement('span');caption.id='positionCaption';caption.textContent='Tap a letter to lock its position';dial.append(caption);
 function fitWord(){wordInput.style.fontSize=([...wordInput.value].length>24?'12px':'20px');wordInput.style.height='auto';wordInput.style.height=Math.min(46,Math.max(32,wordInput.scrollHeight))+'px'}
 addEventListener('resize',fitWord);
 let lockedPosition=0;
 function drawPositions(){
  fitWord();
  const count=[...wordInput.value].length;
  const arc=Math.min(260,Math.max(0,count-1)*11);
  const spacing=count>1?arc/(count-1):11;
  const cell=Math.min(28,Math.floor(2*161.2*Math.sin(spacing*Math.PI/360)-4));
  positions.style.setProperty('--cell',Math.max(8,cell)+'px');positions.style.setProperty('--letter-size',Math.min(20,Math.max(7,cell*.76))+'px');
  positions.replaceChildren();
  [...wordInput.value].forEach((char,i)=>{const button=document.createElement('button');button.type='button';button.textContent=char;const theta=(-90-arc/2+i*spacing)*Math.PI/180;button.style.left=(50+26*Math.cos(theta))+'%';button.style.top=(50+26*Math.sin(theta))+'%';button.disabled=!/^[a-z]$/i.test(char);button.setAttribute('aria-label',(i===lockedPosition?'Unlock':'Lock')+' position '+(i+1)+': '+char);button.setAttribute('aria-pressed',String(i===lockedPosition));button.onclick=()=>{lockedPosition=lockedPosition===i?null:i;if(lockedPosition!==null)choose(char.toUpperCase().charCodeAt(0)-65);else drawPositions()};positions.append(button)});
 }
 function updateWord(letter){if(lockedPosition===null)return;const chars=[...wordInput.value];if(!chars[lockedPosition]||!/^[a-z]$/i.test(chars[lockedPosition]))return;const before=chars[lockedPosition];chars[lockedPosition]=before===before.toUpperCase()?letter:letter.toLowerCase();wordInput.value=chars.join('');drawPositions()}
 const wrap=n=>((n%26)+26)%26;
 function setAngle(value,snap=false){
  const index=wrap(Math.round(value/step));
  if(snap)value=Math.round(value/step)*step;
  angle=value;current=index;
  pointer.style.transform='rotate('+value+'deg)';rotor.style.transform='rotate('+value+'deg)';
  const letter=letters[index].dataset.letter;
  if(label.textContent!==letter)label.textContent=letter;
  knob.setAttribute('aria-label','Turn letter dial, selected '+letter);
  letters.forEach((node,i)=>{node.classList.toggle('rhyme-current-letter',i===index);node.setAttribute('aria-pressed',String(i===index))});
  updateWord(letter);
 }
 function choose(index){let delta=wrap(index)*step-((angle%360+360)%360);if(delta>180)delta-=360;if(delta< -180)delta+=360;setAngle(angle+delta,true)}
 function fromPointer(event){const rect=dial.getBoundingClientRect();return Math.atan2(event.clientY-(rect.top+rect.height/2),event.clientX-(rect.left+rect.width/2))*180/Math.PI+90}
 let lastPointer=0;
 knob.addEventListener('pointerdown',e=>{if(e.button!==0)return;active=e.pointerId;startX=e.clientX;startY=e.clientY;moved=false;lastPointer=fromPointer(e);knob.setPointerCapture(e.pointerId);dial.classList.add('turning')});
 knob.addEventListener('pointermove',e=>{if(e.pointerId!==active)return;if(Math.hypot(e.clientX-startX,e.clientY-startY)>4)moved=true;if(!moved)return;const next=fromPointer(e);let delta=next-lastPointer;if(delta>180)delta-=360;if(delta< -180)delta+=360;lastPointer=next;setAngle(angle+delta)});
 function release(e){if(e.pointerId!==active)return;active=null;dial.classList.remove('turning');setAngle(angle,true)}
 knob.addEventListener('pointerup',release);knob.addEventListener('pointercancel',release);knob.addEventListener('lostpointercapture',release);
 knob.addEventListener('click',e=>{if(e.detail===0||!moved)choose(current+1);moved=false});
 knob.addEventListener('keydown',e=>{let target;if(['ArrowRight','ArrowUp'].includes(e.key))target=current+1;else if(['ArrowLeft','ArrowDown'].includes(e.key))target=current-1;else if(e.key==='Home')target=0;else if(e.key==='End')target=25;else return;e.preventDefault();choose(target)});
 letters.forEach((node,i)=>{node.onclick=()=>choose(i)});
 document.getElementById('rhymeBackOrbit')?.remove();
 wordInput.addEventListener('input',()=>{const chars=[...wordInput.value];if(lockedPosition!==null&&/^[a-z]$/i.test(chars[lockedPosition]||''))choose(chars[lockedPosition].toUpperCase().charCodeAt(0)-65);else{lockedPosition=null;drawPositions()}});
 setAngle(360/26,true);
 drawPositions();
})();
</script><div id="rhyme-mac10-doodle" role="img" aria-label="MAC-10 doodle with Russian colors and hanging Puerto Rican flag"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150"><title>MAC-10 doodle with Russian colors and a hanging Puerto Rican flag</title><g fill="#182939" stroke="#e8d4a5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M14 34L114 31 119 64 49 68 43 57 16 58Z"/><path d="M114 40H140V54H117"/><path d="M62 66L72 68 70 103 51 104 54 69M27 58L26 77 48 77 53 67"/><path d="M75 29L77 22H98L100 31M24 31V24M17 26H32" fill="none"/><path d="M34 61V70M22 42L102 39M93 48H104" fill="none"/></g><path d="M77 45H97V50H77Z" fill="#fff"/><path d="M77 50H97V55H77Z" fill="#326acb"/><path d="M77 55H97V60H77Z" fill="#e14e52"/><path d="M109 62Q122 77 113 90" fill="none" stroke="#e8d4a5" stroke-width="2"/><g transform="translate(92 87) rotate(8)"><path d="M0 0H59V36H0Z" fill="#fff" stroke="#e8d4a5" stroke-width="2"/><path d="M0 0H59V7H0ZM0 14H59V22H0ZM0 29H59V36H0Z" fill="#db3545"/><path d="M0 0L29 18 0 36Z" fill="#2678c9"/><path d="M10 10L12 15 17 15 13 19 15 24 10 21 5 24 7 19 3 15 8 15Z" fill="#fff"/></g></svg>
</div><script>document.getElementById("dial").append(document.getElementById("rhyme-mac10-doodle"));</script><div id="rhyme-original-hellfire-hand" role="img" aria-label="Original bandanna hand gesture with palm cross and hellfire bracelet"><svg viewBox="196 0 68 104" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="restoredWhitePaisley" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#102d4a"></rect><path d="M5 3C13 1 15 10 9 13C3 16 2 9 6 8C10 7 11 11 8 11" fill="none" stroke="#fff" stroke-width="1.25"></path><circle cx="15" cy="4" r="1" fill="#fff"></circle><path d="M2 16l1-2 1 2 2 1-2 1-1 2-1-2-2-1z" fill="#fff"></path></pattern></defs><g fill="url(#restoredWhitePaisley)" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"><path d="M217 64L215 101H241L237 64Z"></path><path fill-rule="evenodd" d="M217 71L215 61Q207 56 204 49L200 41Q197 34 202 29Q208 23 215 27L219 31L218 14Q217 7 222 6Q227 5 228 12L230 31L232 10Q233 3 238 5Q242 6 241 13L239 34L246 18Q249 12 253 15Q257 18 253 24L246 43Q247 53 241 61L237 65L237 71ZM213 35Q208 31 205 35Q202 39 207 43L217 48Q222 48 223 43Q222 39 217 36Z"></path></g><g stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M228 42V59M222 48H235" stroke="#102d4a" stroke-width="6"></path><path d="M228 42V59M222 48H235" stroke="#fff" stroke-width="2.5"></path></g><g aria-hidden="true"><path d="M214 74Q227 70 240 74L241 85Q228 89 214 85Z" fill="#102d4a" stroke="#fff" stroke-width="1.5"></path><path d="M215 76Q228 73 239 76M215 84Q228 87 240 84" fill="none" stroke="#fff" stroke-width=".65"></path><text x="227.5" y="82.5" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="5.5" font-weight="bold" textLength="23" lengthAdjust="spacingAndGlyphs">hellfire</text></g></svg></div><script>document.getElementById("dial").append(document.getElementById("rhyme-original-hellfire-hand"));</script></body></html>
