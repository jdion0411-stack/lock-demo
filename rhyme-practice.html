<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RHYME DIAL</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}button,textarea{-webkit-tap-highlight-color:transparent}#dialStage{position:relative;width:100vw;height:100vh}#dial{position:absolute;left:50%;top:50%;width:620px;height:620px;transform-origin:center;border-radius:50%;isolation:isolate;touch-action:manipulation;user-select:none;filter:drop-shadow(0 9px 10px #0005)}.face{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.ring{position:absolute;inset:0;pointer-events:none}#innerRing{z-index:6}.letter{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border:0;border-radius:7px;background:transparent!important;color:#e4c680;font:35px/1 Georgia,serif;display:grid;place-items:center;cursor:pointer;pointer-events:auto;text-shadow:0 1px #000;transition:color .15s,background .15s}.letter.rhyme-current-letter{background:linear-gradient(#b58a3e,#f2dc9e,#a97c31)!important;color:#112b46;text-shadow:none;box-shadow:0 0 0 1px #fff2bf,inset 0 0 0 3px #b08c49}.letter:focus-visible,button:focus-visible{outline:3px solid #ad7e32;outline-offset:3px}#letterPointer{position:absolute;inset:0;z-index:7;pointer-events:none;transform-origin:50% 50%;transition:transform .18s ease-out;filter:drop-shadow(1px 2px 1px #0005)}#letterPointer svg{width:100%;height:100%}#letterKnob{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:12;width:43px;height:43px;padding:0;border:2px solid #b28a43;border-radius:50%;background:radial-gradient(circle at 33% 25%,#fff3bd,#d7b56a 40%,#9a7132 72%,#e5c584);box-shadow:0 2px 4px #0006,inset 0 0 0 3px #ead091;touch-action:none;cursor:grab;color:#3e2e15}#letterKnob:active{cursor:grabbing}#dialSelection{font:700 20px Georgia,serif}#knobRotor{display:none}#wordControls{position:absolute;left:50%;top:73%;transform:translateX(-50%);width:43%;z-index:13}#rhymeWord{display:block;width:100%;resize:none;overflow:hidden;min-height:42px;max-height:64px;border:1.5px solid #b58d48;border-radius:8px;background:#fffcf5;color:#172e47;text-align:center;padding:5px 10px;font:26px/1.2 Georgia,serif;box-shadow:inset 0 1px 4px #a78c5529;user-select:text}#rhymeWord:focus{outline:2px solid #c7a45e;outline-offset:3px}#wordPositions{position:absolute;inset:0;z-index:11;pointer-events:none}#wordPositions button{position:absolute;transform:translate(-50%,-50%);width:var(--cell);height:var(--cell);border:1px solid #b99a5b;border-radius:50%;background:#f8f2e4;color:#18324c;font:var(--letter-size) Georgia,serif;padding:0;pointer-events:auto;cursor:pointer}#wordPositions button.position-locked{background:#193650;color:#f7e4b4;border-color:#d1b26c;box-shadow:0 0 0 1px #193650}#wordPositions button[aria-pressed=true]{outline:2px solid #b38b3d;outline-offset:2px}#wordPositions button:disabled{opacity:.5}.rhyme-step{position:absolute;top:55%;transform:translate(-50%,-50%);width:34px;height:34px;z-index:13;border:1px solid #b89b60;border-radius:50%;background:#f9f3e7;color:#193650;font:30px/26px Georgia,serif;padding:0;cursor:pointer}#rhymePrev{left:25%}#rhymeNext{left:75%}#toggleLetterLock{display:none}.turning #letterPointer{transition:none}@media(prefers-reduced-motion:reduce){#letterPointer{transition:none}}</style></head><body><main id="dialStage"><div id="dial"><svg class="face" viewBox="0 0 620 620" aria-hidden="true"><defs>

<path d="M272 270Q265 257 271 255Q278 255 275 266Q282 256 285 262Q287 270 275 273L280 277H267L272 270Z"/><path d="M351 270Q344 257 350 255Q357 255 354 266Q361 256 364 262Q366 270 354 273L359 277H346L351 270Z"/></g></svg><div id="innerRing" class="ring"></div><div id="letterPointer"><svg viewBox="0 0 620 620" aria-hidden="true"><path d="M305 303L305 267L287 269L286 259L305 256L305 123L310 54L315 123L315 256L334 259L333 269L315 267L315 303L320 312L310 324L300 312Z" fill="url(#metal)" stroke="#745323" stroke-width="1.5"/><path d="M310 72V251" stroke="#fff5c4" stroke-width="2"/><path d="M310 248L317 257L310 266L303 257Z" fill="#e9d18d" stroke="#85612a"/><path d="M310 250L313 257L310 262L307 257Z" fill="#2c5374"/></svg></div><button id="letterKnob" aria-label="Turn letter dial"><span id="knobRotor"></span><span id="dialSelection"></span></button><div id="wordControls"><textarea id="rhymeWord" aria-label="Word to rhyme" rows="1" spellcheck="false">SUFFER</textarea></div><div id="wordPositions" role="group" aria-label="Choose letter positions"></div></div></main><script>const ring=document.getElementById('innerRing');[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].forEach((char,i)=>{const b=document.createElement('button');b.className='letter';b.dataset.letter=char;b.textContent=char;b.type='button';b.setAttribute('aria-label','Rhyme letter '+char);b.style.transform='rotate('+(i*360/26)+'deg)';ring.append(b)});function fit(){document.getElementById('dial').style.transform='translate(-50%,-50%) scale('+Math.min(innerWidth/620,innerHeight/620)*.98+')'}fit();addEventListener('resize',fit);</script><script>
(()=>{
 const dial=document.getElementById('dial'),knob=document.getElementById('letterKnob'),pointer=document.getElementById('letterPointer'),rotor=document.getElementById('knobRotor'),label=document.getElementById('dialSelection');
 const letters=[...document.querySelectorAll('#innerRing .letter')],step=360/26;
 let current=0,angle=0,active=null,startX=0,startY=0,moved=false;
 const wordInput=document.getElementById('rhymeWord'),positions=document.getElementById('wordPositions');
 dial.append(positions);
 letters.forEach((node,i)=>{const a=(i*360/26-90)*Math.PI/180,c=Math.cos(a),n=Math.sin(a);node.style.left=(50+c*43.1)+'%';node.style.top=(50+n*43.1)+'%';node.style.setProperty('--rhyme-marker-x',`calc(${50-c*50}% - ${c*12}px)`);node.style.setProperty('--rhyme-marker-y',`calc(${50-n*50}% - ${n*12}px)`);node.style.setProperty('--rhyme-pair-x',`calc(${50-c*50}% - ${c*34}px)`);node.style.setProperty('--rhyme-pair-y',`calc(${50-n*50}% - ${n*34}px)`)});
 const prev=document.createElement('button'),next=document.createElement('button');prev.type=next.type='button';prev.id='rhymePrev';next.id='rhymeNext';prev.className=next.className='rhyme-step';prev.textContent='‹';next.textContent='›';prev.setAttribute('aria-label','Previous letter');next.setAttribute('aria-label','Next letter');prev.onclick=()=>choose(current-1);next.onclick=()=>choose(current+1);dial.append(prev,next);
 
 function fitWord(){wordInput.style.fontSize=([...wordInput.value].length>24?'17px':'26px');wordInput.style.height='auto';wordInput.style.height=Math.min(64,Math.max(42,wordInput.scrollHeight))+'px'}
 addEventListener('resize',fitWord);
 let lockedPosition=0;
 const lockedLetters=new Set();
 const lockToggle=document.createElement('button');lockToggle.id='toggleLetterLock';lockToggle.type='button';dial.append(lockToggle);
 lockToggle.onclick=()=>{};lockToggle.disabled=true;

 function drawPositions(){
  fitWord();
  const count=[...wordInput.value].length;
  const arc=Math.min(260,Math.max(0,count-1)*11);
  const spacing=count>1?arc/(count-1):11;
  const cell=Math.min(28,Math.floor(2*161.2*Math.sin(spacing*Math.PI/360)-4));
  positions.style.setProperty('--cell',Math.max(8,cell)+'px');positions.style.setProperty('--letter-size',Math.min(20,Math.max(7,cell*.76))+'px');
  const selected=[...wordInput.value][lockedPosition];lockToggle.disabled=true;lockToggle.textContent=selected?'Cycling '+selected+' · '+(lockedPosition+1):'All letters locked';lockToggle.setAttribute('aria-pressed',String(lockedLetters.has(lockedPosition)));
  positions.replaceChildren();
  [...wordInput.value].forEach((char,i)=>{const button=document.createElement('button');button.type='button';button.textContent=char;const theta=(-90-arc/2+i*spacing)*Math.PI/180;button.style.left=(50+26*Math.cos(theta))+'%';button.style.top=(50+26*Math.sin(theta))+'%';button.disabled=!/^[a-z]$/i.test(char);button.setAttribute('aria-label',(lockedLetters.has(i)?'Unlock and cycle':'Lock')+' position '+(i+1)+': '+char);button.setAttribute('aria-pressed',String(i===lockedPosition));button.classList.toggle('position-locked',lockedLetters.has(i));button.onclick=()=>{if(lockedLetters.has(i)){lockedLetters.delete(i);lockedPosition=i;}else{lockedLetters.add(i);if(lockedPosition===i){lockedPosition=[...wordInput.value].findIndex((c,j)=>!lockedLetters.has(j)&&/^[a-z]$/i.test(c));if(lockedPosition<0)lockedPosition=null;}}if(lockedPosition!==null)choose([...wordInput.value][lockedPosition].toUpperCase().charCodeAt(0)-65);drawPositions()};positions.append(button)});
 }
 function updateWord(letter){if(lockedPosition===null||lockedLetters.has(lockedPosition))return;const chars=[...wordInput.value];if(!chars[lockedPosition]||!/^[a-z]$/i.test(chars[lockedPosition]))return;const before=chars[lockedPosition];chars[lockedPosition]=before===before.toUpperCase()?letter:letter.toLowerCase();wordInput.value=chars.join('');drawPositions()}
 const wrap=n=>((n%26)+26)%26;
 function setAngle(value,snap=false){
  const index=wrap(Math.round(value/step));
  if(snap)value=Math.round(value/step)*step;
  angle=value;current=index;
  pointer.style.transform='rotate('+value+'deg)';rotor.style.transform='rotate('+value+'deg)';
  const letter=letters[index].dataset.letter;
  if(label.textContent!==letter)label.textContent=letter;
  knob.setAttribute('aria-label','Turn letter dial, selected '+letter);
  letters.forEach((node,i)=>{node.classList.toggle('rhyme-current-letter',i===index);node.setAttribute('aria-pressed',String(i===index))});
  updateWord(letter);
 }
 function choose(index){let delta=wrap(index)*step-((angle%360+360)%360);if(delta>180)delta-=360;if(delta< -180)delta+=360;setAngle(angle+delta,true)}
 function fromPointer(event){const rect=dial.getBoundingClientRect();return Math.atan2(event.clientY-(rect.top+rect.height/2),event.clientX-(rect.left+rect.width/2))*180/Math.PI+90}
 let lastPointer=0;
 knob.addEventListener('pointerdown',e=>{if(e.button!==0)return;active=e.pointerId;startX=e.clientX;startY=e.clientY;moved=false;lastPointer=fromPointer(e);knob.setPointerCapture(e.pointerId);dial.classList.add('turning')});
 knob.addEventListener('pointermove',e=>{if(e.pointerId!==active)return;if(Math.hypot(e.clientX-startX,e.clientY-startY)>4)moved=true;if(!moved)return;const next=fromPointer(e);let delta=next-lastPointer;if(delta>180)delta-=360;if(delta< -180)delta+=360;lastPointer=next;setAngle(angle+delta)});
 function release(e){if(e.pointerId!==active)return;active=null;dial.classList.remove('turning');setAngle(angle,true)}
 knob.addEventListener('pointerup',release);knob.addEventListener('pointercancel',release);knob.addEventListener('lostpointercapture',release);
 knob.addEventListener('click',e=>{if(e.detail===0||!moved)choose(current+1);moved=false});
 knob.addEventListener('keydown',e=>{let target;if(['ArrowRight','ArrowUp'].includes(e.key))target=current+1;else if(['ArrowLeft','ArrowDown'].includes(e.key))target=current-1;else if(e.key==='Home')target=0;else if(e.key==='End')target=25;else return;e.preventDefault();choose(target)});
 letters.forEach((node,i)=>{node.onclick=()=>choose(i)});
 document.getElementById('rhymeBackOrbit')?.remove();
 wordInput.addEventListener('input',()=>{lockedLetters.clear();const chars=[...wordInput.value];if(lockedPosition===null||!/^[a-z]$/i.test(chars[lockedPosition]||''))lockedPosition=chars.findIndex(c=>/^[a-z]$/i.test(c));if(lockedPosition<0)lockedPosition=null;if(lockedPosition!==null)choose(chars[lockedPosition].toUpperCase().charCodeAt(0)-65);else{lockedPosition=null;drawPositions()}});
 setAngle((wordInput.value.charAt(0).toUpperCase().charCodeAt(0)-65)*step,true);
 drawPositions();
})();
