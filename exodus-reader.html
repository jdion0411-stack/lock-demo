ork 4 tha offering of tha sanctuary. So tha people were restrained from bringing."},{"n":"36:7","text":"4 tha stuff they had was sufficient 4 all tha work 2 make it, N too much."},{"n":"36:8","text":"N every wise hearted man among ’em dat wrought tha work of tha tabernacle made ten curtainz of fine twined linen, N blue, N purple, N scarlet: wit cherubims of cunning work made he ’em."},{"n":"36:9","text":"Tha length of one curtain was twenty N eight cubitz, N tha breadth of one curtain four cubitz: tha curtainz were all of one size."},{"n":"36:10","text":"N he coupled tha five curtainz one 2 another: N tha other five curtainz he coupled one 2 another."},{"n":"36:11","text":"N he made loops of blue on tha edge of one curtain from tha selvedge in tha coupling: likewise he made in tha uttermost side of another curtain, in tha coupling of tha second."},{"n":"36:12","text":"Fifty loops made he in one curtain, N fifty loops made he in tha edge of tha curtain which was in tha coupling of tha second: tha loops held one curtain 2 another."},{"n":"36:13","text":"N he made fifty taches of gold, N coupled tha curtainz one 2 another wit tha taches: so it became one tabernacle."},{"n":"36:14","text":"N he made curtainz of goats’ hair 4 tha tent over tha tabernacle: eleven curtainz he made ’em."},{"n":"36:15","text":"Tha length of one curtain was thirty cubitz, N four cubitz was tha breadth of one curtain: tha eleven curtainz were of one size."},{"n":"36:16","text":"N he coupled five curtainz by themselves, N six curtainz by themselves."},{"n":"36:17","text":"N he made fifty loops on tha uttermost edge of tha curtain in tha coupling, N fifty loops made he on tha edge of tha curtain which coupleth tha second."},{"n":"36:18","text":"N he made fifty taches of brass 2 couple tha tent together, dat it might be one."},{"n":"36:19","text":"N he made a covering 4 tha tent of rams’ skins dyed red, N a covering of badgers’ skins above dat."},{"n":"36:20","text":"N he made boardz 4 tha tabernacle of shittim wood, standing up."},{"n":"36:21","text":"Tha length of a board was ten cubitz, N tha breadth of a board one cubit N a half."},{"n":"36:22","text":"One board had two tenons, equally distant one from another: thus did he make 4 all tha boardz of tha tabernacle."},{"n":"36:23","text":"N he made boardz 4 tha tabernacle; twenty boardz 4 tha south side southward:"},{"n":"36:24","text":"N forty socketz of silver he made under tha twenty boardz; two socketz under one board 4 his two tenons, N two socketz under another board 4 his two tenons."},{"n":"36:25","text":"N 4 tha other side of tha tabernacle, which is toward tha north corner, he made twenty boardz,"},{"n":"36:26","text":"N their forty socketz of silver; two socketz under one board, N two socketz under another board."},{"n":"36:27","text":"N 4 tha sides of tha tabernacle westward he made six boardz."},{"n":"36:28","text":"N two boardz made he 4 tha corners of tha tabernacle in tha two sides."},{"n":"36:29","text":"N they were coupled beneath, N coupled together at tha head thereof, 2 one ring: thus he did 2 both of ’em in both tha corners."},{"n":"36:30","text":"N there were eight boardz; N their socketz were sixteen socketz of silver, under every board two socketz."},{"n":"36:31","text":"N he made bars of shittim wood; five 4 tha boardz of tha one side of tha tabernacle,"},{"n":"36:32","text":"N five bars 4 tha boardz of tha other side of tha tabernacle, N five bars 4 tha boardz of tha tabernacle 4 tha sides westward."},{"n":"36:33","text":"N he made tha middle bar 2 shoot through tha boardz from tha one end 2 tha other."},{"n":"36:34","text":"N he overlaid tha boardz wit gold, N made their ringz of gold 2 be places 4 tha bars, N overlaid tha bars wit gold."},{"n":"36:35","text":"N he made a vail of blue, N purple, N scarlet, N fine twined linen: wit cherubims made he it of cunning work."},{"n":"36:36","text":"N he made thereunto four pillarz of shittim wood, N overlaid ’em wit gold: their hookz were of gold; N he cast 4 ’em four socketz of silver."},{"n":"36:37","text":"N he made an hanging 4 tha tabernacle door of blue, N purple, N scarlet, N fine twined linen, of needlework;"},{"n":"36:38","text":"N tha five pillarz of it wit their hookz: N he overlaid their chapiters N their fillets wit gold: but their five socketz were of brass."}],"37":[{"n":"37:1","text":"N Bezaleel made tha ark of shittim wood: two cubitz N a half was tha length of it, N a cubit N a half tha breadth of it, N a cubit N a half tha height of it:"},{"n":"37:2","text":"N he overlaid it wit pure gold within N without, N made a crown of gold 2 it round about."},{"n":"37:3","text":"N he cast 4 it four ringz of gold, 2 be set by tha four corners of it; even two ringz on tha one side of it, N two ringz on tha other side of it."},{"n":"37:4","text":"N he made staves of shittim wood, N overlaid ’em wit gold."},{"n":"37:5","text":"N he put tha staves in2 tha ringz by tha sides of tha ark, 2 bear tha ark."},{"n":"37:6","text":"N he made tha mercy seat of pure gold: two cubitz N a half was tha length thereof, N one cubit N a half tha breadth thereof."},{"n":"37:7","text":"N he made two cherubims of gold, beaten out of one piece made he ’em, on tha two ends of tha mercy seat;"},{"n":"37:8","text":"One cherub on tha end on dis side, N another cherub on tha other end on dat side: out of tha mercy seat made he tha cherubims on tha two ends thereof."},{"n":"37:9","text":"N tha cherubims spread out their wings on high, N covered wit their wings over tha mercy seat, wit their faces one 2 another; even 2 tha mercy seatward were tha faces of tha cherubims."},{"n":"37:10","text":"N he made tha table of shittim wood: two cubitz was tha length thereof, N a cubit tha breadth thereof, N a cubit N a half tha height thereof:"},{"n":"37:11","text":"N he overlaid it wit pure gold, N made thereunto a crown of gold round about."},{"n":"37:12","text":"Also he made thereunto a border of an handbreadth round about; N made a crown of gold 4 tha border thereof round about."},{"n":"37:13","text":"N he cast 4 it four ringz of gold, N put tha ringz on tha four corners dat were in tha four feet thereof."},{"n":"37:14","text":"Over against tha border were tha ringz, tha places 4 tha staves 2 bear tha table."},{"n":"37:15","text":"N he made tha staves of shittim wood, N overlaid ’em wit gold, 2 bear tha table."},{"n":"37:16","text":"N he made tha vessels which were on tha table, his dishes, N his spoons, N his bowls, N his covers 2 cover withal, of pure gold."},{"n":"37:17","text":"N he made tha candlestick of pure gold: of beaten work made he tha candlestick; his shaft, N his branch, his bowls, his knops, N his flowers, were of tha same:"},{"n":"37:18","text":"N six branches going out of tha sides thereof; three branches of tha candlestick out of tha one side thereof, N three branches of tha candlestick out of tha other side thereof:"},{"n":"37:19","text":"Three bowls made after tha fashion of almonds in one branch, a knop N a flower; N three bowls made like almonds in another branch, a knop N a flower: so throughout tha six branches going out of tha candlestick."},{"n":"37:20","text":"N in tha candlestick were four bowls made like almonds, his knops, N his flowers:"},{"n":"37:21","text":"N a knop under two branches of tha same, N a knop under two branches of tha same, N a knop under two branches of tha same, according 2 tha six branches going out of it."},{"n":"37:22","text":"Their knops N their branches were of tha same: all of it was one beaten work of pure gold."},{"n":"37:23","text":"N he made his seven lamps, N his snuffers, N his snuffdishes, of pure gold."},{"n":"37:24","text":"Of a talent of pure gold made he it, N all tha vessels thereof."},{"n":"37:25","text":"N he made tha incense altar of shittim wood: tha length of it was a cubit, N tha breadth of it a cubit; it was foursquare; N two cubitz was tha height of it; tha horns thereof were of tha same."},{"n":"37:26","text":"N he overlaid it wit pure gold, both tha top of it, N tha sides thereof round about, N tha horns of it: also he made 2 it a crown of gold round about."},{"n":"37:27","text":"N he made two ringz of gold 4 it under tha crown thereof, by tha two corners of it, on tha two sides thereof, 2 be places 4 tha staves 2 bear it withal."},{"n":"37:28","text":"N he made tha staves of shittim wood, N overlaid ’em wit gold."},{"n":"37:29","text":"N he made tha holy anointing oil, N tha pure incense of sweet spices, according 2 tha work of tha apothecary."}],"38":[{"n":"38:1","text":"N he made tha altar of burnt offering of shittim wood: five cubitz was tha length thereof, N five cubitz tha breadth thereof; it was foursquare; N three cubitz tha height thereof."},{"n":"38:2","text":"N he made tha horns thereof on tha four corners of it; tha horns thereof were of tha same: N he overlaid it wit brass."},{"n":"38:3","text":"N he made all tha vessels of tha altar, tha pots, N tha shovels, N tha basons, N tha fleshhooks, N tha firepans: all tha vessels thereof made he of brass."},{"n":"38:4","text":"N he made 4 tha altar a brasen grate of network under tha compass thereof beneath 2 tha midst of it."},{"n":"38:5","text":"N he cast four ringz 4 tha four ends of tha grate of brass, 2 be places 4 tha staves."},{"n":"38:6","text":"N he made tha staves of shittim wood, N overlaid ’em wit brass."},{"n":"38:7","text":"N he put tha staves in2 tha ringz on tha sides of tha altar, 2 bear it withal; he made tha altar hollow wit boardz."},{"n":"38:8","text":"N he made tha laver of brass, N tha foot of it of brass, of tha lookingglasses of tha women assembling, which assembled at tha door of tha tabernacle of tha congregation."},{"n":"38:9","text":"N he made tha court: on tha south side southward tha hangings of tha court were of fine twined linen, a hundred cubitz:"},{"n":"38:10","text":"Their pillarz were twenty, N their brasen socketz twenty; tha hookz of tha pillarz N their fillets were of silver."},{"n":"38:11","text":"N 4 tha north side tha hangings were a hundred cubitz, their pillarz were twenty, N their socketz of brass twenty; tha hookz of tha pillarz N their fillets of silver."},{"n":"38:12","text":"N 4 tha west side were hangings of fifty cubitz, their pillarz ten, N their socketz ten; tha hookz of tha pillarz N their fillets of silver."},{"n":"38:13","text":"N 4 tha east side eastward fifty cubitz."},{"n":"38:14","text":"Tha hangings of tha one side of tha gate were fifteen cubitz; their pillarz three, N their socketz three."},{"n":"38:15","text":"N 4 tha other side of tha court gate, on dis hand N dat hand, were hangings of fifteen cubitz; their pillarz three, N their socketz three."},{"n":"38:16","text":"All tha hangings of tha court round about were of fine twined linen."},{"n":"38:17","text":"N tha socketz 4 tha pillarz were of brass; tha hookz of tha pillarz N their fillets of silver; N tha overlaying of their chapiters of silver; N all tha pillarz of tha court were filleted wit silver."},{"n":"38:18","text":"N tha hanging 4 tha gate of tha court was needlework, of blue, N purple, N scarlet, N fine twined linen: N twenty cubitz was tha length, N tha height in tha breadth was five cubitz, answerable 2 tha hangings of tha court."},{"n":"38:19","text":"N their pillarz were four, N their socketz of brass four; their hookz of silver, N tha overlaying of their chapiters N their fillets of silver."},{"n":"38:20","text":"N all tha pins of tha tabernacle, N of tha court round about, were of brass."},{"n":"38:21","text":"Dis is tha sum of tha tabernacle, even of tha tabernacle of testimony, as it was counted, according 2 tha commandment of Moses, 4 tha service of tha Levites, by tha hand of Ithamar, son 2 Aaron tha priest."},{"n":"38:22","text":"N Bezaleel tha son of Uri, tha son of Hur, of tha tribe of Judah, made all dat tha LORD commanded Moses."},{"n":"38:23","text":"N wit him was Aholiab, son of Ahisamach, of tha tribe of Dan, an engraver, N a cunning workman, N an embroiderer in blue, N in purple, N in scarlet, N fine linen."},{"n":"38:24","text":"All tha gold dat was occupied 4 tha work in all tha work of tha holy place, even tha gold of tha offering, was twenty N nine talents, N seven hundred N thirty shekels, after tha shekel of tha sanctuary."},{"n":"38:25","text":"N tha silver of ’em dat were numbered of tha congregation was a hundred talents, N a thousand seven hundred N threescore N fifteen shekels, after tha shekel of tha sanctuary:"},{"n":"38:26","text":"A bekah 4 every man, dat is, half a shekel, after tha shekel of tha sanctuary, 4 every one dat went 2 be numbered, from twenty yearz old N upward, 4 six hundred thousand N three thousand N five hundred N fifty men."},{"n":"38:27","text":"N of tha hundred talents of silver were cast tha socketz of tha sanctuary, N tha socketz of tha vail; a hundred socketz of tha hundred talents, a talent 4 a socket."},{"n":"38:28","text":"N of tha thousand seven hundred seventy N five shekels he made hookz 4 tha pillarz, N overlaid their chapiters, N filleted ’em."},{"n":"38:29","text":"N tha brass of tha offering was seventy talents, N two thousand N four hundred shekels."},{"n":"38:30","text":"N therewith he made tha socketz 2 tha door of tha tabernacle of tha congregation, N tha brasen altar, N tha brasen grate 4 it, N all tha vessels of tha altar,"},{"n":"38:31","text":"N tha socketz of tha court round about, N tha socketz of tha court gate, N all tha pins of tha tabernacle, N all tha pins of tha court round about."}],"39":[{"n":"39:1","text":"N of tha blue, N purple, N scarlet, they made cloths of service, 2 do service in tha holy place, N made tha holy garmentz 4 Aaron; as tha LORD commanded Moses."},{"n":"39:2","text":"N he made tha ephod of gold, blue, N purple, N scarlet, N fine twined linen."},{"n":"39:3","text":"N they did beat tha gold in2 thin plates, N cut it in2 wires, 2 work it in tha blue, N in tha purple, N in tha scarlet, N in tha fine linen, wit cunning work."},{"n":"39:4","text":"They made shoulderpieces 4 it, 2 couple it together: by tha two edges was it coupled together."},{"n":"39:5","text":"N tha curious girdle of his ephod, dat was on it, was of tha same, according 2 tha work thereof; of gold, blue, N purple, N scarlet, N fine twined linen; as tha LORD commanded Moses."},{"n":"39:6","text":"N they wrought onyx stones inclosed in ouches of gold, graven, as signets r graven, wit tha namez of tha children of Israel."},{"n":"39:7","text":"N he put ’em on tha shoulders of tha ephod, dat they should be stones 4 a memorial 2 tha children of Israel; as tha LORD commanded Moses."},{"n":"39:8","text":"N he made tha breastplate of cunning work, like tha work of tha ephod; of gold, blue, N purple, N scarlet, N fine twined linen."},{"n":"39:9","text":"It was foursquare; they made tha breastplate double: a span was tha length thereof, N a span tha breadth thereof, being doubled."},{"n":"39:10","text":"N they set in it four rows of stones: tha first row was a sardius, a topaz, N a carbuncle: dis was tha first row."},{"n":"39:11","text":"N tha second row, an emerald, a sapphire, N a diamond."},{"n":"39:12","text":"N tha third row, a ligure, an agate, N an amethyst."},{"n":"39:13","text":"N tha fourth row, a beryl, an onyx, N a jasper: they were inclosed in ouches of gold in their inclosings."},{"n":"39:14","text":"N tha stones were according 2 tha namez of tha children of Israel, twelve, according 2 their namez, like tha engravings of a signet, every one wit his name, according 2 tha twelve tribez."},{"n":"39:15","text":"N they made on tha breastplate chains at tha ends, of wreathen work of pure gold."},{"n":"39:16","text":"N they made two ouches of gold, N two gold ringz; N put tha two ringz in tha two ends of tha breastplate."},{"n":"39:17","text":"N they put tha two wreathen chains of gold in tha two ringz on tha ends of tha breastplate."},{"n":"39:18","text":"N tha two ends of tha two wreathen chains they fastened in tha two ouches, N put ’em on tha shoulderpieces of tha ephod, before it."},{"n":"39:19","text":"N they made two ringz of gold, N put ’em on tha two ends of tha breastplate, on tha border of it, which was on tha side of tha ephod inward."},{"n":"39:20","text":"N they made two other golden ringz, N put ’em on tha two sides of tha ephod underneath, toward tha forepart of it, over against tha other coupling thereof, above tha curious girdle of tha ephod."},{"n":"39:21","text":"N they did bind tha breastplate by his ringz 2 tha ringz of tha ephod wit a lace of blue, dat it might be above tha curious girdle of tha ephod, N dat tha breastplate might not be loosed from tha ephod; as tha LORD commanded Moses."},{"n":"39:22","text":"N he made tha robe of tha ephod of woven work, all of blue."},{"n":"39:23","text":"N there was an hole in tha midst of tha robe, as tha hole of an habergeon, wit a band round about tha hole, dat it should not rend."},{"n":"39:24","text":"N they made on tha hems of tha robe pomegranates of blue, N purple, N scarlet, N twined linen."},{"n":"39:25","text":"N they made bells of pure gold, N put tha bells between tha pomegranates on tha hem of tha robe, round about between tha pomegranates;"},{"n":"39:26","text":"A bell N a pomegranate, a bell N a pomegranate, round about tha hem of tha robe 2 minister in; as tha LORD commanded Moses."},{"n":"39:27","text":"N they made coats of fine linen of woven work 4 Aaron, N 4 his sonz,"},{"n":"39:28","text":"N a mitre of fine linen, N goodly bonnets of fine linen, N linen breeches of fine twined linen,"},{"n":"39:29","text":"N a girdle of fine twined linen, N blue, N purple, N scarlet, of needlework; as tha LORD commanded Moses."},{"n":"39:30","text":"N they made tha plate of tha holy crown of pure gold, N wrote on it a writing, like 2 tha engravings of a signet, HOLINESS TO THA LORD."},{"n":"39:31","text":"N they tied 2 it a lace of blue, 2 fasten it on high on tha mitre; as tha LORD commanded Moses."},{"n":"39:3
