{"n":"19:12","text":"N u will set bounds 2 tha people round about, saying, Take heed 2 yourselves, dat y’all go not up in2 tha mount, or touch tha border of it: whosoever toucheth tha mount will be surely put 2 death:"},{"n":"19:13","text":"There will not an hand touch it, but he will surely be stoned, or shot through; whether it be beast or man, it will not live: when tha trumpet soundeth long, they will come up 2 tha mount."},{"n":"19:14","text":"N Moses went down from tha mount 2 tha people, N sanctified tha people; N they washed their clothes."},{"n":"19:15","text":"N he said 2 tha people, Be ready against tha third day: come not at ur wivez."},{"n":"19:16","text":"N it happened on tha third day in tha morning, dat there were thunders N lightnings, N a thick cloud on tha mount, N tha voice of tha trumpet exceeding loud; so dat all tha people dat was in tha camp trembled."},{"n":"19:17","text":"N Moses brought forth tha people out of tha camp 2 meet wit God; N they stood at tha nether part of tha mount."},{"n":"19:18","text":"N mount Sinai was altogether on a smoke, because tha LORD descended on it in fire: N tha smoke thereof ascended as tha smoke of a furnace, N tha whole mount quaked greatly."},{"n":"19:19","text":"N when tha voice of tha trumpet sounded long, N waxed louder N louder, Moses spoke, N God answered him by a voice."},{"n":"19:20","text":"N tha LORD came down on mount Sinai, on tha top of tha mount: N tha LORD called Moses up 2 tha top of tha mount; N Moses went up."},{"n":"19:21","text":"N tha LORD said 2 Moses, Go down, charge tha people, lest they break through 2 tha LORD 2 gaze, N many of ’em perish."},{"n":"19:22","text":"N let tha priestz also, which come near 2 tha LORD, sanctify themselves, lest tha LORD break forth on ’em."},{"n":"19:23","text":"N Moses said 2 tha LORD, Tha people cannot come up 2 mount Sinai: 4 u chargedst us, saying, Set bounds about tha mount, N sanctify it."},{"n":"19:24","text":"N tha LORD said 2 him, Away, get u down, N u will come up, u, N Aaron wit u: but let not tha priestz N tha people break through 2 come up 2 tha LORD, lest he break forth on ’em."},{"n":"19:25","text":"So Moses went down 2 tha people, N spoke 2 ’em."}],"20":[{"n":"20:1","text":"N God spoke all dese wordz, saying,"},{"n":"20:2","text":"I am tha LORD ur God, which have brought u out of tha land of Egypt, out of tha house of bondage."},{"n":"20:3","text":"U will have no other godz before me."},{"n":"20:4","text":"U will not make 2 u any graven image, or any likeness of any thing dat is in heaven above, or dat is in tha earth beneath, or dat is in tha water under tha earth:"},{"n":"20:5","text":"U will not bow down thyself 2 ’em, nor serve ’em: 4 I tha LORD ur God am a jealous God, visiting tha iniquity of tha fatherz on tha children 2 tha third N fourth generation of ’em dat hate me;"},{"n":"20:6","text":"N shewing mercy 2 thousands of ’em dat love me, N keep my commandmentz."},{"n":"20:7","text":"U will not take tha name of tha LORD ur God in vain; 4 tha LORD will not hold him guiltless dat taketh his name in vain."},{"n":"20:8","text":"Remember tha sabbath day, 2 keep it holy."},{"n":"20:9","text":"Six dayz will u labour, N do all ur work:"},{"n":"20:10","text":"But tha seventh day is tha sabbath of tha LORD ur God: in it u will not do any work, u, nor ur son, nor ur daughter, ur manservant, nor ur maidservant, nor ur cattle, nor ur stranger dat is within ur gates:"},{"n":"20:11","text":"4 in six dayz tha LORD made heaven N earth, tha sea, N all dat in ’em is, N rested tha seventh day: wherefore tha LORD blessed tha sabbath day, N hallowed it."},{"n":"20:12","text":"Honour ur father N ur mother: dat ur dayz may be long on tha land which tha LORD ur God giveth u."},{"n":"20:13","text":"U will not kill."},{"n":"20:14","text":"U will not commit adultery."},{"n":"20:15","text":"U will not steal."},{"n":"20:16","text":"U will not bear false witness against ur neighbour."},{"n":"20:17","text":"U will not covet ur neighbour’s house, u will not covet ur neighbour’s wife, nor his manservant, nor his maidservant, nor his ox, nor his ass, nor any thing dat is ur neighbour’s."},{"n":"20:18","text":"N all tha people saw tha thunderings, N tha lightnings, N tha noise of tha trumpet, N tha mountain smoking: N when tha people saw it, they removed, N stood afar off."},{"n":"20:19","text":"N they said 2 Moses, Speak u wit us, N we will hear: but let not God speak wit us, lest we die."},{"n":"20:20","text":"N Moses said 2 tha people, Fear not: 4 God is come 2 prove u, N dat his fear may be before ur faces, dat y’all sin not."},{"n":"20:21","text":"N tha people stood afar off, N Moses drew near 2 tha thick darkness where God was."},{"n":"20:22","text":"N tha LORD said 2 Moses, Thus u will say 2 tha children of Israel, Y’all have seen dat I have talked wit u from heaven."},{"n":"20:23","text":"Y’all will not make wit me godz of silver, neither will y’all make 2 u godz of gold."},{"n":"20:24","text":"An altar of earth u will make 2 me, N will sacrifice thereon ur burnt offeringz, N ur peace offeringz, ur sheep, N urz oxen: in all places where I record my name I will come 2 u, N I will bless u."},{"n":"20:25","text":"N if u wilt make me an altar of stone, u will not build it of hewn stone: 4 if u lift up ur tool on it, u have polluted it."},{"n":"20:26","text":"Neither will u go up by steps 2 mine altar, dat ur nakedness be not discovered thereon."}],"21":[{"n":"21:1","text":"Now dese r tha judgments which u will set before ’em."},{"n":"21:2","text":"If u buy an Hebrew servant, six yearz he will serve: N in tha seventh he will go out free 4 nothing."},{"n":"21:3","text":"If he came in by himself, he will go out by himself: if he were married, then his wife will go out wit him."},{"n":"21:4","text":"If his master have given him a wife, N she have born him sonz or daughterz; tha wife N her children will be her master’s, N he will go out by himself."},{"n":"21:5","text":"N if tha servant will plainly say, I love my master, my wife, N my children; I will not go out free:"},{"n":"21:6","text":"Then his master will bring him 2 tha judges; he will also bring him 2 tha door, or 2 tha door post; N his master will bore his ear through wit an aul; N he will serve him 4 ever."},{"n":"21:7","text":"N if a man sell his daughter 2 be a maidservant, she will not go out as tha menservants do."},{"n":"21:8","text":"If she please not her master, who has betrothed her 2 himself, then will he let her be redeemed: 2 sell her 2 a strange nation he will have no power, seeing he has dealt deceitfully wit her."},{"n":"21:9","text":"N if he have betrothed her 2 his son, he will deal wit her after tha manner of daughterz."},{"n":"21:10","text":"If he take him another wife; her food, her raiment, N her duty of marriage, will he not diminish."},{"n":"21:11","text":"N if he do not dese three 2 her, then will she go out free without money."},{"n":"21:12","text":"He dat smiteth a man, so dat he die, will be surely put 2 death."},{"n":"21:13","text":"N if a man lie not in wait, but God deliver him in2 his hand; then I will appoint u a place whither he will flee."},{"n":"21:14","text":"But if a man come presumptuously on his neighbour, 2 slay him wit guile; u will take him from mine altar, dat he may die."},{"n":"21:15","text":"N he dat smiteth his father, or his mother, will be surely put 2 death."},{"n":"21:16","text":"N he dat stealeth a man, N selleth him, or if he be found in his hand, he will surely be put 2 death."},{"n":"21:17","text":"N he dat curseth his father, or his mother, will surely be put 2 death."},{"n":"21:18","text":"N if men strive together, N one smite another wit a stone, or wit his fist, N he die not, but keepeth his bed:"},{"n":"21:19","text":"If he rise again, N walk abroad on his staff, then will he dat smote him be quit: only he will pay 4 tha loss of his time, N will cause him 2 be thoroughly healed."},{"n":"21:20","text":"N if a man smite his servant, or his maid, wit a rod, N he die under his hand; he will be surely punished."},{"n":"21:21","text":"Notwithstanding, if he continue a day or two, he will not be punished: 4 he is his money."},{"n":"21:22","text":"If men strive, N hurt a woman wit child, so dat her fruit depart from her, N yet no mischief follow: he will be surely punished, according as tha woman’s husband will lay on him; N he will pay as tha judges determine."},{"n":"21:23","text":"N if any mischief follow, then u will give life 4 life,"},{"n":"21:24","text":"Eye 4 eye, tooth 4 tooth, hand 4 hand, foot 4 foot,"},{"n":"21:25","text":"Burning 4 burning, wound 4 wound, stripe 4 stripe."},{"n":"21:26","text":"N if a man smite tha eye of his servant, or tha eye of his maid, dat it perish; he will let him go free 4 his eye’s sake."},{"n":"21:27","text":"N if he smite out his manservant’s tooth, or his maidservant’s tooth; he will let him go free 4 his tooth’s sake."},{"n":"21:28","text":"If an ox gore a man or a woman, dat they die: then tha ox will be surely stoned, N his flesh will not be eaten; but tha owner of tha ox will be quit."},{"n":"21:29","text":"But if tha ox were wont 2 push wit his horn in time past, N it has been testified 2 his owner, N he has not kept him in, but dat he has killed a man or a woman; tha ox will be stoned, N his owner also will be put 2 death."},{"n":"21:30","text":"If there be laid on him a sum of money, then he will give 4 tha ransom of his life whatsoever is laid on him."},{"n":"21:31","text":"Whether he have gored a son, or have gored a daughter, according 2 dis judgment will it be done 2 him."},{"n":"21:32","text":"If tha ox will push a manservant or a maidservant; he will give 2 their master thirty shekels of silver, N tha ox will be stoned."},{"n":"21:33","text":"N if a man will open a pit, or if a man will dig a pit, N not cover it, N an ox or an ass fall therein;"},{"n":"21:34","text":"Tha owner of tha pit will make it good, N give money 2 tha owner of ’em; N tha dead beast will be his."},{"n":"21:35","text":"N if one man’s ox hurt another’s, dat he die; then they will sell tha live ox, N divide tha money of it; N tha dead ox also they will divide."},{"n":"21:36","text":"Or if it be known dat tha ox has used 2 push in time past, N his owner has not kept him in; he will surely pay ox 4 ox; N tha dead will be his own."}],"22":[{"n":"22:1","text":"If a man will steal an ox, or a sheep, N kill it, or sell it; he will restore five oxen 4 an ox, N four sheep 4 a sheep."},{"n":"22:2","text":"If a thief be found breaking up, N be smitten dat he die, there will no blood be shed 4 him."},{"n":"22:3","text":"If tha sun be risen on him, there will be blood shed 4 him; 4 he should make full restitution; if he have nothing, then he will be sold 4 his theft."},{"n":"22:4","text":"If tha theft be certainly found in his hand alive, whether it be ox, or ass, or sheep; he will restore double."},{"n":"22:5","text":"If a man will cause a field or vineyard 2 be eaten, N will put in his beast, N will feed in another man’s field; of tha best of his own field, N of tha best of his own vineyard, will he make restitution."},{"n":"22:6","text":"If fire break out, N catch in thorns, so dat tha stacks of corn, or tha standing corn, or tha field, be consumed therewith; he dat kindled tha fire will surely make restitution."},{"n":"22:7","text":"If a man will deliver 2 his neighbour money or stuff 2 keep, N it be stolen out of tha man’s house; if tha thief be found, let him pay double."},{"n":"22:8","text":"If tha thief be not found, then tha master of tha house will be brought 2 tha judges, 2 see whether he have put his hand 2 his neighbour’s goods."},{"n":"22:9","text":"4 all manner of trespass, whether it be 4 ox, 4 ass, 4 sheep, 4 raiment, or 4 any manner of lost thing, which another challengeth 2 be his, tha cause of both parties will come before tha judges; N whom tha judges will condemn, he will pay double 2 his neighbour."},{"n":"22:10","text":"If a man deliver 2 his neighbour an ass, or an ox, or a sheep, or any beast, 2 keep; N it die, or be hurt, or driven away, no man seeing it:"},{"n":"22:11","text":"Then will an oath of tha LORD be between ’em both, dat he has not put his hand 2 his neighbour’s goods; N tha owner of it will accept thereof, N he will not make it good."},{"n":"22:12","text":"N if it be stolen from him, he will make restitution 2 tha owner thereof."},{"n":"22:13","text":"If it be torn in pieces, then let him bring it 4 witness, N he will not make good dat which was torn."},{"n":"22:14","text":"N if a man borrow ought of his neighbour, N it be hurt, or die, tha owner thereof being not wit it, he will surely make it good."},{"n":"22:15","text":"But if tha owner thereof be wit it, he will not make it good: if it be an hired thing, it came 4 his hire."},{"n":"22:16","text":"N if a man entice a maid dat is not betrothed, N lie wit her, he will surely endow her 2 be his wife."},{"n":"22:17","text":"If her father utterly refuse 2 give her 2 him, he will pay money according 2 tha dowry of virgins."},{"n":"22:18","text":"U will not suffer a witch 2 live."},{"n":"22:19","text":"Whosoever lieth wit a beast will surely be put 2 death."},{"n":"22:20","text":"He dat sacrificeth 2 any god, save 2 tha LORD only, he will be utterly destroyed."},{"n":"22:21","text":"U will neither vex a stranger, nor oppress him: 4 y’all were strangers in tha land of Egypt."},{"n":"22:22","text":"Y’all will not afflict any widow, or fatherless child."},{"n":"22:23","text":"If u afflict ’em in any wise, N they cry at all 2 me, I will surely hear their cry;"},{"n":"22:24","text":"N my wrath will wax hot, N I will kill u wit tha sword; N ur wivez will be widows, N ur children fatherless."},{"n":"22:25","text":"If u lend money 2 any of my people dat is poor by u, u will not be 2 him as an usurer, neither will u lay on him usury."},{"n":"22:26","text":"If u at all take ur neighbour’s raiment 2 pledge, u will deliver it 2 him by dat tha sun goeth down:"},{"n":"22:27","text":"4 dat is his covering only, it is his raiment 4 his skin: wherein will he sleep? N it will come 2 pass, when he crieth 2 me, dat I will hear; 4 I am gracious."},{"n":"22:28","text":"U will not revile tha godz, nor curse tha ruler of ur people."},{"n":"22:29","text":"U will not delay 2 offer tha first of ur ripe fruits, N of ur liquors: tha firstborn of ur sonz will u give 2 me."},{"n":"22:30","text":"Likewise will u do wit urz oxen, N wit ur sheep: seven dayz it will be wit his dam; on tha eighth day u will give it me."},{"n":"22:31","text":"N y’all will be holy men 2 me: neither will y’all eat any flesh dat is torn of beasts in tha field; y’all will cast it 2 tha dogs."}],"23":[{"n":"23:1","text":"U will not raise a false report: put not urz hand wit tha wicked 2 be an unrighteous witness."},{"n":"23:2","text":"U will not follow a multitude 2 do evil; neither will u speak in a cause 2 decline after many 2 wrest judgment:"},{"n":"23:3","text":"Neither will u countenance a poor man in his cause."},{"n":"23:4","text":"If u meet urz enemy’s ox or his ass going astray, u will surely bring it back 2 him again."},{"n":"23:5","text":"If u see tha ass of him dat hateth u lying under his burden, N wouldest forbear 2 help him, u will surely help wit him."},{"n":"23:6","text":"U will not wrest tha judgment of ur poor in his cause."},{"n":"23:7","text":"Keep u far from a false matter; N tha innocent N righteous slay u not: 4 I will not justify tha wicked."},{"n":"23:8","text":"N u will take no gift: 4 tha gift blindeth tha wise, N perverteth tha wordz of tha righteous."},{"n":"23:9","text":"Also u will not oppress a stranger: 4 y’all know tha heart of a stranger, seeing y’all were strangers in tha land of Egypt."},{"n":"23:10","text":"N six yearz u will sow ur land, N will gather in tha fruits thereof:"},{"n":"23:11","text":"But tha seventh year u will let it rest N lie still; dat tha poor of ur people may eat: N what they leave tha beasts of tha field will eat. In like manner u will deal wit ur vineyard, N wit ur oliveyard."},{"n":"23:12","text":"Six dayz u will do ur work, N on tha seventh day u will rest: dat urz ox N urz ass may rest, N tha son of ur handmaid, N tha stranger, may be refreshed."},{"n":"23:13","text":"N in all things dat I have said 2 u be circumspect: N make no mention of tha name of other godz, neither let it be heard out of ur mouth."},{"n":"23:14","text":"Three times u will keep a feast 2 me in tha year."},{"n":"23:15","text":"U will keep tha feast of unleavened bread: (u will eat unleavened bread seven dayz, as I commanded u, in tha time appointed of tha month Abib; 4 in it u camest out from Egypt: N none will appear before me empty:)"},{"n":"23:16","text":"N tha feast of harvest, tha firstfruits of ur labours, which u have sown in tha field: N tha feast of ingathering, which is in tha end of tha year, when u have gathered in ur labours out of tha field."},{"n":"23:17","text":"Three times in tha year all ur males will appear before tha LORD God."},{"n":"23:18","text":"U will not offer tha blood of my sacrifice wit leavened bread; neither will tha fat of my sacrifice remain until tha morning."},{"n":"23:19","text":"Tha first of tha firstfruits of ur land u will bring in2 tha house of tha LORD ur God. U will not seethe a kid in his mother’s milk."},{"n":"23:20","text":"Look, I send an Angel before u, 2 keep u in tha way, N 2 bring u in2 tha place which I have prepared."},{"n":"23:21","text":"Beware of him, N obey his voice, provoke him not; 4 he will not pardon ur transgressions: 4 my name is in him."},{"n":"23:22","text":"But if u will indeed obey his voice, N do all dat I speak; then I will be an enemy 2 urz enemiez, N an adversary 2 urz adversaries."},{"n":"23:23","text":"4 mine Angel will go before u, N bring u in 2 tha Amorites, N tha Hittites, N tha Perizzites, N tha Canaanites, tha Hivites, N tha Jebusites: N I will cut ’em off."},{"n":"23:24","text":"U will not bow down 2 their godz, nor serve ’em, nor do after their works: but u will utterly overthrow ’em, N quite break down their images."},{"n":"23:25","text":"N y’all will serve tha LORD ur God, N he will bless ur bread, N ur water; N I will take sickness away from tha midst of u."},{"n":"23:26","text":"There will nothing cast their young, nor be barren, in ur land: tha number of ur dayz I will fulfil."},{"n":"23:27","text":"I will send my fear before u, N will destroy all tha people 2 whom u will come, N I will make all urz enemiez turn their backs 2 u."},{"n":"23:28","text":"N I will send hornets before u, which will drive out tha Hivite, tha Canaanite, N tha Hittite, from before u."},{"n":"23:29","text":"I will not drive ’em out from before u in one year; lest tha land become desolate, N tha beast of tha field multiply against u."},{"n":"23:30","text":"By little N little I will drive ’em out from before u, until u be increased, N inherit tha land."},{"n":"23:31","text":"N I will set ur bounds from tha Red sea even 2 tha sea of tha Philistines, N from tha desert 2 tha river: 4 I will deliver tha inhabitants of tha land in2 ur hand; N u will drive ’em out before u."},{"n":"23:32","text":"U will make no covenant wit ’em, nor wit their godz."},{"n":"23:33","text":"They will not dwell in ur land, lest they make u sin against me: 4 if u serve their godz, it will surely be a snare 2 u."}],"24":[{"n":"24:1","text":"N he said 2 Moses, Come up 2 tha LORD, u, N Aaron, Nadab, N Abihu, N seventy of tha elders of Israel; N worship y’all afar off."},{"n":"24:2","text":"N Moses alone will come near tha LORD: but they will not come nigh; neither will tha people go up wit him."},{"n":"24:3","text":"N Moses came N told tha people all tha wordz of tha LORD, N all tha judgments: N all tha people answered wit one voice, N said, All tha wordz which tha LORD has said will we do."},{"n":"24:4","text":"N Moses wrote all tha wordz of tha LORD, N rose up early in tha morning, N builded an altar under tha hill, N twelve pillarz, according 2 tha twelve tribez of Israel."},{"n":"24:5","text":"N he sent young men of tha children of Israel, which offered burnt offeringz, N sacrificed peace offeringz of oxen 2 tha LORD."},{"n":"24:6","text":"N Moses took half of tha blood, N put it in basons; N half of tha blood he sprinkled on tha altar."},{"n":"24:7","text":"N he took tha book of tha covenant, N read in tha audience of tha people: N they said, All dat tha LORD has said will we do, N be obedient."},{"n":"24:8","text":"N Moses took tha blood, N sprinkled it on tha people, N said, Look tha blood of tha covenant, which tha LORD has made wit u concerning all dese wordz."},{"n":"24:9","text":"Then went up Moses, N Aaron, Nadab, N Abihu, N seventy of tha elders of Israel:"},{"n":"24:10","text":"N they saw tha God of Israel: N there was under his feet as it were a paved work of a sapphire stone, N as it were tha body of heaven in his clearness."},{"n":"24:11","text":"N on tha nobles of tha children of Israel he laid not his hand: also they saw God, N did eat N drink."},{"n":"24:12","text":"N tha LORD said 2 Moses, Come up 2 me in2 tha mount, N be there: N I will give u tablez of stone, N a law, N commandmentz which I have written; dat u mayest teach ’em."},{"n":"24:13","text":"N Moses rose up, N his minister Joshua: N Moses went up in2 tha mount of God."},{"n":"24:14","text":"N he said 2 tha elders, Tarry y’all here 4 us, until we come again 2 u: N, look, Aaron N Hur r wit u: if any man have any matters 2 do, let him come 2 ’em."},{"n":"24:15","text":"N Moses went up in2 tha mount, N a cloud covered tha mount."},{"n":"24:16","text":"N tha glory of tha LORD abode on mount Sinai, N tha cloud covered it six dayz: N tha seventh day he called 2 Moses out of tha midst of tha cloud."},{"n":"24:17","text":"N tha sight of tha glory of tha LORD was like devouring fire on tha top of tha mount in tha eyez of tha children of Israel."},{"n":"24:18","text":"N Moses went in2 tha midst of tha cloud, N gat him up in2 tha mount: N Moses was in tha mount forty dayz N forty nights."}],"25":[{"n":"25:1","text":"N tha LORD spoke 2 Moses, saying,"},{"n":"25:2","text":"Speak 2 tha children of Israel, dat they bring me an offering: of every man dat giveth it willingly wit his heart y’all will take my offering."},{"n":"25:3","text":"N dis is tha offering which y’all will take of ’em; gold, N silver, N brass,"},{"n":"25:4","text":"N blue, N purple, N scarlet, N fine linen, N goats’ hair,"},{"n":"25:5","text":"N rams’ skins dyed red, N badgers’ skins, N shittim wood,"},{"n":"25:6","text":"Oil 4 tha light, spices 4 anointing oil, N 4 sweet incense,"},{"n":"25:7","text":"Onyx stones, N stones 2 be set in tha ephod, N in tha breastplate."},{"n":"25:8","text":"N let ’em make me a sanctuary; dat I may dwell among ’em."},{"n":"25:9","text":"According 2 all dat I shew u, after tha pattern of tha tabernacle, N tha pattern of all tha instruments thereof, even so will y’all make it."},{"n":"25:10","text":"N they will make an ark of shittim wood: two cubitz N a half will be tha length thereof, N a cubit N a half tha breadth thereof, N a cubit N a half tha height thereof."},{"n":"25:11","text":"N u will overlay it wit pure gold, within N without will u overlay it, N will make on it a crown of gold round about."},{"n":"25:12","text":"N u will cast four ringz of gold 4 it, N put ’em in tha four corners thereof; N two ringz will be in tha one side of it, N two ringz in tha other side of it."},{"n":"25:13","text":"N u will make staves of shittim wood, N overlay ’em wit gold."},{"n":"25:14","text":"N u will put tha staves in2 tha ringz by tha sides of tha ark, dat tha ark may be borne wit ’em."},{"n":"25:15","text":"Tha staves will be in tha ringz of tha ark: they will not be taken from it."},{"n":"25:16","text":"N u will put in2 tha ark tha testimony which I will give u."},{"n":"25:17","text":"N u will make a mercy seat of pure gold: two cubitz N a half will be tha length thereof, N a cubit N a half tha breadth thereof."},{"n":"25:18","text":"N u will make two cherubims of gold, of beaten work will u make ’em, in tha two ends of tha mercy seat."},{"n":"25:19","text":"N make one cherub on tha one end, N tha other cherub on tha other end: even of tha mercy seat will y’all make tha cherubims on tha two ends thereof."},{"n":"25:20","text":"N tha cherubims will stretch forth their wings on high, covering tha mercy seat wit their wings, N their faces will look one 2 another; toward tha mercy seat will tha faces of tha cherubims be."},{"n":"25:21","text":"N u will put tha mercy seat above on tha ark; N in tha ark u will put tha testimony dat I will give u."},{"n":"25:22","text":"N there I will meet wit u, N I will commune wit u from above tha mercy seat, from between tha two cherubims which r on tha ark of tha testimony, of all things which I will give u in commandment 2 tha children of Israel."},{"n":"25:23","text":"U will also make a table of shittim wood: two cubitz will be tha length thereof, N a cubit tha breadth thereof, N a cubit N a half tha height thereof."},{"n":"25:24","text":"N u will overlay it wit pure gold, N make thereto a crown of gold round about."},{"n":"25:25","text":"N u will make 2 it a border of an hand breadth round about, N u will make a golden crown 2 tha border thereof round about."},{"n":"25:26","text":"N u will make 4 it four ringz of gold, N put tha ringz in tha four corners dat r on tha four feet thereof."},{"n":"25:27","text":"Over against tha border will tha ringz be 4 places of tha staves 2 bear tha table."},{"n":"25:28","text":"N u will make tha staves of shittim wood, N overlay ’em wit gold, dat tha table may be borne wit ’em."},{"n":"25:29","text":"N u will make tha dishes thereof, N spoons thereof, N covers thereof, N bowls thereof, 2 cover withal: of pure gold will u make ’em."},{"n":"25:30","text":"N u will set on tha table shewbread before me alway."},{"n":"25:31","text":"N u will make a candlestick of pure gold: of beaten work will tha candlestick be made: his shaft, N his branches, his bowls, his knops, N his flowers, will be of tha same."},{"n":"25:32","text":"N six branches will come out of tha sides of it; three branches of tha candlestick out of tha one side, N three branches of tha candlestick out of tha other side:"},{"n":"25:33","text":"Three bowls made like 2 almonds, wit a knop N a flower in one branch; N three bowls made like almonds in tha other branch, wit a knop N a flower: so in tha six branches dat come out of tha candlestick."},{"n":"25:34","text":"N in tha candlestick will be four bowls made like 2 almonds, wit their knops N their flowers."},{"n":"25:35","text":"N there will be a knop under two branches of tha same, N a knop under two branches of tha same, N a knop under two branches of tha same, according 2 tha six branches dat proceed out of tha candlestick."},{"n":"25:36","text":"Their knops N their branches will be of tha same: all it will be one beaten work of pure gold."},{"n":"25:37","text":"N u will make tha seven lamps thereof: N they will light tha lamps thereof, dat they may give light over against it."},{"n":"25:38","text":"N tha tongs thereof, N tha snuffdishes thereof, will be of pure gold."},{"n":"25:39","text":"Of a talent of pure gold will he make it, wit all dese vessels."},{"n":"25:40","text":"N look dat u make ’em after their pattern, which was shewed u in tha mount."}],"26":[{"n":"26:1","text":"Moreover u will make tha tabernacle wit ten curtainz of fine twined linen, N blue, N purple, N scarlet: wit cherubims of cunning work will u make ’em."},{"n":"26:2","text":"Tha length of one curtain will be eight N twenty cubitz, N tha breadth of one curtain four cubitz: N every one of tha curtainz will have one measure."},{"n":"26:3","text":"Tha five curtainz will be coupled together one 2 another; N other five curtainz will be coupled one 2 another."},{"n":"26:4","text":"N u will make loops of blue on tha edge of tha one curtain from tha selvedge in tha coupling; N likewise will u make in tha uttermost edge of another curtain, in tha coupling of tha second."},{"n":"26:5","text":"Fifty loops will u make in tha one curtain, N fifty loops will u make in tha edge of tha curtain dat is in tha coupling of tha second; dat tha loops may take hold one of another."},{"n":"26:6","text":"N u will make fifty taches of gold, N couple tha curtainz together wit tha taches: N it will be one tabernacle."},{"n":"26:7","text":"N u will make curtainz of goats’ hair 2 be a covering on tha tabernacle: eleven curtainz will u make."},{"n":"26:8","text":"Tha length of one curtain will be thirty cubitz, N tha breadth of one curtain four cubitz: N tha eleven curtainz will be all of one measure."},{"n":"26:9","text":"N u will couple five curtainz by themselves, N six curtainz by themselves, N will double tha sixth curtain in tha forefront of tha tabernacle."},{"n":"26:10","text":"N u will make fifty loops on tha edge of tha one curtain dat is outmost in tha coupling, N fifty loops in tha edge of tha curtain which coupleth tha second."},{"n":"26:11","text":"N u will make fifty taches of brass, N put tha taches in2 tha loops, N couple tha tent together, dat it may be one."},{"n":"26:12","text":"N tha remnant dat remaineth of tha curtainz of tha tent, tha half curtain dat remaineth, will hang over tha backside of tha tabernacle."},{"n":"26:13","text":"N a cubit on tha one side, N a cubit on tha other side of dat which remaineth in tha length of tha curtainz of tha tent, it will hang over tha sides of tha tabernacle on dis side N on dat side, 2 cover it."},{"n":"26:14","text":"N u will make a covering 4 tha tent of rams’ skins dyed red, N a covering above of badgers’ skins."},{"n":"26:15","text":"N u will make boardz 4 tha tabernacle of shittim wood standing up."},{"n":"26:16","text":"Ten cubitz will be tha length of a board, N a cubit N a half will be tha breadth of one board."},{"n":"26:17","text":"Two tenons will there be in one board, set in order one against another: thus will u make 4 all tha boardz of tha tabernacle."},{"n":"26:18","text":"N u will make tha boardz 4 tha tabernacle, twenty boardz on tha south side southward."},{"n":"26:19","text":"N u will make forty socketz of silver under tha twenty boardz; two socketz under one board 4 his two tenons, N two socketz under another board 4 his two tenons."},{"n":"26:20","text":"N 4 tha second side of tha tabernacle on tha north side there will be twenty boardz:"},{"n":"26:21","text":"N their forty socketz of silver; two socketz under one board, N two socketz under another board."},{"n":"26:22","text":"N 4 tha sides of tha tabernacle westward u will make six boardz."},{"n":"26:23","text":"N two boardz will u make 4 tha corners of tha tabernacle in tha two sides."},{"n":"26:24","text":"N they will be coupled together beneath, N they will be coupled together above tha head of it 2 one ring: thus will it be 4 ’em both; they will be 4 tha two corners."},{"n":"26:25","text":"N they will be eight boardz, N their socketz of silver, sixteen socketz; two socketz under one board, N two socketz under another board."},{"n":"26:26","text":"N u will make bars of shittim wood; five 4 tha boardz of tha one side of tha tabernacle,"},{"n":"26:27","text":"N five bars 4 tha boardz of tha other side of tha tabernacle, N five bars 4 tha boardz of tha side of tha tabernacle, 4 tha two sides westward."},{"n":"26:28","text":"N tha middle bar in tha midst of tha boardz will reach from end 2 end."},{"n":"26:29","text":"N u will overlay tha boardz wit gold, N make their ringz of gold 4 places 4 tha bars: N u will overlay tha bars wit gold."},{"n":"26:30","text":"N u will rear up tha tabernacle according 2 tha fashion thereof which was shewed u in tha mount."},{"n":"26:31","text":"N u will make a vail of blue, N purple, N scarlet, N fine twined linen of cunning work: wit cherubims will it be made:"},{"n":"26:32","text":"N u will hang it on four pillarz of shittim wood overlaid wit gold: their hookz will be of gold, on tha four socketz of silver."},{"n":"26:33","text":"N u will hang up tha vail under tha taches, dat u mayest bring in thither within tha vail tha ark of tha testimony: N tha vail will divide 2 u between tha holy place N tha most holy."},{"n":"26:34","text":"N u will put tha mercy seat on tha ark of tha testimony in tha most holy place."},{"n":"26:35","text":"N u will set tha table without tha vail, N tha candlestick over against tha table on tha side of tha tabernacle toward tha south: N u will put tha table on tha north side."},{"n":"26:36","text":"N u will make an hanging 4 tha door of tha tent, of blue, N purple, N scarlet, N fine twined linen, wrought wit needlework."},{"n":"26:37","text":"N u will make 4 tha hanging five pillarz of shittim wood, N overlay ’em wit gold, N their hookz will be of gold: N u will cast five socketz of brass 4 ’em."}],"27":[{"n":"27:1","text":"N u will make an altar of shittim wood, five cubitz long, N five cubitz broad; tha altar will be foursquare: N tha height thereof will be three cubitz."},{"n":"27:2","text":"N u will make tha horns of it on tha four corners thereof: his horns will be of tha same: N u will overlay it wit brass."},{"n":"27:3","text":"N u will make his pans 2 receive his ashes, N his shovels, N his basons, N his fleshhooks, N his firepans: all tha vessels thereof u will make of brass."},{"n":"27:4","text":"N u will make 4 it a grate of network of brass; N on tha net will u make four brasen ringz in tha four corners thereof."},{"n":"27:5","text":"N u will put it under tha compass of tha altar beneath, dat tha net may be even 2 tha midst of tha altar."},{"n":"27:6","text":"N u will make staves 4 tha altar, staves of shittim wood, N overlay ’em wit brass."},{"n":"27:7","text":"N tha staves will be put in2 tha ringz, N tha staves will be on tha two sides of tha altar, 2 bear it."},{"n":"27:8","text":"Hollow wit boardz will u make it: as it was shewed u in tha mount, so will they make it."},{"n":"27:9","text":"N u will make tha court of tha tabernacle: 4 tha south side southward there will be hangings 4 tha court of fine twined linen of a hundred cubitz long 4 one side:"},{"n":"27:10","text":"N tha twenty pillarz thereof N their twenty socketz will be of brass; tha hookz of tha pillarz N their fillets will be of silver."},{"n":"27:11","text":"N likewise 4 tha north side in length there will be hangings of a hundred cubitz long, N his twenty pillarz N their twenty socketz of brass; tha hookz of tha pillarz N their fillets of silver."},{"n":"27:12","text":"N 4 tha breadth of tha court on tha west side will be hangings of fifty cubitz: their pillarz ten, N their socketz ten."},{"n":"27:13","text":"N tha breadth of tha court on tha east side eastward will be fifty cubitz."},{"n":"27:14","text":"Tha hangings of one side of tha gate will be fifteen cubitz: their pillarz three, N their socketz three."},{"n":"27:15","text":"N on tha other side will be hangings fifteen cubitz: their pillarz three, N their socketz three."},{"n":"27:16","text":"N 4 tha gate of tha court will be an hanging of twenty cubitz, of blue, N purple, N scarlet, N fine twined linen, wrought wit needlework: N their pillarz will be four, N their socketz four."},{"n":"27:17","text":"All tha pillarz round about tha court will be filleted wit silver; their hookz will be of silver, N their socketz of brass."},{"n":"27:18","text":"Tha length of tha court will be a hundred cubitz, N tha breadth fifty every where, N tha height five cubitz of fine twined linen, N their socketz of brass."},{"n":"27:19","text":"All tha vessels of tha tabernacle in all tha service thereof, N all tha pins thereof, N all tha pins of tha court, will be of brass."},{"n":"27:20","text":"N u will command tha children of Israel, dat they bring u pure oil olive beaten 4 tha light, 2 cause tha lamp 2 burn always."},{"n":"27:21","text":"In tha tabernacle of tha congregation without tha vail, which is before tha testimony, Aaron N his sonz will order it from evening 2 morning before tha LORD: it will be a statute 4 ever 2 their generations on tha behalf of tha children of Israel."}],"28":[{"n":"28:1","text":"N take u 2 u Aaron ur brother, N his sonz wit him, from among tha children of Israel, dat he may minister 2 me in tha priest’s office, even Aaron, Nadab N Abihu, Eleazar N Ithamar, Aaron’s sonz."},{"n":"28:2","text":"N u will make holy garmentz 4 Aaron ur brother 4 glory N 4 beauty."},{"n":"28:3","text":"N u will speak 2 all dat r wise hearted, whom I have filled wit tha spirit of wisdom, dat they may make Aaron’s garmentz 2 consecrate him, dat he may minister 2 me in tha priest’s office."},{"n":"28:4","text":"N dese r tha garmentz which they will make; a breastplate, N an ephod, N a robe, N a broidered coat, a mitre, N a girdle: N they will make holy garmentz 4 Aaron ur brother, N his sonz, dat he may minister 2 me in tha priest’s office."},{"n":"28:5","text":"N they will take gold, N blue, N purple, N scarlet, N fine linen."},{"n":"28:6","text":"N they will make tha ephod of gold, of blue, N of purple, of scarlet, N fine twined linen, wit cunning work."},{"n":"28:7","text":"It will have tha two shoulderpieces thereof joined at tha two edges thereof; N so it will be joined together."},{"n":"28:8","text":"N tha curious girdle of tha ephod, which is on it, will be of tha same, according 2 tha work thereof; even of gold, of blue, N purple, N scarlet, N fine twined linen."},{"n":"28:9","text":"N u will take two onyx stones, N grave on ’em tha namez of tha children of Israel:"},{"n":"28:10","text":"Six of their namez on one stone, N tha other six namez of tha rest on tha other stone, according 2 their birth."},{"n":"28:11","text":"Wit tha work of an engraver in stone, like tha engravings of a signet, will u engrave tha two stones wit tha namez of tha children of Israel: u will make ’em 2 be set in ouches of gold."},{"n":"28:12","text":"N u will put tha two stones on tha shoulders of tha ephod 4 stones of memorial 2 tha children of Israel: N Aaron will bear their namez before tha LORD on his two shoulders 4 a memorial."},{"n":"28:13","text":"N u will make ouches of gold;"},{"n":"28:14","text":"N two chains of pure gold at tha ends; of wreathen work will u make ’em, N fasten tha wreathen chains 2 tha ouches."},{"n":"28:15","text":"N u will make tha breastplate of judgment wit cunning work; after tha work of tha ephod u will make it; of gold, of blue, N of purple, N of scarlet, N of fine twined linen, will u make it."},{"n":"28:16","text":"Foursquare it will be being doubled; a span will be tha length thereof, N a span will be tha breadth thereof."},{"n":"28:17","text":"N u will set in it settings of stones, even four rows of stones: tha first row will be a sardius, a topaz, N a carbuncle: dis will be tha first row."},{"n":"28:18","text":"N tha second row will be an emerald, a sapphire, N a diamond."},{"n":"28:19","text":"N tha third row a ligure, an agate, N an amethyst."},{"n":"28:20","text":"N tha fourth row a beryl, N an onyx, N a jasper: they will be set in gold in their inclosings."},{"n":"28:21","text":"N tha stones will be wit tha namez of tha children of Israel, twelve, according 2 their namez, like tha engravings of a signet; every one wit his name will they be according 2 tha twelve tribez."},{"n":"28:22","text":"N u will make on tha breastplate chains at tha ends of wreathen work of pure gold."},{"n":"28:23","text":"N u will make on tha breastplate two ringz of gold, N will put tha two ringz on tha two ends of tha breastplate."},{"n":"28:24","text":"N u will put tha two wreathen chains of gold in tha two ringz which r on tha ends of tha breastplate."},{"n":"28:25","text":"N tha other two ends of tha two wreathen chains u will fasten in tha two ouches, N put ’em on tha shoulderpieces of tha ephod before it."},{"n":"28:26","text":"N u will make two ringz of gold, N u will put ’em on tha two ends of tha breastplate in tha border thereof, which is in tha side of tha ephod inward."},{"n":"28:27","text":"N two other ringz of gold u will make, N will put ’em on tha two sides of tha ephod underneath, toward tha forepart thereof, over against tha other coupling thereof, above tha curious girdle of tha ephod."},{"n":"28:28","text":"N they will bind tha breastplate by tha ringz thereof 2 tha ringz of tha ephod wit a lace of blue, dat it may be above tha curious girdle of tha ephod, N dat tha breastplate be not loosed from tha ephod."},{"n":"28:29","text":"N Aaron will bear tha namez of tha children of Israel in tha breastplate of judgment on his heart, when he goeth in 2 tha holy place, 4 a memorial before tha LORD continually."},{"n":"28:30","text":"N u will put in tha breastplate of judgment tha Urim N tha Thummim; N they will be on Aaron’s heart, when he goeth in before tha LORD: N Aaron will bear tha judgment of tha children of Israel on his heart before tha LORD continually."},{"n":"28:31","text":"N u will make tha robe of tha ephod all of blue."},{"n":"28:32","text":"N there will be an hole in tha top of it, in tha midst thereof: it will have a binding of woven work round about tha hole of it, as it were tha hole of an habergeon, dat it be not rent."},{"n":"28:33","text":"N beneath on tha hem of it u will make pomegranates of blue, N of purple, N of scarlet, round about tha hem thereof; N bells of gold between ’em round about:"},{"n":"28:34","text":"A golden bell N a pomegranate, a golden bell N a pomegranate, on tha hem of tha robe round about."},{"n":"28:35","text":"N it will be on Aaron 2 minister: N his sound will be heard when he goeth in 2 tha holy place before tha LORD, N when he cometh out, dat he die not."},{"n":"28:36","text":"N u will make a plate of pure gold, N grave on it, like tha engravings of a signet, HOLINESS TO THA LORD."},{"n":"28:37","text":"N u will put it on a blue lace, dat it may be on tha mitre; on tha forefront of tha mitre it will be."},{"n":"28:38","text":"N it will be on Aaron’s forehead, dat Aaron may bear tha iniquity of tha holy things, which tha children of Israel will hallow in all their holy gifts; N it will be always on his forehead, dat they may be accepted before tha LORD."},{"n":"28:39","text":"N u will embroider tha coat of fine linen, N u will make tha mitre of fine linen, N u will make tha girdle of needlework."},{"n":"28:40","text":"N 4 Aaron’s sonz u will make coats, N u will make 4 ’em girdles, N bonnets will u make 4 ’em, 4 glory N 4 beauty."},{"n":"28:41","text":"N u will put ’em on Aaron ur brother, N his sonz wit him; N will anoint ’em, N consecrate ’em, N sanctify ’em, dat they may minister 2 me in tha priest’s office."},{"n":"28:42","text":"N u will make ’em linen breeches 2 cover their nakedness; from tha loins even 2 tha thighs they will reach:"},{"n":"28:43","text":"N they will be on Aaron, N on his sonz, when they come in 2 tha tabernacle of tha congregation, or when they come near 2 tha altar 2 minister in tha holy place; dat they bear not iniquity, N die: it will be a statute 4 ever 2 him N his seed after him."}],"29":[{"n":"29:1","text":"N dis is tha thing dat u will do 2 ’em 2 hallow ’em, 2 minister 2 me in tha priest’s office: Take one young bullock, N two rams without blemish,"},{"n":"29:2","text":"N unleavened bread, N cakes unleavened tempered wit oil, N wafers unleavened anointed wit oil: of wheaten flour will u make ’em."},{"n":"29:3","text":"N u will put ’em in2 one basket, N bring ’em in tha basket, wit tha bullock N tha two rams."},{"n":"29:4","text":"N Aaron N his sonz u will bring 2 tha door of tha tabernacle of tha congregation, N will wash ’em wit water."},{"n":"29:5","text":"N u will take tha garmentz, N put on Aaron tha coat, N tha robe of tha ephod, N tha ephod, N tha breastplate, N gird him wit tha curious girdle of tha ephod:"},{"n":"29:6","text":"N u will put tha mitre on his head, N put tha holy crown on tha mitre."},{"n":"29:7","text":"Then will u take tha anointing oil, N pour it on his head, N anoint him."},{"n":"29:8","text":"N u will bring his sonz, N put coats on ’em."},{"n":"29:9","text":"N u will gird ’em wit girdles, Aaron N his sonz, N put tha bonnets on ’em: N tha priest’s office will be theirs 4 a perpetual statute: N u will consecrate Aaron N his sonz."},{"n":"29:10","text":"N u will cause a bullock 2 be brought before tha tabernacle of tha congregation: N Aaron N his sonz will put their handz on tha head of tha bullock."},{"n":"29:11","text":"N u will kill tha bullock before tha LORD, by tha door of tha tabernacle of tha congregation."},{"n":"29:12","text":"N u will take of tha blood of tha bullock, N put it on tha horns of tha altar wit ur finger, N pour all tha blood beside tha bottom of tha altar."},{"n":"29:13","text":"N u will take all tha fat dat covereth tha inwards, N tha caul dat is above tha liver, N tha two kidneys, N tha fat dat is on ’em, N burn ’em on tha altar."},{"n":"29:14","text":"But tha flesh of tha bullock, N his skin, N his dung, will u burn wit fire without tha camp: it is a sin offering."},{"n":"29:15","text":"U will also take one ram; N Aaron N his sonz will put their handz on tha head of tha ram."},{"n":"29:16","text":"N u will slay tha ram, N u will take his blood, N sprinkle it round about on tha altar."},{"n":"29:17","text":"N u will cut tha ram in pieces, N wash tha inwards of him, N his legs, N put ’em 2 his pieces, N 2 his head."},{"n":"29:18","text":"N u will burn tha whole ram on tha altar: it is a burnt offering 2 tha LORD: it is a sweet savour, an offering made by fire 2 tha LORD."},{"n":"29:19","text":"N u will take tha other ram; N Aaron N his sonz will put their handz on tha head of tha ram."},{"n":"29:20","text":"Then will u kill tha ram, N take of his blood, N put it on tha tip of tha right ear of Aaron, N on tha tip of tha right ear of his sonz, N on tha thumb of their right hand, N on tha great toe of their right foot, N sprinkle tha blood on tha altar round about."},{"n":"29:21","text":"N u will take of tha blood dat is on tha altar, N of tha anointing oil, N sprinkle it on Aaron, N on his garmentz, N on his sonz, N on tha garmentz of his sonz wit him: N he will be hallowed, N his garmentz, N his sonz, N his sonz’ garmentz wit him."},{"n":"29:22","text":"Also u will take of tha ram tha fat N tha rump, N tha fat dat covereth tha inwards, N tha caul above tha liver, N tha two kidneys, N tha fat dat is on ’em, N tha right shoulder; 4 it is a ram of consecration:"},{"n":"29:23","text":"N one loaf of bread, N one cake of oiled bread, N one wafer out of tha basket of tha unleavened bread dat is before tha LORD:"},{"n":"29:24","text":"N u will put all in tha handz of Aaron, N in tha handz of his sonz; N will wave ’em 4 a wave offering before tha LORD."},{"n":"29:25","text":"N u will receive ’em of their handz, N burn ’em on tha altar 4 a burnt offering, 4 a sweet savour before tha LORD: it is an offering made by fire 2 tha LORD."},{"n":"29:26","text":"N u will take tha breast of tha ram of Aaron’s consecration, N wave it 4 a wave offering before tha LORD: N it will be ur part."},{"n":"29:27","text":"N u will sanctify tha breast of tha wave offering, N tha shoulder of tha heave offering, which is waved, N which is heaved up, of tha ram of tha consecration, even of dat which is 4 Aaron, N of dat which is 4 his sonz:"},{"n":"29:28","text":"N it will be Aaron’s N his sonz’ by a statute 4 ever from tha children of Israel: 4 it is an heave offering: N it will be an heave offering from tha children of Israel of tha sacrifice of their peace offeringz, even their heave offering 2 tha LORD."},{"n":"29:29","text":"N tha holy garmentz of Aaron will be his sonz’ after him, 2 be anointed therein, N 2 be consecrated in ’em."},{"n":"29:30","text":"N dat son dat is priest in his stead will put ’em on seven dayz, when he cometh in2 tha tabernacle of tha congregation 2 minister in tha holy place."},{"n":"29:31","text":"N u will take tha ram of tha consecration, N seethe his flesh in tha holy place."},{"n":"29:32","text":"N Aaron N his sonz will eat tha flesh of tha ram, N tha bread dat is in tha basket, by tha door of tha tabernacle of tha congregation."},{"n":"29:33","text":"N they will eat dose things wherewith tha atonement was made, 2 consecrate N 2 sanctify ’em: but a stranger will not eat thereof, because they r holy."},{"n":"29:34","text":"N if ought of tha flesh of tha consecrations, or of tha bread, remain 2 tha morning, then u will burn tha remainder wit fire: it will not be eaten, because it is holy."},{"n":"29:35","text":"N thus will u do 2 Aaron, N 2 his sonz, according 2 all things which I have commanded u: seven dayz will u consecrate ’em."},{"n":"29:36","text":"N u will offer every day a bullock 4 a sin offering 4 atonement: N u will cleanse tha altar, when u have made an atonement 4 it, N u will anoint it, 2 sanctify it."},{"n":"29:37","text":"Seven dayz u will make an atonement 4 tha altar, N sanctify it; N it will be an altar most holy: whatsoever toucheth tha altar will be holy."},{"n":"29:38","text":"Now dis is dat which u will offer on tha altar; two lambs of tha first year day by day continually."},{"n":"29:39","text":"Tha one lamb u will offer in tha morning; N tha other lamb u will offer at even:"},{"n":"29:40","text":"N wit tha one lamb a tenth deal of flour mingled wit tha fourth part of an hin of beaten oil; N tha fourth part of an hin of wine 4 a drink offering."},{"n":"29:41","text":"N tha other lamb u will offer at even, N will do thereto according 2 tha meat offering of tha morning, N according 2 tha drink offering thereof, 4 a sweet savour, an offering made by fire 2 tha LORD."},{"n":"29:42","text":"Dis will be a continual burnt offering throughout ur generations at tha door of tha tabernacle of tha congregation before tha LORD: where I will meet u, 2 speak there 2 u."},{"n":"29:43","text":"N there I will meet wit tha children of Israel, N tha tabernacle will be sanctified by my glory."},{"n":"29:44","text":"N I will sanctify tha tabernacle of tha congregation, N tha altar: I will sanctify also both Aaron N his sonz, 2 minister 2 me in tha priest’s office."},{"n":"29:45","text":"N I will dwell among tha children of Israel, N will be their God."},{"n":"29:46","text":"N they will know dat I am tha LORD their God, dat brought ’em forth out of tha land of Egypt, dat I may dwell among ’em: I am tha LORD their God."}],"30":[{"n":"30:1","text":"N u will make an altar 2 burn incense on: of shittim wood will u make it."},{"n":"30:2","text":"A cubit will be tha length thereof, N a cubit tha breadth thereof; foursquare will it be: N two cubitz will be tha height thereof: tha horns thereof will be of tha same."},{"n":"30:3","text":"N u will overlay it wit pure gold, tha top thereof, N tha sides thereof round about, N tha horns thereof; N u will make 2 it a crown of gold round about."},{"n":"30:4","text":"N two golden ringz will u make 2 it under tha crown of it, by tha two corners thereof, on tha two sides of it will u make it; N they will be 4 places 4 tha staves 2 bear it withal."},{"n":"30:5","text":"N u will make tha staves of shittim wood, N overlay ’em wit gold."},{"n":"30:6","text":"N u will put it before tha vail dat is by tha ark of tha testimony, before tha mercy seat dat is over tha testimony, where I will meet wit u."},{"n":"30:7","text":"N Aaron will burn thereon sweet incense every morning: when he dresseth tha lamps, he will burn incense on it."},{"n":"30:8","text":"N when Aaron lighteth tha lamps at even, he will burn incense on it, a perpetual incense before tha LORD throughout ur generations."},{"n":"30:9","text":"Y’all will offer no strange incense thereon, nor burnt sacrifice, nor meat offering; neither will y’all pour drink offering thereon."},{"n":"30:10","text":"N Aaron will make an atonement on tha horns of it once in a year wit tha blood of tha sin offering of atonements: once in tha year will he make atonement on it throughout ur generations: it is most holy 2 tha LORD."},{"n":"30:11","text":"N tha LORD spoke 2 Moses, saying,"},{"n":"30:12","text":"When u takest tha sum of tha children of Israel after their number, then will they give every man a ransom 4 his soul 2 tha LORD, when u numberest ’em; dat there be no plague among ’em, when u numberest ’em."},{"n":"30:13","text":"Dis they will give, every one dat passeth among ’em dat r numbered, half a shekel after tha shekel of tha sanctuary: (a shekel is twenty gerahs:) an half shekel will be tha offering of tha LORD."},{"n":"30:14","text":"Every one dat passeth among ’em dat r numbered, from twenty yearz old N above, will give an offering 2 tha LORD."},{"n":"30:15","text":"Tha rich will not give more, N tha poor will not give less than half a shekel, when they give an offering 2 tha LORD, 2 make an atonement 4 ur souls."},{"n":"30:16","text":"N u will take tha atonement money of tha children of Israel, N will appoint it 4 tha service of tha tabernacle of tha congregation; dat it may be a memorial 2 tha children of Israel before tha LORD, 2 make an atonement 4 ur souls."},{"n":"30:17","text":"N tha LORD spoke 2 Moses, saying,"},{"n":"30:18","text":"U will also make a laver of brass, N his foot also of brass, 2 wash withal: N u will put it between tha tabernacle of tha congregation N tha altar, N u will put water therein."},{"n":"30:19","text":"4 Aaron N his sonz will wash their handz N their feet thereat:"},{"n":"30:20","text":"When they go in2 tha tabernacle of tha congregation, they will wash wit water, dat they die not; or when they come near 2 tha altar 2 minister, 2 burn offering made by fire 2 tha LORD:"},{"n":"30:21","text":"So they will wash their handz N their feet, dat they die not: N it will be a statute 4 ever 2 ’em, even 2 him N 2 his seed throughout their generations."},{"n":"30:22","text":"Moreover tha LORD spoke 2 Moses, saying,"},{"n":"30:23","text":"Take u also 2 u principal spices, of pure myrrh five hundred shekels, N of sweet cinnamon half so much, even two hundred N fifty shekels, N of sweet calamus two hundred N fifty shekels,"},{"n":"30:24","text":"N of cassia five hundred shekels, after tha shekel of tha sanctuary, N of oil olive an hin:"},{"n":"30:25","text":"N u will make it an oil of holy ointment, an ointment compound after tha r of tha apothecary: it will be an holy anointing oil."},{"n":"30:26","text":"N u will anoint tha tabernacle of tha congregation therewith, N tha ark of tha testimony,"},{"n":"30:27","text":"N tha table N all his vessels, N tha candlestick N his vessels, N tha altar of incense,"},{"n":"30:28","text":"N tha altar of burnt offering wit all his vessels, N tha laver N his foot."},{"n":"30:29","text":"N u will sanctify ’em, dat they may be most holy: whatsoever toucheth ’em will be holy."},{"n":"30:30","text":"N u will anoint Aaron N his sonz, N consecrate ’em, dat they may minister 2 me in tha priest’s office."},{"n":"30:31","text":"N u will speak 2 tha children of Israel, saying, Dis will be an holy anointing oil 2 me throughout ur generations."},{"n":"30:32","text":"On man’s flesh will it not be poured, neither will y’all make any other like it, after tha composition of it: it is holy, N it will be holy 2 u."},{"n":"30:33","text":"Whosoever compoundeth any like it, or whosoever putteth any of it on a stranger, will even be cut off from his people."},{"n":"30:34","text":"N tha LORD said 2 Moses, Take 2 u sweet spices, stacte, N onycha, N galbanum; dese sweet spices wit pure frankincense: of each will there be a like weight:"},{"n":"30:35","text":"N u will make it a perfume, a confection after tha r of tha apothecary, tempered together, pure N holy:"},{"n":"30:36","text":"N u will beat some of it very small, N put of it before tha testimony in tha tabernacle of tha congregation, where I will meet wit u: it will be 2 u most holy."},{"n":"30:37","text":"N as 4 tha perfume which u will make, y’all will not make 2 yourselves according 2 tha composition thereof: it will be 2 u holy 4 tha LORD."},{"n":"30:38","text":"Whosoever will make like 2 dat, 2 smell thereto, will even be cut off from his people."}],"31":[{"n":"31:1","text":"N tha LORD spoke 2 Moses, saying,"},{"n":"31:2","text":"See, I have called by name Bezaleel tha son of Uri, tha son of Hur, of tha tribe of Judah:"},{"n":"31:3","text":"N I have filled him wit tha spirit of God, in wisdom, N in understanding, N in knowledge, N in all manner of workmanship,"},{"n":"31:4","text":"2 devise cunning works, 2 work in gold, N in silver, N in brass,"},{"n":"31:5","text":"N in cutting of stones, 2 set ’em, N in carving of timber, 2 work in all manner of workmanship."},{"n":"31:6","text":"N I, look, I have given wit him Aholiab, tha son of Ahisamach, of tha tribe of Dan: N in tha hearts of all dat r wise hearted I have put wisdom, dat they may make all dat I have commanded u;"},{"n":"31:7","text":"Tha tabernacle of tha congregation, N tha ark of tha testimony, N tha mercy seat dat is thereupon, N all tha furniture of tha tabernacle,"},{"n":"31:8","text":"N tha table N his furniture, N tha pure candlestick wit all his furniture, N tha altar of incense,"},{"n":"31:9","text":"N tha altar of burnt offering wit all his furniture, N tha laver N his foot,"},{"n":"31:10","text":"N tha cloths of service, N tha holy garmentz 4 Aaron tha priest, N tha garmentz of his sonz, 2 minister in tha priest’s office,"},{"n":"31:11","text":"N tha anointing oil, N sweet incense 4 tha holy place: according 2 all dat I have commanded u will they do."},{"n":"31:12","text":"N tha LORD spoke 2 Moses, saying,"},{"n":"31:13","text":"Speak u also 2 tha children of Israel, saying, Verily my sabbaths y’all will keep: 4 it is a sign between me N u throughout ur generations; dat y’all may know dat I am tha LORD dat does sanctify u."},{"n":"31:14","text":"Y’all will keep tha sabbath therefore; 4 it is holy 2 u: every one dat defileth it will surely be put 2 death: 4 whosoever doeth any work therein, dat soul will be cut off from among his people."},{"n":"31:15","text":"Six dayz may work be done; but in tha seventh is tha sabbath of rest, holy 2 tha LORD: whosoever doeth any work in tha sabbath day, he will surely be put 2 death."},{"n":"31:16","text":"Wherefore tha children of Israel will keep tha sabbath, 2 observe tha sabbath throughout their generations, 4 a perpetual covenant."},{"n":"31:17","text":"It is a sign between me N tha children of Israel 4 ever: 4 in six dayz tha LORD made heaven N earth, N on tha seventh day he rested, N was refreshed."},{"n":"31:18","text":"N he gave 2 Moses, when he had made an end of communing wit him on mount Sinai, two tablez of testimony, tablez of stone, written wit tha finger of God."}],"32":[{"n":"32:1","text":"N when tha people saw dat Moses delayed 2 come down out of tha mount, tha people gathered themselves together 2 Aaron, N said 2 him, Up, make us godz, which will go before us; 4 as 4 dis Moses, tha man dat brought us up out of tha land of Egypt, we wot not what is become of him."},{"n":"32:2","text":"N Aaron said 2 ’em, Break off tha golden earrings, which r in tha earz of ur wivez, of ur sonz, N of ur daughterz, N bring ’em 2 me."},{"n":"32:3","text":"N all tha people brake off tha golden earrings which were in their earz, N brought ’em 2 Aaron."},{"n":"32:4","text":"N he received ’em at their hand, N fashioned it wit a graving tool, after he had made it a molten calf: N they said, Dese be ur godz, O Israel, which brought u up out of tha land of Egypt."},{"n":"32:5","text":"N when Aaron saw it, he built an altar before it; N Aaron made proclamation, N said, 2 morrow is a feast 2 tha LORD."},{"n":"32:6","text":"N they rose up early on tha morrow, N offered burnt offeringz, N brought peace offeringz; N tha people sat down 2 eat N 2 drink, N rose up 2 play."},{"n":"32:7","text":"N tha LORD said 2 Moses, Go, get u down; 4 ur people, which u broughtest out of tha land of Egypt, have corrupted themselves:"},{"n":"32:8","text":"They have turned aside quickly out of tha way which I commanded ’em: they have made ’em a molten calf, N have worshipped it, N have sacrificed thereunto, N said, Dese be ur godz, O Israel, which have brought u up out of tha land of Egypt."},{"n":"32:9","text":"N tha LORD said 2 Moses, I have seen dis people, N, look, it is a stiffnecked people:"},{"n":"32:10","text":"Now therefore let me alone, dat my wrath may wax hot against ’em, N dat I may consume ’em: N I will make of u a great nation."},{"n":"32:11","text":"N Moses besought tha LORD his God, N said, LORD, why does ur wrath wax hot against ur people, which u have brought forth out of tha land of Egypt wit great power, N wit a mighty hand?"},{"n":"32:12","text":"Wherefore should tha Egyptianz speak, N say, 4 mischief did he bring ’em out, 2 slay ’em in tha mountainz, N 2 consume ’em from tha face of tha earth? Turn from ur fierce wrath, N repent of dis evil against ur people."},{"n":"32:13","text":"Remember Abraham, Isaac, N Israel, ur servantz, 2 whom u swarest by urz own self, N saidst 2 ’em, I will multiply ur seed as tha stars of heaven, N all dis land dat I have spoken of will I give 2 ur seed, N they will inherit it 4 ever."},{"n":"32:14","text":"N tha LORD repented of tha evil which he thought 2 do 2 his people."},{"n":"32:15","text":"N Moses turned, N went down from tha mount, N tha two tablez of tha testimony were in his hand: tha tablez were written on both their sides; on tha one side N on tha other were they written."},{"n":"32:16","text":"N tha tablez were tha work of God, N tha writing was tha writing of God, graven on tha tablez."},{"n":"32:17","text":"N when Joshua heard tha noise of tha people as they shouted, he said 2 Moses, There is a noise of war in tha camp."},{"n":"32:18","text":"N he said, It is not tha voice of ’em dat shout 4 mastery, neither is it tha voice of ’em dat cry 4 being overcome: but tha noise of ’em dat sing do I hear."},{"n":"32:19","text":"N it happened, as soon as he came nigh 2 tha camp, dat he saw tha calf, N tha dancing: N Moses’ anger waxed hot, N he cast tha tablez out of his handz, N brake ’em beneath tha mount."},{"n":"32:20","text":"N he took tha calf which they had made, N burnt it in tha fire, N ground it 2 powder, N strawed it on tha water, N made tha children of Israel drink of it."},{"n":"32:21","text":"N Moses said 2 Aaron, What did dis people 2 u, dat u have brought so great a sin on ’em?"},{"n":"32:22","text":"N Aaron said, Let not tha anger of my lord wax hot: u knowest tha people, dat they r set on mischief."},{"n":"32:23","text":"4 they said 2 me, Make us godz, which will go before us: 4 as 4 dis Moses, tha man dat brought us up out of tha land of Egypt, we wot not what is become of him."},{"n":"32:24","text":"N I said 2 ’em, Whosoever has any gold, let ’em break it off. So they gave it me: then I cast it in2 tha fire, N there came out dis calf."},{"n":"32:25","text":"N when Moses saw dat tha people were naked; (4 Aaron had made ’em naked 2 their shame among their enemiez:)"},{"n":"32:26","text":"Then Moses stood in tha gate of tha camp, N said, Who is on tha LORD’s side? let him come 2 me. N all tha sonz of Levi gathered themselves together 2 him."},{"n":"32:27","text":"N he said 2 ’em, Thus says tha LORD God of Israel, Put every man his sword by his side, N go in N out from gate 2 gate throughout tha camp, N slay every man his brother, N every man his companion, N every man his neighbour."},{"n":"32:28","text":"N tha children of Levi did according 2 tha word of Moses: N there fell of tha people dat day about three thousand men."},{"n":"32:29","text":"4 Moses had said, Consecrate yourselves today 2 tha LORD, even every man on his son, N on his brother; dat he may bestow on u a blessing dis day."},{"n":"32:30","text":"N it happened on tha morrow, dat Moses said 2 tha people, Y’all have sinned a great sin: N now I will go up 2 tha LORD; peradventure I will make an atonement 4 ur sin."},{"n":"32:31","text":"N Moses returned 2 tha LORD, N said, Oh, dis people have sinned a great sin, N have made ’em godz of gold."},{"n":"32:32","text":"Yet now, if u wilt forgive their sin--; N if not, blot me, I pray u, out of ur book which u have written."},{"n":"32:33","text":"N tha LORD said 2 Moses, Whosoever has sinned against me, him will I blot out of my book."},{"n":"32:34","text":"Therefore now go, lead tha people 2 tha place of which I have spoken 2 u: look, mine Angel will go before u: nevertheless in tha day when I visit I will visit their sin on ’em."},{"n":"32:35","text":"N tha LORD plagued tha people, because they made tha calf, which Aaron made."}],"33":[{"n":"33:1","text":"N tha LORD said 2 Moses, Depart, N go up hence, u N tha people which u have brought up out of tha land of Egypt, 2 tha land which I sware 2 Abraham, 2 Isaac, N 2 Jacob, saying, 2 ur seed will I give it:"},{"n":"33:2","text":"N I will send an angel before u; N I will drive out tha Canaanite, tha Amorite, N tha Hittite, N tha Perizzite, tha Hivite, N tha Jebusite:"},{"n":"33:3","text":"2 a land flowing wit milk N honey: 4 I will not go up in tha midst of u; 4 u r a stiffnecked people: lest I consume u in tha way."},{"n":"33:4","text":"N when tha people heard dese evil tidings, they mourned: N no man did put on him his ornaments."},{"n":"33:5","text":"4 tha LORD had said 2 Moses, Say 2 tha children of Israel, Y’all r a stiffnecked people: I will come up in2 tha midst of u in a moment, N consume u: therefore now put off ur ornaments from u, dat I may know what 2 do 2 u."},{"n":"33:6","text":"N tha children of Israel stripped themselves of their ornaments by tha mount Horeb."},{"n":"33:7","text":"N Moses took tha tabernacle, N pitched it without tha camp, afar off from tha camp, N called it tha Tabernacle of tha congregation. N it happened, dat every one which sought tha LORD went out 2 tha tabernacle of tha congregation, which was without tha camp."},{"n":"33:8","text":"N it happened, when Moses went out 2 tha tabernacle, dat all tha people rose up, N stood every man at his tent door, N looked after Moses, until he was gone in2 tha tabernacle."},{"n":"33:9","text":"N it happened, as Moses entered in2 tha tabernacle, tha cloudy pillar descended, N stood at tha door of tha tabernacle, N tha Lord talked wit Moses."},{"n":"33:10","text":"N all tha people saw tha cloudy pillar stand at tha tabernacle door: N all tha people rose up N worshipped, every man in his tent door."},{"n":"33:11","text":"N tha LORD spoke 2 Moses face 2 face, as a man speaketh 2 his friend. N he turned again in2 tha camp: but his servant Joshua, tha son of Nun, a young man, departed not out of tha tabernacle."},{"n":"33:12","text":"N Moses said 2 tha LORD, See, u sayest 2 me, Bring up dis people: N u have not let me know whom u wilt send wit me. Yet u have said, I know u by name, N u have also found grace in my sight."},{"n":"33:13","text":"Now therefore, I pray u, if I have found grace in ur sight, shew me now ur way, dat I may know u, dat I may find grace in ur sight: N consider dat dis nation is ur people."},{"n":"33:14","text":"N he said, My presence will go wit u, N I will give u rest."},{"n":"33:15","text":"N he said 2 him, If ur presence go not wit me, carry us not up hence."},{"n":"33:16","text":"4 wherein will it be known here dat I N ur people have found grace in ur sight? is it not in dat u goest wit us? so will we be separated, I N ur people, from all tha people dat r on tha face of tha earth."},{"n":"33:17","text":"N tha LORD said 2 Moses, I will do dis thing also dat u have spoken: 4 u have found grace in my sight, N I know u by name."},{"n":"33:18","text":"N he said, I beseech u, shew me ur glory."},{"n":"33:19","text":"N he said, I will make all my goodness pass before u, N I will proclaim tha name of tha LORD before u; N will be gracious 2 whom I will be gracious, N will shew mercy on whom I will shew mercy."},{"n":"33:20","text":"N he said, U canst not see my face: 4 there will no man see me, N live."},{"n":"33:21","text":"N tha LORD said, Look, there is a place by me, N u will stand on a rock:"},{"n":"33:22","text":"N it will come 2 pass, while my glory passeth by, dat I will put u in a clift of tha rock, N will cover u wit my hand while I pass by:"},{"n":"33:23","text":"N I will take away mine hand, N u will see my back parts: but my face will not be seen."}],"34":[{"n":"34:1","text":"N tha LORD said 2 Moses, Hew u two tablez of stone like 2 tha first: N I will write on dese tablez tha wordz dat were in tha first tablez, which u brakest."},{"n":"34:2","text":"N be ready in tha morning, N come up in tha morning 2 mount Sinai, N present thyself there 2 me in tha top of tha mount."},{"n":"34:3","text":"N no man will come up wit u, neither let any man be seen throughout all tha mount; neither let tha flocks nor herds feed before dat mount."},{"n":"34:4","text":"N he hewed two tablez of stone like 2 tha first; N Moses rose up early in tha morning, N went up 2 mount Sinai, as tha LORD had commanded him, N took in his hand tha two tablez of stone."},{"n":"34:5","text":"N tha LORD descended in tha cloud, N stood wit him there, N proclaimed tha name of tha LORD."},{"n":"34:6","text":"N tha LORD passed by before him, N proclaimed, Tha LORD, Tha LORD God, merciful N gracious, longsuffering, N abundant in goodness N truth,"},{"n":"34:7","text":"Keeping mercy 4 thousands, forgiving iniquity N transgression N sin, N dat will by no means clear tha guilty; visiting tha iniquity of tha fatherz on tha children, N on tha children’s children, 2 tha third N 2 tha fourth generation."},{"n":"34:8","text":"N Moses made haste, N bowed his head toward tha earth, N worshipped."},{"n":"34:9","text":"N he said, If now I have found grace in ur sight, O LORD, let my LORD, I pray u, go among us; 4 it is a stiffnecked people; N pardon our iniquity N our sin, N take us 4 urz inheritance."},{"n":"34:10","text":"N he said, Look, I make a covenant: before all ur people I will do marvels, such as have not been done in all tha earth, nor in any nation: N all tha people among which u r will see tha work of tha LORD: 4 it is a terrible thing dat I will do wit u."},{"n":"34:11","text":"Observe u dat which I command u dis day: look, I drive out before u tha Amorite, N tha Canaanite, N tha Hittite, N tha Perizzite, N tha Hivite, N tha Jebusite."},{"n":"34:12","text":"Take heed 2 thyself, lest u make a covenant wit tha inhabitants of tha land whither u goest, lest it be 4 a snare in tha midst of u:"},{"n":"34:13","text":"But y’all will destroy their altars, break their images, N cut down their groves:"},{"n":"34:14","text":"4 u will worship no other god: 4 tha LORD, whose name is Jealous, is a jealous God:"},{"n":"34:15","text":"Lest u make a covenant wit tha inhabitants of tha land, N they go a whoring after their godz, N do sacrifice 2 their godz, N one call u, N u eat of his sacrifice;"},{"n":"34:16","text":"N u take of their daughterz 2 ur sonz, N their daughterz go a whoring after their godz, N make ur sonz go a whoring after their godz."},{"n":"34:17","text":"U will make u no molten godz."},{"n":"34:18","text":"Tha feast of unleavened bread will u keep. Seven dayz u will eat unleavened bread, as I commanded u, in tha time of tha month Abib: 4 in tha month Abib u camest out from Egypt."},{"n":"34:19","text":"All dat openeth tha matrix is mine; N every firstling among ur cattle, whether ox or sheep, dat is male."},{"n":"34:20","text":"But tha firstling of an ass u will redeem wit a lamb: N if u redeem him not, then will u break his neck. All tha firstborn of ur sonz u will redeem. N none will appear before me empty."},{"n":"34:21","text":"Six dayz u will work, but on tha seventh day u will rest: in earing time N in harvest u will rest."},{"n":"34:22","text":"N u will observe tha feast of weeks, of tha firstfruits of wheat harvest, N tha feast of ingathering at tha year’s end."},{"n":"34:23","text":"Thrice in tha year will all ur menchildren appear before tha LORD God, tha God of Israel."},{"n":"34:24","text":"4 I will cast out tha nations before u, N enlarge ur borders: neither will any man desire ur land, when u will go up 2 appear before tha LORD ur God thrice in tha year."},{"n":"34:25","text":"U will not offer tha blood of my sacrifice wit leaven; neither will tha sacrifice of tha feast of tha passover be left 2 tha morning."},{"n":"34:26","text":"Tha first of tha firstfruits of ur land u will bring 2 tha house of tha LORD ur God. U will not seethe a kid in his mother’s milk."},{"n":"34:27","text":"N tha LORD said 2 Moses, Write u dese wordz: 4 after tha tenor of dese wordz I have made a covenant wit u N wit Israel."},{"n":"34:28","text":"N he was there wit tha LORD forty dayz N forty nights; he did neither eat bread, nor drink water. N he wrote on tha tablez tha wordz of tha covenant, tha ten commandmentz."},{"n":"34:29","text":"N it happened, when Moses came down from mount Sinai wit tha two tablez of testimony in Moses’ hand, when he came down from tha mount, dat Moses wist not dat tha skin of his face shone while he talked wit him."},{"n":"34:30","text":"N when Aaron N all tha children of Israel saw Moses, look, tha skin of his face shone; N they were afraid 2 come nigh him."},{"n":"34:31","text":"N Moses called 2 ’em; N Aaron N all tha rulers of tha congregation returned 2 him: N Moses talked wit ’em."},{"n":"34:32","text":"N afterward all tha children of Israel came nigh: N he gave ’em in commandment all dat tha LORD had spoken wit him in mount Sinai."},{"n":"34:33","text":"N till Moses had done speaking wit ’em, he put a vail on his face."},{"n":"34:34","text":"But when Moses went in before tha LORD 2 speak wit him, he took tha vail off, until he came out. N he came out, N spoke 2 tha children of Israel dat which he was commanded."},{"n":"34:35","text":"N tha children of Israel saw tha face of Moses, dat tha skin of Moses’ face shone: N Moses put tha vail on his face again, until he went in 2 speak wit him."}],"35":[{"n":"35:1","text":"N Moses gathered all tha congregation of tha children of Israel together, N said 2 ’em, Dese r tha wordz which tha LORD has commanded, dat y’all should do ’em."},{"n":"35:2","text":"Six dayz will work be done, but on tha seventh day there will be 2 u an holy day, a sabbath of rest 2 tha LORD: whosoever doeth work therein will be put 2 death."},{"n":"35:3","text":"Y’all will kindle no fire throughout ur habitations on tha sabbath day."},{"n":"35:4","text":"N Moses spoke 2 all tha congregation of tha children of Israel, saying, Dis is tha thing which tha LORD commanded, saying,"},{"n":"35:5","text":"Take y’all from among u an offering 2 tha LORD: whosoever is of a willing heart, let him bring it, an offering of tha LORD; gold, N silver, N brass,"},{"n":"35:6","text":"N blue, N purple, N scarlet, N fine linen, N goats’ hair,"},{"n":"35:7","text":"N rams’ skins dyed red, N badgers’ skins, N shittim wood,"},{"n":"35:8","text":"N oil 4 tha light, N spices 4 anointing oil, N 4 tha sweet incense,"},{"n":"35:9","text":"N onyx stones, N stones 2 be set 4 tha ephod, N 4 tha breastplate."},{"n":"35:10","text":"N every wise hearted among u will come, N make all dat tha LORD has commanded;"},{"n":"35:11","text":"Tha tabernacle, his tent, N his covering, his taches, N his boardz, his bars, his pillarz, N his socketz,"},{"n":"35:12","text":"Tha ark, N tha staves thereof, wit tha mercy seat, N tha vail of tha covering,"},{"n":"35:13","text":"Tha table, N his staves, N all his vessels, N tha shewbread,"},{"n":"35:14","text":"Tha candlestick also 4 tha light, N his furniture, N his lamps, wit tha oil 4 tha light,"},{"n":"35:15","text":"N tha incense altar, N his staves, N tha anointing oil, N tha sweet incense, N tha hanging 4 tha door at tha entering in of tha tabernacle,"},{"n":"35:16","text":"Tha altar of burnt offering, wit his brasen grate, his staves, N all his vessels, tha laver N his foot,"},{"n":"35:17","text":"Tha hangings of tha court, his pillarz, N their socketz, N tha hanging 4 tha door of tha court,"},{"n":"35:18","text":"Tha pins of tha tabernacle, N tha pins of tha court, N their cords,"},{"n":"35:19","text":"Tha cloths of service, 2 do service in tha holy place, tha holy garmentz 4 Aaron tha priest, N tha garmentz of his sonz, 2 minister in tha priest’s office."},{"n":"35:20","text":"N all tha congregation of tha children of Israel departed from tha presence of Moses."},{"n":"35:21","text":"N they came, every one whose heart stirred him up, N every one whom his spirit made willing, N they brought tha LORD’s offering 2 tha work of tha tabernacle of tha congregation, N 4 all his service, N 4 tha holy garmentz."},{"n":"35:22","text":"N they came, both men N women, as many as were willing hearted, N brought bracelets, N earrings, N ringz, N tablets, all jewels of gold: N every man dat offered offered an offering of gold 2 tha LORD."},{"n":"35:23","text":"N every man, wit whom was found blue, N purple, N scarlet, N fine linen, N goats’ hair, N red skins of rams, N badgers’ skins, brought ’em."},{"n":"35:24","text":"Every one dat did offer an offering of silver N brass brought tha LORD’s offering: N every man, wit whom was found shittim wood 4 any work of tha service, brought it."},{"n":"35:25","text":"N all tha women dat were wise hearted did spin wit their handz, N brought dat which they had spun, both of blue, N of purple, N of scarlet, N of fine linen."},{"n":"35:26","text":"N all tha women whose heart stirred ’em up in wisdom spun goats’ hair."},{"n":"35:27","text":"N tha rulers brought onyx stones, N stones 2 be set, 4 tha ephod, N 4 tha breastplate;"},{"n":"35:28","text":"N spice, N oil 4 tha light, N 4 tha anointing oil, N 4 tha sweet incense."},{"n":"35:29","text":"Tha children of Israel brought a willing offering 2 tha LORD, every man N woman, whose heart made ’em willing 2 bring 4 all manner of work, which tha LORD had commanded 2 be made by tha hand of Moses."},{"n":"35:30","text":"N Moses said 2 tha children of Israel, See, tha LORD has called by name Bezaleel tha son of Uri, tha son of Hur, of tha tribe of Judah;"},{"n":"35:31","text":"N he has filled him wit tha spirit of God, in wisdom, in understanding, N in knowledge, N in all manner of workmanship;"},{"n":"35:32","text":"N 2 devise curious works, 2 work in gold, N in silver, N in brass,"},{"n":"35:33","text":"N in tha cutting of stones, 2 set ’em, N in carving of wood, 2 make any manner of cunning work."},{"n":"35:34","text":"N he has put in his heart dat he may teach, both he, N Aholiab, tha son of Ahisamach, of tha tribe of Dan."},{"n":"35:35","text":"’Em has he filled wit wisdom of heart, 2 work all manner of work, of tha engraver, N of tha cunning workman, N of tha embroiderer, in blue, N in purple, in scarlet, N in fine linen, N of tha weaver, even of ’em dat do any work, N of dose dat devise cunning work."}],"36":[{"n":"36:1","text":"Then wrought Bezaleel N Aholiab, N every wise hearted man, in whom tha LORD put wisdom N understanding 2 know how 2 work all manner of work 4 tha service of tha sanctuary, according 2 all dat tha LORD had commanded."},{"n":"36:2","text":"N Moses called Bezaleel N Aholiab, N every wise hearted man, in whose heart tha LORD had put wisdom, even every one whose heart stirred him up 2 come 2 tha work 2 do it:"},{"n":"36:3","text":"N they received of Moses all tha offering, which tha children of Israel had brought 4 tha work of tha service of tha sanctuary, 2 make it withal. N they brought yet 2 him free offeringz every morning."},{"n":"36:4","text":"N all tha wise men, dat wrought all tha work of tha sanctuary, came every man from his work which they made;"},{"n":"36:5","text":"N they spoke 2 Moses, saying, Tha people bring much more than enough 4 tha service of tha work, which tha LORD commanded 2 make."},{"n":"36:6","text":"N Moses gave commandment, N they caused it 2 be proclaimed throughout tha camp, saying, Let neither man nor woman make any more w
